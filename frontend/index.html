<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR PI Group - Automation Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler for React JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function StatCard({ label, value, subtext, color }) {
      return (
        <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
          <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{label}</p>
          <p className={`text-lg font-bold mt-1 ${color}`}>{value}</p>
          <p className="text-xs text-slate-500 mt-0.5">{subtext}</p>
        </div>
      );
    }

    function App() {
      const [secret, setSecret] = useState(localStorage.getItem('vrpi_cron_secret') || '');
      const [loading, setLoading] = useState(false);
      const [response, setResponse] = useState(null);
      const [error, setError] = useState(null);
      const [lastRun, setLastRun] = useState(null);

      const runSync = async (e) => {
        e.preventDefault();
        if (!secret.trim()) {
          alert('Please enter your CRON_SECRET');
          return;
        }

        localStorage.setItem('vrpi_cron_secret', secret.trim());
        setLoading(true);
        setError(null);
        setResponse(null);

        try {
          const res = await fetch('/api/process', {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${secret.trim()}`
            }
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || `Error ${res.status}: ${res.statusText}`);
          }
          setResponse(data);
          setLastRun(new Date().toLocaleTimeString());
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <main className="min-h-screen flex items-center justify-center p-4 sm:p-6">
          <div className="max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8">
            
            {/* Header */}
            <header className="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-slate-800 gap-4">
              <div>
                <h1 className="text-2xl font-bold text-white tracking-tight">VR PI Group of Companies</h1>
                <p className="text-xs sm:text-sm text-slate-400 mt-1">Internship Offer Letter Dispatch Console</p>
              </div>
              <div className="flex items-center gap-2 self-start sm:self-auto bg-emerald-950 border border-emerald-500/30 px-3.5 py-1.5 rounded-full">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-xs font-semibold text-emerald-300">Cron Active (1m)</span>
              </div>
            </header>

            {/* Quick Metrics */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 my-6">
              <StatCard label="Automation" value="Every 1 Min" subtext="cron-job.org" color="text-indigo-400" />
              <StatCard label="Database" value="Google Sheets" subtext="Real-time sync" color="text-emerald-400" />
              <StatCard label="Delivery" value="Gmail API" subtext="Personalized PDF" color="text-amber-400" />
            </div>

            {/* Manual Run Form */}
            <form onSubmit={runSync} className="bg-slate-950/80 border border-slate-800/80 rounded-xl p-5 mb-4">
              <h2 className="text-sm font-semibold text-slate-200">Manual Batch Trigger</h2>
              <p className="text-xs text-slate-400 mt-1 mb-4">
                Execute an instant sync cycle without waiting for the next cron interval.
              </p>

              <div className="flex flex-col sm:flex-row gap-2.5">
                <input
                  type="password"
                  value={secret}
                  onChange={(e) => setSecret(e.target.value)}
                  placeholder="Paste your CRON_SECRET..."
                  className="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg px-4 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium text-xs px-5 py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2"
                >
                  {loading ? (
                    <>
                      <svg className="animate-spin h-3.5 w-3.5 text-white" viewBox="0 0 24 24" fill="none">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                      </svg>
                      <span>Processing...</span>
                    </>
                  ) : (
                    <span>Run Batch Now</span>
                  )}
                </button>
              </div>

              {lastRun && (
                <p className="text-[11px] text-slate-500 mt-2">Last executed at: {lastRun}</p>
              )}
            </form>

            {/* Error Message */}
            {error && (
              <div className="p-3 bg-red-950/60 border border-red-500/40 rounded-lg text-xs text-red-300 mb-4">
                <strong>Error:</strong> {error}
              </div>
            )}

            {/* Response Console */}
            {response && (
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-800 text-xs">
                  <span className="font-semibold text-slate-300">Response Payload</span>
                  <span className="text-emerald-400 font-mono">Processed: {response.processed || 0}</span>
                </div>
                <pre className="text-[11px] font-mono text-slate-300 overflow-x-auto max-h-48">
                  {JSON.stringify(response, null, 2)}
                </pre>
              </div>
            )}

            {/* Footer */}
            <footer className="mt-6 pt-4 border-t border-slate-800 text-center text-[11px] text-slate-500">
              VR PI Group Automation Engine &bull; Serverless Python on Vercel
            </footer>
          </div>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
