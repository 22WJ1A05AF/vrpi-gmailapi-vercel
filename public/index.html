
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VR PI Group | Enterprise Talent Excellence Platform</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#17233a;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1160px;margin:auto;padding:28px 22px}
.header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid #e1e7ef}
.logo{width:175px;height:auto;display:block}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{padding:10px 15px;border:1px solid #dfe6ef;background:#fff;border-radius:9px;color:#263d5e;text-decoration:none;font-size:11px;font-weight:800}
.primary{background:#1e3a5f;color:white;border-color:#1e3a5f}
.orange{background:#e94b17;color:white;border:0}
.hero{text-align:center;padding:60px 10px 42px}
.eyebrow{display:inline-block;background:white;border:1px solid #e1e7ef;border-radius:30px;padding:9px 17px;color:#687891;font-size:10px;font-weight:800;letter-spacing:1px}
.hero h1{font-size:clamp(34px,5vw,55px);line-height:1.12;letter-spacing:-2px;color:#111a2d;font-weight:800;margin:22px 0 14px}
.hero p{max-width:750px;margin:auto;color:#74839a;font-size:13px;line-height:1.9}
.panel{background:white;border:1px solid #e1e7ef;border-radius:18px;padding:28px;box-shadow:0 10px 32px #263b5909}
.kicker{color:#8291a6;font-size:10px;font-weight:800;letter-spacing:1.5px}
h2{font-size:21px;color:#172b49;margin:9px 0}
.description{font-size:12px;color:#8290a5;line-height:1.8}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:25px}
.field label{display:block;font-size:10px;font-weight:800;color:#52637c;margin-bottom:9px}
.field select{width:100%;padding:13px;border:1px solid #dfe6ef;border-radius:9px;background:white;color:#30425d;font-size:12px;outline:none}
.field select:focus{border-color:#e94b17}
.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
.template{border:1px solid #e0e7ef;border-radius:14px;padding:20px;display:flex;flex-direction:column}
.template.active{border:2px solid #e94b17;background:#fffaf7}
.template h3{font-size:13px;color:#1e3a5f;margin:12px 0 8px}
.template p{font-size:11px;color:#7d8aa0;line-height:1.75;flex:1}
.template button{border:0;border-radius:8px;background:#1e3a5f;color:white;padding:11px;font-size:10px;font-weight:800}
.notice{padding:12px 15px;border-radius:9px;font-size:11px;margin-top:16px;background:#f0f5fb;color:#52637c}
.error{background:#fff5ed;color:#a34a16;border:1px solid #ffdbbd}
.success{background:#edfaf3;color:#16754c;border:1px solid #c9eedc}
.footer{text-align:center;padding:30px 0;color:#8491a5;font-size:10px}
.footer a{color:#0d7377;text-decoration:none}
.modal{position:fixed;inset:0;background:#101827e8;z-index:100;overflow:auto;padding:15px;display:flex;justify-content:center;align-items:flex-start}
.modal-inner{max-width:900px;width:100%;margin:auto}
.modalbar{background:#111c30;padding:12px 15px;border-radius:11px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.modalbar strong{font-size:11px;color:white}
.modalbar select{padding:8px;border-radius:7px;font-size:10px;max-width:220px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.a4{width:210mm;height:297mm;min-height:297mm;margin:auto;background:white;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 15px 50px #0004;color:#26354d}
.doc-header{padding:23px 35px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:2px solid #1e3a5f}
.doc-logo{width:150px;height:auto}
.doc-info{text-align:right;font-size:9px;color:#66758c;line-height:1.8}
.doc-info strong{color:#1e3a5f}
.doc-content{padding:27px 39px;flex:1;display:flex;flex-direction:column;font-size:10.5px;line-height:1.8}
.doc-content p{color:#475569;margin:9px 0}
.doc-title{text-align:center;margin:12px 0 23px}
.doc-title h2{font-size:17px;letter-spacing:1.5px;color:#1e3a5f;margin:8px}
.doc-title small{color:#8491a5;font-size:9px;letter-spacing:2px;font-weight:700}
.doc-section{font-size:10px;letter-spacing:1.2px;color:#1e3a5f;font-weight:800;border-bottom:1px solid #dce3ec;padding-bottom:6px;margin-top:17px}
.doc-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:10px}
.doc-table td{border-bottom:1px solid #e5eaf0;padding:7px 10px}
.doc-table td:first-child{width:37%;background:#f3f6fa;color:#1e3a5f;font-weight:700}
.doc-footer{padding:11px 20px;background:#1e3a5f;color:#fff;text-align:center;font-size:9px;line-height:1.7}
.signoff{margin-top:auto;padding-top:22px;border-top:1px solid #e1e7ef}
.signoff strong{display:block;margin-top:7px;color:#1e3a5f;font-size:11px}
.signoff small{display:block;color:#8190a5;margin-top:3px;font-size:9px}
.draft{padding:7px;text-align:center;background:#fff4e8;color:#aa4b16;border:1px solid #ffd7b5;font-weight:800;font-size:9px;letter-spacing:1px}
.training-top{height:9px;background:linear-gradient(90deg,#191928 70%,#e94b17)}
.training-title{font-size:26px;line-height:1.17;font-weight:800;color:#111827;margin:13px 0 24px}
.footer-brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:10px}
@media(max-width:750px){
 .app{padding:16px 12px}
 .fields,.templates{grid-template-columns:1fr}
 .panel{padding:20px}
 .header{align-items:flex-start}
 .logo{width:145px}
 .a4{width:100%;height:auto;min-height:1050px}
 .doc-content{padding:22px}
}
@media print{
 @page{size:A4 portrait;margin:0}
 html,body{margin:0!important;padding:0!important;background:white!important}
 body *{visibility:hidden!important}
 #printTarget,#printTarget *{visibility:visible!important}
 .modal{position:static!important;display:block!important;padding:0!important;background:white!important;overflow:visible!important}
 .modal-inner{width:210mm!important;max-width:none!important;margin:0!important}
 #printTarget{position:absolute!important;left:0!important;top:0!important;width:210mm!important}
 .a4{width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;break-after:page}
 .no-print{display:none!important}
}
</style>
</head>

const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

function value(row,names){
 const key=Object.keys(row||{}).find(k=>
  names.some(n=>norm(n)===norm(k))
 );
 return key?row[key]??"":"";
}

function mapCandidate(row){
 return {
  raw:row,
  aid:value(row,["Application ID","Application Id","aid","Reference Code"]),
  name:value(row,["Full Name","Name","name"]),
  email:value(row,["Email Address","Email","email"]),
  phone:value(row,["WhatsApp / Phone","WhatsApp","Phone"]),
  college:value(row,["College"]),
  degree:value(row,["Degree"]),
  domain:value(row,["Domain","Internship Domain","Track"]),
  mode:value(row,["Mode","Programme Mode"]),
  joining:value(row,["Joining Date","Start Date","Commencement Date"]),
  endDate:value(row,["End Date","Internship End Date"]),
  duration:value(row,["Duration","Programme Duration"]),
  status:value(row,["Application Status","Email Status","Letter Sent","Status"]),
  completionStatus:value(row,["Completion Status","Training Status","Programme Status"]),
  completionDate:value(row,["Completion Date"]),
  stipend:value(row,["Stipend"]),
  timestamp:value(row,["Timestamp"]),
  pdf:value(row,["PDF Link","PDF Record"])
 };
}

function val(v){
 return v&&String(v).trim()?String(v).trim():"To be confirmed by VR PI Group";
}

function App(){
 const [records,setRecords]=useState([]);
 const [candidateId,setCandidateId]=useState("");
 const [templateId,setTemplateId]=useState("offer");
 const [preview,setPreview]=useState(false);
 const [loading,setLoading]=useState(true);
 const [error,setError]=useState("");
 const [search,setSearch]=useState("");

 const loadRecords=useCallback(async()=>{
  setLoading(true);
  try{
   const response=await fetch(API_URL,{
    method:"GET",
    cache:"no-store",
    credentials:"include",
    headers:{Accept:"application/json"}
   });
   if(!response.ok)throw new Error("Candidate API returned "+response.status);

   const data=await response.json();
   const rows=Array.isArray(data)?data:(data.rows||data.candidates||[]);
   const parsed=rows.map(mapCandidate).filter(x=>x.aid||x.name||x.email);

   setRecords(parsed);
   setCandidateId(old=>parsed.some(x=>x.aid===old)?old:(parsed[0]?.aid||""));
   setError("");
  }catch(e){
   setRecords([]);
   setCandidateId("");
   setError("Could not load actual candidate records. Connect the authenticated /api/candidates endpoint to the private Google Sheet. No sample records are displayed.");
  }finally{
   setLoading(false);
  }
 },[]);

 useEffect(()=>{
  loadRecords();
  const timer=setInterval(loadRecords,60000);
  return()=>clearInterval(timer);
 },[loadRecords]);

 const filtered=records.filter(c=>
  [c.aid,c.name,c.email,c.domain].join(" ").toLowerCase().includes(search.toLowerCase())
 );

 const candidate=records.find(c=>c.aid===candidateId)||null;
 const template=TEMPLATES.find(t=>t.id===templateId);

 function openTemplate(id){
  setTemplateId(id);
  setPreview(true);
 }

 return <main className="app">

  <header className="header no-print">
   <a href={WEBSITE} target="_blank" rel="noreferrer">
    <Logo/>
   </a>
   <div className="actions">
    <a className="btn" href={WEBSITE} target="_blank" rel="noreferrer">Company Website ↗</a>
    <a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Google Sheet ↗</a>
    <a className="btn primary"
       href={GMAIL_URL}
       target="_blank"
       rel="noreferrer">Company Gmail ↗</a>
   </div>
  </header>

  <section className="hero no-print">
   <div className="eyebrow">VR PI GROUP • CORPORATE OPERATIONS SUITE</div>
   <h1>Enterprise Talent<br/>
    <span style={{color:"#1e3a5f"}}>Excellence Platform</span>
   </h1>
   <p>A unified enterprise solution for intelligent talent management, official documentation, professional certifications, and automated corporate communication.</p>
  </section>

  <section className="panel no-print">
   <div className="kicker">CORPORATE DOCUMENT LIBRARY</div>
   <h2>Professional Document Generation</h2>
   <p className="description">Select an actual candidate record, choose an official VR PI Group document and preview the personalized A4 letter before saving it as PDF.</p>

   {error&&<div className="notice error">{error}</div>}

   <div className="fields">
    <div className="field">
     <label>SELECT CANDIDATE</label>
     <select value={candidateId}
      onChange={e=>setCandidateId(e.target.value)}>
      <option value="">{loading?"Loading real records...":"Select candidate"}</option>
      {filtered.map((c,i)=>
       <option key={c.aid||i} value={c.aid}>
        {c.name} — {c.aid}
       </option>
      )}
     </select>
     <input value={search}
      onChange={e=>setSearch(e.target.value)}
      placeholder="Search candidate name or application ID"
      style={{width:"100%",padding:10,marginTop:9,border:"1px solid #e1e7ef",borderRadius:8,fontSize:11}}/>
    </div>

    <div className="field">
     <label>SELECT DOCUMENT TEMPLATE</label>
     <select value={templateId} onChange={e=>setTemplateId(e.target.value)}>
      {TEMPLATES.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
     </select>

     <div className="notice" style={{marginTop:10}}>
      <b>{COMPANY}</b><br/>
      {LOCATION}<br/>
      {EMAIL}
     </div>
    </div>
   </div>

   <div className="notice">
    {loading?"Synchronizing actual Google Sheets records...":
     candidate?`Selected: ${candidate.name} • ${candidate.aid}`:
     "No candidate selected. Check the private Sheet API connection."}
   </div>

   <div className="templates">
    {TEMPLATES.map(t=>
     <article className={"template "+(templateId===t.id?"active":"")} key={t.id}>
      <span className="kicker" style={{color:t.color}}>VR PI • OFFICIAL DOCUMENT</span>
      <h3>{t.name}</h3>
      <p>{t.desc}</p>
      <button disabled={!candidate} onClick={()=>openTemplate(t.id)}>
       Preview A4 Document →
      </button>
     </article>
    )}
   </div>

   <div style={{display:"flex",justifyContent:"flex-end",marginTop:22}}>
    <button className="btn orange" disabled={!candidate}
     onClick={()=>setPreview(true)}>
     Open A4 / PDF Preview
    </button>
   </div>
  </section>

  <footer className="footer no-print">
   <div className="footer-brand"><Logo/></div>
   <b>{COMPANY}</b><br/>
   {LOCATION}<br/>
   {EMAIL}<br/>
   <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a>
   <p>Enterprise Talent Excellence Platform</p>
  </footer>

  {preview&&candidate&&
   <div className="modal">
    <div className="modal-inner">
     <div className="modalbar no-print">
      <strong>{template.name} • {candidate.name}</strong>
      <div className="modal-actions">
       <select value={candidateId} onChange={e=>setCandidateId(e.target.value)}>
        {records.map(c=><option key={c.aid} value={c.aid}>{c.name} — {c.aid}</option>)}
       </select>
       <button className="btn orange" onClick={()=>window.print()}>
        Print / Save PDF
       </button>
       <button className="btn" onClick={()=>setPreview(false)}>Close ×</button>
      </div>
     </div>

     <div className="modal-actions no-print" style={{justifyContent:"center",marginBottom:12}}>
      {TEMPLATES.map(t=>
       <button className="btn"
        key={t.id}
        style={{
         background:templateId===t.id?t.color:"#fff",
         color:templateId===t.id?"#fff":"#263d5e"
        }}
        onClick={()=>setTemplateId(t.id)}>
        {t.name}
       </button>
      )}
     </div>

     <div id="printTarget">
      {templateId==="offer"&&<OfferLetter c={candidate}/>}
      {templateId==="completion"&&<CompletionLetter c={candidate}/>}
      {templateId==="training"&&<TrainingLetter c={candidate}/>}
     </div>
    </div>
   </div>
  }
 </main>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
