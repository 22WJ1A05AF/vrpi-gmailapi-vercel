/*

 const BACKEND_API_BASE="https://your-real-project.vercel.app";

 When the website and /api/candidates run on the same Vercel
 domain, leave it empty to use the same-origin API.
*/

const API_PATH="/api/candidates";

 day:"2-digit",month:"long",year:"numeric"
});

/* TEN DOCUMENT TEMPLATES */

 {id:"participation",name:"Participation Certificate",group:"Certification",style:"certificate",color:"#0d7377",desc:"Professional participation certificate."},
 {id:"experience",name:"Experience Certificate",group:"Certification",style:"formal",color:"#1e3a5f",desc:"Formal professional experience document."},

 {id:"project-completion",name:"Project Completion Certificate",group:"Certification",style:"certificate",color:"#0d7377",desc:"Project completion recognition document."},
 {id:"general-certificate",name:"General Certification Letter",group:"Certification",style:"formal",color:"#1e3a5f",desc:"Official corporate certification correspondence."}

/*

 No manual record is ever sent to Google Sheets.
*/
const FIELDS={
 "internship-offer":[

  {key:"email",label:"Email Address",type:"email"},
  {key:"phone",label:"WhatsApp / Phone"},
  {key:"college",label:"College / Institution"},
  {key:"degree",label:"Degree / Qualification"},
  {key:"domain",label:"Internship Domain",required:true},

 ],

 "general-certificate":[

const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

function pick(row,names){
 const key=Object.keys(row||{}).find(k=>names.some(n=>norm(n)===norm(k)));
 return key?row[key]??"":"";
}

function mapCandidate(row,index=0){
 return {
  source:"sheet",
  key:String(pick(row,["Application ID","Application Id","aid"])||`sheet-${index}`),
  applicationId:pick(row,["Application ID","Application Id"]),
  aid:pick(row,["Application ID","Application Id"]),
  name:pick(row,["Full Name","Name"]),
  email:pick(row,["Email Address","Email"]),
  phone:pick(row,["WhatsApp / Phone","WhatsApp","Phone"]),
  college:pick(row,["College","Institution"]),
  degree:pick(row,["Degree","Qualification"]),
  domain:pick(row,["Domain","Internship Domain","Track"]),
  mode:pick(row,["Mode","Programme Mode","Work Mode"]),
  joining:pick(row,["Joining Date","Start Date","Commencement Date"]),
  endDate:pick(row,["End Date","Internship End Date"]),
  duration:pick(row,["Duration","Programme Duration"]),
  stipend:pick(row,["Stipend","Stipend Amount"]),
  completionDate:pick(row,["Completion Date"]),
  completionStatus:pick(row,["Completion Status","Training Completion Status","Certificate Status"]),
  participationStatus:pick(row,["Participation Status","Attendance Status"]),
  projectName:pick(row,["Project Name","Project Title"]),
  timestamp:pick(row,["Timestamp"]),
  status:pick(row,["Application Status","Email Status","Letter Sent","Status"]),
  pdf:pick(row,["PDF Record","PDF Link"]),
  updated:pick(row,["Last Updated","Updated At"]),
  raw:row
 };
}

/* READ-ONLY BACKEND CONNECTION */
function getCandidatesURL(){
 if(location.protocol==="file:"){
  if(!BACKEND_API_BASE||BACKEND_API_BASE.includes("YOUR-")){
   throw new Error("For direct Start-Process mode, set BACKEND_API_BASE to your deployed Vercel domain. A private Google Sheet cannot be read directly from a local HTML file.");
  }
  return BACKEND_API_BASE.replace(/\/$/,"")+API_PATH;
 }
 return (BACKEND_API_BASE?BACKEND_API_BASE.replace(/\/$/,""):"")+API_PATH;
}

async function fetchCandidates(){
 const url=getCandidatesURL();
 const response=await fetch(url,{
  method:"GET",
  cache:"no-store",
  credentials:"same-origin",
  headers:{Accept:"application/json"}
 });

 if(!response.ok){
  throw new Error(`Candidate API returned HTTP ${response.status}. Check the Vercel /api/candidates endpoint.`);
 }

 const data=await response.json();
 const rows=Array.isArray(data)?data:
  (data.rows||data.candidates||data.data||[]);

 return rows.map(mapCandidate).filter(c=>c.name||c.email||c.aid);
}

  awardDate:"Recognition Date",
  certificateTitle:"Certificate Purpose",
  issueDate:"Issue Date"
 };

 return <table className="doc-table"><tbody>
  {keys.map(key=>{
   const value=candidate[key];
   if(!value)return null;
   return <tr key={key}>
    <td>{labels[key]||key}</td>
    <td>{value}</td>
   </tr>;
  })}
 </tbody></table>;
}

function Signoff({department="Talent Acquisition Department",color="#1e3a5f"}){
 return <div className="signoff">
  Regards,
  <strong style={{color}}>{department}</strong>
  <small>{COMPANY}</small>
  <small>{LOCATION}</small>
  <small>{EMAIL}</small>
  <small>Authorized Corporate Representative</small>
 </div>;
}

function verified(candidate,template){
 if(candidate.source==="manual")return false;
 const status=template.id==="participation"
  ?candidate.participationStatus
  :template.id==="experience"
  ?candidate.experienceStatus
  :template.id==="project-completion"
  ?candidate.projectStatus
  :template.id==="appreciation"
  ?""
  :candidate.completionStatus;
 return /verified/i.test(String(status||""));
}

/* OFFER LETTER */
function OfferDocument({c,t}){
 const isTraining=t.group==="Training"||t.id==="internship-training";
 const keys=["name","applicationId","email","phone","college","degree","domain","mode","joining","endDate","duration","stipend"];

 return <div className="a4">
  <div style={{
   background:"#1e3a5f",padding:"22px 34px",
   display:"flex",justifyContent:"space-between",
   alignItems:"center",gap:15
  }}>
   <Logo style={{width:155,height:80}}/>
   <div style={{textAlign:"right",color:"#e2e8f0",fontSize:9,lineHeight:1.9}}>
    <b style={{color:"white"}}>{COMPANY}</b><br/>
    {LOCATION}<br/>{EMAIL}<br/>{WEBSITE}
   </div>
  </div>
  <div style={{height:4,background:"linear-gradient(90deg,#f97316,#fed7aa)"}}/>

  <div className="doc-content">
   <div className="doc-title">
    <small>OFFICIAL CORPORATE COMMUNICATION</small>
    <h2>{t.name.toUpperCase()}</h2>
    <small>DATE ISSUED: {TODAY()}</small>
   </div>

   <p><b>To: {c.name}</b><br/>
   {c.email||""}<br/>{c.phone||""}</p>

   <p>Dear {c.name},</p>

   <p>We are pleased to communicate this {isTraining?"training":"internship"} opportunity at <b>{COMPANY}</b> in the <b>{c.domain}</b> programme. The candidate information available for this document is presented below.</p>

   <p>The engagement will be subject to the programme details and applicable terms formally communicated by the organization.</p>

   <div className="doc-section">{isTraining?"TRAINING PARTICULARS":"INTERNSHIP PARTICULARS"}</div>
   <DetailTable candidate={c} keys={keys}/>

   <div className="doc-section">PROGRAMME GUIDELINES</div>
   <p>1. Maintain professional conduct during the programme.</p>
   <p>2. Complete assigned activities within communicated timelines.</p>
   <p>3. Handle confidential company information responsibly.</p>
   <p>4. Follow instructions issued by the authorized programme coordinator.</p>

   <div className="signoff">
    Regards,
    <strong>Talent Acquisition Department</strong>
    <small>{COMPANY}</small>
    <small>{LOCATION}</small>
    <small>{EMAIL}</small>
   </div>
  </div>
  <DocumentFooter/>
 </div>;
}

/* TRAINING APPOINTMENT */
function TrainingDocument({c,t}){
 return <div className="a4">
  <div className="training-top"/>
  <div className="doc-header" style={{borderColor:"#e94b17"}}>
   <Logo/>
   <div className="doc-info">
    <strong>{COMPANY}</strong><br/>{LOCATION}<br/>{EMAIL}<br/>{WEBSITE}
   </div>
  </div>

  <div className="doc-content" style={{padding:"34px 42px"}}>
   <div style={{fontSize:10,color:"#e94b17",fontWeight:800,letterSpacing:2}}>
    {COMPANY.toUpperCase()}
   </div>
   <h2 style={{fontSize:24,color:"#111827",lineHeight:1.2,margin:"12px 0 22px"}}>
    {t.name.toUpperCase()}
   </h2>
   <p><b>Date:</b> {TODAY()}<br/>
   <b>Reference:</b> {c.applicationId||"Not provided"}<br/>
   <b>Candidate:</b> {c.name}</p>

   <p>Dear {c.name},</p>

   <p>We are pleased to present this training communication for the <b style={{color:"#e94b17"}}>{c.domain}</b> programme at <b>{COMPANY}</b>.</p>

   <div className="doc-section" style={{color:"#e94b17"}}>TRAINING PARTICULARS</div>
   <DetailTable candidate={c} keys={[
    "name","applicationId","email","phone","college","degree",
    "domain","mode","joining","endDate","duration","stipend"
   ]}/>

   <div style={{background:"#111827",color:"#e2e8f0",borderRadius:7,padding:17,fontSize:10,lineHeight:1.9}}>
    <b style={{color:"#f97316"}}>PROFESSIONAL EXPECTATIONS</b><br/>
    Maintain professional conduct, meet communicated deliverable timelines, comply with confidentiality expectations, and follow programme instructions.
   </div>

   <Signoff department="Industrial Training Department" color="#e94b17"/>
  </div>
  <DocumentFooter color="#191928"/>
 </div>;
}

/* COMPLETION / EXPERIENCE / OTHER FORMAL DOCUMENTS */
function FormalDocument({c,t}){
 const isCertificate=t.style==="certificate";
 const isVerified=verified(c,t);
 const keys=["name","applicationId","email","college","degree","domain","role","projectName","eventTitle","joining","endDate","completionDate","participationDate","duration","awardDate","issueDate"];

 let body="This document is prepared in connection with the programme and candidate information listed below. All applicable details should be reviewed by the authorized company representative.";

 if(t.id==="internship-completion"||t.id==="training-completion"){
  body=isVerified
   ?`This document records the verified completion of the ${c.domain} programme at ${COMPANY}.`
   :`This document has been prepared for ${c.name} in relation to the ${c.domain} programme. Completion must be confirmed by the organization before official issuance.`;
 }else if(t.id==="experience"){
  body="This document records the candidate's stated role and engagement information for review by the company. All employment dates and experience particulars require verification.";
 }else if(t.id==="participation"){
  body="This document is prepared in recognition of the candidate's participation in the programme listed below, subject to confirmation of attendance.";
 }else if(t.id==="project-completion"){
  body=`This document concerns the project "${c.projectName}" and is subject to verification of project completion by the responsible department.`;
 }else if(t.id==="appreciation"){
  body=`This document recognizes the contribution described by the candidate: ${c.achievement||"Contribution details to be confirmed"}. Final approval is required before issue.`;
 }else{
  body=`This document is prepared in relation to ${c.certificateTitle||t.name}. Its purpose and supporting particulars must be validated before official issuance.`;
 }

 return <div className="a4">
  <div style={{padding:"23px 34px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"2px solid #e7edf1"}}>
   <Logo/>
   <div className="doc-info">
    <b>{COMPANY}</b><br/>{LOCATION}<br/>{EMAIL}<br/>{WEBSITE}
   </div>
  </div>
  <div style={{height:4,background:"#0d7377"}}/>

  {(!isVerified||c.source==="manual")&&
   <div className="draft">DRAFT PREVIEW • VERIFY DETAILS BEFORE OFFICIAL ISSUE</div>}

  <div className="doc-content" style={{padding:"35px 45px"}}>
   <div style={{fontSize:10,color:"#0d7377",fontWeight:800,letterSpacing:3,marginBottom:23}}>
    DATE: {TODAY()}
   </div>

   {isCertificate?
    <div style={{border:"2px solid #0d7377",padding:16,marginBottom:20}}>
     <div style={{border:"1px solid #b7dddd",padding:"35px 22px",textAlign:"center"}}>
      <Logo style={{width:135,height:70,margin:"0 auto 20px"}}/>
      <div style={{color:"#0d7377",fontSize:10,fontWeight:800,letterSpacing:3}}>{COMPANY.toUpperCase()}</div>
      <h2 style={{fontSize:22,color:"#0d7377",margin:"22px 0"}}>{t.name.toUpperCase()}</h2>
      <p style={{textAlign:"center",fontSize:11}}>This document is prepared for</p>
      <div style={{fontFamily:"Playfair Display,serif",fontSize:25,color:"#1e3a5f",margin:"17px 0"}}>{c.name}</div>
      <p style={{textAlign:"center",lineHeight:2,fontSize:11}}>{body}</p>
      <p style={{textAlign:"center",fontSize:10,color:"#66758c"}}>Reference: {c.applicationId||"Not provided"}</p>
     </div>
    </div>
    :
    <>
     <h2 style={{fontSize:18,color:"#0d7377",marginBottom:18}}>{t.name}</h2>
     <p>Respected {c.name},</p>
     <p>{body}</p>
     <div className="doc-section">CANDIDATE AND PROGRAMME DETAILS</div>
     <DetailTable candidate={c} keys={keys}/>
     <p>We appreciate the candidate's professional development and wish them continued success.</p>
    </>
   }

   <Signoff department="Talent Excellence Division" color="#0d7377"/>
  </div>
  <DocumentFooter color="#0d7377"/>
 </div>;
}

function DocumentRenderer({candidate,template}){
 if(template.style==="offer")return <OfferDocument c={candidate} t={template}/>;
 if(template.style==="training")return <TrainingDocument c={candidate} t={template}/>;
 return <FormalDocument c={candidate} t={template}/>;
}

/* MAIN APPLICATION */
function App(){
 const [records,setRecords]=useState([]);
 const [source,setSource]=useState("sheet");
 const [selectedId,setSelectedId]=useState("");
 const [templateId,setTemplateId]=useState("internship-offer");
 const [manual,setManual]=useState({});
 const [search,setSearch]=useState("");
 const [loading,setLoading]=useState(true);
 const [error,setError]=useState("");
 const [notice,setNotice]=useState("");
 const [lastSync,setLastSync]=useState("");
 const [preview,setPreview]=useState(false);

 const template=TEMPLATES.find(t=>t.id===templateId)||TEMPLATES[0];
 const templateFields=FIELDS[templateId]||[];

 const refresh=useCallback(async()=>{
  setLoading(true);
  setError("");
  try{
   const data=await fetchCandidates();
   setRecords(data);
   setSelectedId(old=>data.some(c=>c.key===old)?old:(data[0]?.key||""));
   setLastSync(new Date().toLocaleTimeString("en-IN"));
   setNotice(`${data.length} actual Google Sheets records synchronized.`);
  }catch(e){
   setError(e.message||"Unable to retrieve Google Sheets data.");
   setRecords([]);
   setSelectedId("");
   setNotice("");
  }finally{
   setLoading(false);
  }
 },[]);

 useEffect(()=>{
  refresh();
  const timer=setInterval(refresh,30000);
  return()=>clearInterval(timer);
 },[refresh]);

 const filtered=useMemo(()=>{
  const q=search.trim().toLowerCase();
  if(!q)return records;
  return records.filter(c=>
   Object.values(c.raw||{}).join(" ").toLowerCase().includes(q)||
   [c.aid,c.name,c.email,c.phone,c.domain].join(" ").toLowerCase().includes(q)
  );
 },[records,search]);

 const sheetCandidate=records.find(c=>c.key===selectedId)||null;

 const manualCandidate={
  ...manual,
  source:"manual",
  aid:manual.applicationId||"MANUAL PREVIEW",
  name:manual.name||"",
  email:manual.email||"",
  domain:manual.domain||manual.eventTitle||manual.certificateTitle||"",
  college:manual.college||""
 };

 const candidate=source==="manual"?manualCandidate:sheetCandidate;

 function setManualField(key,value){
  setManual(prev=>({...prev,[key]:value}));
 }

 function clearManual(){
  setManual({});
 }

 const requiredMissing=templateFields
  .filter(f=>f.required)
  .some(f=>!String(manual[f.key]||"").trim());

 const canPreview=source==="sheet"
  ?Boolean(sheetCandidate)
  :!requiredMissing;

 function showPreview(){
  if(!canPreview)return;
  setPreview(true);
 }

 function openSheetRecord(c){
  setSource("sheet");
  setSelectedId(c.key);
  setPreview(true);
 }

 const sent=records.filter(c=>String(c.status).toUpperCase().includes("SENT")).length;
 const pending=records.filter(c=>String(c.status).toUpperCase().includes("PENDING")).length;
 const failed=records.filter(c=>String(c.status).toUpperCase().includes("FAIL")).length;

 return <main className="app">

  {/* HEADER */}

  <header className="header no-print">
   <a className="brand" href={WEBSITE} target="_blank" rel="noreferrer">
    <CompanyLogo className="logo"/>
    <div className="brand-text">
     <strong>{COMPANY}</strong>
     <small>ENGINEERING • CONSULTANCY • TALENT EXCELLENCE</small>
    </div>
   </a>

   <div className="actions">
    <a className="btn" href={WEBSITE} target="_blank" rel="noreferrer">Company Website ↗</a>
    <a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Google Sheet ↗</a>
    <a className="btn btn-dark" href={GMAIL_URL} target="_blank" rel="noreferrer">Company Gmail ↗</a>
    <button className="btn btn-orange" onClick={refresh} disabled={loading}>
     {loading?"Syncing...":"↻ Refresh"}
    </button>
   </div>
  </header>

  {/* HERO */}

  <section className="hero no-print">
   <div className="eyebrow">VR PI GROUP • ENTERPRISE OPERATIONS SUITE</div>
   <h1>Enterprise Talent<br/>
    <span style={{color:"#1e3a5f"}}>Excellence Platform</span>
   </h1>
   <p>A unified enterprise solution for intelligent talent management, official documentation, professional certifications, and automated corporate communication.</p>
  </section>

  {/* CONNECTION STATUS */}

  {error&&<div className="alert alert-error no-print">
   <b>Google Sheets connection:</b> {error}
   <br/><br/>
   {location.protocol==="file:"
    ?"For Start-Process mode, set BACKEND_API_BASE to the deployed Vercel URL. The private Google Sheet must be read through the authenticated backend."
    :"Ensure that the deployed Vercel project contains GET /api/candidates and that it returns the current Google Sheet records."}
  </div>}

  {notice&&<div className="alert alert-success no-print">
   {notice} • Last sync: {lastSync}
  </div>}

  {/* DASHBOARD */}

  <section className="stats no-print">
   {[
    ["TOTAL APPLICANTS",records.length,"Actual sheet records","#1e3a5f"],
    ["LETTERS ISSUED",sent,"Recorded sent status","#15803d"],
    ["PENDING ACTIONS",pending,"Recorded pending status","#b45309"],
    ["FAILED RECORDS",failed,"Recorded failed status","#dc2626"]
   ].map(([label,value,note,color])=>(
    <div className="stat" key={label}>
     <label>{label}</label>
     <strong style={{color}}>{value}</strong>
     <small>{note}</small>
    </div>
   ))}
  </section>

  {/* CANDIDATE RECORDS */}

  <section className="panel no-print">
   <div className="section-head">
    <div>
     <div className="kicker">LIVE DATA MANAGEMENT • READ ONLY</div>
     <h2>Candidate Records</h2>
     <p className="description">
      Actual records from your connected Google Sheet.
      Automatically synchronized every 30 seconds.
     </p>
    </div>
    <input className="search" value={search}
     onChange={e=>setSearch(e.target.value)}
     placeholder="Search ID, name, email..."/>
   </div>

   <div className="table-wrap">
    {loading&&records.length===0?
     <div className="empty">Connecting to the company records...</div>:
     filtered.length===0?
     <div className="empty">No actual candidate records available.</div>:
     <table className="records">
      <thead><tr>
       <th>Application ID</th><th>Candidate</th><th>Email</th>
       <th>Phone</th><th>Domain</th><th>Status</th>
       <th>PDF Record</th><th>Timestamp</th><th>Action</th>
      </tr></thead>
      <tbody>
       {filtered.map(c=>{
        const s=String(c.status||"Not recorded");
        const cls=s.toUpperCase().includes("SENT")?"sent":
         s.toUpperCase().includes("FAIL")?"failed":
         s.toUpperCase().includes("PENDING")?"pending":"";
        return <tr key={c.key}>
         <td>{c.aid||"—"}</td>
         <td><b>{c.name||"—"}</b></td>
         <td>{c.email||"—"}</td>
         <td>{c.phone||"—"}</td>
         <td>{c.domain||"—"}</td>
         <td><span className={"status "+cls}>{s}</span></td>
         <td>{c.pdf||"—"}</td>
         <td>{c.timestamp||"—"}</td>
         <td><button className="text-btn" onClick={()=>openSheetRecord(c)}>Preview</button></td>
        </tr>;
       })}
      </tbody>
     </table>
    }
   </div>
  </section>

  {/* DOCUMENT GENERATION */}

  <section className="panel no-print">
   <div className="kicker">OFFICIAL CORPORATE DOCUMENT LIBRARY</div>
   <h2>Professional Document Generation</h2>
   <p className="description">
    Select an existing Google Sheet record or enter only the information
    required for your selected document. Manual entries are used exclusively
    for temporary previews and are never added to the Google Sheet.
   </p>

   {/* DATA SOURCE */}

   <div className="source-tabs">
    <button className={"source-tab "+(source==="sheet"?"active":"")}
     onClick={()=>setSource("sheet")}>
     Use Google Sheet Record
    </button>
    <button className={"source-tab "+(source==="manual"?"active":"")}
     onClick={()=>setSource("manual")}>
     Enter Details Manually
    </button>
   </div>

   <div className="template-layout">

    {/* CANDIDATE SOURCE */}

    <div className="field">
     <label>SELECT CANDIDATE / DATA SOURCE</label>

     {source==="sheet"?
      <>
       <select value={selectedId}
        onChange={e=>setSelectedId(e.target.value)}>
        <option value="">Select actual candidate</option>
        {records.map(c=>
         <option key={c.key} value={c.key}>
          {c.name} — {c.aid}
         </option>
        )}
       </select>
       <div className="alert alert-info">
        <b>Read-only Sheet connection</b><br/>
        Selecting a candidate loads actual spreadsheet values.
        No changes are made to the original records.
       </div>
      </>
      :
      <>
       <div className="alert alert-success">
        <b>Temporary manual preview</b><br/>
        Only the fields required by the selected template are shown.
        No submission or sheet update occurs.
       </div>
       <button className="btn" onClick={clearManual}>
        Clear Manual Details
       </button>
      </>
     }
    </div>

    {/* TEMPLATE SELECTOR */}

    <div className="field">
     <label>SELECT DOCUMENT TEMPLATE</label>
     <select value={templateId}
      onChange={e=>{
       setTemplateId(e.target.value);
       if(source==="manual")setManual({});
      }}>
      <optgroup label="Internship Documents">
       {TEMPLATES.filter(t=>t.group==="Internship").map(t=>
        <option key={t.id} value={t.id}>{t.name}</option>
       )}
      </optgroup>
      <optgroup label="Training Documents">
       {TEMPLATES.filter(t=>t.group==="Training").map(t=>
        <option key={t.id} value={t.id}>{t.name}</option>
       )}
      </optgroup>
      <optgroup label="Certifications and Other Letters">
       {TEMPLATES.filter(t=>t.group==="Certification").map(t=>
        <option key={t.id} value={t.id}>{t.name}</option>
       )}
      </optgroup>
     </select>

     <div className="template-description">
      <span className="kicker" style={{color:template.color}}>VR PI • OFFICIAL DOCUMENT</span>
      <strong>{template.name}</strong>
      <p>{template.desc}</p>
      <div className="template-categories">
       <span className="category-pill">{template.group}</span>
       <span className="category-pill">A4 Portrait</span>
       <span className="category-pill">PDF Preview</span>
      </div>
     </div>
    </div>
   </div>

   {/* TEMPLATE-SPECIFIC MANUAL FORM */}

   {source==="manual"&&
    <div className="manual-box">
     <div className="kicker">TEMPLATE-SPECIFIC CANDIDATE DETAILS</div>
     <h2>Enter {template.name} Details</h2>
     <p className="description">
      Complete only the following fields. The preview will update
      using these temporary values. They will not be sent to the sheet.
     </p>

     <div className="form-grid">
      {templateFields.map(field=>(
       <div className="form-field" key={field.key}>
        <label>
         {field.label}
         {field.required&&<span className="required"> *</span>}
        </label>

        {field.type==="select"?
         <select
          value={manual[field.key]||""}
          onChange={e=>setManualField(field.key,e.target.value)}>
          <option value="">Select {field.label}</option>
          {field.options.map(o=><option key={o} value={o}>{o}</option>)}
         </select>
         :
         field.type==="textarea"?
         <textarea
          value={manual[field.key]||""}
          placeholder={`Enter ${field.label.toLowerCase()}`}
          onChange={e=>setManualField(field.key,e.target.value)}/>
         :
         <input
          type={field.type||"text"}
          value={manual[field.key]||""}
          placeholder={`Enter ${field.label.toLowerCase()}`}
          onChange={e=>setManualField(field.key,e.target.value)}/>
        }
       </div>
      ))}
     </div>

     <div className="alert alert-info">
      <b>Privacy:</b> These manually entered values remain in React
      memory for this page session only. There is no POST request,
      database insertion or Google Sheets update.
     </div>

     <div className="form-actions">
      <button className="btn" onClick={clearManual}>Clear Form</button>
      <button className="btn btn-orange" disabled={!canPreview}
       onClick={()=>setPreview(true)}>
       Preview A4 Document →
      </button>
     </div>
    </div>
   }

   {/* GOOGLE SHEET PREVIEW BUTTON */}

   {source==="sheet"&&
    <div className="section-head" style={{marginTop:22}}>
     <span className="description">
      {candidateOrMessage(sheetCandidate)}
     </span>
     <button className="btn btn-orange"
      disabled={!sheetCandidate}
      onClick={()=>setPreview(true)}>
      Preview Selected A4 Document →
     </button>
    </div>
   }

  </section>

  {/* FOOTER */}

  <footer className="footer no-print">
   <CompanyLogo className="footer-logo"/>
   <b>{COMPANY}</b><br/>
   {LOCATION}<br/>
   {EMAIL}<br/>
   <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a>
   <p>Enterprise Talent Excellence Platform</p>
  </footer>

  {/* A4 PREVIEW */}

  {preview&&candidate&&
   <div className="modal">
    <div className="modal-inner">

     <div className="modalbar no-print">
      <strong>{template.name} • {candidate.name}</strong>
      <div className="modal-actions">
       {source==="sheet"&&
        <select value={selectedId}
         onChange={e=>setSelectedId(e.target.value)}>
         {records.map(c=>
          <option key={c.key} value={c.key}>
           {c.name} — {c.aid}
          </option>
         )}
        </select>
       }
       <button className="btn btn-orange" onClick={()=>window.print()}>
        Print / Save A4 PDF
       </button>
       <button className="btn" onClick={()=>setPreview(false)}>Close ×</button>
      </div>
     </div>

     <div className="modal-tabs no-print">
      {TEMPLATES.map(t=>
       <button key={t.id}
        className={templateId===t.id?"active":""}
        onClick={()=>{
         setTemplateId(t.id);
         if(source==="manual")setManual({});
        }}>
        {t.name}
       </button>
      )}
     </div>

     <div id="printTarget">
      <DocumentRenderer candidate={candidate} template={template}/>
     </div>

    </div>
   </div>
  }
 </main>;
}

function candidateOrMessage(candidate){
 return candidate
  ?`Selected: ${candidate.name} • ${candidate.aid}`
  :"Select a real candidate from the connected sheet.";
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
