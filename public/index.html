    // ── MAIN APP ─────────────────────────────────────────────────
    function App() {
      const [candidates, setCandidates] = useState(REAL_ROWS);
      const [syncing, setSyncing]       = useState(false);
      const [syncMsg, setSyncMsg]       = useState("");
      const [selTmpl, setSelTmpl]       = useState("offer");
      const [a4Open, setA4Open]         = useState(false);
      const [histOpen, setHistOpen]     = useState(false);
      const [search, setSearch]         = useState("");
      const [activeCand, setActiveCand] = useState(REAL_ROWS[0]);

      const fetchSheet = useCallback(async () => {
        setSyncing(true); setSyncMsg("Connecting to Google Sheet...");
        try {
          const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
          const r = await fetch(url);
          if (!r.ok) throw new Error("HTTP " + r.status);
          const text = await r.text();
          const json = JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1));
          const rows = json?.table?.rows || [];
          const g = (row, idx) => (row.c && row.c[idx] && row.c[idx].v != null ? String(row.c[idx].v).trim() : "");
          const parsed = rows.map((row, i) => {
            const name = g(row,2), email = g(row,3);
            if (!name && !email) return null;
            return { timestamp:g(row,0), aid:g(row,1)||`VRPI-INT-${9000+i}`, name:name||"Candidate", email, phone:g(row,4), domain:g(row,7)||"Full Stack Web Development", status:(g(row,17)||"PENDING").toUpperCase(), pdfRecord:g(row,18)||"Pending", lastUpdated:g(row,19)||"", notes:g(row,20)||"" };
          }).filter(Boolean);
          if (parsed.length > 0) { setCandidates(parsed); setActiveCand(parsed[0]); setSyncMsg(`✓ Synced ${parsed.length} live records from Google Sheet`); }
          else setSyncMsg("Sheet returned 0 rows — showing cached records.");
        } catch (e) {
          setSyncMsg("Sheet not publicly shared — showing cached records. Set sheet to 'Anyone with link can view'.");
        }
        setSyncing(false);
        setTimeout(() => setSyncMsg(""), 7000);
      }, []);

      useEffect(() => { fetchSheet(); }, []);

      const filtered = candidates.filter(c =>
        c.name.toLowerCase().includes(search.toLowerCase()) ||
        c.aid.toLowerCase().includes(search.toLowerCase()) ||
        c.email.toLowerCase().includes(search.toLowerCase())
      );
      const count = s => candidates.filter(c => c.status === s).length;

      const BS = (bg,color,border) => ({display:"inline-flex",alignItems:"center",gap:7,padding:"10px 20px",borderRadius:12,background:bg,color,fontWeight:800,fontSize:11.5,border:border||"none",cursor:"pointer",textDecoration:"none",whiteSpace:"nowrap",boxShadow:bg==="#1e3a5f"?"0 4px 14px rgba(30,58,95,0.25)":"0 1px 5px rgba(0,0,0,0.07)"});

      return (
        <div style={{maxWidth:1100,margin:"0 auto",padding:"32px 20px"}}>

          {/* HEADER */}
          <header style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:20,marginBottom:28,borderBottom:"1.5px solid #e2e8f0",flexWrap:"wrap",gap:14}}>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <VRLogo size={50} />
              <div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <a href={COMPANY_URL} target="_blank" rel="noreferrer" style={{fontSize:15,fontWeight:800,color:"#0f172a",textDecoration:"none"}}>VR PI Group of Companies</a>
                  <span style={{fontSize:9,fontWeight:700,padding:"3px 9px",borderRadius:20,background:"#fff7ed",color:"#c2410c",border:"1px solid #fed7aa",textTransform:"uppercase",letterSpacing:.5}}>Live Operations</span>
                </div>
                <div style={{fontSize:10,color:"#64748b",marginTop:3}}>Talent Acquisition • Document Synthesis • Gmail API Engine</div>
              </div>
            </div>
            <div style={{display:"flex",gap:9,flexWrap:"wrap"}}>
              <a href={SHEET_URL} target="_blank" rel="noreferrer" style={BS("#fff","#15803d","1.5px solid #e2e8f0")}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/></svg>
                Connected Sheet
              </a>
              <a href={GMAIL_URL} target="_blank" rel="noreferrer" style={BS("#fff","#dc2626","1.5px solid #e2e8f0")}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                Gmail Inbox
              </a>
              <div style={{display:"flex",alignItems:"center",gap:7,padding:"10px 16px",borderRadius:12,background:"#f0fdf4",border:"1.5px solid #bbf7d0",fontSize:11,fontWeight:700,color:"#15803d"}}>
                <span style={{width:7,height:7,borderRadius:"50%",background:"#22c55e",display:"inline-block"}}></span>
                24/7 Engine Active
              </div>
            </div>
          </header>

          {/* HERO */}
          <section style={{textAlign:"center",maxWidth:760,margin:"0 auto 40px",padding:"0 10px"}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:8,padding:"5px 16px",borderRadius:20,background:"#fff",border:"1px solid #e2e8f0",fontSize:10.5,color:"#64748b",fontWeight:600,marginBottom:18,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
              <span style={{width:6,height:6,borderRadius:"50%",background:"#f97316",display:"inline-block"}}></span>
              Enterprise Automation • Google Sheets • Gmail API • A4 PDF Engine
            </div>
            <h1 style={{fontSize:38,fontWeight:900,color:"#0f172a",lineHeight:1.12,marginBottom:14,letterSpacing:-0.5}}>
              Enterprise Talent<br/>
              <span style={{color:"#1e3a5f"}}>Excellence Platform</span>
            </h1>
            <p style={{fontSize:13,color:"#64748b",lineHeight:1.8,maxWidth:640,margin:"0 auto 28px"}}>
              A unified enterprise solution for intelligent talent management, official documentation, professional certifications, and automated corporate communication.
            </p>
            <div style={{display:"flex",justifyContent:"center",gap:12,flexWrap:"wrap"}}>
              <button onClick={()=>setA4Open(true)} style={BS("#1e3a5f","#fff")}>
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                Preview A4 Template
              </button>
              <button onClick={()=>setHistOpen(true)} style={BS("#fff","#0f172a","1.5px solid #e2e8f0")}>
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                View Sheet History ({candidates.length})
              </button>
              <button onClick={fetchSheet} disabled={syncing} style={BS("#fff","#15803d","1.5px solid #bbf7d0")}>
                {syncing ? "Syncing…" : "↻ Sync Sheet Data"}
              </button>
            </div>
            {syncMsg && (
              <div style={{marginTop:14,fontSize:11,padding:"9px 20px",borderRadius:10,background:syncMsg.startsWith("✓")?"#f0fdf4":"#fef3c7",color:syncMsg.startsWith("✓")?"#166534":"#92400e",border:`1px solid ${syncMsg.startsWith("✓")?"#bbf7d0":"#fde68a"}`,display:"inline-block"}}>
                {syncMsg}
              </div>
            )}
          </section>

          {/* STATS */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:38}}>
            {[{l:"Total Applicants",v:candidates.length,s:"Real records from Sheet",c:"#1e3a5f"},{l:"Letters Issued",v:count("SENT"),s:"Gmail API Delivered",c:"#15803d"},{l:"Pending Actions",v:count("PENDING"),s:"Ready to dispatch",c:"#b45309"},{l:"Failed / Retries",v:count("FAILED"),s:"Missing email / API blocks",c:"#dc2626"}].map((x,i)=>(
              <div key={i} style={{background:"#fff",borderRadius:16,padding:"20px",border:"1.5px solid #e2e8f0",boxShadow:"0 1px 6px rgba(0,0,0,0.04)"}}>
                <div style={{fontSize:9,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#94a3b8",marginBottom:8}}>{x.l}</div>
                <div style={{fontSize:34,fontWeight:900,color:x.c,lineHeight:1}}>{x.v}</div>
                <div style={{fontSize:10,color:"#94a3b8",marginTop:7}}>{x.s}</div>
              </div>
            ))}
          </div>

          {/* TEMPLATE CARDS */}
          <section style={{marginBottom:50}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div>
                <h2 style={{fontSize:15,fontWeight:800,color:"#0f172a",margin:0}}>Document Templates</h2>
                <p style={{fontSize:11,color:"#64748b",marginTop:4}}>3 professionally distinct A4 layouts — click to select &amp; preview</p>
              </div>
              <span style={{fontSize:10,fontWeight:700,padding:"4px 14px",borderRadius:20,background:"#fff",border:"1px solid #e2e8f0",color:"#64748b"}}>3 Layouts</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:18}}>
              {TEMPLATES.map(t=>(
                <div key={t.id} style={{background:"#fff",borderRadius:18,padding:"22px 22px 18px",border:`2px solid ${selTmpl===t.id?t.color:"#e2e8f0"}`,boxShadow:selTmpl===t.id?`0 0 0 4px ${t.color}22`:"0 1px 6px rgba(0,0,0,0.04)",transition:"all .2s",display:"flex",flexDirection:"column"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                    <span style={{fontSize:9,fontWeight:700,padding:"3px 10px",borderRadius:20,background:`${t.color}18`,color:t.color,border:`1px solid ${t.color}44`,textTransform:"uppercase",letterSpacing:.5}}>{t.tag}</span>
                    <span style={{fontSize:10,color:"#94a3b8",fontFamily:"JetBrains Mono,monospace"}}>Style {TEMPLATES.indexOf(t)+1}</span>
                  </div>
                  <h3 style={{fontSize:13,fontWeight:800,color:"#0f172a",marginBottom:8}}>{t.title}</h3>
                  <p style={{fontSize:11,color:"#64748b",lineHeight:1.65,flex:1}}>{t.desc}</p>
                  <button onClick={()=>{setSelTmpl(t.id);setA4Open(true);}} style={{marginTop:16,padding:"10px 16px",borderRadius:10,background:selTmpl===t.id?t.color:"#0f172a",color:"#fff",fontWeight:700,fontSize:11,border:"none",cursor:"pointer",width:"100%"}}>
                    {selTmpl===t.id?"✓ View Selected Template":"Select & Preview →"}
                  </button>
                </div>
              ))}
            </div>
          </section>

          {/* HISTORY MODAL */}
          {histOpen && (
            <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.65)",backdropFilter:"blur(5px)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,zIndex:200}}>
              <div style={{background:"#fff",borderRadius:24,maxWidth:1050,width:"100%",maxHeight:"90vh",display:"flex",flexDirection:"column",boxShadow:"0 24px 80px rgba(0,0,0,0.3)",border:"1px solid #e2e8f0"}}>
                <div style={{padding:"22px 28px 14px",borderBottom:"1px solid #f1f5f9",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:9}}>
                      <span style={{width:10,height:10,borderRadius:"50%",background:"#22c55e",display:"inline-block"}}></span>
                      <h3 style={{fontSize:16,fontWeight:800,color:"#0f172a",margin:0}}>Google Sheet Tracking History</h3>
                    </div>
                    <p style={{fontSize:11,color:"#64748b",marginTop:4}}>Columns A–E &amp; R–U from <strong>Internship_Students</strong> • {candidates.length} Candidate Records</p>
                  </div>
                  <button onClick={()=>setHistOpen(false)} style={{width:32,height:32,borderRadius:"50%",background:"#f1f5f9",border:"none",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#64748b",fontWeight:700}}>×</button>
                </div>
                <div style={{padding:"12px 28px",display:"flex",gap:10,alignItems:"center",borderBottom:"1px solid #f1f5f9"}}>
                  <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, App ID, or email…"
                    style={{flex:1,padding:"9px 14px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:11,fontFamily:"JetBrains Mono,monospace",outline:"none",background:"#f8fafc"}} />
                  <a href={SHEET_URL} target="_blank" rel="noreferrer" style={{padding:"9px 18px",borderRadius:10,background:"#15803d",color:"#fff",fontWeight:700,fontSize:11,textDecoration:"none",whiteSpace:"nowrap"}}>Open Live Sheet</a>
                  <button onClick={fetchSheet} disabled={syncing} style={{padding:"9px 14px",borderRadius:10,background:"#f1f5f9",border:"1px solid #e2e8f0",fontSize:13,fontWeight:700,cursor:"pointer",color:"#0f172a"}}>{syncing?"…":"↻"}</button>
                </div>
                <div style={{flex:1,overflowY:"auto",padding:"0 28px"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead style={{position:"sticky",top:0,background:"#fff",zIndex:10}}>
                      <tr style={{borderBottom:"2px solid #f1f5f9"}}>
                        {["Timestamp (A)","App ID (B)","Full Name (C)","Email (D)","Phone (E)","Status (R)","PDF Record (S)","Last Updated (T)","Notes (U)"].map(h=>(
                          <th key={h} style={{padding:"12px 10px",textAlign:"left",fontSize:9,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:1,whiteSpace:"nowrap"}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {filtered.length===0?(
                        <tr><td colSpan={9} style={{textAlign:"center",padding:40,color:"#94a3b8",fontSize:13}}>No records match your search</td></tr>
                      ):filtered.map((c,i)=>(
                        <tr key={i} onClick={()=>{setActiveCand(c);setHistOpen(false);setA4Open(true);}}
                          style={{borderBottom:"1px solid #f8fafc",cursor:"pointer"}}
                          onMouseEnter={e=>e.currentTarget.style.background="#f8faff"}
                          onMouseLeave={e=>e.currentTarget.style.background=""}>
                          <td style={{padding:"12px 10px",fontFamily:"JetBrains Mono,monospace",fontSize:9.5,color:"#64748b",whiteSpace:"nowrap"}}>{c.timestamp}</td>
                          <td style={{padding:"12px 10px",fontFamily:"JetBrains Mono,monospace",fontWeight:700,color:"#1e3a5f",whiteSpace:"nowrap"}}>{c.aid}</td>
                          <td style={{padding:"12px 10px",fontWeight:700,color:"#0f172a",whiteSpace:"nowrap"}}>{c.name}</td>
                          <td style={{padding:"12px 10px",fontFamily:"JetBrains Mono,monospace",fontSize:9.5,color:"#64748b"}}>{c.email}</td>
                          <td style={{padding:"12px 10px",fontFamily:"JetBrains Mono,monospace",fontSize:9.5,color:"#94a3b8",whiteSpace:"nowrap"}}>{c.phone}</td>
                          <td style={{padding:"12px 10px"}}>
                            <span className={c.status==="SENT"?"s-sent":c.status==="FAILED"?"s-failed":"s-pending"}>{c.status||"PENDING"}</span>
                          </td>
                          <td style={{padding:"12px 10px",fontSize:10,color:"#475569",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.pdfRecord}</td>
                          <td style={{padding:"12px 10px",fontFamily:"JetBrains Mono,monospace",fontSize:9.5,color:"#94a3b8",whiteSpace:"nowrap"}}>{c.lastUpdated}</td>
                          <td style={{padding:"12px 10px",fontSize:10,color:"#64748b",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.notes}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{padding:"14px 28px",borderTop:"1px solid #f1f5f9",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:11,color:"#94a3b8"}}>Showing {filtered.length} of {candidates.length} records • Click any row to preview its document</span>
                  <button onClick={()=>setHistOpen(false)} style={{padding:"9px 22px",borderRadius:10,background:"#0f172a",color:"#fff",fontSize:11,fontWeight:700,border:"none",cursor:"pointer"}}>Close History</button>
                </div>
              </div>
            </div>
          )}

          {/* A4 TEMPLATE MODAL */}
          {a4Open && (
            <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.8)",backdropFilter:"blur(6px)",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"20px 10px",zIndex:200,overflowY:"auto"}}>
              <div style={{maxWidth:900,width:"100%"}}>
                <div style={{background:"#0f172a",borderRadius:16,padding:"12px 20px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{width:10,height:10,borderRadius:"50%",background:"#f97316",display:"inline-block"}}></span>
                    <span style={{color:"#f1f5f9",fontWeight:700,fontSize:11,textTransform:"uppercase",letterSpacing:.8}}>
                      {selTmpl==="offer"&&"Template 1 — Internship Offer Letter"}
                      {selTmpl==="certificate"&&"Template 2 — Completion Certificate"}
                      {selTmpl==="training"&&"Template 3 — Industrial Training Appointment"}
                    </span>
                    <span style={{color:"#64748b",fontSize:10}}>• {activeCand.name}</span>
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <select value={activeCand.aid} onChange={e=>setActiveCand(candidates.find(c=>c.aid===e.target.value)||candidates[0])}
                      style={{padding:"6px 10px",borderRadius:8,background:"#1e293b",color:"#e2e8f0",border:"1px solid #334155",fontSize:10,cursor:"pointer"}}>
                      {candidates.map(c=><option key={c.aid} value={c.aid}>{c.name} ({c.aid})</option>)}
                    </select>
                    <button onClick={()=>window.print()} style={{padding:"7px 16px",borderRadius:10,background:"#f97316",color:"#fff",fontWeight:700,fontSize:11,border:"none",cursor:"pointer"}}>🖨 Print / Save A4 PDF</button>
                    <button onClick={()=>setA4Open(false)} style={{width:34,height:34,borderRadius:10,background:"#1e293b",color:"#94a3b8",border:"none",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>×</button>
                  </div>
                </div>
                <div style={{display:"flex",gap:9,marginBottom:14,justifyContent:"center",flexWrap:"wrap"}}>
                  {TEMPLATES.map(t=>(
                    <button key={t.id} onClick={()=>setSelTmpl(t.id)}
                      style={{padding:"6px 18px",borderRadius:20,fontSize:10.5,fontWeight:700,border:"none",cursor:"pointer",background:selTmpl===t.id?t.color:"#1e293b",color:"#fff"}}>
                      {t.title}
                    </button>
                  ))}
                </div>
                {selTmpl==="offer"       && <OfferLetter c={activeCand} />}
                {selTmpl==="certificate" && <CompletionCert c={activeCand} />}
                {selTmpl==="training"    && <TrainingLetter c={activeCand} />}
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer style={{textAlign:"center",fontSize:11,color:"#94a3b8",paddingTop:24,borderTop:"1px solid #e2e8f0",marginTop:24}}>
            <a href={COMPANY_URL} target="_blank" rel="noreferrer" style={{color:"#1e3a5f",fontWeight:700,textDecoration:"none"}}>VR PI Group of Companies</a>
            {" "}• Enterprise Talent Excellence Platform • Vercel Serverless Runtime • Gmail API v1
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
