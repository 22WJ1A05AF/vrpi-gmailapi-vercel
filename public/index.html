/* GOOGLE SHEET HELPERS */

function normalize(value){
 return String(value||"").toLowerCase().replace(/[^a-z0-9]/g,"");
}

function findColumn(columns,names,fallback=-1){
 const labels=columns.map(c=>normalize(c.label));

 for(const name of names){
  const index=labels.findIndex(x=>x===normalize(name));
  if(index!==-1)return index;
 }

 return fallback;
}

function getCell(row,index){
 if(index<0)return "";
 const cell=row.c?.[index];
 if(!cell||cell.v==null)return "";
 return String(cell.f??cell.v).trim();
}

function statusColor(status){
 const s=String(status||"").toUpperCase();
 if(s.includes("SENT")||s.includes("SUCCESS"))return "#dcfce7";
 if(s.includes("FAIL"))return "#fee2e2";
 if(s.includes("PENDING"))return "#fef3c7";
 return "#f1f5f9";
}

function statusTextColor(status){
 const s=String(status||"").toUpperCase();
 if(s.includes("SENT")||s.includes("SUCCESS"))return "#166534";
 if(s.includes("FAIL"))return "#991b1b";
 if(s.includes("PENDING"))return "#92400e";
 return "#475569";
}

/* MAIN APPLICATION */

function App(){

 const [candidates,setCandidates]=useState([]);
 const [loading,setLoading]=useState(false);
 const [error,setError]=useState("");
 const [message,setMessage]=useState("");
 const [lastSynced,setLastSynced]=useState("");
 const [search,setSearch]=useState("");

 const [selectedTemplate,setSelectedTemplate]=useState("offer");
 const [activeCandidate,setActiveCandidate]=useState(null);
 const [previewOpen,setPreviewOpen]=useState(false);

 const fetchSheet=useCallback(async()=>{
  setLoading(true);
  setError("");
  setMessage("");

  try{
   const url=
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&t=${Date.now()}`;

   const response=await fetch(url);

   if(!response.ok)throw new Error("Google Sheets connection failed.");

   const text=await response.text();

   const start=text.indexOf("{");
   const end=text.lastIndexOf("}");

   if(start<0||end<0)throw new Error("Invalid Google Sheets response.");

   const data=JSON.parse(text.substring(start,end+1));

   const columns=data.table.cols||[];
   const rows=data.table.rows||[];

   const index={
    timestamp:findColumn(columns,["Timestamp"],0),
    aid:findColumn(columns,["Application ID"],1),
    name:findColumn(columns,["Full Name","Name"],2),
    email:findColumn(columns,["Email Address","Email"],3),
    phone:findColumn(columns,["WhatsApp / Phone","WhatsApp","Phone"],4),
    college:findColumn(columns,["College"],5),
    domain:findColumn(columns,["Domain","Internship Domain"],7),
    mode:findColumn(columns,["Mode","Programme Mode"],-1),
    status:findColumn(columns,["Letter Sent","Email Status","Application Status"],17),
    pdf:findColumn(columns,["PDF Link","PDF Record"],18),
    updated:findColumn(columns,["Last Updated"],19),
    joining:findColumn(columns,["Joining Date","Start Date"],-1),
    duration:findColumn(columns,["Duration"],-1),
    completion:findColumn(columns,["Completion Date"],-1)
   };

   const parsed=rows.map(row=>{
    const value=i=>getCell(row,i);

    const name=value(index.name);
    const email=value(index.email);

    if(!name&&!email)return null;

    return{
     timestamp:value(index.timestamp),
     aid:value(index.aid),
     name,
     email,
     phone:value(index.phone),
     college:value(index.college),
     domain:value(index.domain),
     mode:value(index.mode),
     status:value(index.status)||"NOT RECORDED",
     pdfRecord:value(index.pdf),
     lastUpdated:value(index.updated),
     joiningDate:value(index.joining),
     duration:value(index.duration),
     completionDate:value(index.completion)
    };
   }).filter(Boolean);

   setCandidates(parsed);

   setActiveCandidate(previous=>{
    if(!parsed.length)return null;
    if(!previous)return parsed[0];
    return parsed.find(c=>c.aid===previous.aid)||parsed[0];
   });

   const time=new Date().toLocaleTimeString("en-IN");
   setLastSynced(time);
   setMessage(`${parsed.length} actual candidate records synchronized.`);

  }catch(e){
   setError("Unable to connect to Google Sheets. Verify that the sheet is accessible to this application.");
  }

  setLoading(false);
 },[]);

 useEffect(()=>{
  fetchSheet();
  const timer=setInterval(fetchSheet,60000);
  return()=>clearInterval(timer);
 },[fetchSheet]);

 const filtered=candidates.filter(c=>
  [c.name,c.aid,c.email,c.phone,c.domain]
   .join(" ")
   .toLowerCase()
   .includes(search.toLowerCase())
 );

 const count=status=>candidates.filter(c=>
  String(c.status).toUpperCase().includes(status)
 ).length;

 const activeTemplate=TEMPLATES.find(t=>t.id===selectedTemplate);

 return(
  <div style={{
   maxWidth:1150,
   margin:"auto",
   padding:"30px 20px"
  }}>

   {/* HEADER */}

   <header className="dashboard-header no-print" style={{
    display:"flex",
    justifyContent:"space-between",
    alignItems:"center",
    flexWrap:"wrap",
    gap:15,
    paddingBottom:22,
    borderBottom:"1px solid #e2e8f0"
   }}>
    <a href={COMPANY_URL}
       target="_blank"
       rel="noreferrer"
       style={{
        display:"flex",
        gap:13,
        alignItems:"center",
        textDecoration:"none"
       }}>
     <CompanyLogo size={54}/>
     <div>
      <div style={{
       fontSize:15,
       fontWeight:800,
       color:"#0f172a"
      }}>VR PI Group Of Company</div>
      <div style={{
       fontSize:10,
       color:"#64748b",
       marginTop:4
      }}>Engineering • Consultancy • Talent Excellence</div>
     </div>
    </a>

    <div style={{
     display:"flex",
     gap:9,
     flexWrap:"wrap"
    }}>
     <a href={COMPANY_URL} target="_blank" rel="noreferrer"
        style={{
         padding:"10px 15px",
         borderRadius:9,
         border:"1px solid #e2e8f0",
         background:"#fff",
         fontSize:10,
         color:"#1e3a5f",
         fontWeight:700,
         textDecoration:"none"
        }}>Company Website ↗</a>

     <a href={SHEET_URL} target="_blank" rel="noreferrer"
        style={{
         padding:"10px 15px",
         borderRadius:9,
         border:"1px solid #e2e8f0",
         background:"#fff",
         fontSize:10,
         color:"#15803d",
         fontWeight:700,
         textDecoration:"none"
        }}>Connected Sheet ↗</a>

     <a href={GMAIL_URL} target="_blank" rel="noreferrer"
        style={{
         padding:"10px 15px",
         borderRadius:9,
         border:"1px solid #e2e8f0",
         background:"#fff",
         fontSize:10,
         color:"#dc2626",
         fontWeight:700,
         textDecoration:"none"
        }}>Open Gmail ↗</a>

     <button onClick={fetchSheet} disabled={loading}
      style={{
       padding:"10px 15px",
       border:0,
       borderRadius:9,
       background:"#07865c",
       color:"#fff",
       fontSize:10,
       fontWeight:800
      }}>
      {loading?"Syncing...":"↻ Refresh"}
     </button>
    </div>
   </header>

   {/* HERO */}

   <section className="no-print" style={{
    textAlign:"center",
    maxWidth:800,
    margin:"auto",
    padding:"60px 10px 45px"
   }}>
    <div style={{
     display:"inline-block",
     padding:"8px 17px",
     borderRadius:25,
     background:"#fff",
     border:"1px solid #e2e8f0",
     fontSize:10,
     color:"#64748b",
     fontWeight:700,
     letterSpacing:1
    }}>
     <span style={{color:"#f97316"}}>● </span>
     VR PI GROUP • ENTERPRISE OPERATIONS SUITE
    </div>

    <h1 className="hero-title" style={{
     fontSize:52,
     fontWeight:900,
     lineHeight:1.12,
     color:"#0f172a",
     margin:"23px 0 15px",
     letterSpacing:-1.7
    }}>
     Enterprise Talent<br/>
     <span style={{color:"#1e3a5f"}}>
      Excellence Platform
     </span>
    </h1>

    <p style={{
     fontSize:13,
     lineHeight:1.9,
     color:"#64748b",
     maxWidth:700,
     margin:"auto"
    }}>
     A unified enterprise solution for intelligent talent
     management, official documentation, professional
     certifications, and automated corporate communication.
    </p>
   </section>

   {/* CONNECTION STATUS */}

   {error&&
    <div className="no-print" style={{
     padding:13,
     background:"#fff7ed",
     border:"1px solid #fed7aa",
     color:"#9a531b",
     borderRadius:10,
     fontSize:11,
     marginBottom:20
    }}>{error}</div>
   }

   {message&&
    <div className="no-print" style={{
     textAlign:"center",
     color:"#15803d",
     fontSize:11,
     marginBottom:20
    }}>{message}</div>
   }

   {/* STATISTICS */}

   <section className="no-print" style={{
    display:"grid",
    gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",
    gap:14,
    marginBottom:38
   }}>
    {[
     ["Total Applicants",candidates.length,"Actual Sheet Records","#1e3a5f"],
     ["Letters Issued",count("SENT"),"Recorded Sent Status","#15803d"],
     ["Pending Actions",count("PENDING"),"Pending Status Records","#b45309"],
     ["Failed Records",count("FAILED"),"Failed Status Records","#dc2626"]
    ].map(([label,value,note,color])=>(
     <div key={label} style={{
      background:"#fff",
      border:"1px solid #e2e8f0",
      borderRadius:15,
      padding:20
     }}>
      <div style={{
       color:"#94a3b8",
       fontSize:9,
       fontWeight:800,
       letterSpacing:1
      }}>{label.toUpperCase()}</div>
      <div style={{
       fontSize:32,
       fontWeight:900,
       color,
       margin:"10px 0 5px"
      }}>{value}</div>
      <div style={{fontSize:10,color:"#94a3b8"}}>{note}</div>
     </div>
    ))}
   </section>

   {/* CANDIDATE RECORDS */}

   <section className="no-print" style={{
    background:"#fff",
    border:"1px solid #e2e8f0",
    borderRadius:17,
    overflow:"hidden",
    marginBottom:45
   }}>
    <div style={{
     padding:"23px 25px",
     display:"flex",
     justifyContent:"space-between",
     alignItems:"center",
     gap:15,
     flexWrap:"wrap"
    }}>
     <div>
      <div style={{
       color:"#94a3b8",
       fontSize:9,
       fontWeight:800,
       letterSpacing:1.5
      }}>LIVE DATA MANAGEMENT</div>
      <h2 style={{
       fontSize:18,
       fontWeight:800,
       margin:"7px 0 4px"
      }}>Candidate Records</h2>
      <p style={{fontSize:10,color:"#94a3b8"}}>
       Read-only Google Sheets data • Last sync: {lastSynced||"Not synchronized"}
      </p>
     </div>

     <input
      value={search}
      onChange={e=>setSearch(e.target.value)}
      placeholder="Search ID, candidate or email..."
      style={{
       padding:11,
       border:"1px solid #e2e8f0",
       borderRadius:9,
       fontSize:11,
       minWidth:240,
       outline:"none"
      }}
     />
    </div>

    <div className="table-scroll">
     <table style={{
      width:"100%",
      minWidth:900,
      borderCollapse:"collapse",
      textAlign:"left"
     }}>
      <thead style={{background:"#f8fafc"}}>
       <tr>
        {[
         "Application ID","Full Name","Email Address",
         "Phone","Domain","Status","PDF Record","Timestamp","Action"
        ].map(x=>(
         <th key={x} style={{
          padding:13,
          fontSize:9,
          color:"#94a3b8",
          textTransform:"uppercase",
          whiteSpace:"nowrap"
         }}>{x}</th>
        ))}
       </tr>
      </thead>

      <tbody>
       {filtered.map((c,i)=>(
        <tr key={c.aid||i} style={{borderTop:"1px solid #f1f5f9"}}>
         <td style={{padding:13,fontSize:10,fontFamily:"JetBrains Mono",fontWeight:700}}>{c.aid}</td>
         <td style={{padding:13,fontSize:11,fontWeight:700}}>{c.name}</td>
         <td style={{padding:13,fontSize:10}}>{c.email}</td>
         <td style={{padding:13,fontSize:10}}>{c.phone||"—"}</td>
         <td style={{padding:13,fontSize:10}}>{c.domain||"—"}</td>
         <td style={{padding:13}}>
          <span style={{
           padding:"5px 10px",
           borderRadius:20,
           fontSize:9,
           fontWeight:800,
           background:statusColor(c.status),
           color:statusTextColor(c.status)
          }}>{c.status}</span>
         </td>
         <td style={{padding:13,fontSize:10}}>{c.pdfRecord||"—"}</td>
         <td style={{padding:13,fontSize:10,whiteSpace:"nowrap"}}>{c.timestamp||"—"}</td>
         <td style={{padding:13}}>
          <button onClick={()=>{
           setActiveCandidate(c);
           setPreviewOpen(true);
          }} style={{
           border:0,
           background:"none",
           color:"#087eae",
           fontWeight:800,
           fontSize:10
          }}>Preview</button>
         </td>
        </tr>
       ))}

       {!loading&&filtered.length===0&&
        <tr><td colSpan="9" style={{
         padding:45,
         textAlign:"center",
         color:"#94a3b8",
         fontSize:12
        }}>No live candidate records available.</td></tr>
       }
      </tbody>
     </table>
    </div>
   </section>

   {/* DOCUMENT TEMPLATES */}

   <section className="no-print" style={{marginBottom:45}}>
    <div style={{marginBottom:18}}>
     <div style={{
      color:"#94a3b8",
      fontSize:9,
      fontWeight:800,
      letterSpacing:1.5
     }}>CORPORATE DOCUMENT LIBRARY</div>
     <h2 style={{
      fontSize:18,
      fontWeight:800,
      margin:"7px 0"
     }}>Choose Document Template</h2>
     <p style={{fontSize:11,color:"#64748b"}}>
      Select a professional A4 document design.
     </p>
    </div>

    <div style={{
     display:"grid",
     gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",
     gap:16
    }}>
     {TEMPLATES.map(t=>(
      <div key={t.id} style={{
       background:"#fff",
       borderRadius:15,
       padding:22,
       border:`2px solid ${selectedTemplate===t.id?t.color:"#e2e8f0"}`
      }}>
       <span style={{
        color:t.color,
        fontSize:9,
        fontWeight:800,
        letterSpacing:1
       }}>{t.tag}</span>

       <h3 style={{
        fontSize:14,
        fontWeight:800,
        margin:"12px 0"
       }}>{t.title}</h3>

       <p style={{
        color:"#64748b",
        fontSize:11,
        lineHeight:1.7,
        minHeight:55
       }}>{t.description}</p>

       <button
        disabled={!candidates.length}
        onClick={()=>{
         setSelectedTemplate(t.id);
         if(!activeCandidate&&candidates.length){
          setActiveCandidate(candidates[0]);
         }
         setPreviewOpen(true);
        }}
        style={{
         width:"100%",
         background:t.color,
         color:"#fff",
         padding:11,
         border:0,
         borderRadius:9,
         fontSize:10,
         fontWeight:800
        }}>
        Select & Preview
       </button>
      </div>
     ))}
    </div>
   </section>

   {/* DOCUMENT PREVIEW */}

   {previewOpen&&activeCandidate&&
    <div className="no-print" style={{
     position:"fixed",
     inset:0,
     zIndex:100,
     background:"rgba(15,23,42,.85)",
     display:"flex",
     justifyContent:"center",
     alignItems:"flex-start",
     overflowY:"auto",
     padding:15
    }}>
     <div style={{width:"100%",maxWidth:900}}>
      <div style={{
       background:"#0f172a",
       padding:13,
       borderRadius:12,
       display:"flex",
       justifyContent:"space-between",
       alignItems:"center",
       gap:12,
       flexWrap:"wrap",
       marginBottom:15
      }}>
       <div style={{
        color:"#fff",
        fontSize:11,
        fontWeight:800
       }}>{activeTemplate.title}</div>

       <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <select
         value={activeCandidate.aid}
         onChange={e=>setActiveCandidate(
          candidates.find(c=>c.aid===e.target.value)
         )}
         style={{
          padding:8,
          borderRadius:7,
          fontSize:10
         }}>
         {candidates.map(c=>(
          <option key={c.aid} value={c.aid}>
           {c.name} - {c.aid}
          </option>
         ))}
        </select>

        <button onClick={()=>window.print()}
         style={{
          background:"#f97316",
          color:"#fff",
          padding:"8px 14px",
          border:0,
          borderRadius:8,
          fontSize:10,
          fontWeight:800
         }}>Print / Save A4 PDF</button>

        <button onClick={()=>setPreviewOpen(false)}
         style={{
          background:"#334155",
          color:"#fff",
          border:0,
          padding:"8px 13px",
          borderRadius:8
         }}>✕</button>
       </div>
      </div>

      <div style={{
       display:"flex",
       gap:8,
       justifyContent:"center",
       marginBottom:15,
       flexWrap:"wrap"
      }}>
       {TEMPLATES.map(t=>(
        <button key={t.id}
         onClick={()=>setSelectedTemplate(t.id)}
         style={{
          background:selectedTemplate===t.id?t.color:"#334155",
          color:"#fff",
          border:0,
          padding:"8px 14px",
          borderRadius:20,
          fontSize:10,
          fontWeight:700
         }}>{t.title}</button>
       ))}
      </div>

      {selectedTemplate==="offer"&&
       <OfferLetter c={activeCandidate}/>}

      {selectedTemplate==="completion"&&
       <CompletionLetter c={activeCandidate}/>}

      {selectedTemplate==="training"&&
       <TrainingLetter c={activeCandidate}/>}
     </div>
    </div>
   }

   {/* FOOTER */}

   <footer className="no-print" style={{
    borderTop:"1px solid #e2e8f0",
    padding:"25px 10px",
    textAlign:"center",
    fontSize:10,
    color:"#94a3b8"
   }}>
    <div style={{
     display:"flex",
     justifyContent:"center",
     alignItems:"center",
     gap:10,
     marginBottom:10
    }}>
     <CompanyLogo size={35}/>
     <a href={COMPANY_URL}
        target="_blank"
        rel="noreferrer"
        style={{
         color:"#1e3a5f",
         textDecoration:"none",
         fontWeight:800
        }}>
      VR PI Group Of Company
     </a>
    </div>

    Enterprise Talent Excellence Platform
    <br/>
    Official Corporate Documentation & Talent Operations
    <br/><br/>
    <a href={COMPANY_URL}
       target="_blank"
       rel="noreferrer"
       style={{color:"#0d7377",textDecoration:"none"}}>
     Visit Company Website ↗
    </a>
   </footer>

  </div>
 );
}

ReactDOM.createRoot(
 document.getElementById("root")
).render(<App/>);

</script>
</body>
</html>
