<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR PI Group | Corporate Document Platform & HR Studio</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#17233a;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1520px;margin:auto;padding:22px}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid #dfe6ef;padding-bottom:16px}
.logo{width:190px;height:95px;object-fit:contain;display:block}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 16px;background:white;border:1px solid #dfe6ef;border-radius:9px;color:#1e3a5f;text-decoration:none;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.dark{background:#1e3a5f;color:white;border-color:#1e3a5f}
.dark:hover{background:#152d4c}
.orange{background:#e94b17;color:white;border-color:#e94b17}
.orange:hover{background:#d03e0e}
.gmail-btn{background:linear-gradient(135deg,#312e81 0%,#4338ca 100%);color:white;border:1px solid #4f46e5;box-shadow:0 2px 6px #4338ca33}
.gmail-btn:hover{background:linear-gradient(135deg,#28256b 0%,#3730a3 100%)}

/* Hero Banner */
.hero{text-align:center;padding:36px 10px 24px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;background:white;border:1px solid #dfe6ef;border-radius:25px;padding:8px 18px;font-size:10px;font-weight:800;letter-spacing:1px;color:#64748b}
h1{font-size:clamp(30px,4.5vw,48px);line-height:1.15;margin:16px 0;color:#121c30;letter-spacing:-1.5px}
.desc{color:#8290a5;font-size:12px;line-height:1.8}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}
.stat,.panel{background:white;border:1px solid #dfe6ef;border-radius:16px}
.stat{padding:20px}
.stat label{font-size:10px;font-weight:800;color:#8795a9;letter-spacing:1px}
.stat strong{display:block;font-size:30px;margin:8px 0}
.stat small{font-size:10px;color:#94a3b8}

/* Panels */
.panel{padding:24px;margin-bottom:24px}
.kicker{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#8492a7;display:flex;align-items:center;gap:6px}
h2{font-size:20px;color:#172b49;margin:8px 0}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.search{padding:10px 14px;border:1px solid #dfe6ef;border-radius:9px;min-width:240px;font-size:11px}
.table-wrap{overflow-x:auto;margin-top:16px;max-height:270px}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{background:#f8fafc;text-align:left;padding:12px;color:#8795a9;font-size:9px;position:sticky;top:0;z-index:1}
td{padding:12px;border-bottom:1px solid #edf0f4;font-size:10px;color:#52637c}
.status{padding:4px 8px;border-radius:20px;background:#edf2f7;font-size:9px;font-weight:700}
.sent{background:#dcfce7;color:#166534}
.failed{background:#fee2e2;color:#991b1b}
.pending{background:#fef3c7;color:#92400e}
.text-btn{border:0;background:none;color:#0284c7;font-weight:800;font-size:10px;cursor:pointer}
.text-btn:hover{text-decoration:underline}

/* Live Studio Two-Column Grid */
.studio-grid{display:grid;grid-template-columns:1.08fr 1fr;gap:24px;align-items:start}
@media(max-width:1150px){.studio-grid{grid-template-columns:1fr}}

.mode-switch,.template-pills{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
.mode-switch button,.template-pills button{padding:9px 13px;border:1px solid #dfe6ef;background:white;border-radius:9px;font-size:10px;font-weight:800;color:#52637c;transition:all .15s ease}
.mode-switch button.active,.template-pills button.active{background:#1e3a5f;color:white;border-color:#1e3a5f}

.form-box{padding:20px;background:#f8fafc;border:1px solid #e4eaf1;border-radius:13px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;font-size:10px;font-weight:800;color:#52637c;margin-bottom:7px}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid #dfe6ef;border-radius:9px;background:white;color:#30425d;font-size:11px;outline:none}
.field input:focus,.field select:focus{border-color:#e94b17;box-shadow:0 0 0 3px #e94b1715}
.field input[type=date]{min-height:40px;cursor:pointer;color-scheme:light}
.help{font-size:10px;color:#8492a7;margin-top:12px;line-height:1.7}

/* Live Preview Sticky Container */
.preview-column{position:sticky;top:20px}
.preview-topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0f172a;color:white;padding:12px 18px;border-radius:12px 12px 0 0}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:#4ade80}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.preview-controls{display:flex;align-items:center;gap:8px}
.preview-scale-btn{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:5px 9px;border-radius:6px;font-size:10px;font-weight:700}
.preview-scale-btn:hover{background:#334155}

.preview-stage{background:#cbd5e1;padding:18px 12px;border-radius:0 0 12px 12px;border:1px solid #cbd5e1;overflow:auto;max-height:860px;display:flex;justify-content:center}
.preview-scaled-wrap{transform-origin:top center;transition:transform .15s ease}

/* Alerts */
.alert{padding:12px 16px;border-radius:9px;font-size:11px;line-height:1.7;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between}
.error{background:#fff5ed;color:#a34a16;border:1px solid #ffdbbd}
.success{background:#edfaf3;color:#16754c;border:1px solid #c9eedc}

/* Document Styles */
.a4{width:210mm;min-height:297mm;background:white;margin:auto;display:flex;flex-direction:column;color:#26354d;box-shadow:0 10px 30px #00000025}
.doc-header{padding:18px 34px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1e3a5f;gap:15px}
.doc-logo{width:150px;height:82px;object-fit:contain;display:block}
.doc-info{text-align:right;font-size:9px;color:#718096;line-height:1.8;overflow-wrap:anywhere}
.doc-info strong{color:#1e3a5f;font-size:11.5px}
.doc-content{padding:26px 38px;flex:1;display:flex;flex-direction:column;font-size:10.5px;line-height:1.85}
.doc-title{text-align:center;margin:8px 0 18px}
.doc-title h2{font-size:18px;letter-spacing:1.5px;color:#152d4c}
.doc-title small{font-size:9px;color:#8492a7;letter-spacing:2px;font-weight:800}
.doc-section{font-size:10px;letter-spacing:1px;font-weight:800;color:#1e3a5f;border-bottom:1px solid #dfe6ef;padding-bottom:6px;margin-top:15px}
.doc-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:9.5px;white-space:normal}
.doc-table td{padding:9px;border-bottom:1px solid #e4eaf1;overflow-wrap:anywhere}
.doc-table td:first-child{background:#f2f5f9;color:#1e3a5f;font-weight:700;width:36%}
.doc-content p{color:#475569;line-height:1.85;margin:7px 0}
.doc-footer{background:#1e3a5f;color:white;text-align:center;padding:11px;font-size:8.5px;line-height:1.8}
.signoff{margin-top:auto;padding-top:20px}
.signoff strong{display:block;color:#1e3a5f;margin-top:6px}
.acceptance-box{border:1.5px solid #1e3a5f;border-radius:9px;padding:8px 15px;margin-top:9px}
.acceptance-box p{margin:4px 0}

/* Completion Template */
.completion-page{border:1px solid #e5e9ef}
.completion-head{padding:16px 28px 14px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:5px solid #d6ad59}
.completion-head .doc-logo{width:140px;height:80px}
.completion-company{text-align:right;font-size:9px;line-height:1.8;color:#52637c}
.completion-company strong{font-size:12.5px;color:#1e3a5f}
.completion-accent{height:7px;background:linear-gradient(90deg,#172f50 0%,#d5ae61 48%,#172f50 100%)}
.completion-body{padding:24px 38px;flex:1;display:flex;flex-direction:column;font-size:10.5px;line-height:1.85}
.completion-title{text-align:center;margin:8px 0 18px}
.completion-title h2{font-family:'Playfair Display',serif;font-size:22px;color:#152d4c;letter-spacing:.5px;margin:6px 0}
.completion-title small{font-size:9px;font-weight:800;letter-spacing:2px;color:#9a7b39}
.completion-body p{font-size:10.5px;color:#36465d;line-height:1.9;margin:8px 0}
.completion-recipient{border-bottom:1px solid #d9e0e9;padding-bottom:10px;margin-bottom:12px}
.completion-recipient b{color:#1e3a5f}
.completion-details{width:100%;border-collapse:collapse;margin:12px 0;font-size:9.5px;white-space:normal}
.completion-details td{border-bottom:1px solid #e3e8ee;padding:7px 10px}
.completion-details td:first-child{width:34%;background:#f4f6f9;color:#1e3a5f;font-weight:800}
.completion-signoff{margin-top:auto;padding-top:14px;position:relative;min-height:105px}
.completion-signoff strong{display:block;color:#1e3a5f;margin-top:4px}
.well-done{position:absolute;right:10px;bottom:10px;width:95px;height:95px;border:5px double #c49b46;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#1e3a5f;background:#fffdf6;font-size:7.5px;font-weight:800;line-height:1.35;transform:rotate(7deg)}
.well-done .star{font-size:18px;color:#bc923f}
.completion-footer{background:#132e50;color:#fff;padding:11px 18px;text-align:center;font-size:8px;line-height:1.8;border-top:4px solid #c69f4d}

/* Participation Certificate */
.participation-page{width:297mm;min-height:210mm;height:210mm;position:relative;overflow:hidden;background:#fffdf8;border:9px double #cba85a;padding:12mm 15mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.participation-page:before{content:"";position:absolute;left:-5%;top:-55px;width:110%;height:78px;background:#17395c;border-bottom:9px solid #e6ce8f;border-radius:0 0 50% 50%;z-index:0}
.participation-page:after{content:"";position:absolute;left:-5%;bottom:-58px;width:110%;height:90px;background:#17395c;border-top:9px solid #e6ce8f;border-radius:50% 50% 0 0;z-index:0}
.participation-content{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center}
.participation-logo{width:140px;height:68px;object-fit:contain;margin:2px auto 6px}
.participation-company{font-size:10px;font-weight:800;letter-spacing:3px;color:#17395c}
.participation-heading{margin:8px 0 2px;font-family:'Playfair Display',serif;font-size:36px;letter-spacing:4px;color:#17395c}
.participation-subtitle{font-size:13px;letter-spacing:4px;color:#a58038;font-weight:700}
.participation-medal{position:absolute;left:15px;top:25px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b8,#cfac56 45%,#9f722d 80%);border:4px double #f8e9b7;box-shadow:0 3px 10px #76531b33}
.participation-medal:after{content:"";position:absolute;top:44px;left:9px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:26px solid #c49b48;transform:rotate(15deg)}
.participation-medal:before{content:"";position:absolute;top:44px;right:9px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:26px solid #e3ca86;transform:rotate(-15deg)}
.participation-intro{font-size:11.5px;color:#45566c;margin-top:18px}
.participation-name{font-family:'Playfair Display',serif;font-style:italic;font-size:36px;color:#bd974c;border-bottom:1px solid #bca66f;padding:0 40px 4px;margin:6px 0 9px;max-width:90%;overflow-wrap:anywhere}
.participation-copy{font-size:10.5px;color:#344861;line-height:1.85;max-width:680px;margin:6px auto}
.participation-meta{display:flex;justify-content:space-around;width:100%;gap:20px;margin-top:15px;color:#17395c;font-size:9.5px}
.participation-meta strong{display:block;font-size:10.5px}
.participation-meta span{display:block;color:#687789}
.participation-foot{font-size:8.5px;color:#17395c;font-weight:700;position:relative;z-index:2;margin-bottom:2px}

/* Modal Styling */
.modal-overlay{position:fixed;inset:0;background:#090d16cc;backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.cred-card{background:white;border-radius:18px;max-width:620px;width:100%;box-shadow:0 25px 60px #00000040;overflow:hidden;animation:slideUp .2s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.cred-header{background:linear-gradient(135deg,#312e81 0%,#4338ca 100%);padding:20px 24px;color:white;display:flex;justify-content:space-between;align-items:center}
.cred-title-row{display:flex;align-items:center;gap:14px}
.cred-g-icon{width:42px;height:42px;background:#ffffff18;border:1px solid #ffffff30;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.cred-header h3{margin:0;font-size:17px;font-weight:700}
.cred-header p{margin:3px 0 0;font-size:11px;color:#c7d2fe}
.close-round{background:#ffffff18;border:0;color:white;width:32px;height:32px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.close-round:hover{background:#ffffff35}

.cred-body{padding:22px 24px}
.active-banner{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.active-left{display:flex;align-items:center;gap:10px}
.active-left strong{color:#065f46;font-size:12px}
.active-left p{color:#047857;font-size:10.5px;margin:2px 0 0}
.cred-field{margin-bottom:15px}
.cred-field label{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:#334155;margin-bottom:6px}
.cred-input-wrap{position:relative}
.cred-input{width:100%;padding:11px 13px;border:1px solid #cbd5e1;border-radius:9px;font-size:12px;outline:none;background:#f8fafc;transition:border-color .15s}
.cred-input:focus{border-color:#4338ca;background:white}
.toggle-pwd{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#64748b;font-size:14px}

.stages-title{font-size:10px;font-weight:800;letter-spacing:1px;color:#64748b;margin:18px 0 10px}
.stages-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.stage-chip{padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;display:flex;align-items:center;gap:10px}
.stage-chip strong{font-size:11px;color:#1e293b;display:block}
.stage-chip small{font-size:9.5px;color:#64748b}

.app-pwd-help{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:13px 16px;font-size:10px;color:#475569;line-height:1.7}
.app-pwd-help strong{color:#1e293b;font-size:11px;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.app-pwd-help ol{margin:6px 0 0;padding-left:18px}

.cred-footer{padding:16px 24px;background:#f8fafc;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

footer{text-align:center;color:#8491a5;font-size:10px;padding:25px}
footer .logo{width:90px;height:auto;margin:0 auto 8px}

@media print{
@page{size:A4 portrait;margin:0}
@page cert{size:A4 landscape;margin:0}
body *{visibility:hidden!important}
#printStage,#printStage *{visibility:visible!important}
#printStage{position:fixed;left:0;top:0;width:100%!important;margin:0!important;padding:0!important;background:white!important;transform:none!important}
.a4{width:210mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.participation-page{page:cert;width:297mm!important;height:210mm!important;min-height:210mm!important;margin:0!important;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.completion-page,.completion-footer,.doc-table td:first-child{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;

const COMPANY="VR PI Group Of Companies";
const SHEET_ID="1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU";
const SHEET_GID="0";
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SHEET_GID}`;
const WEBSITE="https://share.google/Staafq7spnZSStc8n";

function Logo({className="",style={}}){
  return <img src="./vrpi-logo.png" alt="VR PI Group" className={className} style={{objectFit:"contain",display:"block",...style}} onError={e=>{e.target.style.display='none';}}/>;
}

const TEMPLATES=[
  {id:"offer",name:"Internship Offer Letter",fields:["name","domain","mode","joining","duration"],desc:"Formal internship offer with professional terms and conditions.",type:"letter"},
  {id:"internship-completion",name:"Internship Completion Certificate",fields:["name","domain","mode","joining","duration","completionDate"],desc:"Corporate internship completion letter with personalized company details.",type:"completion",programme:"internship"},
  {id:"training-appointment",name:"Training Appointment Letter",fields:["name","domain","mode","appointmentDate","duration"],desc:"Professional training appointment and responsibilities.",type:"letter"},
  {id:"training-completion",name:"Training Completion Certificate",fields:["name","domain","mode","joining","duration","completionDate"],desc:"Formal training completion letter with company branding.",type:"completion",programme:"training"},
  {id:"participation",name:"Participation Certificate",fields:["name","eventName","domain","participationDate"],desc:"Elegant navy-and-gold participation certificate.",type:"participation"},
  {id:"experience",name:"Experience Letter",fields:["name","domain","role","joining","duration"],desc:"Professional engagement and experience confirmation.",type:"experience"}
];

const LABELS={
  name:"Candidate Full Name",domain:"Programme Domain",mode:"Programme Mode",
  joining:"Start Date",duration:"Duration",completionDate:"Completion Date",
  appointmentDate:"Appointment Date",eventName:"Event / Programme Name",
  participationDate:"Participation Date",role:"Designation / Role"
};

const DOMAINS=[
  "Full Stack Development","Java Development","Python Development",
  "Web Development","Artificial Intelligence","Machine Learning",
  "Data Science","Data Analytics","Cloud Computing","Cybersecurity",
  "DevOps","UI UX Design","Software Testing",
  "Mobile Application Development","Digital Marketing","Business Analytics"
];
const MODES=["Online","Offline","Hybrid"];
const DURATIONS=["1 Month","2 Months","3 Months","4 Months","5 Months","6 Months","9 Months","12 Months"];

function today(){
  return new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});
}
function dateText(v){
  if(!v)return "";
  const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"}):v;
}
function norm(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function column(cols,names,fallback=-1){
  for(const n of names){
    const i=cols.findIndex(c=>norm(c.label||c.id)===norm(n));
    if(i>=0)return i;
  }
  return fallback;
}
function cell(row,i){
  return i<0?"":String(row.c?.[i]?.f||row.c?.[i]?.v||"").trim();
}

function fetchSheet(){
  return new Promise((resolve,reject)=>{
    const cb="vrpiReadOnlySheet";
    let done=false;
    const script=document.createElement("script");
    const timer=setTimeout(()=>finish(new Error("Google Sheets connection timed out.")),15000);
    function finish(err,data){
      if(done)return;
      done=true;
      clearTimeout(timer);
      script.remove();
      try{delete window[cb]}catch(e){}
      err?reject(err):resolve(data);
    }
    window[cb]=data=>{
      if(!data?.table){finish(new Error("Sheet is not accessible. Enable Anyone with the link – Viewer."));return}
      finish(null,data.table);
    };
    script.onerror=()=>finish(new Error("Unable to load Google Sheets."));
    script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=${encodeURIComponent("out:json;responseHandler:"+cb)}&t=${Date.now()}`;
    document.head.appendChild(script);
  });
}

async function getRecords(){
  const table=await fetchSheet();
  const cols=table.cols||[];
  return (table.rows||[]).map((row,i)=>{
    const read=(names,fallback=-1)=>cell(row,column(cols,names,fallback));
    return {
      key:read(["Application ID","Application Id"],1)||"row-"+i,
      aid:read(["Application ID","Application Id"],1),
      name:read(["Full Name","Candidate Name","Name"],2),
      email:read(["Email Address","Email","Candidate Email"],3),
      phone:read(["WhatsApp / Phone","WhatsApp","Phone"],4),
      domain:read(["Domain","Internship Domain","Programme Domain"],7),
      mode:read(["Mode","Programme Mode","Internship Mode"],-1),
      joining:read(["Start Date","Joining Date","Internship Start Date"],-1),

        email:"vrpigroupoftechnology@gmail.com",
        appPassword:"",
        displayName:"VR PI TECH SOLUTIONS HR",

    setLoading(true);
    try{
      const result=await getRecords();
      setRecords(result);
      setSelected(old=>result.some(r=>r.key===old)?old:(result[0]?.key||""));
      setError("");
      setLastSync(new Date().toLocaleTimeString("en-IN"));

        ...form,

    const q=search.toLowerCase();
    return records.filter(r=>[r.aid,r.name,r.email,r.domain].join(" ").toLowerCase().includes(q));

      <div className="section-head">
        <div>
          <div className="kicker">LIVE DATA MANAGEMENT • READ ONLY</div>
          <h2>Candidate Records</h2>
          <p className="desc">Click "Select" on any row to immediately populate the live document studio.</p>
        </div>
        <input className="search" placeholder="Search ID, name, email..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>

      <div className="table-wrap">
        {!filtered.length?<div className="no-record" style={{padding:20,textAlign:"center",color:"#64748b"}}>{loading?"Connecting to Google Sheets...":"No records available."}</div>:
        <table>
          <thead><tr><th>APPLICATION ID</th><th>NAME</th><th>EMAIL</th><th>PHONE</th><th>DOMAIN</th><th>STATUS</th><th>PDF</th><th>ACTION</th></tr></thead>
          <tbody>{filtered.map(r=><tr key={r.key}>
            <td>{r.aid||"—"}</td>
            <td><b>{r.name}</b></td>
            <td>{r.email||"—"}</td>
            <td>{r.phone||"—"}</td>
            <td>{r.domain||"—"}</td>
            <td><span className={"status "+(/sent|success|delivered/i.test(r.status)?"sent":/failed|error/i.test(r.status)?"failed":"pending")}>{r.status}</span></td>
            <td>{r.pdf||"—"}</td>
            <td>
              <button className="text-btn" onClick={()=>{
                setManual(false);
                setSelected(r.key);
                setForm(prev=>({
                  ...prev,
                  name:r.name||prev.name,
                  domain:r.domain||prev.domain,
                  email:r.email||prev.email,
                  mode:r.mode||prev.mode,
                  joining:r.joining||prev.joining,
                  duration:r.duration||prev.duration
                }));
              }}>Select Candidate ↗</button>
            </td>
          </tr>)}</tbody>
        </table>}
      </div>
    </section>

    {/* Live Side-by-Side Studio */}
    <div className="studio-grid">
      {/* Left Column: Form Controls */}
      <section className="panel" style={{marginBottom:0}}>
        <div className="kicker">
          <span style={{color:"#059669"}}>● Instant Sync Enabled</span>
        </div>
        <h2>Document Customizer</h2>
        <p className="desc">Choose your template. Any change typed here instantly updates the live document preview on the right.</p>

        <div className="mode-switch">
          <button className={!manual?"active":""} onClick={()=>setManual(false)}>Use Google Sheet Record</button>
          <button className={manual?"active":""} onClick={()=>setManual(true)}>Enter Details Manually</button>
        </div>

        <div className="template-pills">
          {TEMPLATES.map(t=><button key={t.id} className={templateId===t.id?"active":""} onClick={()=>changeTemplate(t.id)}>{t.name}</button>)}
        </div>

        <div style={{padding:"10px 14px",background:"#f1f5f9",borderRadius:9,margin:"12px 0",fontSize:11,color:"#475569"}}>
          <strong>{template.name}:</strong> {template.desc}
        </div>

        {!manual&&<div className="form-box" style={{marginTop:0,marginBottom:14}}>
          <div className="field">
            <label>SELECT CANDIDATE FROM GOOGLE SHEETS</label>
            <select value={selected} onChange={e=>setSelected(e.target.value)}>
              <option value="">Choose a synchronized applicant</option>
              {records.map(r=><option key={r.key} value={r.key}>{r.name} — ({r.domain||"No Domain"}) [{r.aid||"ID"}]</option>)}
            </select>
          </div>
        </div>}

        <div className="form-box" style={{marginTop:0}}>
          <div className="kicker">{manual?"MANUAL CANDIDATE DETAILS":"OVERRIDE / CUSTOMIZE CANDIDATE FIELDS"}</div>
          <h2>{template.name}</h2>
          <div className="grid">
            {template.fields.map(key=><div className="field" key={key}>
              <label>{LABELS[key].toUpperCase()}{key==="name"?" *":""}</label>
              {key==="domain"?
                <select name={key} value={activeData[key]||""} onChange={changeField}>
                  <option value="">Select domain</option>
                  {DOMAINS.map(x=><option key={x} value={x}>{x}</option>)}
                </select>
              :key==="mode"?
                <select name={key} value={activeData[key]||""} onChange={changeField}>
                  <option value="">Select mode</option>
                  {MODES.map(x=><option key={x} value={x}>{x}</option>)}
                </select>
              :key==="duration"?
                <select name={key} value={activeData[key]||""} onChange={changeField}>
                  <option value="">Select duration</option>
                  {DURATIONS.map(x=><option key={x} value={x}>{x}</option>)}
                </select>
              :["joining","completionDate","appointmentDate","participationDate"].includes(key)?
                <input type="date" name={key} value={activeData[key]||""} onChange={changeField}/>
              :<input type="text" name={key} value={activeData[key]||""} onChange={changeField} placeholder={"Enter "+LABELS[key].toLowerCase()} autoComplete="off"/>
              }
            </div>)}
          </div>
          <p className="help">All edits are instantly reflected in the real-time preview panel on the right.</p>
        </div>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:18}}>
          <button className="btn" onClick={()=>setCredModalOpen(true)}>
            ✉ Configure Sender: {gmailCreds.displayName}
          </button>
          <button className="btn orange" onClick={()=>window.print()}>
            🖨 Print / Download PDF
          </button>
        </div>
      </section>

      {/* Right Column: Live Sticky Document Preview */}
      <div className="preview-column">
        <div className="preview-topbar">
          <div className="sync-badge">
            <span className="sync-dot"></span>
            <span>Live Document Preview • Real-Time Sync</span>
          </div>
          <div className="preview-controls">
            <span style={{fontSize:10,color:"#94a3b8"}}>Zoom:</span>
            <button className="preview-scale-btn" onClick={()=>setPreviewScale(s=>Math.max(0.35,+(s-0.08).toFixed(2)))}>-</button>
            <span style={{fontSize:10,fontWeight:700,minWidth:35,textAlign:"center"}}>{Math.round(previewScale*100)}%</span>
            <button className="preview-scale-btn" onClick={()=>setPreviewScale(s=>Math.min(1.0,+(s+0.08).toFixed(2)))}>+</button>
            <button className="btn orange" style={{padding:"6px 12px",fontSize:10}} onClick={()=>window.print()}>Print / Save PDF</button>
          </div>
        </div>

        <div className="preview-stage">
          <div
            id="printStage"
            className="preview-scaled-wrap"
            style={{
              transform:`scale(${previewScale})`,
              marginBottom:template.type==="participation"?-140:-280
            }}
          >
            <DocumentRenderer
              data={activeData}
              template={template}
              senderEmail={gmailCreds.email}
              displayName={gmailCreds.displayName}
            />
          </div>
        </div>
      </div>
    </div>

    <footer>
      <Logo style={{width:90,height:"auto",margin:"0 auto 8px"}}/>
      <b>{COMPANY}</b><br/>
      Wanaparthy, Telangana, India<br/>
      Connected Sender: {gmailCreds.email} • {WEBSITE}<br/>
      <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website</a>
    </footer>

    {/* Interactive Google Gmail Credentials Modal */}
    <GmailModal
      open={credModalOpen}
      onClose={()=>setCredModalOpen(false)}
      credentials={gmailCreds}
      onSave={saveGmailCreds}
      onRemove={removeGmailCreds}
    />
  </main>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
