<body>
<div id="root">
<div style="padding:30px;text-align:center">Starting VR PI Group platform...</div>
</div>
<script>
(function(){
 function loadScript(urls,callback){
  let index=0;
  function attempt(){
   if(index>=urls.length){callback(new Error("Could not load React from the available CDN sources."));return;}
   const script=document.createElement("script");
   script.src=urls[index++];
   script.onload=()=>callback(null);
   script.onerror=()=>{script.remove();attempt();};
   document.head.appendChild(script);
  }
  attempt();
 }

 function showFatal(message){
  document.getElementById("root").innerHTML=
   '<div class="boot-error"><h2>VR PI Group platform could not start</h2><p>'+message+'</p><p>Check your internet connection and reload the page. React libraries are loaded from external CDNs; this file does not need a separate JavaScript file.</p></div>';
 }

 loadScript([
  "https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js",
  "https://unpkg.com/react@18.2.0/umd/react.production.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
 ],function(error){
  if(error){showFatal(error.message);return;}

  loadScript([
   "https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js",
   "https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js",
   "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
  ],function(domError){
   if(domError){showFatal(domError.message);return;}
   startApp();
  });
 });

 function startApp(){
  const h=React.createElement;
  const E=(tag,props,...children)=>{
   const flat=children.flat(Infinity).filter(x=>x!==null&&x!==undefined&&x!==false);
   return h(tag,props,...flat);
  };

  const COMPANY="VR PI Group Of Companies";
  const EMAIL="vrpigroupoftechnology@gmail.com";
  const LOCATION="Wanaparthy, Telangana, India";
  const WEBSITE="https://share.google/Staafq7spnZSStc8n";
  const SHEET_ID="1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU";
  const SHEET_GID="0";
  const SHEET_URL="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit?gid="+SHEET_GID;
  const GMAIL_URL="https://mail.google.com/mail/?authuser=vrpigroupoftechnology%40gmail.com#inbox";
  const TODAY=()=>new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});

  const LOGO_DATA="data:image/png;base64,LOGO_BASE64";

  const TEMPLATES=[
   {id:"offer",name:"Internship Offer Letter",group:"Internship",style:"offer",color:"#1e3a5f",desc:"Formal internship offer with programme particulars, terms and acceptance."},
   {id:"intern-completion",name:"Internship Completion Certificate",group:"Internship",style:"completion",color:"#4f8b55",desc:"Premium green landscape completion certificate."},
   {id:"training",name:"Industrial Training Appointment Letter",group:"Training",style:"training",color:"#e94b17",desc:"Professional training appointment with programme particulars."},
   {id:"training-completion",name:"Training Completion Certificate",group:"Training",style:"completion",color:"#4f8b55",desc:"Landscape training completion certificate."},
   {id:"participation",name:"Participation Certificate",group:"Certification",style:"participation",color:"#1e3a5f",desc:"Distinctive navy and gold participation recognition."},
   {id:"experience",name:"Experience Letter",group:"Certification",style:"experience",color:"#1e3a5f",desc:"Formal professional experience letter with company branding."}
  ];

  const FIELDS={
   offer:[
    {key:"name",label:"Candidate Name",required:true},
    {key:"domain",label:"Internship Domain",required:true},
    {key:"mode",label:"Programme Mode",type:"select",options:["Virtual / Remote","Hybrid","On-site"],required:true},
    {key:"duration",label:"Duration",required:true},
    {key:"joining",label:"Start Date",type:"date",required:true}
   ],
   "intern-completion":[
    {key:"name",label:"Candidate Name",required:true},
    {key:"domain",label:"Internship Domain",required:true},
    {key:"joining",label:"Start Date",type:"date"},
    {key:"endDate",label:"End Date",type:"date",required:true},
    {key:"duration",label:"Duration"}
   ],
   training:[
    {key:"name",label:"Candidate Name",required:true},
    {key:"domain",label:"Training Domain",required:true},
    {key:"mode",label:"Training Mode",type:"select",options:["Virtual / Remote","Hybrid","On-site"],required:true},
    {key:"duration",label:"Duration",required:true},
    {key:"joining",label:"Start Date",type:"date",required:true}
   ],
   "training-completion":[
    {key:"name",label:"Candidate Name",required:true},
    {key:"domain",label:"Training Domain",required:true},
    {key:"joining",label:"Start Date",type:"date"},
    {key:"endDate",label:"End Date",type:"date",required:true},
    {key:"duration",label:"Duration"},
    {key:"completionDate",label:"Completion Date",type:"date"}
   ],
   participation:[
    {key:"name",label:"Candidate Name",required:true},
    {key:"eventTitle",label:"Programme / Event Name",required:true},
    {key:"participationDate",label:"Participation Date",type:"date",required:true}
   ],
   experience:[
    {key:"name",label:"Candidate Name",required:true},
    {key:"role",label:"Role / Designation",required:true},
    {key:"domain",label:"Department / Domain",required:true},
    {key:"joining",label:"Start Date",type:"date",required:true},
    {key:"endDate",label:"End Date",type:"date",required:true}
   ]
  };

  const LABELS={
   name:"Candidate Name",domain:"Programme Domain",mode:"Programme Mode",
   duration:"Duration",joining:"Start Date",endDate:"End Date",
   completionDate:"Completion Date",eventTitle:"Programme / Event",
   participationDate:"Participation Date",role:"Role / Designation"
  };

  const normalize=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

  function sanitize(key,value){
   if(["name","domain","role"].includes(key))return value.replace(/[^a-zA-Z ]/g,"").replace(/\s+/g," ");
   if(["duration","eventTitle"].includes(key))return value.replace(/[^a-zA-Z0-9 ]/g,"").replace(/\s+/g," ");
   return value;
  }

  function readCell(cell){
   if(!cell||cell.v===null||cell.v===undefined)return "";
   if(cell.f!==undefined&&cell.f!==null)return String(cell.f).trim();
   const value=String(cell.v);
   const match=value.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
   if(match){
    return new Date(+match[1],+match[2],+match[3]).toLocaleDateString("en-IN");
   }
   return value.trim();
  }

  function getIndex(columns,names,fallback=-1){
   const labels=columns.map(c=>normalize(c.label||c.id||""));
   for(const name of names){
    const index=labels.findIndex(x=>x===normalize(name));
    if(index>=0)return index;
   }
   return fallback;
  }

  function getStatus(c){
   const s=String(c||"").toUpperCase().trim();
   if(/FAILED|FAILURE|ERROR|BOUNCED|REJECTED|UNDELIVERED/.test(s))return "FAILED";
   if(/NOT SENT|NOT DELIVERED|PENDING|QUEUED|WAITING|PROCESSING|IN PROGRESS/.test(s))return "PENDING";
   if(/SENT|DELIVERED|SUCCESS|ACCEPTED BY GMAIL|TRUE|^YES$|^1$/.test(s))return "SENT";
   return "UNKNOWN";
  }

  function loadSheet(){
   return new Promise((resolve,reject)=>{
    const callback="vrpiSheet_"+Date.now();
    const script=document.createElement("script");
    let done=false;

    const timer=setTimeout(()=>finish(new Error("Google Sheets did not respond. Check sheet access.")),15000);

    function finish(error,result){
     if(done)return;
     done=true;
     clearTimeout(timer);
     script.remove();
     try{delete window[callback]}catch(e){}
     error?reject(error):resolve(result);
    }

    window[callback]=response=>{
     if(!response||!response.table){
      const msg=response?.errors?.[0]?.detailed_message||"Google Sheets returned no readable table.";
      finish(new Error(msg));
      return;
     }
     finish(null,response.table);
    };

    const tqx=encodeURIComponent("out:json;responseHandler:"+callback+";reqId:0");
    script.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?gid="+SHEET_GID+"&tqx="+tqx+"&_="+Date.now();
    script.async=true;
    script.onerror=()=>finish(new Error("Google Sheets cannot be reached. Check link-view access."));
    document.head.appendChild(script);
   });
  }

  function parseSheet(table){
   const columns=table.cols||[];
   const rows=table.rows||[];

   function field(row,names,fallback){
    return readCell(row.c?.[getIndex(columns,names,fallback)]);
   }

   return rows.map((row,index)=>{
    const aid=field(row,["Application ID","Application Id"],1);
    return {
     key:aid||"sheet-row-"+index,
     source:"sheet",
     timestamp:field(row,["Timestamp"],0),
     aid:aid,
     name:field(row,["Full Name","Candidate Name","Name"],2),
     email:field(row,["Email Address","Email"],3),
     phone:field(row,["WhatsApp / Phone","WhatsApp","Phone"],4),
     domain:field(row,["Domain","Internship Domain","Training Domain","Track"],7),
     mode:field(row,["Mode","Programme Mode","Training Mode"]),
     duration:field(row,["Duration","Programme Duration"]),
     joining:field(row,["Joining Date","Start Date","Commencement Date"]),
     endDate:field(row,["End Date","Internship End Date"]),
     completionDate:field(row,["Completion Date"]),
     eventTitle:field(row,["Event Title","Event Name","Programme Name"]),
     participationDate:field(row,["Participation Date","Event Date"]),
     role:field(row,["Role","Designation","Job Title"]),
     completionStatus:field(row,["Completion Status","Training Completion Status","Certificate Status"]),
     participationStatus:field(row,["Participation Status","Attendance Status"]),
     status:field(row,["Letter Sent","Email Status","Mail Status","Dispatch Status","Delivery Status","Application Status","Status"],17)||"Not recorded",
     pdf:field(row,["PDF Record","PDF Link"],18),
     updated:field(row,["Last Updated","Updated At"],19)
    };
   }).filter(c=>c.name||c.aid||c.email);
  }

  function App(){
   const [records,setRecords]=React.useState([]);
   const [selectedKey,setSelectedKey]=React.useState("");
   const [templateId,setTemplateId]=React.useState("offer");
   const [source,setSource]=React.useState("sheet");
   const [manual,setManual]=React.useState({});
   const [search,setSearch]=React.useState("");
   const [filter,setFilter]=React.useState("ALL");
   const [loading,setLoading]=React.useState(true);
   const [error,setError]=React.useState("");
   const [notice,setNotice]=React.useState("");
   const [lastSync,setLastSync]=React.useState("");
   const [preview,setPreview]=React.useState(false);

   const template=TEMPLATES.find(t=>t.id===templateId)||TEMPLATES[0];
   const fields=FIELDS[templateId]||[];

   const refresh=React.useCallback(async()=>{
    setLoading(true);
    setError("");
    try{
     const data=await loadCandidates();
     setRecords(data);
     setSelectedKey(old=>data.some(c=>c.key===old)?old:(data[0]?.key||""));
     setLastSync(new Date().toLocaleTimeString("en-IN"));
     setNotice(data.length+" actual candidate records synchronized from Google Sheets.");
    }catch(e){
     setError(e.message||"Unable to read Google Sheets.");
     setNotice("");
    }finally{
     setLoading(false);
    }
   },[]);

   React.useEffect(()=>{
    refresh();
    const timer=setInterval(refresh,30000);
    return()=>clearInterval(timer);
   },[refresh]);

   const sheetCandidate=records.find(c=>c.key===selectedKey)||null;
   const candidate=source==="manual"?Object.assign({},manual,{source:"manual"}):sheetCandidate;
   const missing=fields.some(f=>f.required&&!String(manual[f.key]||"").trim());
   const canPreview=source==="sheet"?Boolean(sheetCandidate):!missing;

   const sent=records.filter(c=>getStatus(c.status)==="SENT").length;
   const pending=records.filter(c=>getStatus(c.status)==="PENDING").length;
   const failed=records.filter(c=>getStatus(c.status)==="FAILED").length;

   function updateManual(key,value){
    setManual(old=>Object.assign({},old,{[key]:sanitize(key,value)}));
   }

   function chooseTemplate(id){
    setTemplateId(id);
    setPreview(false);
    if(source==="manual")setManual({});
   }

   const visible=records.filter(c=>{
    const query=search.trim().toLowerCase();
    const match=!query||[c.name,c.aid,c.email,c.phone,c.domain].join(" ").toLowerCase().includes(query);
    return match&&(filter==="ALL"||getStatus(c.status)===filter);

    setSource(mode);

     source==="manual"?
      E("div",{className:"manual-box"},
       E("div",{className:"kicker"},"TEMPLATE-SPECIFIC DETAILS"),
       E("h2",{},template.name),
       E("p",{className:"description"},"Only the required information is displayed for this document."),
       E("div",{className:"form-grid"},
        fields.map(f=>
         E("div",{className:"form-field",key:f.key},
          E("label",{},f.label,f.required?" *":""),
          f.type==="select"?
           E("select",{value:manual[f.key]||"",onChange:e=>updateManual(f.key,e.target.value)},
            E("option",{value:""},"Select "+f.label),
            f.options.map(o=>E("option",{key:o,value:o},o))
           ):
           E("input",{type:f.type||"text",value:manual[f.key]||"",placeholder:"Enter "+f.label.toLowerCase(),onChange:e=>updateManual(f.key,e.target.value)})
         )
        )
       ),
       E("div",{className:"alert info"},"Manual details are held in temporary page memory only. No spreadsheet row or database record is created."),
       E("div",{className:"form-actions"},
        E("button",{className:"btn",onClick:()=>setManual({})},"Clear Details"),
        E("button",{className:"btn orange",disabled:missing,onClick:()=>setPreview(true)},"Preview Document →")
       )
      ):
      E("div",{className:"section-head",style:{marginTop:22}},
       E("span",{className:"description"},sheetCandidate?"Selected: "+sheetCandidate.name:"Select an actual sheet candidate."),
       E("button",{className:"btn orange",disabled:!sheetCandidate,onClick:()=>setPreview(true)},"Preview A4 Document →")
      )
    ),

    E("footer",{className:"footer no-print"},
     E(CompanyLogo,{className:"footer-logo"}),
     E("b",{},COMPANY),E("br"),LOCATION,E("br"),EMAIL,E("br"),
     E("a",{href:WEBSITE,target:"_blank",rel:"noreferrer"},"Official Company Website ↗"),
     E("p",{},"Enterprise Talent Excellence Platform")
    ),

    preview&&candidate?E("div",{className:"modal"},
     E("div",{className:"modal-inner"},
      E("div",{className:"modalbar no-print"},
       E("strong",{},template.name+" • "+candidate.name),
       E("div",{className:"modal-actions"},
        source==="sheet"?E("select",{value:selectedKey,onChange:e=>setSelectedKey(e.target.value)},
         records.map(c=>E("option",{key:c.key,value:c.key},c.name+" — "+(c.aid||"")))
        ):null,
        E("button",{className:"btn orange",onClick:()=>window.print()},"Print / Save PDF"),
        E("button",{className:"btn",onClick:()=>setPreview(false)},"Close ×")
       )
      ),
      E("div",{className:"modal-tabs no-print"},
       TEMPLATES.map(t=>E("button",{key:t.id,className:templateId===t.id?"active":"",onClick:()=>chooseTemplate(t.id)},t.name))
      ),
      E("div",{id:"printTarget"},
       E(RenderDocument,{candidate,template})
      )
     )
    ):null
   );
  }

  try{
   ReactDOM.createRoot(document.getElementById("root")).render(E(App));
  }catch(error){
   showFatal("React application error: "+error.message);
  }
 }
})();
</script>
</body>
</html>
