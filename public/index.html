
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VR PI Group | Enterprise Talent Excellence Platform</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#172033;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.page{max-width:1150px;margin:auto;padding:30px 22px}
.header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid #e2e8f0}
.logo{width:160px;height:auto;display:block}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{padding:10px 15px;border:1px solid #e2e8f0;background:white;border-radius:9px;color:#263c5b;font-size:11px;font-weight:800;text-decoration:none}
.btn-dark{background:#1e3a5f;color:white;border-color:#1e3a5f}
.btn-orange{background:#eb4b16;color:white;border:0}
.hero{text-align:center;padding:65px 10px 45px}
.eyebrow{display:inline-block;background:white;border:1px solid #e2e8f0;border-radius:30px;padding:9px 16px;color:#66758b;font-size:10px;font-weight:700;letter-spacing:1px}
.hero h1{font-size:clamp(34px,5vw,55px);line-height:1.12;letter-spacing:-2px;color:#111a2d;font-weight:800;margin:23px 0 15px}
.hero p{max-width:740px;margin:auto;color:#708096;font-size:14px;line-height:1.9}
.library{background:white;border:1px solid #e3e9f1;border-radius:18px;padding:28px;box-shadow:0 10px 35px #25334a09}
.kicker{color:#8b98aa;font-size:10px;font-weight:800;letter-spacing:1.4px}
.library h2{font-size:21px;margin:8px 0;color:#172b4d}
.library p{font-size:12px;line-height:1.8;color:#8290a3}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:25px}
.field label{display:block;font-size:10px;font-weight:800;color:#53647d;margin-bottom:9px}
.field select{width:100%;padding:13px;border:1px solid #dfe5ed;border-radius:9px;background:white;color:#30425d;font-size:12px;outline:none}
.field select:focus{border-color:#eb4b16}
.template-list{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:25px}
.template{padding:20px;border:1px solid #e5eaf0;border-radius:13px}
.template h3{font-size:13px;color:#1e3a5f;margin:10px 0}
.template p{font-size:11px;min-height:55px;margin:0 0 15px}
.template button{width:100%;padding:10px;border:0;border-radius:8px;background:#1e3a5f;color:white;font-weight:700;font-size:10px}
.template.selected{border:2px solid #eb4b16;background:#fffaf7}
.candidate-note{font-size:11px;color:#718096;margin-top:12px}
.footer{text-align:center;padding:28px 0;color:#8b98aa;font-size:10px}
.footer a{color:#0d7377;text-decoration:none}
.modal{position:fixed;inset:0;z-index:50;background:#101827df;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:15px}
.modal-inner{width:100%;max-width:900px}
.modal-bar{background:#111b2e;padding:12px 16px;border-radius:11px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.modal-bar select{padding:8px;border-radius:7px;font-size:10px;max-width:240px}
.a4-page{width:210mm;height:297mm;min-height:297mm;background:white;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 15px 50px #0003}
.doc-header{padding:23px 36px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid #1e3a5f}
.doc-brand{display:flex;align-items:center;gap:12px}
.doc-brand strong{display:block;font-size:14px;color:#172b4d}
.doc-brand small{display:block;font-size:8px;color:#748399;margin-top:4px;letter-spacing:1px}
.doc-content{padding:28px 40px;flex:1;display:flex;flex-direction:column;font-size:11px;line-height:1.8}
.doc-title{text-align:center;margin:12px 0 24px}
.doc-title h2{font-size:17px;color:#1e3a5f;letter-spacing:1.5px;margin:6px}
.doc-title small{font-size:9px;color:#8290a3;letter-spacing:2px}
.doc-content p{color:#46566d;line-height:1.9}
.doc-table{border-collapse:collapse;width:100%;font-size:10px;margin:12px 0}
.doc-table td{padding:8px 10px;border-bottom:1px solid #e7ebf0}
.doc-table td:first-child{background:#f1f5f9;color:#1e3a5f;font-weight:700;width:38%}
.doc-footer{padding:11px;background:#1e3a5f;color:white;text-align:center;font-size:9px}
.signoff{margin-top:auto;border-top:1px solid #e2e8f0;padding-top:20px;color:#253650}
.signoff strong{display:block;margin-top:8px;font-size:11px}
.signoff small{font-size:9px;color:#78869a}
.training-accent{height:8px;background:linear-gradient(90deg,#191928 55%,#eb4b16)}
.completion-accent{height:4px;background:#0d7377}
@media(max-width:700px){
 .page{padding:18px 12px}
 .controls,.template-list{grid-template-columns:1fr}
 .library{padding:20px}
 .header{align-items:flex-start}
 .logo{width:135px}
 .a4-page{width:100%;height:auto;min-height:1050px}
 .doc-content{padding:22px}
}
@media print{
 @page{size:A4 portrait;margin:0}
 html,body{margin:0!important;padding:0!important;background:white!important}
 body *{visibility:hidden!important}
 #printTarget,#printTarget *{visibility:visible!important}
 #printTarget{position:absolute!important;left:0!important;top:0!important;width:210mm!important}
 .a4-page{width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}
 .modal{position:static!important;display:block!important;padding:0!important;background:white!important;overflow:visible!important}
 .modal-inner{width:210mm!important;max-width:none!important}
 .modal-bar,.no-print{display:none!important}
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useCallback}=React;

const COMPANY="VR PI Group Of Company";
const COMPANY_EMAIL="vrpigroupoftechnology@gmail.com";
const COMPANY_URL="https://share.google/Staafq7spnZSStc8n";
const SHEET_URL="https://docs.google.com/spreadsheets/d/1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU/edit";
const GMAIL_URL="https://mail.google.com/mail/?authuser=vrpigroupoftechnology%40gmail.com#inbox";

/* Inline single-file logo inspired by the uploaded VRPi brand artwork */
function Logo({width=160}){
 return <svg className="logo" width={width} viewBox="0 0 360 132" role="img" aria-label="VR PI Group of Companies">
  <text x="3" y="82" fontSize="91" fontWeight="900" letterSpacing="-9" fill="#d9003d">VR</text>
  <text x="193" y="82" fontSize="83" fontWeight="900" letterSpacing="-6" fill="#ff6900">Pi</text>
  <text x="5" y="119" fontSize="19" fontWeight="600" letterSpacing="1.1" fill="#d9003d">GROUP OF COMPANIES</text>
 </svg>;
}

const TEMPLATES=[
 {id:"offer",name:"Internship Offer Letter",color:"#1e3a5f",desc:"Formal corporate internship offer with programme particulars and terms."},
 {id:"completion",name:"Internship Completion Certificate",color:"#0d7377",desc:"Premium teal-accented internship completion document."},
 {id:"training",name:"Industrial Training Appointment",color:"#e84916",desc:"Modern corporate training appointment with structured details."}
];

const normalize=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

function pick(row,names){
 const key=Object.keys(row||{}).find(k=>names.some(n=>normalize(n)===normalize(k)));
 return key?row[key]??"":"";
}

function Candidate(raw){
 return {
  ...raw,
  aid:pick(raw,["Application ID","Application Id","aid","Reference Code"]),
  name:pick(raw,["Full Name","Name","name"]),
  email:pick(raw,["Email Address","Email","email"]),
  phone:pick(raw,["WhatsApp / Phone","WhatsApp","Phone"]),
  college:pick(raw,["College"]),
  domain:pick(raw,["Domain","Internship Domain","Track"]),
  mode:pick(raw,["Mode","Programme Mode"]),
  joining:pick(raw,["Joining Date","Start Date"]),
  duration:pick(raw,["Duration"]),
  timestamp:pick(raw,["Timestamp"]),
  status:pick(raw,["Email Status","Letter Sent","Application Status","Status"]),
  pdf:pick(raw,["PDF Link","PDF Record"]),
  completion:pick(raw,["Completion Date"])
 };
}

/*
  The frontend reads private sheet data through your existing
  authenticated Vercel backend. Expected endpoint: GET /api/candidates.
  No credentials are stored in this HTML.
*/
function App(){
 const [candidates,setCandidates]=useState([]);
 const [selectedId,setSelectedId]=useState("");
 const [templateId,setTemplateId]=useState("offer");
 const [open,setOpen]=useState(false);
 const [loading,setLoading]=useState(true);
 const [message,setMessage]=useState("Connecting to company records...");

 const loadCandidates=useCallback(async()=>{
  setLoading(true);
  try{
   const response=await fetch("/api/candidates",{
    method:"GET",
    credentials:"include",
    cache:"no-store",
    headers:{Accept:"application/json"}
   });
   if(!response.ok)throw new Error("Candidate API unavailable");
   const data=await response.json();
   const rows=Array.isArray(data)?data:(data.rows||data.candidates||[]);
   const records=rows.map(Candidate).filter(c=>c.aid||c.email||c.name);
   setCandidates(records);
   setSelectedId(previous=>records.some(c=>c.aid===previous)?previous:(records[0]?.aid||""));
   setMessage(records.length?`${records.length} live candidate records available`:"No candidate records returned");
  }catch(error){
   setCandidates([]);
   setMessage("Live records require the authenticated /api/candidates backend endpoint.");
  }finally{
   setLoading(false);
  }
 },[]);

 useEffect(()=>{
  loadCandidates();
  const timer=setInterval(loadCandidates,60000);
  return()=>clearInterval(timer);
 },[loadCandidates]);

 const candidate=candidates.find(c=>c.aid===selectedId)||null;
 const template=TEMPLATES.find(t=>t.id===templateId);

 return <main className="page">
  <header className="header no-print">
   <a href={COMPANY_URL} target="_blank" rel="noreferrer">
    <Logo width={175}/>
   </a>
   <div className="actions">
    <a className="btn" href={COMPANY_URL} target="_blank" rel="noreferrer">Company Website ↗</a>
    <a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Google Sheet ↗</a>
    <a className="btn btn-dark" href={GMAIL_URL} target="_blank" rel="noreferrer">Open Company Gmail ↗</a>
   </div>
  </header>

  <section className="hero no-print">
   <div className="eyebrow">VR PI GROUP • ENTERPRISE OPERATIONS SUITE</div>
   <h1>Enterprise Talent<br/><span style={{color:"#1e3a5f"}}>Excellence Platform</span></h1>
   <p>A unified enterprise solution for intelligent talent management, official documentation, professional certifications, and automated corporate communication.</p>
  </section>

  <section className="library no-print">
   <span className="kicker">CORPORATE DOCUMENT LIBRARY</span>
   <h2>Professional Document Generation</h2>
   <p>Select a real candidate from the connected company records, choose a document template, and preview it in A4 format before printing or saving as PDF.</p>

   <div className="controls">
    <div className="field">
     <label>SELECT CANDIDATE</label>
     <select value={selectedId} onChange={e=>setSelectedId(e.target.value)}>
      <option value="">{loading?"Loading candidates...":"Select candidate"}</option>
      {candidates.map((c,i)=><option key={c.aid||i} value={c.aid}>{c.name} — {c.aid}</option>)}
     </select>
    </div>
    <div className="field">
     <label>SELECT DOCUMENT TEMPLATE</label>
     <select value={templateId} onChange={e=>setTemplateId(e.target.value)}>
      {TEMPLATES.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
     </select>
    </div>
   </div>

   <div className="candidate-note">{message}</div>

   <div className="template-list">
    {TEMPLATES.map(t=>
     <article className={"template "+(templateId===t.id?"selected":"")} key={t.id}>
      <span className="kicker" style={{color:t.color}}>VR PI • OFFICIAL DOCUMENT</span>
      <h3>{t.name}</h3>
      <p>{t.desc}</p>
      <button disabled={!candidate} onClick={()=>{setTemplateId(t.id);setOpen(true);}}>Preview A4 Document →</button>
     </article>
    )}
   </div>

   <div style={{marginTop:20,display:"flex",justifyContent:"flex-end"}}>
    <button className="btn btn-orange" disabled={!candidate} onClick={()=>setOpen(true)}>Open A4 / PDF Preview</button>
   </div>
  </section>

  <footer className="footer no-print">
   <Logo width={150}/>
   <p><strong>{COMPANY}</strong></p>
   <p>Enterprise Talent Excellence Platform</p>
   <a href={COMPANY_URL} target="_blank" rel="noreferrer">Official Company Website ↗</a>
  </footer>

  {open&&candidate&&<div className="modal">
   <div className="modal-inner">
    <div className="modal-bar no-print">
     <strong style={{color:"white",fontSize:11}}>{template.name} • {candidate.name}</strong>
     <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      <button className="btn" onClick={()=>window.print()}>Print / Save A4 PDF</button>
      <button className="btn btn-orange" onClick={()=>setOpen(false)}>Close ×</button>
     </div>
    </div>

    <div className="no-print" style={{display:"flex",justifyContent:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
     {TEMPLATES.map(t=><button key={t.id} className="btn" style={{background:templateId===t.id?t.color:"#fff",color:templateId===t.id?"#fff":"#263c5b"}} onClick={()=>setTemplateId(t.id)}>{t.name}</button>)}
    </div>

    <div id="printTarget">
     {templateId==="offer"&&<OfferDocument candidate={candidate}/>}
     {templateId==="completion"&&<CompletionDocument candidate={candidate}/>}
     {templateId==="training"&&<TrainingDocument candidate={candidate}/>}
    </div>
   </div>
  </div>}
 </main>;
}

/* A4 TEMPLATE CONTENT */

function OfferDocument({candidate:c}){
 const rows=[
  ["Candidate Name",c.name],["Application ID",c.aid],
  ["Email Address",c.email],["Phone",c.phone],
  ["College",c.college],["Programme Domain",c.domain],
  ["Mode",c.mode],["Joining Date",c.joining],["Duration",c.duration]
 ].filter(x=>x[1]);

 return <div className="a4-page">
  <DocumentHeader reference={c.aid} date={new Date().toLocaleDateString("en-IN")}/>
  <div className="doc-content">
   <div className="doc-title">
    <small>OFFICIAL CORPORATE COMMUNICATION</small>
    <h2>INTERNSHIP OFFER LETTER</h2>
   </div>
   <p><b>To: {c.name}</b><br/>{c.email}</p>
   <p>Dear {c.name},</p>
   <p>We are pleased to inform you that you have been selected for the <b>{c.domain}</b> internship programme at <b>VR PI Group of Companies</b>.</p>
   <p>We welcome you to our professional development programme and look forward to your participation in assigned projects, practical learning activities, and professional engagements.</p>
   <h4 style={{color:"#1e3a5f",letterSpacing:1}}>PROGRAMME PARTICULARS</h4>
   <table className="doc-table"><tbody>{rows.map(([k,v])=><tr key={k}><td>{k}</td><td>{v}</td></tr>)}</tbody></table>
   <h4 style={{color:"#1e3a5f",letterSpacing:1}}>TERMS AND CONDITIONS</h4>
   <p>1. Maintain confidentiality of company information.</p>
   <p>2. Complete assigned tasks within communicated deadlines.</p>
   <p>3. Follow professional conduct and programme guidelines.</p>
   <p>4. Adhere to applicable company policies.</p>
   <div className="signoff">
    Regards,
    <strong>Talent Acquisition Directorate</strong>
    <small>VR PI Group of Companies • Authorized Corporate Representative</small>
   </div>
  </div>
  <DocumentFooter/>
 </div>;
}

function CompletionDocument({candidate:c}){
 return <div className="a4-page">
  <DocumentHeader reference={c.aid} date={new Date().toLocaleDateString("en-IN")} color="#0d7377"/>
  <div className="doc-content" style={{padding:"40px 48px"}}>
   <div className="doc-title">
    <small style={{color:"#0d7377"}}>OFFICIAL CORPORATE COMMUNICATION</small>
    <h2 style={{color:"#0d7377"}}>TO WHOM IT MAY CONCERN</h2>
    <small>INTERNSHIP COMPLETION CERTIFICATE</small>
   </div>
   <p>This document is issued in the name of <b>{c.name}</b>, application reference <b>{c.aid}</b>, in connection with the <b>{c.domain}</b> programme at VR PI Group of Companies.</p>
   <p>This document is intended to formally recognize completion of the programme, subject to confirmation of the candidate's completion status by the authorized company representative.</p>
   <div style={{background:"#effafa",borderLeft:"4px solid #0d7377",padding:20,marginTop:25}}>
    <h4 style={{color:"#0d7377",marginTop:0}}>CANDIDATE DETAILS</h4>
    {[["Name",c.name],["Application ID",c.aid],["Email",c.email],["Domain",c.domain],["College",c.college],["Programme Mode",c.mode],["Completion Date",c.completion]].filter(x=>x[1]).map(([k,v])=><p key={k} style={{fontSize:10,margin:"9px 0"}}><b>{k}:</b> {v}</p>)}
   </div>
   <div className="signoff">
    Regards,
    <strong>Director of Talent Acquisition</strong>
    <small>VR PI Group of Companies • Authorized Corporate Representative</small>
   </div>
  </div>
  <DocumentFooter color="#0d7377"/>
 </div>;
}

function TrainingDocument({candidate:c}){
 return <div className="a4-page">
  <div style={{height:12,background:"linear-gradient(90deg,#191928 65%,#e84916)"}}/>
  <div className="doc-header" style={{borderColor:"#e84916"}}>
   <div className="doc-brand">
    <Logo width={145}/>
   </div>
   <div style={{textAlign:"right",fontSize:9,color:"#64748b"}}>
    DATE ISSUED<br/><b>{new Date().toLocaleDateString("en-IN")}</b><br/>
    <b style={{color:"#e84916"}}>{c.aid}</b>
   </div>
  </div>
  <div className="doc-content" style={{padding:"35px 42px"}}>
   <small style={{color:"#e84916",fontWeight:800,letterSpacing:2}}>VR PI GROUP OF COMPANIES</small>
   <h2 style={{fontSize:25,lineHeight:1.2,color:"#101828",margin:"12px 0 25px"}}>INDUSTRIAL TRAINING<br/>APPOINTMENT LETTER</h2>
   <p><b>To: {c.name}</b><br/>{c.email}</p>
   <p>Dear {c.name},</p>
   <p>We are pleased to offer you an industrial training opportunity in the <b style={{color:"#e84916"}}>{c.domain}</b> domain at VR PI Group of Companies.</p>
   <h4>TRAINING PARTICULARS</h4>
   <table className="doc-table"><tbody>
    {[["Candidate",c.name],["Application ID",c.aid],["Domain",c.domain],["College",c.college],["Mode",c.mode],["Joining Date",c.joining],["Duration",c.duration]].filter(x=>x[1]).map(([k,v])=><tr key={k}><td>{k}</td><td>{v}</td></tr>)}
   </tbody></table>
   <div style={{background:"#111827",color:"#e2e8f0",padding:17,borderRadius:7,marginTop:20,fontSize:10}}>
    <b style={{color:"#fb743e"}}>PROFESSIONAL EXPECTATIONS</b><br/>
    Maintain professional conduct, fulfil assigned deliverables, participate in programme reviews, and comply with company confidentiality requirements.
   </div>
   <div className="signoff">
    Regards,
    <strong>Head, Industrial Training Cell</strong>
    <small>VR PI Group of Companies • Authorized Corporate Representative</small>
   </div>
  </div>
  <DocumentFooter color="#e84916"/>
 </div>;
}

function DocumentHeader({reference,date,color="#1e3a5f"}){
 return <div className="doc-header" style={{borderColor:color}}>
  <div className="doc-brand">
   <Logo width={145}/>
  </div>
  <div style={{textAlign:"right",fontSize:9,color:"#64748b"}}>
   DATE ISSUED<br/><b>{date}</b><br/>
   <b style={{color}}>REF: {reference}</b>
  </div>
 </div>;
}

function DocumentFooter({color="#1e3a5f"}){
 return <div className="doc-footer" style={{background:color}}>
  VR PI Group Of Company • {COMPANY_EMAIL} • Official Corporate Documentation
 </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
