<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR PI Group | Corporate Document Platform & HR Studio</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#17233a;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1520px;margin:auto;padding:20px}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #dfe6ef;padding-bottom:14px}
.logo{width:180px;height:85px;object-fit:contain;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 15px;background:white;border:1px solid #dfe6ef;border-radius:9px;color:#1e3a5f;text-decoration:none;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.dark{background:#1e3a5f;color:white;border-color:#1e3a5f}
.dark:hover{background:#152d4c}
.orange{background:#e94b17;color:white;border-color:#e94b17}
.orange:hover{background:#d03e0e}
.gmail-btn{background:linear-gradient(135deg,#312e81 0%,#4338ca 100%);color:white;border:1px solid #4f46e5}
.teams-btn{background:linear-gradient(135deg,#464eb8 0%,#5b5fc7 100%);color:white;border:1px solid #5b5fc7}

/* Hero */
.hero{text-align:center;padding:26px 10px 16px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;background:white;border:1px solid #dfe6ef;border-radius:25px;padding:6px 16px;font-size:10px;font-weight:800;letter-spacing:1px;color:#64748b}
h1{font-size:clamp(28px,4vw,44px);line-height:1.15;margin:12px 0;color:#121c30;letter-spacing:-1px}
.desc{color:#8290a5;font-size:11.5px;line-height:1.7}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat,.panel{background:white;border:1px solid #dfe6ef;border-radius:14px}
.stat{padding:16px}
.stat label{font-size:9.5px;font-weight:800;color:#8795a9;letter-spacing:1px}
.stat strong{display:block;font-size:26px;margin:6px 0}
.stat small{font-size:9.5px;color:#94a3b8}

/* Panels */
.panel{padding:20px;margin-bottom:20px}
.kicker{font-size:10px;letter-spacing:1.2px;font-weight:800;color:#8492a7;display:flex;align-items:center;gap:6px}
h2{font-size:19px;color:#172b49;margin:6px 0}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.search{padding:9px 12px;border:1px solid #dfe6ef;border-radius:8px;min-width:220px;font-size:11px}
.table-wrap{overflow-x:auto;margin-top:14px;max-height:240px}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{background:#f8fafc;text-align:left;padding:10px 12px;color:#8795a9;font-size:9px;position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-bottom:1px solid #edf0f4;font-size:10px;color:#52637c}
.status{padding:3px 7px;border-radius:20px;background:#edf2f7;font-size:9px;font-weight:700}
.sent{background:#dcfce7;color:#166534}
.failed{background:#fee2e2;color:#991b1b}
.pending{background:#fef3c7;color:#92400e}
.text-btn{border:0;background:none;color:#0284c7;font-weight:800;font-size:10px;cursor:pointer}

/* Two-Column Studio */
.studio-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:1150px){.studio-grid{grid-template-columns:1fr}}

.mode-switch,.template-pills{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.mode-switch button,.template-pills button{padding:8px 12px;border:1px solid #dfe6ef;background:white;border-radius:8px;font-size:10px;font-weight:800;color:#52637c;transition:all .15s ease}
.mode-switch button.active,.template-pills button.active{background:#1e3a5f;color:white;border-color:#1e3a5f}

.form-box{padding:18px;background:#f8fafc;border:1px solid #e4eaf1;border-radius:12px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field label{display:block;font-size:9.5px;font-weight:800;color:#52637c;margin-bottom:6px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid #dfe6ef;border-radius:8px;background:white;color:#30425d;font-size:11px;outline:none}
.field input:focus,.field select:focus{border-color:#e94b17;box-shadow:0 0 0 3px #e94b1712}
.field input[type=date]{min-height:37px;cursor:pointer;color-scheme:light}
.help{font-size:9.5px;color:#8492a7;margin-top:10px;line-height:1.6}

/* Live Preview Side */
.preview-column{position:sticky;top:15px}
.preview-topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0f172a;color:white;padding:10px 16px;border-radius:10px 10px 0 0}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:#4ade80}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80}
.preview-controls{display:flex;align-items:center;gap:6px}
.preview-scale-btn{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700}
.preview-stage{background:#94a3b8;padding:16px 8px;border-radius:0 0 10px 10px;border:1px solid #94a3b8;overflow:auto;max-height:820px;display:flex;justify-content:center}
.preview-scaled-wrap{transform-origin:top center;transition:transform .12s ease}

/* Fullscreen Preview Modal */
.modal-overlay{position:fixed;inset:0;background:#090d16cc;backdrop-filter:blur(4px);z-index:200;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:15px}
.modal-container{max-width:980px;width:100%;margin:auto}
.modalbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#17233a;padding:12px 18px;border-radius:12px;margin-bottom:14px;color:white}
.modalbar strong{font-size:12px}
.modal-actions{display:flex;gap:8px}

/* Professional A4 Document Styles (Exact 1-Page Fit) */
.a4{width:210mm;height:296mm;max-height:296mm;overflow:hidden;background:white;margin:auto;display:flex;flex-direction:column;color:#26354d;box-shadow:0 6px 25px #00000020}
.doc-header{padding:14px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid #1e3a5f;gap:12px}
.doc-logo{width:135px;height:65px;object-fit:contain;display:block}
.doc-info{text-align:right;font-size:8.5px;color:#718096;line-height:1.6}
.doc-info strong{color:#1e3a5f;font-size:11.5px}
.doc-content{padding:14px 28px;flex:1;display:flex;flex-direction:column;font-size:9.5px;line-height:1.55}
.doc-title{text-align:center;margin:4px 0 10px}
.doc-title h2{font-size:17px;letter-spacing:1.2px;color:#152d4c;margin:2px 0}
.doc-title small{font-size:8.5px;color:#8492a7;letter-spacing:1.5px;font-weight:800}
.doc-section{font-size:9px;letter-spacing:1px;font-weight:800;color:#1e3a5f;border-bottom:1px solid #dfe6ef;padding-bottom:3px;margin-top:9px}
.doc-table{width:100%;border-collapse:collapse;margin:7px 0;font-size:9px}
.doc-table td{padding:5px 8px;border-bottom:1px solid #e4eaf1}
.doc-table td:first-child{background:#f2f5f9;color:#1e3a5f;font-weight:700;width:34%}
.doc-content p{color:#475569;line-height:1.55;margin:4px 0}
.terms-list{margin:4px 0;padding-left:16px}
.terms-list li{margin-bottom:2px;color:#475569}
.doc-footer{background:#1e3a5f;color:white;text-align:center;padding:8px 12px;font-size:8px;line-height:1.5;margin-top:auto}
.signoff{margin-top:auto;padding-top:8px}
.signoff strong{display:block;color:#1e3a5f;margin-top:2px}
.acceptance-box{border:1px solid #1e3a5f;border-radius:6px;padding:6px 12px;margin-top:6px}
.acceptance-box p{margin:2px 0}

/* Completion Template */
.completion-page{border:1px solid #e5e9ef}
.completion-head{padding:12px 24px 10px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:4px solid #d6ad59}
.completion-head .doc-logo{width:130px;height:65px}
.completion-company{text-align:right;font-size:8.5px;line-height:1.6;color:#52637c}
.completion-company strong{font-size:11.5px;color:#1e3a5f}
.completion-accent{height:5px;background:linear-gradient(90deg,#172f50 0%,#d5ae61 48%,#172f50 100%)}
.completion-body{padding:16px 28px;flex:1;display:flex;flex-direction:column;font-size:9.5px;line-height:1.6}
.completion-title{text-align:center;margin:4px 0 10px}
.completion-title h2{font-family:'Playfair Display',serif;font-size:19px;color:#152d4c;margin:4px 0}
.completion-title small{font-size:8.5px;font-weight:800;letter-spacing:1.5px;color:#9a7b39}
.completion-body p{font-size:9.5px;color:#36465d;line-height:1.65;margin:4px 0}
.completion-recipient{border-bottom:1px solid #d9e0e9;padding-bottom:5px;margin-bottom:7px}
.completion-recipient b{color:#1e3a5f}
.completion-details{width:100%;border-collapse:collapse;margin:7px 0;font-size:9px}
.completion-details td{border-bottom:1px solid #e3e8ee;padding:5px 8px}
.completion-details td:first-child{width:34%;background:#f4f6f9;color:#1e3a5f;font-weight:800}
.completion-signoff{margin-top:auto;padding-top:8px;position:relative;min-height:85px}
.completion-signoff strong{display:block;color:#1e3a5f;margin-top:2px}
.well-done{position:absolute;right:10px;bottom:5px;width:78px;height:78px;border:4px double #c49b46;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#1e3a5f;background:#fffdf6;font-size:7px;font-weight:800;line-height:1.2;transform:rotate(7deg)}
.well-done .star{font-size:14px;color:#bc923f}
.completion-footer{background:#132e50;color:#fff;padding:8px 14px;text-align:center;font-size:7.5px;line-height:1.6;border-top:3px solid #c69f4d;margin-top:auto}

/* Participation Certificate (Landscape Exact 1 Page) */
.participation-page{width:297mm;height:208mm;max-height:208mm;position:relative;overflow:hidden;background:#fffdf8;border:7px double #cba85a;padding:8mm 12mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.participation-page:before{content:"";position:absolute;left:-5%;top:-45px;width:110%;height:65px;background:#17395c;border-bottom:7px solid #e6ce8f;border-radius:0 0 50% 50%;z-index:0}
.participation-page:after{content:"";position:absolute;left:-5%;bottom:-45px;width:110%;height:75px;background:#17395c;border-top:7px solid #e6ce8f;border-radius:50% 50% 0 0;z-index:0}
.participation-content{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center}
.participation-logo{width:125px;height:55px;object-fit:contain;margin:0 auto 4px}
.participation-company{font-size:9px;font-weight:800;letter-spacing:2.5px;color:#17395c}
.participation-heading{margin:5px 0 1px;font-family:'Playfair Display',serif;font-size:30px;letter-spacing:3px;color:#17395c}
.participation-subtitle{font-size:11px;letter-spacing:3px;color:#a58038;font-weight:700}
.participation-medal{position:absolute;left:15px;top:15px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b8,#cfac56 45%,#9f722d 80%);border:3px double #f8e9b7}
.participation-intro{font-size:10.5px;color:#45566c;margin-top:10px}
.participation-name{font-family:'Playfair Display',serif;font-style:italic;font-size:32px;color:#bd974c;border-bottom:1px solid #bca66f;padding:0 30px 2px;margin:4px 0 6px;max-width:85%}
.participation-copy{font-size:9.5px;color:#344861;line-height:1.6;max-width:640px;margin:4px auto}
.participation-meta{display:flex;justify-content:space-around;width:100%;gap:15px;margin-top:10px;color:#17395c;font-size:8.5px}
.participation-meta strong{display:block;font-size:9.5px}
.participation-meta span{display:block;color:#687789}
.participation-foot{font-size:8px;color:#17395c;font-weight:700;position:relative;z-index:2;margin-bottom:0}

/* Dialog Modals */
.cred-card{background:white;border-radius:16px;max-width:600px;width:100%;box-shadow:0 25px 60px #00000040;overflow:hidden;margin:auto}
.cred-header{padding:18px 22px;color:white;display:flex;justify-content:space-between;align-items:center}
.cred-title-row{display:flex;align-items:center;gap:12px}
.cred-g-icon{width:38px;height:38px;background:#ffffff20;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.cred-header h3{margin:0;font-size:16px;font-weight:700}
.cred-header p{margin:2px 0 0;font-size:10.5px;opacity:.9}
.close-round{background:#ffffff20;border:0;color:white;width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer}
.cred-body{padding:18px 22px}
.cred-field{margin-bottom:13px}
.cred-field label{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;color:#334155;margin-bottom:5px}
.cred-input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:11.5px;outline:none;background:#f8fafc}
.cred-input:focus{border-color:#4338ca;background:white}
.btn-sm{padding:6px 10px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid #cbd5e1;background:#f1f5f9;color:#334155;cursor:pointer}
.app-pwd-help{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:11px 14px;font-size:9.5px;color:#475569;line-height:1.6}
.cred-footer{padding:14px 22px;background:#f8fafc;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}

footer{text-align:center;color:#8491a5;font-size:9.5px;padding:22px}
footer .logo{width:80px;height:auto;margin:0 auto 6px}

/* Guaranteed 1-Page Crisp Print View (Zero Blank Screen) */
@media print{
  @page{size:A4 portrait;margin:0}
  @page certPage{size:A4 landscape;margin:0}
  
  body *{visibility:hidden!important}
  #printTarget,#printTarget *{visibility:visible!important}
  
  #printTarget{
    position:absolute!important;
    left:0!important;
    top:0!important;
    width:100%!important;
    margin:0!important;
    padding:0!important;
    background:white!important;
  }
  
  .modal-overlay{position:static!important;padding:0!important;background:white!important;overflow:visible!important}
  .modal-container{max-width:none!important;width:100%!important;margin:0!important}
  .modalbar{display:none!important}
  
  .a4{
    width:210mm!important;
    height:296mm!important;
    max-height:296mm!important;
    margin:0 auto!important;
    box-shadow:none!important;
    page-break-inside:avoid!important;
    break-inside:avoid!important;
    page-break-after:avoid!important;
    break-after:avoid!important;
    print-color-adjust:exact!important;
    -webkit-print-color-adjust:exact!important;
  }
  
  .participation-page{
    page:certPage;
    width:297mm!important;
    height:208mm!important;
    max-height:208mm!important;
    margin:0 auto!important;
    page-break-inside:avoid!important;
    break-inside:avoid!important;
    page-break-after:avoid!important;
    break-after:avoid!important;
    print-color-adjust:exact!important;
    -webkit-print-color-adjust:exact!important;
  }
  
  .completion-page,.completion-footer,.doc-table td:first-child{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}
}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;

const COMPANY="VR PI Group Of Companies";
const SHEET_ID="1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU";
const SHEET_GID="0";
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SHEET_GID}`;
const WEBSITE="https://share.google/Staafq7spnZSStc8n";

function Logo({className="",style={}}){
  return <img src="./vrpi-logo.png" alt="VR PI Group" className={className} style={{objectFit:"contain",display:"block",...style}} onError={e=>{e.target.style.display='none';}}/>;
}

const TEMPLATES=[
  {id:"offer",name:"Internship Offer Letter",fields:["name","domain","mode","joining","duration"],desc:"Formal internship offer with professional terms and conditions.",type:"letter"},
  {id:"internship-completion",name:"Internship Completion Certificate",fields:["name","domain","mode","joining","duration","completionDate"],desc:"Corporate internship completion letter with personalized company details.",type:"completion",programme:"internship"},
  {id:"training-appointment",name:"Training Appointment Letter",fields:["name","domain","mode","appointmentDate","duration"],desc:"Professional training appointment and responsibilities.",type:"letter"},
  {id:"training-completion",name:"Training Completion Certificate",fields:["name","domain","mode","joining","duration","completionDate"],desc:"Formal training completion letter with company branding.",type:"completion",programme:"training"},
  {id:"participation",name:"Participation Certificate",fields:["name","eventName","domain","participationDate"],desc:"Elegant navy-and-gold participation certificate.",type:"participation"},
  {id:"experience",name:"Experience Letter",fields:["name","domain","role","joining","duration"],desc:"Professional engagement and experience confirmation.",type:"experience"}
];

const LABELS={
  name:"Candidate Full Name",domain:"Programme Domain",mode:"Programme Mode",
  joining:"Start Date",duration:"Duration",completionDate:"Completion Date",
  appointmentDate:"Appointment Date",eventName:"Event / Programme Name",
  participationDate:"Participation Date",role:"Designation / Role"
};

const DOMAINS=[
  "Full Stack Development","Java Development","Python Development",
  "Web Development","Artificial Intelligence","Machine Learning",
  "Data Science","Data Analytics","Cloud Computing","Cybersecurity",
  "DevOps","UI UX Design","Software Testing",
  "Mobile Application Development","Digital Marketing","Business Analytics"
];
const MODES=["Online","Offline","Hybrid"];
const DURATIONS=["1 Month","2 Months","3 Months","4 Months","5 Months","6 Months","9 Months","12 Months"];

function today(){
  return new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});
}
function dateText(v){
  if(!v)return "";
  const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"}):v;
}
function norm(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function column(cols,names,fallback=-1){
  for(const n of names){
    const i=cols.findIndex(c=>norm(c.label||c.id)===norm(n));
    if(i>=0)return i;
  }
  return fallback;
}
function cell(row,i){
  return i<0?"":String(row.c?.[i]?.f||row.c?.[i]?.v||"").trim();
}

function fetchSheet(){
  return new Promise((resolve,reject)=>{
    const cb="vrpiReadOnlySheet";
    let done=false;
    const script=document.createElement("script");
    const timer=setTimeout(()=>finish(new Error("Google Sheets connection timed out.")),15000);
    function finish(err,data){
      if(done)return;
      done=true;
      clearTimeout(timer);
      script.remove();
      try{delete window[cb]}catch(e){}
      err?reject(err):resolve(data);
    }
    window[cb]=data=>{
      if(!data?.table){finish(new Error("Sheet is not accessible. Enable Anyone with the link – Viewer."));return}
      finish(null,data.table);
    };
    script.onerror=()=>finish(new Error("Unable to load Google Sheets."));
    script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=${encodeURIComponent("out:json;responseHandler:"+cb)}&t=${Date.now()}`;
    document.head.appendChild(script);
  });
}

async function getRecords(){
  const table=await fetchSheet();
  const cols=table.cols||[];
  return (table.rows||[]).map((row,i)=>{
    const read=(names,fallback=-1)=>cell(row,column(cols,names,fallback));
    return {
      key:read(["Application ID","Application Id"],1)||"row-"+i,
      aid:read(["Application ID","Application Id"],1),
      name:read(["Full Name","Candidate Name","Name"],2),
      email:read(["Email Address","Email","Candidate Email"],3),
      phone:read(["WhatsApp / Phone","WhatsApp","Phone"],4),
      domain:read(["Domain","Internship Domain","Programme Domain"],7),
      mode:read(["Mode","Programme Mode","Internship Mode"],-1),
      joining:read(["Start Date","Joining Date","Internship Start Date"],-1),
      duration:read(["Duration","Internship Duration","Programme Duration"],-1),
      completionDate:read(["Completion Date","End Date","Internship End Date"],-1),
      appointmentDate:read(["Appointment Date","Training Date"],-1),
      eventName:read(["Event Name","Programme Name","Event"],-1),
      participationDate:read(["Participation Date","Event Date"],-1),
      role:read(["Designation","Role","Job Role"],-1),
      status:read(["Letter Sent","Email Status","Application Status","Status"],17)||"Not recorded",
      pdf:read(["PDF Record","PDF Link"],18)
    };
  }).filter(x=>x.name||x.email||x.aid);
}

function DocHeader({senderEmail}){
  return <div className="doc-header">
    <Logo className="doc-logo"/>
    <div className="doc-info">
      <strong>{COMPANY}</strong><br/>
      Corporate Office • Wanaparthy, Telangana, India<br/>
      Official Email: {senderEmail||"vrpigroupoftechnology@gmail.com"}<br/>
      Web: {WEBSITE} • Date: {today()}
    </div>
  </div>;
}

function DocFooter({senderEmail}){
  return <div className="doc-footer">

function StandardDocument({data,template,senderEmail,displayName}){
  const experience=template.id==="experience";
  const offer=template.id==="offer";
  const training=template.id==="training-appointment";

  const candidateName = data.name || "[Candidate Full Name]";
  const candidateDomain = data.domain || "[Programme Domain]";
  const candidateMode = data.mode || "Online";
  const candidateDuration = data.duration || "3 Months";
  const candidateRole = data.role || "[Designation / Role]";
  const candidateDate = dateText(training ? (data.appointmentDate || "2026-06-01") : (data.joining || "2026-06-01"));

  const intro=offer
  ?`We are pleased to offer ${candidateName} an internship opportunity with ${COMPANY} in the ${candidateDomain} programme. We are delighted to welcome you to our professional team.`
  :training
  ?`We are pleased to appoint ${candidateName} to the ${candidateDomain} training programme with ${COMPANY}. This appointment provides structured learning and practical technical exposure.`
  :`This letter confirms the professional engagement of ${candidateName} with ${COMPANY} in the capacity of ${candidateRole} within the ${candidateDomain} domain.`;

  return <div className="a4">
    <DocHeader senderEmail={senderEmail}/>
    <div className="doc-content">
      <div className="doc-title">
        <small>REF: VRPI/HR/2026/{data.aid||"OFFER"}</small>
        <h2>{template.name.toUpperCase()}</h2>
        <small>{today().toUpperCase()}</small>
      </div>

      <p><b>To,</b><br/>{candidateName}</p>
      {offer&&<p><b>Subject: Official Internship Offer – {candidateDomain}</b></p>}
      {training&&<p><b>Subject: Official Training Appointment – {candidateDomain}</b></p>}
      {experience&&<p><b>Subject: Experience Confirmation Letter</b></p>}
      <p>Dear {candidateName},</p>
      <p>{intro}</p>

      <div className="doc-section">{experience?"PROFESSIONAL EXPERIENCE DETAILS":training?"TRAINING APPOINTMENT DETAILS":"INTERNSHIP OFFER DETAILS"}</div>

      <table className="doc-table"><tbody>
        <tr><td>Candidate Name</td><td>{candidateName}</td></tr>
        {experience&&<tr><td>Designation / Role</td><td>{candidateRole}</td></tr>}
        <tr><td>Programme Domain</td><td>{candidateDomain}</td></tr>
        {!experience&&<tr><td>Programme Mode</td><td>{candidateMode}</td></tr>}
        <tr><td>{training?"Appointment Date":"Start Date"}</td><td>{candidateDate}</td></tr>
        <tr><td>Duration</td><td>{candidateDuration}</td></tr>
      </tbody></table>

      {offer&&<>
        <p>Your internship commences on <b>{candidateDate}</b> for a duration of <b>{candidateDuration}</b> in <b>{candidateMode}</b> mode. Please adhere to the corporate guidelines under your designated coordinator.</p>

        <div className="doc-section">KEY TERMS AND CONDITIONS</div>
        <ol className="terms-list">
          <li><b>Professional Conduct:</b> Maintain punctuality, regular active participation, and respectful professional communication.</li>
          <li><b>Responsibilities & Project Work:</b> Complete designated learning assignments and project milestones within assigned deadlines.</li>
          <li><b>Confidentiality:</b> Keep company and client project data confidential and strictly refrain from unauthorized disclosure.</li>
          <li><b>Documentation & Certificate:</b> Official completion credentials are provided upon verified attendance and satisfactory task evaluation.</li>
        </ol>

        <div className="doc-section">CANDIDATE ACCEPTANCE</div>
        <div className="acceptance-box">
          <p>I, <b>{candidateName}</b>, acknowledge and accept the terms and conditions stated in this offer letter.</p>
          <p style={{marginTop:3}}><b>Signature:</b> ___________________________ &nbsp;&nbsp;&nbsp;&nbsp; <b>Date:</b> ______________</p>
        </div>
      </>}

      {training&&<>
        <p>The training begins on <b>{candidateDate}</b> for <b>{candidateDuration}</b>. You will undergo structured technical training and hands-on assessments.</p>

        <div className="doc-section">TRAINING TERMS</div>
        <ol className="terms-list">
          <li>Maintain regular attendance and actively complete assigned practical exercises and technical sessions.</li>
          <li>Follow the instructions of the training mentor and adhere to information security policies.</li>
          <li>Completion credentials are issued after successful completion of all curriculum criteria.</li>
        </ol>

        <div className="doc-section">CANDIDATE ACKNOWLEDGEMENT</div>
        <div className="acceptance-box">
          <p>I acknowledge this training appointment and agree to follow all instructions.</p>
          <p style={{marginTop:3}}><b>Signature:</b> ___________________________ &nbsp;&nbsp;&nbsp;&nbsp; <b>Date:</b> ______________</p>
        </div>
      </>}

      {experience&&<>
        <p>During the engagement period, the candidate performed their designated role with dedication and professionalism. This letter is issued as a verified corporate confirmation.</p>
        <p>We appreciate the candidate's contribution and wish them continued success in their career endeavors.</p>
      </>}

      <Signoff experience={experience} displayName={displayName}/>
    </div>
    <DocFooter senderEmail={senderEmail}/>
  </div>;
}

function DocumentRenderer({data,template,senderEmail,displayName}){
  if(template.type==="completion")return <CompletionDocument data={data} template={template} senderEmail={senderEmail} displayName={displayName}/>;
  if(template.type==="participation")return <ParticipationDocument data={data} template={template} senderEmail={senderEmail}/>;
  return <StandardDocument data={data} template={template} senderEmail={senderEmail} displayName={displayName}/>;
}

function App(){

  const [manual,setManual]=useState(true);
  const [form,setForm]=useState({
    name:"srija",
    domain:"Full Stack Development",
    mode:"Online",
    duration:"9 Months",
    joining:"2026-06-03",
    completionDate:"2026-09-01",
    appointmentDate:"2026-06-03",
    eventName:"AI & Cloud Computing Summit 2026",
    participationDate:"2026-06-15",
    role:"Full Stack Developer Intern"
  });

  const [previewScale,setPreviewScale]=useState(0.55);
  const [search,setSearch]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [lastSync,setLastSync]=useState("");

  /* Full Screen Preview Modal State */
  const [previewModalOpen,setPreviewModalOpen]=useState(false);

  /* Saved Gmail Credentials */
  const [gmailCreds,setGmailCreds]=useState(()=>{
    try{
      const s=localStorage.getItem("vrpi_gmail_creds");
      return s?JSON.parse(s):{email:"vrpigroupoftechnology@gmail.com",password:"Vrpi_1234",displayName:"VR PI TECH SOLUTIONS HR",active:true};
    }catch(e){return {email:"vrpigroupoftechnology@gmail.com",password:"Vrpi_1234",displayName:"VR PI TECH SOLUTIONS HR",active:true};}
  });
  const [gmailModalOpen,setGmailModalOpen]=useState(false);

  /* Saved Teams Credentials */
  const [teamsCreds,setTeamsCreds]=useState(()=>{
    try{
      const s=localStorage.getItem("vrpi_teams_creds");
      return s?JSON.parse(s):{email:"hr@vrpigroup.co.in",meetingLink:"https://teams.microsoft.com/",displayName:"VR PI Interview Panel",active:true};
    }catch(e){return {email:"hr@vrpigroup.co.in",meetingLink:"https://teams.microsoft.com/",displayName:"VR PI Interview Panel",active:true};}
  });
  const [teamsModalOpen,setTeamsModalOpen]=useState(false);

  const template=TEMPLATES.find(t=>t.id===templateId)||TEMPLATES[0];
  const selectedRecord=records.find(r=>r.key===selected);

  async function refresh(){
    setLoading(true);
    try{
      const result=await getRecords();
      setRecords(result);
      setSelected(old=>result.some(r=>r.key===old)?old:(result[0]?.key||""));
      setError("");
      setLastSync(new Date().toLocaleTimeString("en-IN"));
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  }

  useEffect(()=>{
    refresh();
    const timer=setInterval(refresh,30000);
    return()=>clearInterval(timer);
  },[]);

  const activeData=useMemo(()=>{
    if(manual)return form;
    if(selectedRecord){
      return {
        ...form,
        ...selectedRecord,
        name:selectedRecord.name||form.name,
        domain:selectedRecord.domain||form.domain,
        mode:selectedRecord.mode||form.mode,
        joining:selectedRecord.joining||form.joining,
        duration:selectedRecord.duration||form.duration,
        completionDate:selectedRecord.completionDate||form.completionDate,
        appointmentDate:selectedRecord.appointmentDate||form.appointmentDate,
        eventName:selectedRecord.eventName||form.eventName,
        participationDate:selectedRecord.participationDate||form.participationDate,
        role:selectedRecord.role||form.role
      };
    }
    return form;
  },[manual,form,selectedRecord]);

  const filtered=useMemo(()=>{
    const q=search.toLowerCase();
    return records.filter(r=>[r.aid,r.name,r.email,r.domain].join(" ").toLowerCase().includes(q));
  },[records,search]);

  const sent=records.filter(r=>/sent|success|delivered/i.test(r.status)).length;
  const failed=records.filter(r=>/failed|error/i.test(r.status)).length;
  const pending=records.length-sent-failed;

  function changeField(e){
    const {name}=e.target;
    let value=e.target.value;
    if(name==="name"||name==="role"||name==="eventName")value=value.replace(/[^a-zA-Z0-9\s&'.,-]/g,"");
    setForm(old=>({...old,[name]:value}));
  }

  function saveGmailCreds(c){
    setGmailCreds(c);
    try{localStorage.setItem("vrpi_gmail_creds",JSON.stringify(c));}catch(e){}
  }

  function saveTeamsCreds(c){
    setTeamsCreds(c);
    try{localStorage.setItem("vrpi_teams_creds",JSON.stringify(c));}catch(e){}
  }

  function openCurrentGmailAccount(){
    const target = gmailCreds.email || "vrpigroupoftechnology@gmail.com";

          <button className="btn dark" onClick={openCurrentGmailAccount}>
            ✉ Open Gmail ↗

        <b>Google Sheets Note:</b> {error}
      </div>}

      <section className="stats">
        {[
          ["TOTAL APPLICANTS",records.length,"Synchronized sheet records","#1e3a5f"],
          ["LETTERS SENT",sent,"Recorded sent status","#15803d"],

      {/* Candidate Records Table */}

              <td>{r.phone||"—"}</td>
              <td>{r.domain||"—"}</td>
              <td><span className={"status "+(/sent|success/i.test(r.status)?"sent":/failed/i.test(r.status)?"failed":"pending")}>{r.status}</span></td>
              <td>
                <button className="text-btn" onClick={()=>{
                  setManual(false);
                  setSelected(r.key);
                  setForm(prev=>({
                    ...prev,
                    name:r.name||prev.name,
                    domain:r.domain||prev.domain,
                    email:r.email||prev.email,
                    mode:r.mode||prev.mode,
                    joining:r.joining||prev.joining,
                    duration:r.duration||prev.duration
                  }));
                }}>Select Candidate ↗</button>
              </td>
            </tr>)}</tbody>
          </table>}
        </div>
      </section>

      {/* Live Studio Layout */}
      <div className="studio-grid">
        <section className="panel" style={{marginBottom:0}}>
          <div className="kicker"><span style={{color:"#059669"}}>● Real-Time Studio</span></div>
          <h2>Document Customizer</h2>
          <p className="desc">Choose a template. Enter details or select a candidate to customize.</p>

          <div className="mode-switch">
            <button className={!manual?"active":""} onClick={()=>setManual(false)}>Use Google Sheet Record</button>
            <button className={manual?"active":""} onClick={()=>setManual(true)}>Enter Details Manually</button>
          </div>

          <div className="template-pills">
            {TEMPLATES.map(t=><button key={t.id} className={templateId===t.id?"active":""} onClick={()=>setTemplateId(t.id)}>{t.name}</button>)}
          </div>

          {!manual&&<div className="form-box" style={{marginTop:0,marginBottom:12}}>
            <div className="field">
              <label>SELECT APPLICANT FROM SPREADSHEET</label>
              <select value={selected} onChange={e=>setSelected(e.target.value)}>
                <option value="">Choose candidate...</option>
                {records.map(r=><option key={r.key} value={r.key}>{r.name} — {r.domain||"No Domain"}</option>)}
              </select>
            </div>
          </div>}

          <div className="form-box" style={{marginTop:0}}>
            <div className="kicker">{template.name.toUpperCase()} FIELDS</div>
            <div className="grid">
              {template.fields.map(key=><div className="field" key={key}>
                <label>{LABELS[key].toUpperCase()}{key==="name"?" *":""}</label>
                {key==="domain"?
                  <select name={key} value={activeData[key]||""} onChange={changeField}>
                    <option value="">Select domain</option>
                    {DOMAINS.map(x=><option key={x} value={x}>{x}</option>)}
                  </select>
                :key==="mode"?
                  <select name={key} value={activeData[key]||""} onChange={changeField}>
                    <option value="">Select mode</option>
                    {MODES.map(x=><option key={x} value={x}>{x}</option>)}
                  </select>
                :key==="duration"?
                  <select name={key} value={activeData[key]||""} onChange={changeField}>
                    <option value="">Select duration</option>
                    {DURATIONS.map(x=><option key={x} value={x}>{x}</option>)}
                  </select>
                :["joining","completionDate","appointmentDate","participationDate"].includes(key)?
                  <input type="date" name={key} value={activeData[key]||""} onChange={changeField}/>
                :<input type="text" name={key} value={activeData[key]||""} onChange={changeField} placeholder={"Enter "+LABELS[key].toLowerCase()} autoComplete="off"/>
                }
              </div>)}
            </div>
          </div>

          {/* Clean Candidate Action: Single Professional Preview Button */}
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:18}}>
            <button className="btn orange" style={{padding:"12px 24px",fontSize:12}} onClick={()=>setPreviewModalOpen(true)}>
              Preview Document →
            </button>
          </div>
        </section>

        {/* Live Preview Side Panel */}
        <div className="preview-column">
          <div className="preview-topbar">
            <div className="sync-badge">
              <span className="sync-dot"></span>
              <span>Live Preview • Instant Sync</span>
            </div>
            <div className="preview-controls">
              <span style={{fontSize:9.5,color:"#94a3b8"}}>Scale:</span>
              <button className="preview-scale-btn" onClick={()=>setPreviewScale(s=>Math.max(0.35,+(s-0.05).toFixed(2)))}>-</button>
              <span style={{fontSize:9.5,fontWeight:700,minWidth:30,textAlign:"center"}}>{Math.round(previewScale*100)}%</span>
              <button className="preview-scale-btn" onClick={()=>setPreviewScale(s=>Math.min(1.0,+(s+0.05).toFixed(2)))}>+</button>
              <button className="btn orange" style={{padding:"5px 10px",fontSize:9.5}} onClick={()=>setPreviewModalOpen(true)}>
                Full Preview ↗
              </button>
            </div>
          </div>

          <div className="preview-stage">
            <div
              className="preview-scaled-wrap"
              style={{
                transform:`scale(${previewScale})`,
                marginBottom:template.type==="participation"?-140:-280
              }}
            >
              <DocumentRenderer
                data={activeData}
                template={template}
                senderEmail={gmailCreds.email}
                displayName={gmailCreds.displayName}
              />
            </div>
          </div>
        </div>
      </div>

      <footer>
        <Logo style={{width:80,height:"auto",margin:"0 auto 6px"}}/>
        <b>{COMPANY}</b><br/>
        Wanaparthy, Telangana, India • {gmailCreds.email}<br/>
        <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website</a>
      </footer>

      {/* Full-Screen Document Preview Modal */}
      {previewModalOpen&&<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setPreviewModalOpen(false);}}>
        <div className="modal-container">
          <div className="modalbar">
            <strong>{template.name} • {activeData.name}</strong>
            <div className="modal-actions">
              <button className="btn orange" onClick={()=>window.print()}>
                🖨 Print / Save PDF
              </button>
              <button className="btn" onClick={()=>setPreviewModalOpen(false)}>
                Close ×
              </button>
            </div>
          </div>
          <div id="printTarget">
            <DocumentRenderer
              data={activeData}
              template={template}
              senderEmail={gmailCreds.email}
              displayName={gmailCreds.displayName}
            />
          </div>
        </div>
      </div>}

      {/* Gmail Modal */}
      <GmailModal
        open={gmailModalOpen}
        onClose={()=>setGmailModalOpen(false)}
        credentials={gmailCreds}
        onSave={saveGmailCreds}
      />

      {/* Microsoft Teams Modal */}
      <TeamsModal
        open={teamsModalOpen}
        onClose={()=>setTeamsModalOpen(false)}
        credentials={teamsCreds}
        onSave={saveTeamsCreds}
      />
    </main>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
