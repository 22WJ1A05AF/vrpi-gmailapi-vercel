/* SIX PROFESSIONAL TEMPLATES */

 {id:"offer",name:"Internship Offer Letter",group:"Internship",style:"offer",color:"#1e3a5f",desc:"Formal corporate offer with internship particulars and programme terms."},
 {id:"intern-completion",name:"Internship Completion Certificate",group:"Internship",style:"certificate",color:"#0d7377",desc:"Premium completion document with programme dates and domain."},
 {id:"training",name:"Industrial Training Appointment",group:"Training",style:"training",color:"#e94b17",desc:"Corporate appointment letter with structured training information."},
 {id:"training-completion",name:"Training Completion Certificate",group:"Training",style:"certificate",color:"#0d7377",desc:"Professional training completion recognition."},
 {id:"participation",name:"Participation Certificate",group:"Certification",style:"certificate",color:"#0d7377",desc:"Corporate programme participation certificate."},
 {id:"experience",name:"Experience Certificate",group:"Certification",style:"experience",color:"#1e3a5f",desc:"Formal professional experience record."}
];

/* ONLY FIELDS REQUIRED BY EACH TEMPLATE */
const TEMPLATE_FIELDS={
 offer:[
  {key:"name",label:"Candidate Full Name",required:true},
  {key:"domain",label:"Internship Domain",required:true},
  {key:"mode",label:"Programme Mode",type:"select",options:["Virtual / Remote","Hybrid","On-site"],required:true},

 ],
 "intern-completion":[

 ],
 training:[

 "training-completion":[

 participation:[

 ]
};

const TODAY=()=>new Date().toLocaleDateString("en-IN",{
 day:"2-digit",month:"long",year:"numeric"
});

const normal=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

function readCell(cell){
 if(!cell||cell.v===null||cell.v===undefined)return "";
 return String(cell.f??cell.v).trim();
}

/* Read actual Google Sheet through its built-in viewer endpoint */
function getSheetRows(){
 return new Promise((resolve,reject)=>{
  const callbackName="vrpiCallback"+Date.now();
  const script=document.createElement("script");
  let finished=false;

  const timeout=setTimeout(()=>{
   finish(new Error("Google Sheets timed out. Check the spreadsheet sharing setting."));
  },15000);

  function finish(error,result){
   if(finished)return;
   finished=true;
   clearTimeout(timeout);
   script.remove();
   try{delete window[callbackName]}catch(e){}
   if(error)reject(error);
   else resolve(result);
  }

  window[callbackName]=(response)=>{
   if(!response||!response.table){
    finish(new Error("Google Sheets did not return a readable table."));
    return;
   }
   if(response.status&&response.status!=="ok"){
    finish(new Error(response.errors?.[0]?.detailed_message||"Google Sheets access was denied."));
    return;
   }
   finish(null,response.table);
  };

  const tqx=encodeURIComponent(
   "out:json;responseHandler:"+callbackName+";reqId:0"
  );

  script.async=true;
  script.src=
   `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=${tqx}&_=${Date.now()}`;

  script.onerror=()=>finish(
   new Error("Google Sheets could not be reached. The sheet may be private or unavailable.")
  );

  document.head.appendChild(script);
 });
}

function tableToObjects(table){
 const cols=table.cols||[];
 return (table.rows||[]).map((row,index)=>{
  const obj={};
  cols.forEach((col,i)=>{
   const key=String(col.label||col.id||`Column ${i+1}`).trim();
   if(key)obj[key]=readCell(row.c?.[i]);
  });
  return obj;
 });
}

function findValue(row,names){
 const key=Object.keys(row||{}).find(k=>
  names.some(n=>normal(k)===normal(n))
 );
 return key?row[key]??"":"";
}

function mapCandidate(row,index){
 return {
  key:String(findValue(row,["Application ID","Application Id"])||`sheet-row-${index}`),
  source:"sheet",
  raw:row,
  name:findValue(row,["Full Name","Candidate Name","Name"]),
  domain:findValue(row,["Domain","Internship Domain","Training Domain","Track"]),
  mode:findValue(row,["Mode","Programme Mode","Training Mode","Work Mode"]),
  duration:findValue(row,["Duration","Programme Duration"]),
  startDate:findValue(row,["Start Date","Joining Date","Commencement Date"]),
  endDate:findValue(row,["End Date","Internship End Date"]),
  completionDate:findValue(row,["Completion Date"]),
  eventTitle:findValue(row,["Programme Name","Event Name","Event Title"]),
  participationDate:findValue(row,["Participation Date","Event Date"]),
  role:findValue(row,["Role","Designation","Job Title"]),
  status:findValue(row,["Letter Sent","Email Status","Application Status","Status"]),
  email:findValue(row,["Email Address","Email"]),
  phone:findValue(row,["WhatsApp / Phone","WhatsApp","Phone"]),
  aid:findValue(row,["Application ID","Application Id"]),
  timestamp:findValue(row,["Timestamp"]),
  pdf:findValue(row,["PDF Record","PDF Link"])
 };
}

function loadSheet(){
 return getSheetRows().then(table=>
  tableToObjects(table)
   .map(mapCandidate)
   .filter(c=>c.name||c.aid||c.email)
 );
}

   </h2>

   <p><b>Date:</b> {TODAY()}</p>
   <p><b>Trainee Name:</b> {c.name}</p>
   <p>Dear {c.name},</p>

   <p>We are pleased to welcome you to the <b>{c.domain}</b> training programme at <b>{COMPANY}</b>.</p>

   <p>The programme will be conducted in <b>{c.mode}</b> mode for <b>{c.duration}</b>, from <b>{c.startDate}</b> to <b>{c.endDate}</b>.</p>

   <div className="doc-section" style={{color:"#e94b17"}}>TRAINING PARTICULARS</div>
   <DetailsTable candidate={c} keys={["name","domain","mode","duration","startDate","endDate"]}/>

   <div style={{
    background:"#111827",
    color:"#e2e8f0",
    borderRadius:7,
    padding:17,
    fontSize:10.5,
    lineHeight:1.9,
    marginTop:18
   }}>
    <b style={{color:"#f97316"}}>PROFESSIONAL EXPECTATIONS</b><br/>
    Maintain professional conduct, participate in assigned learning activities, complete deliverables within communicated timelines and follow company confidentiality guidelines.
   </div>

   <div style={{marginTop:"auto",paddingTop:25}}>
    <Signoff department="Industrial Training Department" color="#e94b17"/>
   </div>
  </div>
  <DocFooter color="#191928"/>
 </div>;
}

/* COMPLETION / PARTICIPATION / EXPERIENCE CERTIFICATES */

function CertificateDocument({c,t}){
 const verified= c.source==="sheet" &&
  /verified|approved|completed|issued/i.test(
   String(c.status||c.completionStatus||c.participationStatus||"")
  );

 const isExperience=t.id==="experience";

 let statement;
 if(t.id==="intern-completion"||t.id==="training-completion"){
  statement=`This document recognizes the successful completion of the ${c.domain} programme at ${COMPANY}, subject to confirmation of the candidate's completion record.`;
 }else if(t.id==="participation"){
  statement=`This document recognizes the recorded participation of ${c.name} in ${c.eventTitle||c.domain||"the programme"} organized by ${COMPANY}, subject to attendance verification.`;
 }else{
  statement=`This document records the professional engagement of ${c.name} in the role of ${c.role} within the ${c.domain} department at ${COMPANY}, subject to employment record verification.`;
 }

 return <div className="a4">
  <div style={{padding:"24px 34px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"2px solid #e7edf1"}}>
   <Logo/>
   <div className="doc-info">
    <strong>{COMPANY}</strong><br/>
    {LOCATION}<br/>
    {EMAIL}<br/>
    {WEBSITE}
   </div>
  </div>

  <div style={{height:4,background:"#0d7377"}}/>

  {(!verified||c.source==="manual")&&
   <div className="draft">DRAFT PREVIEW • ORGANIZATIONAL VERIFICATION REQUIRED</div>}

  <div className="doc-content" style={{padding:"34px 43px"}}>
   <div style={{fontSize:10,color:"#0d7377",fontWeight:800,letterSpacing:3}}>
    DATE: {TODAY()}
   </div>

   <div style={{
    border:"2px solid #0d7377",
    padding:17,
    marginTop:20,
    flex:1,
    display:"flex",
    flexDirection:"column"
   }}>
    <div style={{
     border:"1px solid #b7dddd",
     padding:"30px 25px",
     textAlign:"center",
     flex:1,
     display:"flex",
     flexDirection:"column",
     justifyContent:"center"
    }}>
     <Logo style={{width:140,height:70,margin:"0 auto 20px"}}/>

     <div style={{
      fontSize:10,
      color:"#0d7377",
      fontWeight:800,
      letterSpacing:3
     }}>{COMPANY.toUpperCase()}</div>

     <h2 style={{
      fontSize:23,
      color:"#0d7377",
      margin:"25px 0"
     }}>{t.name.toUpperCase()}</h2>

     <p style={{textAlign:"center",fontSize:12}}>This document is issued for</p>

     <div style={{
      fontFamily:"Playfair Display,serif",
      fontSize:27,
      color:"#1e3a5f",
      margin:"17px 0"
     }}>{c.name}</div>

     <p style={{
      fontSize:11,
      lineHeight:2,
      textAlign:"center",
      color:"#53647a"
     }}>{statement}</p>

     <div style={{
      borderTop:"1px solid #dce7e7",
      marginTop:25,
      paddingTop:17
     }}>
      <DetailsTable candidate={c} keys={
       isExperience
        ?["role","domain","startDate","endDate"]
        :t.id==="participation"
         ?["eventTitle","domain","startDate","endDate"]
         :["domain","startDate","endDate","duration","completionDate"]
      }/>
     </div>

     <div style={{
      marginTop:25,
      fontSize:10,
      color:"#687891",
      lineHeight:1.8
     }}>
      {LOCATION}<br/>
      {EMAIL}<br/>
      {WEBSITE}
     </div>
    </div>
   </div>

   <Signoff department={isExperience?"Human Resources Department":"Talent Excellence Division"} color="#0d7377"/>
  </div>

  <DocFooter color="#0d7377"/>
 </div>;
}

function RenderDocument({candidate,template}){
 if(template.style==="offer")return <OfferDocument c={candidate} t={template}/>;
 if(template.style==="training")return <TrainingDocument c={candidate} t={template}/>;
 return <CertificateDocument c={candidate} t={template}/>;
}

/* MAIN REACT APPLICATION */

function App(){
 const [records,setRecords]=useState([]);
 const [selectedKey,setSelectedKey]=useState("");
 const [templateId,setTemplateId]=useState("offer");
 const [source,setSource]=useState("sheet");
 const [manual,setManual]=useState({});
 const [search,setSearch]=useState("");
 const [loading,setLoading]=useState(true);
 const [error,setError]=useState("");
 const [notice,setNotice]=useState("");
 const [lastSync,setLastSync]=useState("");
 const [preview,setPreview]=useState(false);

 const template=TEMPLATES.find(t=>t.id===templateId)||TEMPLATES[0];
 const fields=TEMPLATE_FIELDS[templateId]||[];

 const refresh=useCallback(async()=>{
  setLoading(true);
  setError("");
  setNotice("");

  try{
   const rows=await loadSheet();
   setRecords(rows);
   setSelectedKey(old=>
    rows.some(c=>c.key===old)?old:(rows[0]?.key||"")
   );
   setLastSync(new Date().toLocaleTimeString("en-IN"));
   setNotice(`${rows.length} live records synchronized from Google Sheets.`);
  }catch(e){
   setRecords([]);
   setSelectedKey("");
   setError(e.message||"Google Sheets connection failed.");
  }finally{
   setLoading(false);
  }
 },[]);

 useEffect(()=>{
  refresh();
  const timer=setInterval(refresh,30000);
  return()=>clearInterval(timer);
 },[refresh]);

 const filtered=useMemo(()=>{
  const q=search.trim().toLowerCase();
  if(!q)return records;
  return records.filter(c=>
   Object.values(c.raw||{}).join(" ").toLowerCase().includes(q)||
   [c.name,c.aid,c.email,c.phone,c.domain].join(" ").toLowerCase().includes(q)
  );
 },[records,search]);

 const sheetCandidate=records.find(c=>c.key===selectedKey)||null;

 const manualCandidate={
  ...manual,
  source:"manual",
  name:manual.name||"",
  domain:manual.domain||"",
  mode:manual.mode||"",
  duration:manual.duration||"",
  startDate:manual.startDate||"",
  endDate:manual.endDate||""
 };

 const candidate=source==="manual"?manualCandidate:sheetCandidate;

 const requiredMissing=fields.some(f=>
  f.required&&!String(manual[f.key]||"").trim()
 );

 const canPreview=source==="sheet"
  ?Boolean(sheetCandidate)
  :!requiredMissing;

 const sent=records.filter(c=>/sent/i.test(c.status||"")).length;
 const pending=records.filter(c=>/pending/i.test(c.status||"")).length;
 const failed=records.filter(c=>/failed|fail/i.test(c.status||"")).length;

 function updateManual(key,value){
  setManual(old=>({...old,[key]:value}));
 }

 function chooseTemplate(id){
  setTemplateId(id);
  setManual({});
  setPreview(false);
 }

 function openPreview(){
  if(canPreview)setPreview(true);
 }

 return <main className="app">

  {/* HEADER */}

  <header className="header no-print">
   <a className="brand" href={WEBSITE} target="_blank" rel="noreferrer">
    <CompanyLogo className="logo"/>
   </a>

   <div className="actions">
    <a className="btn" href={WEBSITE} target="_blank" rel="noreferrer">Company Website ↗</a>
    <a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Google Sheet ↗</a>
    <a className="btn btn-dark" href={GMAIL_URL} target="_blank" rel="noreferrer">Company Gmail ↗</a>
    <button className="btn btn-orange" onClick={refresh} disabled={loading}>
     {loading?"Syncing...":"↻ Refresh"}
    </button>
   </div>
  </header>

  {/* HERO */}

  <section className="hero no-print">
   <div className="eyebrow">VR PI GROUP • ENTERPRISE OPERATIONS SUITE</div>
   <h1>Enterprise Talent<br/>
    <span style={{color:"#1e3a5f"}}>Excellence Platform</span>
   </h1>
   <p>A unified enterprise solution for intelligent talent management, official documentation, professional certifications, and automated corporate communication.</p>
  </section>

  {/* CONNECTION STATUS */}

  {error&&<div className="alert alert-error no-print">
   <b>Google Sheets connection:</b> {error}
   <br/><br/>
   Direct sheet reading requires the spreadsheet to be link-viewable.
   A private sheet cannot be accessed by this HTML-only connection.
   Making a candidate spreadsheet public exposes its contents.
  </div>}

  {notice&&<div className="alert alert-success no-print">
   {notice} • Last sync: {lastSync}
  </div>}

  {/* STATISTICS */}

  <section className="stats no-print">
   {[
    ["TOTAL APPLICANTS",records.length,"Actual sheet records","#1e3a5f"],
    ["LETTERS ISSUED",sent,"Recorded sent status","#15803d"],
    ["PENDING ACTIONS",pending,"Recorded pending status","#b45309"],
    ["FAILED RECORDS",failed,"Recorded failed status","#dc2626"]
   ].map(([label,value,note,color])=>(
    <div className="stat" key={label}>
     <label>{label}</label>
     <strong style={{color}}>{value}</strong>
     <small>{note}</small>
    </div>
   ))}
  </section>

  {/* CANDIDATE TABLE */}

  <section className="panel no-print">
   <div className="section-head">
    <div>
     <div className="kicker">LIVE DATA MANAGEMENT • READ ONLY</div>
     <h2>Candidate Records</h2>
     <p className="description">
      Actual Google Sheet records • Automatic refresh every 30 seconds.
     </p>
    </div>

    <input className="search"
     value={search}
     onChange={e=>setSearch(e.target.value)}
     placeholder="Search name, email, application ID..."/>
   </div>

   <div className="table-wrap">
    {loading&&records.length===0?
     <div className="empty">Connecting to Google Sheets...</div>:
     filtered.length===0?
     <div className="empty">No actual records returned from the connected sheet.</div>:
     <table className="records">
      <thead><tr>
       <th>Application ID</th>
       <th>Candidate</th>
       <th>Email</th>
       <th>Phone</th>
       <th>Domain</th>
       <th>Status</th>
       <th>PDF Record</th>
       <th>Timestamp</th>
       <th>Action</th>
      </tr></thead>
      <tbody>
       {filtered.map(c=>{
        const s=String(c.status||"Not recorded");
        const cls=/sent/i.test(s)?"sent":/fail/i.test(s)?"failed":/pending/i.test(s)?"pending":"";
        return <tr key={c.key}>
         <td>{c.aid||"—"}</td>
         <td><b>{c.name||"—"}</b></td>
         <td>{c.email||"—"}</td>
         <td>{c.phone||"—"}</td>
         <td>{c.domain||"—"}</td>
         <td><span className={"status "+cls}>{s}</span></td>
         <td>{c.pdf||"—"}</td>
         <td>{c.timestamp||"—"}</td>
         <td>
          <button className="text-btn" onClick={()=>{
           setSource("sheet");
           setSelectedKey(c.key);
           setPreview(true);
          }}>Preview</button>
         </td>
        </tr>;
       })}
      </tbody>
     </table>
    }
   </div>
  </section>

  {/* DOCUMENT GENERATION */}

  <section className="panel no-print">
   <div className="kicker">OFFICIAL CORPORATE DOCUMENT LIBRARY</div>
   <h2>Professional Document Generation</h2>
   <p className="description">
    Select a real Google Sheet candidate or enter only the information
    required by your chosen template. Manual entries are temporary
    and are never written to the spreadsheet.
   </p>

   <div className="source-tabs">
    <button className={"source-tab "+(source==="sheet"?"active":"")}
     onClick={()=>setSource("sheet")}>
     Use Google Sheet Record
    </button>
    <button className={"source-tab "+(source==="manual"?"active":"")}
     onClick={()=>{
      setSource("manual");
      setManual({});
     }}>
     Enter Details Manually
    </button>
   </div>

   <div className="template-layout">
    <div className="field">
     <label>SELECT CANDIDATE</label>

     {source==="sheet"?
      <select value={selectedKey} onChange={e=>setSelectedKey(e.target.value)}>
       <option value="">Select real candidate</option>
       {records.map(c=>
        <option key={c.key} value={c.key}>
         {c.name||"Candidate"} — {c.aid||"No ID"}
        </option>
       )}
      </select>
      :
      <div className="alert alert-info">
       Manual mode is active. Fill in only the fields required
       for {template.name}.
      </div>
     }
    </div>

    <div className="field">
     <label>SELECT DOCUMENT TEMPLATE</label>
     <select value={templateId} onChange={e=>chooseTemplate(e.target.value)}>
      <optgroup label="Internship">
       {TEMPLATES.filter(t=>t.group==="Internship").map(t=>
        <option key={t.id} value={t.id}>{t.name}</option>
       )}
      </optgroup>
      <optgroup label="Training">
       {TEMPLATES.filter(t=>t.group==="Training").map(t=>
        <option key={t.id} value={t.id}>{t.name}</option>
       )}
      </optgroup>
      <optgroup label="Certification">
       {TEMPLATES.filter(t=>t.group==="Certification").map(t=>
        <option key={t.id} value={t.id}>{t.name}</option>
       )}
      </optgroup>
     </select>

     <div className="template-description">
      <span className="kicker" style={{color:template.color}}>VR PI • OFFICIAL DOCUMENT</span>
      <strong>{template.name}</strong>
      <p>{template.desc}</p>
      <div className="pills">
       <span className="pill">{template.group}</span>
       <span className="pill">A4 Portrait</span>
       <span className="pill">PDF Preview</span>
      </div>
     </div>
    </div>
   </div>

   {/* TEMPLATE-SPECIFIC MANUAL FIELDS */}

   {source==="manual"&&
    <div className="manual-box">
     <div className="kicker">TEMPLATE-SPECIFIC DETAILS</div>
     <h2>{template.name}</h2>
     <p className="description">
      Only the details required for this document are displayed.
      Enter the information to generate a temporary preview.
     </p>

     <div className="form-grid">
      {fields.map(field=>(
       <div className="form-field" key={field.key}>
        <label>
         {field.label}{field.required?<span style={{color:"#e94b17"}}> *</span>:""}
        </label>

        {field.type==="select"?
         <select value={manual[field.key]||""}
          onChange={e=>updateManual(field.key,e.target.value)}>
          <option value="">Select {field.label}</option>
          {field.options.map(option=>
           <option key={option} value={option}>{option}</option>
          )}
         </select>
         :
         <input
          type={field.type||"text"}
          value={manual[field.key]||""}
          onChange={e=>updateManual(field.key,e.target.value)}
          placeholder={"Enter "+field.label.toLowerCase()}
         />
        }
       </div>
      ))}
     </div>

     <div className="alert alert-info">
      These values are kept only in React's temporary page state.
      They are not submitted to Google Sheets or stored in a database.
     </div>

     <div className="form-actions">
      <button className="btn" onClick={()=>setManual({})}>Clear Details</button>
      <button className="btn btn-orange"
       disabled={!canPreview}
       onClick={()=>setPreview(true)}>
       Preview Document →
      </button>
     </div>
    </div>
   }

   {source==="sheet"&&
    <div className="section-head" style={{marginTop:25}}>
     <span className="description">
      {sheetCandidate
       ?`Selected: ${sheetCandidate.name} • ${sheetCandidate.aid||""}`
       :"Select a candidate from the actual sheet records."}
     </span>
     <button className="btn btn-orange"
      disabled={!canPreview}
      onClick={()=>setPreview(true)}>
      Preview Selected Document →
     </button>
    </div>
   }

  </section>

  {/* FOOTER */}

  <footer className="footer no-print">
   <CompanyLogo className="footer-logo"/>
   <b>{COMPANY}</b><br/>
   {LOCATION}<br/>
   {EMAIL}<br/>
   <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a>
   <p>Enterprise Talent Excellence Platform</p>
  </footer>

  {/* A4 PREVIEW MODAL */}

  {preview&&candidate&&
   <div className="modal">
    <div className="modal-inner">
     <div className="modalbar no-print">
      <strong>{template.name} • {candidate.name}</strong>

      <div className="modal-actions">
       {source==="sheet"&&
        <select value={selectedKey} onChange={e=>setSelectedKey(e.target.value)}>
         {records.map(c=>
          <option key={c.key} value={c.key}>{c.name} — {c.aid||""}</option>
         )}
        </select>
       }

       <button className="btn btn-orange" onClick={()=>window.print()}>
        Print / Save A4 PDF
       </button>

       <button className="btn" onClick={()=>setPreview(false)}>
        Close ×
       </button>
      </div>
     </div>

     <div className="modal-tabs no-print">
      {TEMPLATES.map(t=>
       <button key={t.id}
        className={templateId===t.id?"active":""}
        onClick={()=>chooseTemplate(t.id)}>
        {t.name}
       </button>
      )}
     </div>

     <div id="printTarget">
      {template.style==="offer"&&
       <OfferDocument c={candidate} t={template}/>}

      {template.style==="training"&&
       <TrainingDocument c={candidate} t={template}/>}

      {template.style==="certificate"&&
       <CertificateDocument c={candidate} t={template}/>}
     </div>
    </div>
   </div>
  }
 </main>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
