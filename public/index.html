<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR PI Group &bull; Talent Acquisition &amp; Offer Dispatch</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .bg-grid { background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px); background-size: 24px 24px; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 bg-grid min-h-screen selection:bg-orange-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // 1. PASTE YOUR GOOGLE SHEET LINK OR SPREADSHEET ID DIRECTLY HERE:
    // =========================================================================
    const DEFAULT_SPREADSHEET = "https://docs.google.com/spreadsheets/d/1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU/edit?gid=0#gid=0";

    // Helper: Extracts clean Spreadsheet ID whether user pastes the full URL or bare ID
    function extractSpreadsheetId(input) {
      if (!input || input === "YOUR_SPREADSHEET_URL_OR_ID_HERE") return "";
      const match = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) return match[1];
      return input.trim();
    }

    // =========================================================================
    // 2. ONLY REQUIRED OFFICIAL VR PI GROUP TEMPLATES (NO DUMMY DETAILS)
    // =========================================================================
    const COMPANY_TEMPLATES = [
      {
        id: "internship_offer",
        title: "Internship Offer Letter",
        docType: "INTERNSHIP OFFER LETTER",
        tag: "Official Standard",
        duration: "4 weeks",
        mode: "Virtual / Remote",
        division: "Technical Engineering & Mentorship Cell",
        purpose: "Formal offer of engagement for selected candidates with verified domain track and Acceptance signature block."
      },
      {
        id: "training_offer",
        title: "Internship Training Letter",
        docType: "INTERNSHIP TRAINING & OFFER LETTER",
        tag: "Training Cohort",
        duration: "6 weeks",
        mode: "Virtual / Remote",
        division: "Technical Skill Accelerator Cell",
        purpose: "Formal onboarding letter for candidates entering guided industrial training and capstone project modules."
      },
      {
        id: "completion_cert",
        title: "Internship Completion Certificate",
        docType: "CERTIFICATE OF INTERNSHIP COMPLETION",
        tag: "Post-Evaluation",
        duration: "Upon Project Evaluation",
        mode: "Certified",
        division: "HR & Evaluation Board",
        purpose: "Official verification certificate awarded upon milestone completion and mentor review."
      }
    ];

    function App() {
      const [sheetInput, setSheetInput] = useState(
        localStorage.getItem('vrpi_sheet_url') || DEFAULT_SPREADSHEET
      );

      // Real Candidate Data & Loading
      const [candidates, setCandidates] = useState([]);
      const [loadingSheet, setLoadingSheet] = useState(false);
      const [sheetError, setSheetError] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");

      // Template Selection & Preview State
      const [selectedTemplateId, setSelectedTemplateId] = useState("internship_offer");
      const [selectedCandidate, setSelectedCandidate] = useState(null);
      const [previewOpen, setPreviewOpen] = useState(false);

      // Gmail API Sending Action
      const [sendingEmail, setSendingEmail] = useState(false);
      const [dispatchResult, setDispatchResult] = useState(null);

      // --- Read Real Google Sheet Directly ---
      const loadSheetData = async (rawInput = sheetInput) => {
        const cleanId = extractSpreadsheetId(rawInput);
        if (!cleanId) {
          setSheetError("Please link your Google Sheet URL or Spreadsheet ID.");
          return;
        }

        setLoadingSheet(true);
        setSheetError(null);
        try {
          const url = `https://docs.google.com/spreadsheets/d/${cleanId}/gviz/tq?tqx=out:json`;
          const res = await fetch(url);
          if (!res.ok) {
            throw new Error("Could not fetch sheet. Ensure General Access in Google Sheet is 'Anyone with the link can view'.");
          }
          const text = await res.text();
          const rawJson = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
          const data = JSON.parse(rawJson);

          const cols = (data.table.cols || []).map(c => (c ? (c.label || "").trim().toLowerCase() : ""));
          const rows = data.table.rows || [];

          const findCol = (kw) => cols.findIndex(c => c.includes(kw));
          const idxAid = findCol("application") !== -1 ? findCol("application") : 1;
          const idxName = findCol("name") !== -1 ? findCol("name") : 2;
          const idxEmail = findCol("email") !== -1 ? findCol("email") : 3;
          const idxDomain = findCol("domain") !== -1 ? findCol("domain") : 7;
          const idxSent = findCol("letter sent") !== -1 ? findCol("letter sent") : 17;
          const idxPdf = 18;
          const idxUpdated = 19;
          const idxNotes = 20;

          const parsed = rows.map((r, i) => {
            const getVal = (idx) => (r.c && r.c[idx] && r.c[idx].v !== null ? String(r.c[idx].v).trim() : "");
            const name = getVal(idxName);
            const email = getVal(idxEmail);
            if (!name && !email) return null;

            return {
              rowIndex: i + 2,
              aid: getVal(idxAid) || `VRPI-INT-${i + 1}`,
              name: name || "Candidate",
              email: email,
              domain: getVal(idxDomain) || "Full Stack Web Development",
              status: (getVal(idxSent) || "PENDING").toUpperCase(),
              pdfLink: getVal(idxPdf) || "",
              lastUpdated: getVal(idxUpdated) || "Pending Sync",
              notes: getVal(idxNotes) || "Awaiting processing"
            };
          }).filter(Boolean);

          setCandidates(parsed);
          if (parsed.length > 0 && !selectedCandidate) {
            setSelectedCandidate(parsed[0]);
          }
        } catch (err) {
          setSheetError(err.message);
        } finally {
          setLoadingSheet(false);
        }
      };

      useEffect(() => {
        if (extractSpreadsheetId(sheetInput)) {
          loadSheetData(sheetInput);
        }
      }, []);

      const handleUpdateSheet = () => {
        const input = prompt("Paste your Google Sheet URL (or Spreadsheet ID):", sheetInput);
        if (input) {
          setSheetInput(input);
          localStorage.setItem('vrpi_sheet_url', input);
          loadSheetData(input);
        }
      };

      // Real Analytics
      const stats = useMemo(() => {
        const total = candidates.length;
        const sent = candidates.filter(c => c.status === "SENT" || c.status.includes("DELIVERED")).length;
        const pending = candidates.filter(c => c.status === "PENDING" || !c.status).length;
        const failed = candidates.filter(c => c.status === "FAILED").length;
        return { total, sent, pending, failed };
      }, [candidates]);

      const filteredCandidates = useMemo(() => {
        return candidates.filter(c =>
          c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          c.aid.toLowerCase().includes(searchQuery.toLowerCase()) ||
          c.email.toLowerCase().includes(searchQuery.toLowerCase()) ||
          c.domain.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }, [candidates, searchQuery]);

      // --- Gmail API Connection: Send Emails to Pending Candidates ---
      const handleSendViaGmail = async () => {
        setSendingEmail(true);
        setDispatchResult("Connecting to Gmail API (vrpigroupoftechnology@gmail.com)...");
        try {
          const res = await fetch('/api/process', { method: 'GET' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Gmail dispatch response notice.");
          setDispatchResult(`Dispatched via Gmail API! Processed: ${data.processed ?? 0} applications.`);
          setTimeout(() => loadSheetData(sheetInput), 1500);
        } catch (err) {
          setDispatchResult(`Gmail API Notice: ${err.message}`);
          setTimeout(() => loadSheetData(sheetInput), 1500);
        } finally {
          setSendingEmail(false);
        }
      };

      const currentTemplate = COMPANY_TEMPLATES.find(t => t.id === selectedTemplateId) || COMPANY_TEMPLATES[0];

      return (
        <div className="max-w-6xl mx-auto px-4 py-8 sm:py-12">
          
          {/* Header */}
          <header className="flex flex-col sm:flex-row sm:items-center justify-between pb-6 mb-8 border-b border-slate-200/90 gap-4">
            <div className="flex items-center gap-3.5">
              <div className="w-11 h-11 rounded-2xl bg-[#1A365D] flex items-center justify-center font-extrabold text-white text-base shadow-sm">
                VR
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-base font-bold text-slate-900 tracking-tight">VR PI Group of Companies</h1>
                  <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-orange-50 text-orange-600 border border-orange-200">
                    Live Operations
                  </span>
                </div>
                <p className="text-xs text-slate-500 font-medium">Talent Acquisition &bull; Gmail API Engine &bull; Document Automation</p>
              </div>
            </div>

            {/* Google Sheet & Gmail Connection Status */}
            <div className="flex items-center gap-2.5 flex-wrap">
              <button 
                onClick={handleUpdateSheet}
                className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white border border-slate-200 hover:border-emerald-500 text-xs font-semibold text-slate-700 hover:text-emerald-700 shadow-sm transition-all cursor-pointer"
              >
                <svg className="w-4 h-4 text-emerald-600" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/></svg>
                <span>{extractSpreadsheetId(sheetInput) ? "Google Sheet Linked" : "Link Google Sheet URL"}</span>
              </button>

              <div className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Gmail API Connected</span>
              </div>
            </div>
          </header>

          {/* Real Analytics Grid */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
            <div className="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm">
              <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Total Applicants</span>
              <p className="text-2xl font-extrabold text-slate-900 mt-1">{stats.total}</p>
              <span className="text-[11px] text-slate-500 font-medium">Actual Sheet Records</span>
            </div>
            <div className="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm">
              <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-600">Letters Issued</span>
              <p className="text-2xl font-extrabold text-emerald-600 mt-1">{stats.sent}</p>
              <span className="text-[11px] text-emerald-700/80 font-medium">Delivered to Inbox</span>
            </div>
            <div className="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm">
              <span className="text-[10px] font-bold uppercase tracking-wider text-amber-500">Pending Candidates</span>
              <p className="text-2xl font-extrabold text-amber-600 mt-1">{stats.pending}</p>
              <span className="text-[11px] text-slate-500 font-medium">Ready to dispatch</span>
            </div>
            <div className="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm">
              <span className="text-[10px] font-bold uppercase tracking-wider text-rose-500">Failed Retries</span>
              <p className="text-2xl font-extrabold text-rose-600 mt-1">{stats.failed}</p>
              <span className="text-[11px] text-slate-500 font-medium">Missing email / API errors</span>
            </div>
          </div>

          {/* Template Selection & Gmail Dispatch Bar */}
          <section className="bg-white border border-slate-200/90 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/40 mb-10">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
              
              {/* Document Template Selector */}
              <div className="flex-1">
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                  Official VR PI Document Templates
                </label>
                <div className="flex items-center gap-3">
                  <select
                    value={selectedTemplateId}
                    onChange={(e) => setSelectedTemplateId(e.target.value)}
                    className="flex-1 max-w-md bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-xs font-bold text-slate-900 focus:outline-none focus:border-orange-500 focus:bg-white focus:ring-2 focus:ring-orange-100 transition-all cursor-pointer"
                  >
                    {COMPANY_TEMPLATES.map(t => (
                      <option key={t.id} value={t.id}>
                        {t.title} &bull; ({t.tag})
                      </option>
                    ))}
                  </select>

                  <button
                    onClick={() => setPreviewOpen(true)}
                    className="px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center gap-2 cursor-pointer transition-all shadow-sm flex-shrink-0"
                  >
                    <svg className="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    <span>View Official Letterhead</span>
                  </button>
                </div>
                <p className="text-[11px] text-slate-500 mt-2 font-medium">
                  {currentTemplate.purpose}
                </p>
              </div>

              {/* Only Gmail Connection Dispatch Button */}
              <div className="flex items-center gap-3">
                <button
                  onClick={handleSendViaGmail}
                  disabled={sendingEmail}
                  className="px-6 py-3.5 rounded-xl bg-[#EA4335] hover:bg-[#d93025] disabled:opacity-50 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-rose-500/20 transition-all cursor-pointer flex-shrink-0"
                >
                  <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                  <span>{sendingEmail ? "Connecting to Gmail API..." : "Send Offer Emails (Gmail API)"}</span>
                </button>
              </div>

            </div>

            {/* Notification logs */}
            {dispatchResult && (
              <div className="mt-4 p-3 bg-slate-900 text-slate-200 rounded-xl text-xs font-mono flex items-center justify-between">
                <span>{dispatchResult}</span>
                <button onClick={() => setDispatchResult(null)} className="text-slate-400 hover:text-white">&times;</button>
              </div>
            )}
            {sheetError && (
              <div className="mt-4 p-3.5 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs flex items-center justify-between">
                <span><strong>Sheet Notice:</strong> {sheetError}</span>
                <button onClick={handleUpdateSheet} className="px-3 py-1 bg-rose-600 text-white font-bold rounded-lg text-[11px] ml-3 cursor-pointer flex-shrink-0">
                  Update Sheet Link
                </button>
              </div>
            )}
          </section>

          {/* Real Candidates Table */}
          <section className="bg-white border border-slate-200/90 rounded-3xl p-6 sm:p-8 shadow-sm mb-12">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-6 mb-6 border-b border-slate-100 gap-4">
              <div>
                <h3 className="text-base font-bold text-slate-900">
                  Candidate Ledger &bull; Live Google Sheet
                </h3>
                <p className="text-xs text-slate-500 mt-0.5">
                  Real candidate applications loaded dynamically from your sheet.
                </p>
              </div>

              <div className="flex items-center gap-2">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search Ref ID, Candidate Name..."
                  className="bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-800 placeholder-slate-400 font-mono focus:outline-none focus:border-orange-500 focus:bg-white"
                />
              </div>
            </div>

            {/* Candidates Table */}
            <div className="overflow-x-auto">
              {filteredCandidates.length === 0 ? (
                <div className="text-center py-12 text-slate-400 text-xs">
                  {loadingSheet ? "Loading candidate rows from Google Sheets..." : "No candidates found. Link your Google Sheet above."}
                </div>
              ) : (
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-200 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                      <th className="pb-3 pr-4">Application ID</th>
                      <th className="pb-3 px-4">Candidate Name &amp; Email</th>
                      <th className="pb-3 px-4">Domain Track</th>
                      <th className="pb-3 px-4">Delivery Status (Col R)</th>
                      <th className="pb-3 px-4">PDF Attachment (Col S)</th>
                      <th className="pb-3 px-4">Timestamp (Col T)</th>
                      <th className="pb-3 pl-4 text-right">Letterhead</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 font-medium">
                    {filteredCandidates.map((c) => (
                      <tr key={c.aid} className="hover:bg-slate-50/80 transition-colors">
                        <td className="py-3.5 pr-4 font-mono font-bold text-slate-800">{c.aid}</td>
                        <td className="py-3.5 px-4">
                          <div className="font-bold text-slate-900">{c.name}</div>
                          <div className="text-[11px] text-slate-400 font-mono">{c.email}</div>
                        </td>
                        <td className="py-3.5 px-4 text-slate-700">{c.domain}</td>
                        <td className="py-3.5 px-4">
                          <span className={`inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${
                            c.status === "SENT" ? "bg-emerald-50 text-emerald-700 border-emerald-200" :
                            c.status === "FAILED" ? "bg-rose-50 text-rose-700 border-rose-200" :
                            "bg-amber-50 text-amber-700 border-amber-200"
                          }`}>
                            {c.status}
                          </span>
                        </td>
                        <td className="py-3.5 px-4 font-mono text-[11px] text-slate-600 truncate max-w-xs" title={c.pdfLink}>
                          {c.pdfLink || "Pending Generation"}
                        </td>
                        <td className="py-3.5 px-4 font-mono text-[10px] text-slate-500 whitespace-nowrap">
                          {c.lastUpdated}
                        </td>
                        <td className="py-3.5 pl-4 text-right">
                          <button
                            onClick={() => {
                              setSelectedCandidate(c);
                              setPreviewOpen(true);
                            }}
                            className="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 text-[11px] font-bold cursor-pointer"
                          >
                            Open Letter
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </section>

          {/* Official A4 Letterhead Modal (Exact Corporate Layout) */}
          {previewOpen && selectedCandidate && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 z-50">
              <div className="bg-white rounded-2xl max-w-3xl w-full p-6 sm:p-10 shadow-2xl border border-slate-300 max-h-[92vh] overflow-y-auto">
                
                {/* Modal Top Bar */}
                <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-200">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-orange-500"></span>
                    <span className="font-bold text-xs uppercase tracking-wider text-slate-700">
                      {currentTemplate.title} &bull; Candidate: {selectedCandidate.name}
                    </span>
                  </div>
                  <button
                    onClick={() => setPreviewOpen(false)}
                    className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-sm cursor-pointer"
                  >
                    &times;
                  </button>
                </div>

                {/* Exact Corporate A4 Letterhead */}
                <div className="border border-slate-200 rounded-xl p-8 bg-white shadow-inner font-sans text-slate-800">
                  
                  {/* Top Letterhead */}
                  <div className="flex justify-between items-start pb-2">
                    <div>
                      <h2 className="text-xl font-extrabold text-[#1A365D] tracking-wide">
                        VR PI GROUP OF COMPANIES
                      </h2>
                      <a href="https://thevrpigroup.com/about" target="_blank" className="text-xs text-[#2563eb] underline">
                        https://thevrpigroup.com/about
                      </a>
                    </div>
                    <div className="text-right text-xs">
                      <p className="font-bold text-slate-700">Date: {new Date().toLocaleDateString()}</p>
                      <p className="text-slate-500 font-mono">Ref: {selectedCandidate.aid}</p>
                    </div>
                  </div>

                  {/* Orange Accent Rule */}
                  <div className="h-[2px] bg-[#FF5722] my-3"></div>

                  <div className="text-center my-4">
                    <h3 className="text-sm font-bold text-[#FF5722] uppercase tracking-wider">
                      {currentTemplate.docType}
                    </h3>
                  </div>

                  {/* Recipient Details */}
                  <div className="text-xs space-y-1 mb-4 text-slate-700">
                    <p className="font-bold text-slate-800">To: {selectedCandidate.name}</p>
                    <p className="text-slate-500 font-mono">Email: {selectedCandidate.email}</p>
                    <p className="font-bold pt-2">Dear {selectedCandidate.name},</p>
                    <p className="text-slate-600 leading-relaxed pt-1">
                      We are delighted to extend this formal offer of engagement with VR PI Group of Companies. 
                      Based on your profile and technical evaluation, you have been selected for the {selectedCandidate.domain} track. 
                      We are confident that this opportunity will provide you with extensive hands-on industry exposure and mentorship.
                    </p>
                  </div>

                  {/* Specifications Table */}
                  <div className="my-4">
                    <p className="text-xs font-bold text-[#1A365D] mb-1.5 uppercase">Program Specifications</p>
                    <table className="w-full text-xs border border-slate-200">
                      <tbody>
                        <tr className="border-b border-slate-200">
                          <td className="w-1/3 bg-slate-50 font-bold p-2 text-slate-600 border-r border-slate-200">Candidate Name</td>
                          <td className="p-2 font-medium">{selectedCandidate.name}</td>
                        </tr>
                        <tr className="border-b border-slate-200">
                          <td className="bg-slate-50 font-bold p-2 text-slate-600 border-r border-slate-200">Application ID</td>
                          <td className="p-2 font-mono font-bold text-slate-800">{selectedCandidate.aid}</td>
                        </tr>
                        <tr className="border-b border-slate-200">
                          <td className="bg-slate-50 font-bold p-2 text-slate-600 border-r border-slate-200">Domain Track</td>
                          <td className="p-2 font-bold text-slate-900">{selectedCandidate.domain}</td>
                        </tr>
                        <tr className="border-b border-slate-200">
                          <td className="bg-slate-50 font-bold p-2 text-slate-600 border-r border-slate-200">Commencement Date</td>

                        <tr className="border-b border-slate-200">
                          <td className="bg-slate-50 font-bold p-2 text-slate-600 border-r border-slate-200">Program Duration</td>

                        </tr>
                        <tr className="border-b border-slate-200">
                          <td className="bg-slate-50 font-bold p-2 text-slate-600 border-r border-slate-200">Preferred Mode</td>
                          <td className="p-2">{currentTemplate.mode}</td>
                        </tr>
                        <tr>
                          <td className="bg-slate-50 font-bold p-2 text-slate-600 border-r border-slate-200">Supervising Division</td>

                      </tbody>
                    </table>
                  </div>

                  {/* Terms */}
                  <div className="text-[11px] text-slate-600 space-y-1 my-3 leading-relaxed">

                    <p>1. <strong>Project Deliverables:</strong> You are required to complete all assigned technical modules and submit project milestones on schedule.</p>
                    <p>2. <strong>Confidentiality:</strong> You agree to uphold professional integrity and maintain strict confidentiality regarding all company workflows and source code.</p>
                    <p>3. <strong>Verification &amp; Certification:</strong> A verified Certificate of Internship will be awarded upon successful project evaluation and mentor approval.</p>
                    <p>4. <strong>Onboarding:</strong> Technical setup and project allocation details will be delivered to your registered email before the commencement date.</p>
                  </div>

                  {/* Dual Signatures */}
                  <div className="grid grid-cols-2 gap-4 mt-6 pt-3 text-xs">
                    <div className="border border-slate-200 rounded-lg p-3 bg-slate-50/50">
                      <p className="font-bold text-[#1A365D] mb-1">CANDIDATE ACCEPTANCE</p>
                      <p className="text-[10px] text-slate-500 mb-4">I accept the terms and conditions.</p>
                      <p className="text-[11px] text-slate-400">Signature: ______________________</p>
                      <p className="text-[11px] text-slate-400 mt-2">Date: _____ / _____ / 2026</p>
                    </div>

                    <div className="border border-slate-200 rounded-lg p-3 bg-slate-50/50">
                      <p className="font-bold text-[#1A365D] mb-1">FOR VR PI GROUP OF COMPANIES</p>
                      <p className="text-[11px] font-bold text-[#FF5722] mb-1">[DIGITALLY VERIFIED &amp; APPROVED]</p>
                      <p className="text-[10px] text-slate-500">HR &amp; Talent Acquisition Team</p>
                      <p className="text-[10px] text-slate-500 font-mono mt-2">Verification Code: {selectedCandidate.aid}</p>
                    </div>
                  </div>

                  <div className="border-t border-slate-200 mt-6 pt-2 text-center text-[10px] text-slate-400 italic">
                    VR PI Group of Companies - Official Document | Candidate Confidential
                  </div>
                </div>

                {/* Modal Footer Controls */}
                <div className="mt-6 flex justify-between items-center">
                  <span className="text-xs text-slate-400 font-mono">Attachment: {selectedCandidate.name.split(' ')[0]}_Offer_Letter.pdf</span>
                  <div className="flex gap-2">
                    <button
                      onClick={() => window.print()}
                      className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs cursor-pointer"
                    >
                      Print / Download PDF
                    </button>
                    <button
                      onClick={() => setPreviewOpen(false)}
                      className="px-5 py-2 rounded-xl bg-slate-900 text-white font-bold text-xs hover:bg-slate-800 cursor-pointer"
                    >
                      Close
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="text-center text-xs text-slate-400 pt-6 border-t border-slate-200/80">
            VR PI Group of Companies &bull; Autonomous Cloud Infrastructure &bull; Vercel Serverless Runtime
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
