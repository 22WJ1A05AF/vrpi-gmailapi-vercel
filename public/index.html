<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR PI Group - Autonomous Internship Onboarding</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes flow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .flow-line {
      position: relative;
      overflow: hidden;
    }
    .flow-line::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      animation: flow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Visual Workflow Node Component ---
    function WorkflowStep({ number, title, subtitle, badge, badgeColor, icon, isActive }) {
      return (
        <div className={`relative flex flex-col p-5 rounded-2xl border transition-all duration-300 ${
          isActive 
            ? 'bg-slate-900/90 border-indigo-500/50 shadow-xl shadow-indigo-500/10' 
            : 'bg-slate-900/50 border-slate-800 hover:border-slate-700'
        }`}>
          <div className="flex items-center justify-between mb-3">
            <span className="flex items-center justify-center w-7 h-7 rounded-lg bg-slate-800 text-xs font-bold text-slate-300 border border-slate-700">
              0{number}
            </span>
            <span className={`text-[11px] font-semibold px-2.5 py-0.5 rounded-full border ${badgeColor}`}>
              {badge}
            </span>
          </div>
          
          <div className="flex items-center gap-3 my-2">
            <div className="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/60 text-slate-200">
              {icon}
            </div>
            <div>
              <h3 className="text-sm font-bold text-white">{title}</h3>
              <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>
            </div>
          </div>
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      const [secret, setSecret] = useState(localStorage.getItem('vrpi_cron_secret') || '');
      const [loading, setLoading] = useState(false);
      const [response, setResponse] = useState(null);
      const [error, setError] = useState(null);
      const [lastRun, setLastRun] = useState(null);

      const triggerBatch = async (e) => {
        e.preventDefault();
        if (!secret.trim()) {
          alert('Please enter your CRON_SECRET');
          return;
        }

        localStorage.setItem('vrpi_cron_secret', secret.trim());
        setLoading(true);
        setError(null);
        setResponse(null);

        try {
          const res = await fetch('/api/process', {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${secret.trim()}` }
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || `HTTP ${res.status}: ${res.statusText}`);
          }
          setResponse(data);
          setLastRun(new Date().toLocaleTimeString());
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-8 sm:py-12">
          
          {/* Top Navbar */}
          <nav className="flex flex-col sm:flex-row sm:items-center justify-between pb-8 mb-8 border-b border-slate-800 gap-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-orange-500/20 font-black text-white text-lg">
                VR
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-lg font-bold text-white">VR PI Group of Companies</h1>
                  <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                    Automations
                  </span>
                </div>
                <p className="text-xs text-slate-400">Autonomous Internship Onboarding & Dispatch Engine</p>
              </div>
            </div>

            <div className="flex items-center gap-3 self-start sm:self-auto">
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-950/80 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Cron Running Every 1m
              </div>
            </div>
          </nav>

          {/* Hero Explainer Header */}
          <div className="text-center max-w-2xl mx-auto mb-12">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs text-slate-300 mb-3">
              <span>⚡</span> Connected with Google Sheets &bull; Gmail API &bull; Vercel Cloud
            </div>
            <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
              Zero-Touch Candidate Enrollment
            </h2>
            <p className="text-sm text-slate-400 mt-3 leading-relaxed">
              When students register, our cloud engine automatically reads rows, generates certified PDF offer letters with dual signatures, and delivers them directly to inboxes.
            </p>
          </div>

          {/* Visual Automation Pipeline (Inspired by Flow Diagram) */}
          <div className="mb-12">
            <div className="flex items-center justify-between mb-4 px-1">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                <svg className="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Live Automation Pipeline
              </h3>
              <span className="text-xs text-slate-500">Auto-triggers every 60 seconds</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 relative">
              
              {/* Step 1 */}
              <WorkflowStep
                number="1"
                title="Google Sheets"
                subtitle="Reads Internship_Students"
                badge="Data Source"
                badgeColor="bg-emerald-950/80 text-emerald-300 border-emerald-500/30"
                icon={(
                  <svg className="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                  </svg>
                )}
                isActive={true}
              />

              {/* Step 2 */}
              <WorkflowStep
                number="2"
                title="Cloud Trigger"
                subtitle="cron-job.org & Vercel"
                badge="60s Heartbeat"
                badgeColor="bg-indigo-950/80 text-indigo-300 border-indigo-500/30"
                icon={(
                  <svg className="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                )}
                isActive={true}
              />

              {/* Step 3 */}
              <WorkflowStep
                number="3"
                title="PDF Generator"
                subtitle="A4 Letterhead & Signatures"
                badge="Document Engine"
                badgeColor="bg-amber-950/80 text-amber-300 border-amber-500/30"
                icon={(
                  <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                  </svg>
                )}
                isActive={true}
              />

              {/* Step 4 */}
              <WorkflowStep
                number="4"
                title="Gmail API"
                subtitle="Bypasses spam filters"
                badge="OAuth 2.0 Direct"
                badgeColor="bg-rose-950/80 text-rose-300 border-rose-500/30"
                icon={(
                  <svg className="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                )}
                isActive={true}
              />

            </div>
          </div>

          {/* Interactive Manual Dispatch Console */}
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div className="absolute top-0 right-0 w-96 h-96 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>

            <div className="max-w-xl">
              <span className="text-xs font-semibold text-indigo-400 uppercase tracking-wider">
                Administrator Control Center
              </span>
              <h3 className="text-xl font-bold text-white mt-1">Manual Dispatch Trigger</h3>
              <p className="text-xs sm:text-sm text-slate-400 mt-1 mb-6">
                Need to process applications immediately? Paste your <code className="text-indigo-300 bg-slate-800 px-1.5 py-0.5 rounded">CRON_SECRET</code> below to run a manual sync cycle right now.
              </p>

              <form onSubmit={triggerBatch} className="flex flex-col sm:flex-row gap-3">
                <input
                  type="password"
                  value={secret}
                  onChange={(e) => setSecret(e.target.value)}
                  placeholder="Enter CRON_SECRET to execute..."
                  className="flex-1 bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-semibold text-sm px-6 py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2"
                >
                  {loading ? (
                    <>
                      <svg className="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                      </svg>
                      <span>Processing Sheet...</span>
                    </>
                  ) : (
                    <span>Execute Batch Now</span>
                  )}
                </button>
              </form>

              {lastRun && (
                <p className="text-xs text-slate-500 mt-3 flex items-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  Last manual execution completed at {lastRun}
                </p>
              )}
            </div>

            {/* Error Notification */}
            {error && (
              <div className="mt-6 p-4 bg-red-950/60 border border-red-500/40 rounded-xl text-xs text-red-300">
                <div className="font-bold mb-1">Execution Failed</div>
                <div>{error}</div>
              </div>
            )}

            {/* Execution Response Inspector */}
            {response && (
              <div className="mt-6 bg-slate-950 border border-slate-800 rounded-2xl p-5">
                <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800 text-xs">
                  <span className="font-bold text-slate-300 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    Execution Summary
                  </span>
                  <span className="font-mono text-emerald-400 font-semibold">
                    Candidates Processed: {response.processed ?? 0}
                  </span>
                </div>
                <pre className="text-[11px] font-mono text-slate-300 overflow-x-auto max-h-48 leading-relaxed">
                  {JSON.stringify(response, null, 2)}
                </pre>
              </div>
            )}
          </div>

          {/* Footer */}
          <footer className="mt-12 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
            VR PI Group of Companies &bull; Autonomous Cloud Infrastructure powered by Vercel & Gmail API
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
