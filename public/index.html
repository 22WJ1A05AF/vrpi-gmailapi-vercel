<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR PI Group &bull; Autonomous Internship Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .bg-grid { background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px); background-size: 24px 24px; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .float-slow { animation: float 5s ease-in-out infinite; }
    .float-fast { animation: float 4s ease-in-out infinite 1.5s; }
  </style>
</head>
<body class="bg-[#fafbfc] text-slate-800 bg-grid min-h-screen selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Floating Capability Pill (Matches Reference Diagram) ---
    function FeaturePill({ icon, title, subtitle, className = "" }) {
      return (
        <div className={`inline-flex items-center gap-3 bg-white/95 backdrop-blur-md border border-emerald-500/25 rounded-2xl px-4 py-2.5 shadow-lg shadow-emerald-500/5 ${className}`}>
          <div className="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center flex-shrink-0">
            {icon}
          </div>
          <div className="text-left">
            <span className="block text-[11px] font-extrabold tracking-wider text-emerald-800 uppercase">{title}</span>
            <span className="block text-[10px] text-slate-400 font-medium -mt-0.5">{subtitle}</span>
          </div>
        </div>
      );
    }

    // --- Workflow Stage Item ---
    function Stage({ num, title, detail, badge, tagColor }) {
      return (
        <div className="flex items-start gap-4 p-4 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:shadow-md transition-all">
          <div className="w-8 h-8 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-xs flex-shrink-0">
            {num}
          </div>
          <div className="flex-1">
            <div className="flex items-center justify-between">
              <h4 className="text-xs font-bold text-slate-900">{title}</h4>
              <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full border ${tagColor}`}>{badge}</span>
            </div>
            <p className="text-xs text-slate-500 mt-1 leading-relaxed">{detail}</p>
          </div>
        </div>
      );
    }

    function App() {
      const [time, setTime] = useState(new Date().toLocaleTimeString());
      useEffect(() => {
        const t = setInterval(() => setTime(new Date().toLocaleTimeString()), 1000);
        return () => clearInterval(t);
      }, []);

      return (
        <div className="max-w-5xl mx-auto px-4 py-8 sm:py-12">
          
          {/* Header */}
          <header className="flex items-center justify-between pb-6 mb-10 border-b border-slate-200/80">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-slate-900 flex items-center justify-center font-extrabold text-white text-base shadow-sm">
                VR
              </div>
              <div>
                <h1 className="text-base font-bold text-slate-900 leading-tight">VR PI Group of Companies</h1>
                <p className="text-xs text-slate-500 font-medium">Autonomous Talent Acquisition &amp; Onboarding</p>
              </div>
            </div>

            <div className="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-50 border border-emerald-200/70 text-emerald-700 text-xs font-semibold shadow-sm">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              24/7 Engine Active &bull; <span className="mono">{time}</span>
            </div>
          </header>

          {/* Hero Section */}
          <section className="text-center max-w-2xl mx-auto mb-12">
            <div className="inline-flex items-center gap-2.5 bg-white border border-slate-200/80 rounded-2xl px-4 py-2 shadow-sm mb-5">
              {/* Google Workspace Logos */}
              <div className="flex items-center gap-2 pr-2 border-r border-slate-200">
                <svg className="w-4 h-4" viewBox="0 0 87.3 78"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="M43.65 25 29.9 1.2c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/><path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l6.1 10.55z" fill="#ea4335"/><path d="M43.65 25h27.5c0-1.55-.4-3.1-1.2-4.5l-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3z" fill="#00832d"/><path d="M59.8 53H27.5L13.75 76.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25l16.15 28H87.3c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
                <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v.2L12 13l10-6.8V6z"/><path fill="#34A853" d="M2 7.7V18c0 1.1.9 2 2 2h2V10.4L2 7.7z"/><path fill="#EA4335" d="M20 20c1.1 0 2-.9 2-2V7.7l-4 2.7V20h2z"/><path fill="#FBBC05" d="M6 20h12v-9.6L12 15l-6-4.6V20z"/></svg>
                <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#0F9D58" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/><path fill="#87CEAC" d="M14 2v6h6L14 2z"/><path fill="#FFF" d="M8 13h8v2H8zm0 3h8v2H8zm0-6h4v2H8z"/></svg>
              </div>
              <span className="text-xs font-semibold text-slate-700">Google Workspace Cloud Pipeline</span>
            </div>

            <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
              Autonomous Student Enrollment &amp; Offer Dispatch
            </h2>
            <p className="text-sm text-slate-500 mt-3 leading-relaxed">
              Zero-touch cloud orchestration connecting Google Sheets candidate records, dynamic PDF letterhead synthesis, and official Gmail OAuth delivery.
            </p>

            {/* Floating Visual Badges */}
            <div className="flex flex-wrap items-center justify-center gap-3 pt-6">
              <FeaturePill
                className="float-slow"
                title="Students Onboarding"
                subtitle="Live Sheet Watcher"
                icon={<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>}
              />
              <FeaturePill
                className="float-fast"
                title="Send Offers Automatically"
                subtitle="Certified A4 Letterhead"
                icon={<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>}
              />
              <FeaturePill
                className="float-slow"
                title="Verified Inbox Placement"
                subtitle="Official Gmail API"
                icon={<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>}
              />
            </div>
          </section>

          {/* Central Workflow Card */}
          <section className="bg-white border border-slate-200/90 rounded-3xl shadow-xl shadow-slate-200/60 overflow-hidden mb-12">
            <div className="flex items-center justify-between px-5 py-3.5 bg-slate-100/70 border-b border-slate-200/80 text-xs">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-rose-400"></span>
                <span className="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <span className="font-semibold text-slate-600 pl-2">System Lifecycle Monitor</span>
              </div>
              <span className="mono text-[11px] text-slate-500">Every 60s Trigger</span>
            </div>

            <div className="p-6 sm:p-8 grid grid-cols-1 md:grid-cols-2 gap-4">
              <Stage 
                num="01" 
                title="Registration Entry" 
                detail="Student applies and is added to the Google Sheet with letter status blank." 
                badge="Internship_Students" 
                tagColor="bg-emerald-50 text-emerald-700 border-emerald-200" 
              />
              <Stage 
                num="02" 
                title="Serverless Evaluation" 
                detail="Cloud heartbeat pings Vercel API, locks pending row, and verifies track allocation." 
                badge="cron-job.org" 
                tagColor="bg-indigo-50 text-indigo-700 border-indigo-200" 
              />
              <Stage 
                num="03" 
                title="Document Generation" 
                detail="Compiles formal PDF with corporate letterhead, terms, and digital verification code." 
                badge="FormalOfferPDF" 
                tagColor="bg-amber-50 text-amber-700 border-amber-200" 
              />
              <Stage 
                num="04" 
                title="Direct Inbox Dispatch" 
                detail="Transmits via Gmail API (OAuth 2.0), delivers PDF, and marks sheet as SENT." 
                badge="Delivered" 
                tagColor="bg-rose-50 text-rose-700 border-rose-200" 
              />
            </div>

            {/* Live Metrics Row */}
            <div className="grid grid-cols-3 border-t border-slate-200/80 bg-slate-50/50 p-4 text-center divide-x divide-slate-200">
              <div>
                <p className="text-[11px] font-semibold text-slate-400 uppercase">Automation Cycle</p>
                <p className="text-base font-bold text-slate-800 mt-0.5">Every 1 Min</p>
              </div>
              <div>
                <p className="text-[11px] font-semibold text-slate-400 uppercase">Document Output</p>
                <p className="text-base font-bold text-slate-800 mt-0.5">A4 Certified PDF</p>
              </div>
              <div>
                <p className="text-[11px] font-semibold text-slate-400 uppercase">Delivery Protocol</p>
                <p className="text-base font-bold text-slate-800 mt-0.5">Gmail OAuth 2.0</p>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="text-center text-xs text-slate-400 pt-4 border-t border-slate-200/80">
            VR PI Group of Companies &bull; Autonomous Cloud Infrastructure &bull; Vercel Serverless Runtime
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
