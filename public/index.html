<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR PI Group - Autonomous Internship Onboarding</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .bg-grid-pattern {
      background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
    @keyframes pulse-subtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .floating-pill {
      animation: pulse-subtle 4s ease-in-out infinite;
    }
    .floating-pill-delay {
      animation: pulse-subtle 4s ease-in-out infinite 2s;
    }
  </style>
</head>
<body class="bg-slate-50/60 text-slate-800 min-h-screen bg-grid-pattern selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Floating Pill Badge (Exact match to illustration) ---
    function FeaturePill({ icon, title, subtitle, className = "" }) {
      return (
        <div className={`inline-flex items-center gap-3 bg-white/95 backdrop-blur border border-emerald-500/30 rounded-2xl px-4 py-2.5 shadow-lg shadow-emerald-500/5 ${className}`}>
          <div className="flex items-center justify-center w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-100 flex-shrink-0">
            {icon}
          </div>
          <div>
            <span className="block text-[11px] font-bold tracking-wider text-emerald-700 uppercase">
              {title}
            </span>
            {subtitle && (
              <span className="block text-[10px] text-slate-400 font-medium -mt-0.5">
                {subtitle}
              </span>
            )}
          </div>
        </div>
      );
    }

    // --- Main Dashboard Component ---
    function App() {
      const [secret, setSecret] = useState(localStorage.getItem('vrpi_cron_secret') || '');
      const [loading, setLoading] = useState(false);
      const [response, setResponse] = useState(null);
      const [error, setError] = useState(null);
      const [lastRun, setLastRun] = useState(null);

      const triggerBatch = async (e) => {
        e.preventDefault();
        if (!secret.trim()) {
          alert('Please enter your CRON_SECRET');
          return;
        }

        localStorage.setItem('vrpi_cron_secret', secret.trim());
        setLoading(true);
        setError(null);
        setResponse(null);

        try {
          const res = await fetch('/api/process', {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${secret.trim()}` }
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || `HTTP ${res.status}: ${res.statusText}`);
          }
          setResponse(data);
          setLastRun(new Date().toLocaleTimeString());
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-8 sm:py-12">
          
          {/* Top Bar Navigation */}
          <header className="flex flex-col sm:flex-row sm:items-center justify-between pb-6 mb-8 border-b border-slate-200/80 gap-4">
            <div className="flex items-center gap-3.5">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-slate-900 to-slate-700 flex items-center justify-center shadow-md font-extrabold text-white text-base">
                VR
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-base font-bold text-slate-900 tracking-tight">VR PI Group of Companies</h1>
                  <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
                    Enterprise
                  </span>
                </div>
                <p className="text-xs text-slate-500 font-medium">Internship Offer Letter Cloud Automation</p>
              </div>
            </div>

            <div className="flex items-center gap-3 self-start sm:self-auto">
              <div className="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-50 border border-emerald-200/70 text-emerald-700 text-xs font-semibold shadow-sm">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Cloud Engine Active &bull; 60s Cron
              </div>
            </div>
          </header>

          {/* Hero Section with Floating Image-Style Pills */}
          <div className="relative text-center max-w-3xl mx-auto pt-4 pb-12">
            
            {/* Top Google Workspace Icons Bar */}
            <div className="inline-flex items-center gap-3 bg-white border border-slate-200/80 rounded-2xl px-5 py-2.5 shadow-sm mb-6">
              {/* Google Drive Icon */}
              <svg className="w-5 h-5" viewBox="0 0 87.3 78" fill="none">
                <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
                <path d="M43.65 25 29.9 1.2c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/>
                <path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l6.1 10.55z" fill="#ea4335"/>
                <path d="M43.65 25h27.5c0-1.55-.4-3.1-1.2-4.5l-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3z" fill="#00832d"/>
                <path d="M59.8 53H27.5L13.75 76.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
                <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25l16.15 28H87.3c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
              </svg>

              {/* Gmail Icon */}
              <svg className="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v.2L12 13l10-6.8V6z"/>
                <path fill="#34A853" d="M2 7.7V18c0 1.1.9 2 2 2h2V10.4L2 7.7z"/>
                <path fill="#EA4335" d="M20 20c1.1 0 2-.9 2-2V7.7l-4 2.7V20h2z"/>
                <path fill="#FBBC05" d="M6 20h12v-9.6L12 15l-6-4.6V20z"/>
              </svg>

              {/* Google Sheets Icon */}
              <svg className="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#0F9D58" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/>
                <path fill="#87CEAC" d="M14 2v6h6L14 2z"/>
                <path fill="#FFF" d="M8 13h8v2H8zm0 3h8v2H8zm0-6h4v2H8z"/>
              </svg>

              <span className="text-xs font-semibold text-slate-600 pl-1">
                Google Workspace Integration
              </span>
            </div>

            <h2 className="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">
              Autonomous Student Onboarding &amp; Offer Dispatch
            </h2>
            <p className="text-sm sm:text-base text-slate-600 mt-4 leading-relaxed max-w-2xl mx-auto">
              Real-time synchronization engine connecting Google Sheets registrations, dynamic PDF generation, and official Gmail API delivery with zero human delay.
            </p>

            {/* Floating Visual Badges (Exact arrangement from diagram) */}
            <div className="flex flex-wrap items-center justify-center gap-3 pt-6">
              <FeaturePill
                className="floating-pill"
                title="Students Onboarding"
                subtitle="Live Sheet Watcher"
                icon={(
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                  </svg>
                )}
              />

              <FeaturePill
                className="floating-pill-delay"
                title="Send Offers Automatically"
                subtitle="Official Letterhead PDF"
                icon={(
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                )}
              />

              <FeaturePill
                className="floating-pill"
                title="Spam-Shield Delivery"
                subtitle="Primary Inbox Placement"
                icon={(
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                )}
              />
            </div>
          </div>

          {/* Central Premium Canvas (Laptop Mockup Vibe) */}
          <div className="bg-white border border-slate-200/90 rounded-3xl shadow-xl shadow-slate-200/50 overflow-hidden mb-12">
            
            {/* Window Top Bar */}
            <div className="flex items-center justify-between px-5 py-3.5 bg-slate-100/70 border-b border-slate-200/80">
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-rose-400"></span>
                <span className="w-3 h-3 rounded-full bg-amber-400"></span>
                <span className="w-3 h-3 rounded-full bg-emerald-400"></span>
              </div>
              <div className="flex items-center gap-2 px-4 py-1 rounded-lg bg-white border border-slate-200 text-xs font-mono text-slate-500 shadow-sm max-w-sm w-full justify-center">
                <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <span>vrpi-gmailapi.vercel.app/api/process</span>
              </div>
              <div className="text-[11px] font-semibold text-slate-500">
                v2.0 Production
              </div>
            </div>

            {/* Window Content Grid */}
            <div className="grid grid-cols-1 lg:grid-cols-12 divide-y lg:divide-y-0 lg:divide-x divide-slate-200/80">
              
              {/* Left Column: Visual Automation Flow (7 cols) */}
              <div className="lg:col-span-7 p-6 sm:p-8 bg-slate-50/40">
                <div className="flex items-center justify-between mb-6">
                  <div>
                    <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">
                      Active Automation Pipeline
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">End-to-end cloud dispatch lifecycle</p>
                  </div>
                  <span className="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold border border-emerald-200">
                    Live
                  </span>
                </div>

                <div className="space-y-4">
                  {/* Step 1 */}
                  <div className="flex items-start gap-4 p-4 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:shadow transition-shadow">
                    <div className="w-9 h-9 rounded-xl bg-emerald-100/70 border border-emerald-200 text-emerald-700 flex items-center justify-center font-bold text-xs flex-shrink-0">
                      1
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center justify-between">
                        <h4 className="text-xs font-bold text-slate-800">Candidate Enters Google Sheet</h4>
                        <span className="text-[10px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                          Internship_Students
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 mt-1">
                        Row is appended with candidate name, email, and selected domain track.
                      </p>
                    </div>
                  </div>

                  {/* Step 2 */}
                  <div className="flex items-start gap-4 p-4 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:shadow transition-shadow">
                    <div className="w-9 h-9 rounded-xl bg-indigo-100/70 border border-indigo-200 text-indigo-700 flex items-center justify-center font-bold text-xs flex-shrink-0">
                      2
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center justify-between">
                        <h4 className="text-xs font-bold text-slate-800">Vercel Cloud Heartbeat</h4>
                        <span className="text-[10px] font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                          cron-job.org
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 mt-1">
                        Pings every 60s, authenticates with CRON_SECRET, and locks row to <code className="text-amber-600 bg-amber-50 px-1 rounded">PROCESSING</code>.
                      </p>
                    </div>
                  </div>

                  {/* Step 3 */}
                  <div className="flex items-start gap-4 p-4 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:shadow transition-shadow">
                    <div className="w-9 h-9 rounded-xl bg-amber-100/70 border border-amber-200 text-amber-700 flex items-center justify-center font-bold text-xs flex-shrink-0">
                      3
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center justify-between">
                        <h4 className="text-xs font-bold text-slate-800">Dynamic PDF Generator</h4>
                        <span className="text-[10px] font-semibold text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-100">
                          FormalOfferPDF
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 mt-1">
                        Synthesizes personalized A4 letterhead, corporate specs, and verification hash.
                      </p>
                    </div>
                  </div>

                  {/* Step 4 */}
                  <div className="flex items-start gap-4 p-4 rounded-2xl bg-white border border-slate-200/80 shadow-sm hover:shadow transition-shadow">
                    <div className="w-9 h-9 rounded-xl bg-rose-100/70 border border-rose-200 text-rose-700 flex items-center justify-center font-bold text-xs flex-shrink-0">
                      4
                    </div>
                    <div className="flex-1">
                      <div className="flex items-center justify-between">
                        <h4 className="text-xs font-bold text-slate-800">Gmail API Dispatch</h4>
                        <span className="text-[10px] font-semibold text-rose-700 bg-rose-50 px-2 py-0.5 rounded border border-rose-100">
                          OAuth 2.0
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 mt-1">
                        Delivers directly to the student's primary inbox and marks sheet row as <code className="text-emerald-600 bg-emerald-50 px-1 rounded font-bold">SENT</code>.
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              {/* Right Column: Interactive Admin Console (5 cols) */}
              <div className="lg:col-span-5 p-6 sm:p-8 bg-white flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">
                      Dispatcher Console
                    </h3>
                    <span className="text-[11px] text-slate-400">Manual Override</span>
                  </div>

                  <p className="text-xs text-slate-500 mb-6 leading-relaxed">
                    Trigger an immediate processing cycle without waiting for the next cron heartbeat.
                  </p>

                  <form onSubmit={triggerBatch} className="space-y-3.5">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1.5">
                        Authorization Secret
                      </label>
                      <input
                        type="password"
                        value={secret}
                        onChange={(e) => setSecret(e.target.value)}
                        placeholder="Paste CRON_SECRET..."
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-100 transition-all font-mono"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full bg-slate-900 hover:bg-slate-800 disabled:opacity-50 text-white font-semibold text-xs py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer"
                    >
                      {loading ? (
                        <>
                          <svg className="animate-spin h-3.5 w-3.5 text-white" viewBox="0 0 24 24" fill="none">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                          </svg>
                          <span>Processing Applications...</span>
                        </>
                      ) : (
                        <>
                          <svg className="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          <span>Run Immediate Batch</span>
                        </>
                      )}
                    </button>
                  </form>

                  {lastRun && (
                    <div className="mt-4 p-2.5 rounded-lg bg-emerald-50/70 border border-emerald-100 text-[11px] text-emerald-800 font-medium flex items-center gap-2">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                      Completed successfully at {lastRun}
                    </div>
                  )}

                  {error && (
                    <div className="mt-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-xs text-rose-700">
                      <strong>Failed:</strong> {error}
                    </div>
                  )}

                  {response && (
                    <div className="mt-4 rounded-xl border border-slate-200 bg-slate-50/80 p-3 text-xs">
                      <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-200">
                        <span className="font-semibold text-slate-700">Batch Response</span>
                        <span className="text-emerald-700 font-bold font-mono">
                          Processed: {response.processed ?? 0}
                        </span>
                      </div>
                      <pre className="font-mono text-[11px] text-slate-600 max-h-40 overflow-y-auto leading-relaxed">
                        {JSON.stringify(response, null, 2)}
                      </pre>
                    </div>
                  )}
                </div>

                <div className="mt-6 pt-4 border-t border-slate-100 text-[11px] text-slate-400">
                  Protected by HMAC Digest Authorization &bull; Python 3.13 Runtime
                </div>
              </div>

            </div>
          </div>

          {/* Footer */}
          <footer className="pt-6 border-t border-slate-200/80 text-center text-xs text-slate-400">
            VR PI Group of Companies &bull; Autonomous Cloud Infrastructure powered by Vercel &amp; Gmail API
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
