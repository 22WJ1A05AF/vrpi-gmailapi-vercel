<body>
<div id="root"></div>
<script type="text/babel">

const {useState,useEffect,useCallback,useMemo}=React;

const COMPANY="VR PI Group Of Companies";
const EMAIL="vrpigroupoftechnology@gmail.com";
const LOCATION="Wanaparthy, Telangana, India";
const WEBSITE="https://share.google/Staafq7spnZSStc8n";
const SHEET_ID="1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU";
const SHEET_GID="0";
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SHEET_GID}`;
const GMAIL_URL="https://mail.google.com/mail/?authuser=vrpigroupoftechnology%40gmail.com#inbox";
const TODAY=()=>new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});

/* SINGLE-FILE COMPANY BRANDING */
function CompanyLogo({className="",style={}}){
 return <svg className={className} style={style}
  viewBox="0 0 480 150" role="img"
  aria-label="VR PI Group of Companies">

  <text x="235" y="91" fontSize="98" fontWeight="900" letterSpacing="-7" fill="#f05f00" fontFamily="Arial,sans-serif">PI</text>
  <text x="7" y="132" fontSize="20" fontWeight="700" letterSpacing="1" fill="#d0003c" fontFamily="Arial,sans-serif">GROUP OF COMPANIES</text>
 </svg>;
}

/* SIX DOCUMENT TEMPLATES */
const TEMPLATES=[
 {id:"offer",name:"Internship Offer Letter",group:"Internship",style:"offer",color:"#1e3a5f",desc:"Formal internship offer, programme details, terms and candidate acceptance."},
 {id:"intern-completion",name:"Internship Completion Certificate",group:"Internship",style:"certificate",color:"#4f8b55",desc:"Premium landscape certificate with double border and completion statement."},
 {id:"training",name:"Industrial Training Appointment Letter",group:"Training",style:"training",color:"#e94b17",desc:"Professional training appointment with start date and programme details."},
 {id:"training-completion",name:"Training Completion Certificate",group:"Training",style:"certificate",color:"#4f8b55",desc:"Landscape training completion certificate."},
 {id:"participation",name:"Participation Certificate",group:"Certification",style:"certificate",color:"#4f8b55",desc:"Formal participation recognition in a premium certificate layout."},
 {id:"experience",name:"Experience Letter",group:"Certification",style:"experience",color:"#1e3a5f",desc:"Professional experience letter with role and employment dates."}
];

/* FORM FIELDS: START DATE ONLY IN OFFER AND TRAINING APPOINTMENT */
const FIELDS={
 offer:[
  {key:"name",label:"Candidate Name",required:true},
  {key:"domain",label:"Internship Domain",required:true},
  {key:"mode",label:"Programme Mode",type:"select",options:["Virtual / Remote","Hybrid","On-site"],required:true},
  {key:"duration",label:"Duration",required:true},
  {key:"startDate",label:"Start Date",type:"date",required:true}
 ],
 "intern-completion":[
  {key:"name",label:"Candidate Name",required:true},
  {key:"domain",label:"Internship Domain",required:true},
  {key:"startDate",label:"Start Date",type:"date"},
  {key:"endDate",label:"End Date",type:"date",required:true},
  {key:"duration",label:"Duration"}
 ],
 training:[
  {key:"name",label:"Candidate Name",required:true},
  {key:"domain",label:"Training Domain",required:true},
  {key:"mode",label:"Training Mode",type:"select",options:["Virtual / Remote","Hybrid","On-site"],required:true},
  {key:"duration",label:"Duration",required:true},
  {key:"startDate",label:"Start Date",type:"date",required:true}
 ],
 "training-completion":[
  {key:"name",label:"Candidate Name",required:true},
  {key:"domain",label:"Training Domain",required:true},
  {key:"startDate",label:"Start Date",type:"date"},
  {key:"endDate",label:"End Date",type:"date",required:true},
  {key:"duration",label:"Duration"},
  {key:"completionDate",label:"Completion Date",type:"date",required:true}
 ],
 participation:[
  {key:"name",label:"Candidate Name",required:true},
  {key:"eventTitle",label:"Programme / Event Name",required:true},
  {key:"participationDate",label:"Participation Date",type:"date",required:true}
 ],
 experience:[
  {key:"name",label:"Candidate Name",required:true},
  {key:"role",label:"Role / Designation",required:true},
  {key:"domain",label:"Department / Domain",required:true},
  {key:"startDate",label:"Start Date",type:"date",required:true},
  {key:"endDate",label:"End Date",type:"date",required:true}
 ]
};

const normalize=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

function getHeaderIndex(columns,names,fallback=-1){
 const labels=columns.map(c=>normalize(c.label||c.id||""));
 for(const name of names){
  const i=labels.findIndex(x=>x===normalize(name));
  if(i>=0)return i;
 }
 return fallback;
}

function readCell(cell){
 if(!cell||cell.v===null||cell.v===undefined)return "";
 return String(cell.f??cell.v).trim();
}

/* READ-ONLY GOOGLE SHEETS CONNECTION */
function getSheetData(){
 return new Promise((resolve,reject)=>{
  const callback="vrpiSheetCallback"+Date.now();
  const script=document.createElement("script");
  let complete=false;

  const timer=setTimeout(()=>{
   finish(new Error("Google Sheets timed out. Check sharing access."));
  },16000);

  function finish(error,result){
   if(complete)return;
   complete=true;
   clearTimeout(timer);
   script.remove();
   try{delete window[callback]}catch(e){}
   error?reject(error):resolve(result);
  }

  window[callback]=response=>{
   if(!response||!response.table){
    finish(new Error("Google Sheets did not return a readable table."));
    return;
   }
   if(response.status&&response.status!=="ok"){
    finish(new Error(response.errors?.[0]?.detailed_message||"Google Sheets access denied."));
    return;
   }
   finish(null,response.table);
  };

  const tqx=encodeURIComponent("out:json;responseHandler:"+callback+";reqId:0");
  script.async=true;
  script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=${tqx}&_=${Date.now()}`;
  script.onerror=()=>finish(new Error("Google Sheets could not be reached. Check link-view access."));
  document.head.appendChild(script);
 });

}

function convertSheet(table){
 const columns=table.cols||[];
 return (table.rows||[]).map((row,index)=>{
  const val=i=>readCell(row.c?.[i]);
  const get=(names,fallback=-1)=>val(getHeaderIndex(columns,names,fallback));

  // Column R (index 17) is retained as the fallback status field.
  const rawStatus=get([
   "Email Status","Email Delivery Status","Letter Sent",
   "Mail Status","Dispatch Status","Delivery Status",
   "Application Status","Status"
  ],17);

  const raw={};
  columns.forEach((col,i)=>{
   const name=col.label||col.id||`Column ${i+1}`;
   raw[name]=val(i);
  });

  const name=get(["Full Name","Candidate Name","Name"],2);
  const aid=get(["Application ID","Application Id"],1);

  return {
   key:aid||`sheet-${index}`,
   source:"sheet",
   raw,
   name,
   aid,
   email:get(["Email Address","Email"],3),
   phone:get(["WhatsApp / Phone","WhatsApp","Phone"],4),
   domain:get(["Domain","Internship Domain","Training Domain","Track"],7),
   mode:get(["Mode","Programme Mode","Training Mode"]),
   duration:get(["Duration","Programme Duration"]),
   startDate:get(["Start Date","Joining Date","Commencement Date"]),
   endDate:get(["End Date","Internship End Date"]),
   completionDate:get(["Completion Date"]),
   eventTitle:get(["Programme / Event","Programme Name","Event Name","Event Title"]),
   participationDate:get(["Participation Date","Event Date"]),
   role:get(["Role","Designation","Job Title"]),
   completionStatus:get(["Completion Status","Training Completion Status","Certificate Status"]),
   status:rawStatus,
   pdf:get(["PDF Record","PDF Link"],18),
   timestamp:get(["Timestamp"],0),
   lastUpdated:get(["Last Updated"],19)
  };
 }).filter(c=>c.name||c.aid||c.email);
}

async function loadCandidates(){
 const table=await getSheetData();
 return convertSheet(table);
}

/* DELIVERY STATUS CLASSIFICATION */
function classifyStatus(value){
 const s=String(value||"").toUpperCase().trim();

 if(/NOT SENT|NOT DELIVERED|PENDING|QUEUED|WAITING|PROCESSING|IN PROGRESS/.test(s))
  return "PENDING";

 if(/FAILED|FAILURE|ERROR|BOUNCED|REJECTED|UNDELIVERED/.test(s))
  return "FAILED";

 if(/SENT|DELIVERED|SUCCESS|ACCEPTED BY GMAIL|TRUE|^YES$|^1$/.test(s))
  return "SENT";

 return "UNKNOWN";
}

function Logo({style={}}){

/* OFFER LETTER WITH TERMS & CANDIDATE ACCEPTANCE */
function OfferLetter({c}){
 return <div className="a4 portrait">
  <div style={{
   background:"#1e3a5f",
   padding:"20px 34px",
   display:"flex",
   justifyContent:"space-between",
   alignItems:"center"
  }}>
   <Logo/>
   <div style={{textAlign:"right",color:"#e2e8f0",fontSize:9,lineHeight:1.9}}>
    <b style={{color:"#fff"}}>{COMPANY}</b><br/>
    {LOCATION}<br/>{EMAIL}<br/>{WEBSITE}
   </div>
  </div>
  <div style={{height:4,background:"linear-gradient(90deg,#f97316,#fed7aa)"}}/>

  <div className="doc-content">
   <div className="doc-title">
    <small>OFFICIAL CORPORATE COMMUNICATION</small>
    <h2>INTERNSHIP OFFER LETTER</h2>
    <small>DATE OF ISSUE: {TODAY()}</small>
   </div>

   <p><b>To: {c.name}</b></p>
   <p>Dear {c.name},</p>

   <p>We are pleased to offer you the opportunity to join the <b>{c.domain}</b> Internship Programme at <b>{COMPANY}</b>.</p>

   <p>Your programme is scheduled in <b>{c.mode}</b> mode for a duration of <b>{c.duration}</b>, commencing on <b>{c.startDate}</b>.</p>

   <p>During this engagement, you will have the opportunity to gain practical exposure, develop relevant skills and participate in assigned learning and project activities under the guidance of the programme team.</p>

   <div className="doc-section">INTERNSHIP PARTICULARS</div>
   <DetailsTable candidate={c} keys={["name","domain","mode","duration","startDate"]}/>

   <div className="doc-section">TERMS AND CONDITIONS</div>
   <p>1. The candidate is expected to maintain professional conduct and adhere to the applicable organizational policies.</p>
   <p>2. All assigned learning activities, tasks and deliverables should be completed within the timelines communicated by the programme coordinator.</p>
   <p>3. Confidential company information, internal documents and project-related materials must not be disclosed to unauthorized persons.</p>
   <p>4. The candidate must actively participate in assigned programme activities and follow the guidance of the designated mentor or coordinator.</p>
   <p>5. Any leave, absence or programme-related concern should be communicated to the authorized coordinator.</p>
   <p>6. The organization reserves the right to review programme participation and take appropriate action in accordance with its applicable policies.</p>

   <div className="acceptance">
    <b style={{color:"#1e3a5f"}}>CANDIDATE ACCEPTANCE</b>
    <p>I, <b>{c.name}</b>, acknowledge receipt of this internship offer and confirm that I have reviewed and understood the programme particulars and terms and conditions stated in this letter.</p>
    <p>I agree to comply with the applicable programme guidelines and professional expectations.</p>
    <div style={{marginTop:17,fontSize:10}}>
     Candidate Name: <b>{c.name}</b><br/><br/>
     Signature: <span className="acceptance-line"/><br/><br/>
     Date: <span className="acceptance-line"/>
    </div>
   </div>

   <Signoff department="Talent Acquisition Department"/>
  </div>
  <DocumentFooter/>
 </div>;
}

/* TRAINING APPOINTMENT: NO END DATE */

  <div className="training-top"/>
  <div className="doc-header" style={{borderColor:"#e94b17"}}>
   <Logo/>
   <div className="doc-info">
    <strong>{COMPANY}</strong><br/>{LOCATION}<br/>{EMAIL}<br/>{WEBSITE}
   </div>
  </div>

  <div className="doc-content" style={{padding:"34px 42px"}}>
   <div style={{fontSize:10,color:"#e94b17",fontWeight:800,letterSpacing:2}}>
    {COMPANY.toUpperCase()}
   </div>

   <h2 style={{fontSize:23,color:"#111827",lineHeight:1.25,margin:"13px 0 22px"}}>
    INDUSTRIAL TRAINING<br/>APPOINTMENT LETTER
   </h2>

   <p><b>Date:</b> {TODAY()}</p>
   <p><b>Trainee Name:</b> {c.name}</p>
   <p>Dear {c.name},</p>

   <p>We are pleased to welcome you to the <b>{c.domain}</b> Industrial Training Programme at <b>{COMPANY}</b>.</p>

   <p>Your training will be conducted in <b>{c.mode}</b> mode for a duration of <b>{c.duration}</b>, commencing on <b>{c.startDate}</b>.</p>

   <div className="doc-section" style={{color:"#e94b17"}}>TRAINING PARTICULARS</div>
   <DetailsTable candidate={c} keys={["name","domain","mode","duration","startDate"]}/>

   <div style={{background:"#111827",color:"#e2e8f0",padding:17,borderRadius:7,fontSize:10.5,lineHeight:1.9,marginTop:17}}>
    <b style={{color:"#f97316"}}>PROFESSIONAL EXPECTATIONS</b><br/>
    Maintain professional conduct, participate in assigned learning activities, complete deliverables within the communicated timelines and adhere to organizational confidentiality guidelines.
   </div>

   <div className="acceptance">
    <b style={{color:"#e94b17"}}>TRAINEE ACKNOWLEDGEMENT</b>
    <p>I, <b>{c.name}</b>, acknowledge the training appointment and agree to follow the applicable programme guidelines.</p>
    <p>Signature: <span className="acceptance-line"/> Date: <span className="acceptance-line"/></p>
   </div>

   <Signoff department="Industrial Training Department"/>
  </div>
  <DocumentFooter color="#191928"/>
 </div>;
}

/* PREMIUM LANDSCAPE COMPLETION CERTIFICATE */
function CompletionCertificate({c,t}){
 const status=c.completionStatus||"";
 const isVerified=c.source==="sheet"&&/verified|approved|completed/i.test(status);

 const statement=t.id==="participation"
  ?`has participated in ${c.domain||"the professional programme"}.`
  :`has successfully completed the ${c.domain||"professional development"} programme.`;

 return <div className="a4 landscape">
  <div className="certificate-frame">
   <div className="certificate-inner">

    <div>
     <div className="certificate-title">
      {t.id==="participation"?"CERTIFICATE OF PARTICIPATION":"COMPLETION CERTIFICATE"}
     </div>
    </div>

    <div>
     <div className="certificate-company">
      <CompanyLogo style={{width:95,height:48}}/>
      <span>{COMPANY.toUpperCase()}</span>
     </div>
     <div style={{fontSize:10,color:"#63835f",marginTop:5}}>
      {LOCATION}
     </div>
    </div>

    <div>
     <div className="certificate-intro">This certificate is granted to</div>
     <div className="certificate-name">{c.name}</div>
     <div className="certificate-description">
      {t.id==="participation"
       ?statement
       :statement}
      {c.duration?` Programme duration: ${c.duration}.`:""}
      {c.startDate?` Commencement date: ${c.startDate}.`:""}
      {c.endDate?` Completion date: ${c.endDate}.`:""}
     </div>
    </div>

    <div className="certificate-bottom">
     <div>
      <strong>VR PI Group Of Companies</strong>
      <small>Talent Excellence Division</small>
      <br/>
      <small>{LOCATION}</small>
     </div>

     <div className="center">
      <strong>Certificate Reference</strong>
      <small>{c.aid||"To be assigned by the company"}</small>
      <br/>
      <strong style={{marginTop:8}}>Date of Issue</strong>
      <small>{TODAY()}</small>
     </div>

     <div>
      <strong>Authorized Representative</strong>
      <small>{COMPANY}</small>
      <br/>
      <small>{EMAIL}</small>
     </div>
    </div>

    {!isVerified&&
     <div className="certificate-draft">
      PREVIEW ONLY • COMPLETION / PARTICIPATION REQUIRES COMPANY VERIFICATION
     </div>
    }
   </div>
  </div>
 </div>;
}

/* EXPERIENCE LETTER */
function ExperienceLetter({c}){
 return <div className="a4 portrait">
  <DocumentHeader color="#1e3a5f"/>
  <div className="doc-content">
   <div className="doc-title">
    <small>OFFICIAL CORPORATE COMMUNICATION</small>
    <h2>EXPERIENCE LETTER</h2>
    <small>{TODAY()}</small>
   </div>
   <p>To Whom It May Concern,</p>
   <p>This letter is prepared in relation to <b>{c.name}</b> and the role of <b>{c.role}</b> associated with the <b>{c.domain}</b> department at <b>{COMPANY}</b>.</p>
   <p>The engagement information is presented below for review and verification by the authorized company representative.</p>
   <div className="doc-section">PROFESSIONAL DETAILS</div>
   <DetailsTable candidate={c} keys={["name","role","domain","startDate","endDate"]}/>
   <p>We appreciate the professional contribution and wish the candidate continued success in future endeavours.</p>
   <Signoff department="Human Resources Department"/>
  </div>
  <DocumentFooter/>
 </div>;
}

function RenderDocument({candidate,template}){
 if(template.id==="offer")return <OfferLetter c={candidate}/>;
 if(template.id==="training")return <TrainingLetter c={candidate}/>;
 if(template.id==="experience")return <ExperienceLetter c={candidate}/>;
 return <CompletionCertificate c={candidate} t={template}/>;
}

/* MAIN APP */
function App(){
 const [records,setRecords]=useState([]);
 const [selectedKey,setSelectedKey]=useState("");
 const [templateId,setTemplateId]=useState("offer");
 const [source,setSource]=useState("sheet");
 const [manual,setManual]=useState({});
 const [search,setSearch]=useState("");
 const [filter,setFilter]=useState("ALL");
 const [loading,setLoading]=useState(true);
 const [error,setError]=useState("");
 const [notice,setNotice]=useState("");
 const [lastSync,setLastSync]=useState("");
 const [preview,setPreview]=useState(false);

 const template=TEMPLATES.find(t=>t.id===templateId)||TEMPLATES[0];
 const fields=FIELDS[templateId]||[];

 const refresh=useCallback(async()=>{
  setLoading(true);
  setError("");
  setNotice("");
  try{
   const data=await loadCandidates();
   setRecords(data);
   setSelectedKey(old=>data.some(c=>c.key===old)?old:(data[0]?.key||""));
   setLastSync(new Date().toLocaleTimeString("en-IN"));
   setNotice(`${data.length} live records synchronized from Google Sheets.`);
  }catch(e){
   setError(e.message);
   setNotice("");
  }finally{
   setLoading(false);
  }
 },[]);

 useEffect(()=>{
  refresh();
  const timer=setInterval(refresh,30000);
  return()=>clearInterval(timer);
 },[refresh]);

 const sheetCandidate=records.find(c=>c.key===selectedKey)||null;

 const manualCandidate={
  ...manual,
  source:"manual",
  name:manual.name||""
 };

 const candidate=source==="manual"?manualCandidate:sheetCandidate;

 const missing=fields.some(f=>f.required&&!String(manual[f.key]||"").trim());
 const canPreview=source==="sheet"?Boolean(sheetCandidate):!missing;

 const sent=records.filter(c=>{
  const s=classifyStatus(c.status);
  return s==="SENT";
 }).length;
 const pending=records.filter(c=>{
  const s=classifyStatus(c.status);
  return s==="PENDING";
 }).length;
 const failed=records.filter(c=>{
  const s=classifyStatus(c.status);
  return s==="FAILED";
 }).length;

 const visible=records.filter(c=>{
  const q=search.toLowerCase().trim();
  const matches=!q||[c.name,c.aid,c.email,c.domain,c.phone].join(" ").toLowerCase().includes(q);
  const status=classifyStatus(c.status);
  const matchesStatus=filter==="ALL"||status===filter;
  return matches&&matchesStatus;
 });

 function updateManual(key,value){
  setManual(prev=>({...prev,[key]:value}));
 }

 function selectTemplate(id){
  setTemplateId(id);
  setManual({});
  setPreview(false);
 }

 function showPreview(){
  if(canPreview)setPreview(true);
 }

 return <main className="app">

  <header className="header no-print">
   <a className="brand" href={WEBSITE} target="_blank" rel="noreferrer">
    <CompanyLogo className="logo"/>
   </a>
   <div className="actions">
    <a className="btn" href={WEBSITE} target="_blank" rel="noreferrer">Company Website ↗</a>
    <a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Google Sheet ↗</a>
    <a className="btn dark" href={GMAIL_URL} target="_blank" rel="noreferrer">Company Gmail ↗</a>
    <button className="btn orange" onClick={refresh} disabled={loading}>
     {loading?"Syncing...":"↻ Refresh"}
    </button>
   </div>
  </header>

  <section className="hero no-print">
   <div className="eyebrow">VR PI GROUP • ENTERPRISE OPERATIONS SUITE</div>
   <h1>Enterprise Talent<br/><span style={{color:"#1e3a5f"}}>Excellence Platform</span></h1>
   <p>A unified enterprise solution for intelligent talent management, official documentation, professional certifications, and automated corporate communication.</p>
  </section>

  {error&&<div className="alert error no-print">
   <b>Google Sheets connection:</b> {error}
   <br/>
   Direct browser access requires the spreadsheet to be link-viewable.
   Do not make confidential candidate information public.
  </div>}

  {notice&&<div className="alert success no-print">
   {notice} • Last sync: {lastSync}
  </div>}

  {/* LIVE STATUS CARDS - CLICK TO FILTER RECORDS */}
  <section className="stats no-print">
   {[
    ["TOTAL APPLICANTS",records.length,"Actual sheet records","ALL","#1e3a5f"],
    ["LETTERS SENT",sent,"Actual sent / delivered status","SENT","#15803d"],
    ["PENDING ACTIONS",pending,"Actual pending status","PENDING","#b45309"],
    ["FAILED RECORDS",failed,"Actual failed status","FAILED","#dc2626"]
   ].map(([label,value,note,key,color])=>(
    <div className={"stat "+(filter===key?"active":"")} key={key}>
     <button onClick={()=>setFilter(key)}>
      <label>{label}</label>
      <strong style={{color}}>{value}</strong>
      <small>{note}</small>
     </button>
    </div>
   ))}
  </section>

  {/* LIVE CANDIDATE RECORDS */}
  <section className="panel no-print">
   <div className="section-head">
    <div>
     <div className="kicker">LIVE DATA MANAGEMENT • READ ONLY</div>
     <h2>Candidate Records</h2>
     <p className="description">
      Actual Google Sheet data • Auto-refresh every 30 seconds.
     </p>
    </div>
    <input className="search" value={search}
     onChange={e=>setSearch(e.target.value)}
     placeholder="Search name, ID or email..."/>
   </div>

   <div className="table-wrap">
    {loading&&records.length===0?
     <div className="empty">Connecting to Google Sheets...</div>:
     visible.length===0?
     <div className="empty">No records match this status or search.</div>:
     <table className="records">
      <thead><tr>
       <th>Application ID</th>
       <th>Candidate</th>
       <th>Email</th>
       <th>Phone</th>
       <th>Domain</th>
       <th>Letter Status</th>
       <th>PDF Record</th>
       <th>Timestamp</th>
       <th>Action</th>
      </tr></thead>
      <tbody>
       {visible.map(c=>{
        const classification=classifyStatus(c.status);
        return <tr key={c.key}>
         <td>{c.aid||"—"}</td>
         <td><b>{c.name||"—"}</b></td>
         <td>{c.email||"—"}</td>
         <td>{c.phone||"—"}</td>
         <td>{c.domain||"—"}</td>
         <td>
          <span className={"status "+classification.toLowerCase()}>
           {c.status||"Not recorded"}
          </span>
         </td>
         <td>{c.pdf||"—"}</td>
         <td>{c.timestamp||"—"}</td>
         <td>
          <button className="text-btn" onClick={()=>{
           setSource("sheet");
           setSelectedKey(c.key);
           setPreview(true);
          }}>Preview</button>
         </td>
        </tr>;
       })}
      </tbody>
     </table>
    }
   </div>
  </section>

  {/* DOCUMENT GENERATION */}
  <section className="panel no-print">
   <div className="kicker">OFFICIAL CORPORATE DOCUMENT LIBRARY</div>
   <h2>Professional Document Generation</h2>
   <p className="description">
    Select an existing candidate or manually enter only the details
    required by your chosen document. Manual details are temporary
    and are never written to the original Google Sheet.
   </p>

   <div className="source-tabs">
    <button className={"tab "+(source==="sheet"?"active":"")}
     onClick={()=>setSource("sheet")}>
     Use Google Sheet Record
    </button>
    <button className={"tab "+(source==="manual"?"active":"")}
     onClick={()=>{
      setSource("manual");
      setManual({});
     }}>
     Enter Details Manually
    </button>
   </div>

   <div className="template-layout">
    <div className="field">
     <label>SELECT CANDIDATE</label>
     {source==="sheet"?
      <select value={selectedKey} onChange={e=>setSelectedKey(e.target.value)}>
       <option value="">Select actual candidate</option>
       {records.map(c=>
        <option key={c.key} value={c.key}>
         {c.name} — {c.aid||"No ID"}
        </option>
       )}
      </select>
      :
      <div className="alert info">
       Manual preview mode is active. Only required document
       information will be collected.
      </div>
     }
    </div>

    <div className="field">
     <label>SELECT DOCUMENT TEMPLATE</label>
     <select value={templateId} onChange={e=>selectTemplate(e.target.value)}>
      <optgroup label="Internship">
       {TEMPLATES.filter(t=>t.group==="Internship").map(t=>
        <option key={t.id} value={t.id}>{t.name}</option>
       )}
      </optgroup>
      <optgroup label="Training">
       {TEMPLATES.filter(t=>t.group==="Training").map(t=>
        <option key={t.id} value={t.id}>{t.name}</option>
       )}
      </optgroup>
      <optgroup label="Certification">
       {TEMPLATES.filter(t=>t.group==="Certification").map(t=>
        <option key={t.id} value={t.id}>{t.name}</option>
       )}
      </optgroup>
     </select>

     <div className="template-info">
      <span className="kicker" style={{color:template.color}}>VR PI • OFFICIAL DOCUMENT</span>
      <strong>{template.name}</strong>
      <p>{template.desc}</p>
      <div className="pills">
       <span className="pill">{template.group}</span>
       <span className="pill">{template.style==="certificate"?"A4 Landscape":"A4 Portrait"}</span>
       <span className="pill">PDF Preview</span>
      </div>
     </div>
    </div>
   </div>

   {/* TEMPLATE-SPECIFIC MANUAL INPUTS */}
   {source==="manual"&&
    <div className="manual-box">
     <div className="kicker">REQUIRED DOCUMENT INFORMATION</div>
     <h2>{template.name}</h2>
     <p className="description">
      Only the fields required by this document are displayed.
      These details are used for preview only.
     </p>

     <div className="form-grid">
      {fields.map(f=>(
       <div className="form-field" key={f.key}>
        <label>{f.label}{f.required?<span style={{color:"#e94b17"}}> *</span>:""}</label>
        {f.type==="select"?
         <select value={manual[f.key]||""}
          onChange={e=>updateManual(f.key,e.target.value)}>
          <option value="">Select {f.label}</option>
          {f.options.map(o=><option key={o} value={o}>{o}</option>)}
         </select>
         :
         <input type={f.type||"text"}
          value={manual[f.key]||""}
          placeholder={"Enter "+f.label.toLowerCase()}
          onChange={e=>updateManual(f.key,e.target.value)}/>
        }
       </div>
      ))}
     </div>

     <div className="alert info">
      <b>Manual preview only:</b> These details remain in temporary
      page memory. No Google Sheets row is created, updated or deleted.
     </div>

     <div className="form-actions">
      <button className="btn" onClick={()=>setManual({})}>Clear Details</button>
      <button className="btn orange" disabled={!canPreview} onClick={showPreview}>
       Preview Document →
      </button>
     </div>
    </div>
   }

   {source==="sheet"&&
    <div className="section-head" style={{marginTop:23}}>
     <span className="description">
      {sheetCandidate?`Selected: ${sheetCandidate.name}`:"Select a candidate from your live sheet."}
     </span>
     <button className="btn orange" disabled={!canPreview} onClick={showPreview}>
      Preview A4 Document →
     </button>
    </div>
   }
  </section>

  {/* FOOTER */}
  <footer className="footer no-print">
   <CompanyLogo style={{width:145,height:65}}/>
   <b>{COMPANY}</b><br/>
   {LOCATION}<br/>{EMAIL}<br/>
   <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a>
   <p>Enterprise Talent Excellence Platform</p>
  </footer>

  {/* PREVIEW WINDOW */}
  {preview&&candidate&&
   <div className="modal">
    <div className="modal-inner">
     <div className="modalbar no-print">
      <strong>{template.name} • {candidate.name}</strong>
      <div className="modal-actions">
       {source==="sheet"&&
        <select value={selectedKey} onChange={e=>setSelectedKey(e.target.value)}>
         {records.map(c=>
          <option key={c.key} value={c.key}>{c.name} — {c.aid||""}</option>
         )}
        </select>
       }
       <button className="btn orange" onClick={()=>window.print()}>
        Print / Save PDF
       </button>
       <button className="btn" onClick={()=>setPreview(false)}>Close ×</button>
      </div>
     </div>

     <div className="modal-tabs no-print">
      {TEMPLATES.map(t=>
       <button key={t.id}
        className={templateId===t.id?"active":""}
        onClick={()=>selectTemplate(t.id)}>
        {t.name}
       </button>
      )}
     </div>

     <div id="printTarget">
      <RenderDocument candidate={candidate} template={template}/>
     </div>
    </div>
   </div>
  }
 </main>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
