
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VR PI Group | Enterprise Talent Excellence Platform</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:'DM Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:auto;padding:25px 35px}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4e9f1;padding-bottom:22px;gap:20px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:48px;height:48px;border-radius:13px;background:#172b4d;color:white;display:grid;place-items:center;font-weight:900;border:2px solid #e99a50;font-size:18px}
.brand h2{font:800 15px Manrope;margin:0}
.brand p{font-size:11px;color:#8491a5;margin:5px 0 0}
.header-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:11px 16px;font-size:12px;font-weight:700}
.btn-primary{background:#087e59;color:white}
.btn-dark{background:#172b4d;color:white}
.btn-light{background:white;border:1px solid #dce3ed;color:#34435b}
.hero{text-align:center;padding:65px 10px 48px}
.eyebrow{display:inline-block;padding:9px 16px;border:1px solid #e2e8f0;border-radius:30px;background:white;color:#66758b;font-size:10px;letter-spacing:1px;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;background:#f47b32;border-radius:50%;margin-right:8px}
.hero h1{font:800 clamp(34px,5vw,58px)/1.12 Manrope;letter-spacing:-2px;margin:23px 0 15px;color:#111a2d}
.hero p{max-width:790px;margin:auto;color:#6c7a8e;font-size:15px;line-height:1.9}
.hero small{display:block;color:#96a2b3;margin-top:20px;font-size:11px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
.metric{background:white;border:1px solid #e7ebf2;border-radius:14px;padding:20px}
.metric span{font-size:11px;color:#8794a7}
.metric h2{font:800 27px Manrope;margin:10px 0 4px}
.metric small{font-size:10px;color:#9aa5b4}
.panel{background:white;border:1px solid #e5eaf1;border-radius:17px;overflow:hidden;box-shadow:0 10px 30px #24324a08}
.panel-heading{padding:25px 27px 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.panel-heading h2{font:800 21px Manrope;margin:5px 0}
.panel-heading p{font-size:11px;color:#8794a7;margin:0}
.kicker{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#8794a7}
.connected{font-size:10px;background:#edfaf4;color:#13865b;padding:8px 12px;border-radius:20px}
.toolbar{display:flex;justify-content:space-between;gap:15px;padding:0 27px 18px;border-bottom:1px solid #edf0f5;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:transparent;border:0;padding:11px 13px;color:#8995a6;font-size:12px;font-weight:700;border-bottom:2px solid transparent}
.tab.active{color:#172b4d;border-color:#f47b32}
.search{width:min(380px,100%);padding:11px 14px;border:1px solid #e0e6ef;border-radius:9px;font-size:12px;outline:none}
.search:focus,select:focus{border-color:#e88b4c}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;background:#fbfcfe;color:#94a1b3;padding:15px 13px;font-size:9px;letter-spacing:.7px;text-transform:uppercase}
td{padding:15px 13px;border-top:1px solid #eff2f6;font-size:11px;color:#5c6b80}
th:first-child,td:first-child{padding-left:27px}
td strong{color:#25334b}
.mono{font-family:monospace;font-weight:700}
.status{display:inline-block;padding:5px 10px;border-radius:20px;background:#eef3f8;color:#68778c;font-size:9px;font-weight:800}
.status.sent,.status.success,.status.completed{background:#eaf9f1;color:#12865a}
.status.failed,.status.rejected{background:#fff0ee;color:#c94e43}
.link-btn{border:0;background:none;color:#087eae;font-size:11px;font-weight:700}
.empty{text-align:center;padding:55px 20px;color:#8794a7;font-size:12px}
.history{padding:25px 30px}
.history-event{border-left:2px solid #e5eaf1;padding:0 0 25px 23px;position:relative}
.history-event:before{content:"";position:absolute;left:-6px;top:3px;width:9px;height:9px;border-radius:50%;background:#ed873d}
.event-head{display:flex;justify-content:space-between;gap:15px}
.event-head strong{font-size:11px;color:#1c3558}
.event-head time{font-size:10px;color:#96a2b3}
.history-event p{font-size:12px;color:#65748a}
.event-details{display:flex;flex-wrap:wrap;gap:12px 20px;font-size:10px;color:#8996a7}
.event-details b{color:#4b5b72}
.templates{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:30px}
.templates h3{font:800 22px Manrope}
.templates p{font-size:12px;line-height:1.8;color:#8190a3}
.templates label{display:block;font-size:11px;font-weight:700;margin:25px 0 9px}
.template-select{width:100%;padding:13px;border:1px solid #dfe6ef;border-radius:9px;background:white;color:#34435b}
.preview{border:1px solid #e3e8ef;border-radius:12px;padding:27px;background:#fff;min-height:360px;box-shadow:0 8px 25px #24324a08}
.paper-header{display:flex;align-items:center;gap:12px}
.paper-header h4{font:800 13px Manrope;color:#172b4d;margin:0}
.paper-header small{font-size:9px;color:#8794a7}
.paper-rule{height:3px;background:#1a365d;margin:18px 0 28px}
.preview h2{text-align:center;font:800 20px Manrope;color:#1a365d;margin:25px 0}
.preview-body{font-size:12px;line-height:2;color:#526178}
.preview-meta{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:#748298;margin:20px 0}
.signoff{border-top:1px solid #e4e9ef;padding-top:16px;margin-top:50px;font-size:11px;color:#35445c}
.signoff span{display:block;color:#8b97a8;font-size:9px;margin-top:5px}
.preview-footer{border-top:2px solid #1a365d;margin-top:25px;padding-top:10px;text-align:center;font-size:9px;color:#8591a3}
.footer{text-align:center;padding:30px 10px;color:#8c98a9;font-size:10px}
.footer a{color:#087eae;text-decoration:none}
.alert{margin:0 0 18px;padding:13px 16px;background:#fff7ed;border:1px solid #fed7aa;color:#9a531b;border-radius:10px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:#101a2c99;display:grid;place-items:center;padding:20px;z-index:10}
.modal{background:white;width:min(850px,100%);max-height:85vh;overflow:auto;border-radius:15px;padding:25px}
.modal-top{display:flex;justify-content:space-between;align-items:center}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.detail{padding:12px;background:#f8fafc;border:1px solid #edf0f4;border-radius:8px;overflow-wrap:anywhere}
.detail span{display:block;font-size:9px;color:#8794a7;text-transform:uppercase}
.detail b{display:block;font-size:11px;margin-top:7px;color:#34435b}
@media(max-width:800px){
 .app{padding:16px}
 .header{align-items:flex-start;flex-direction:column}
 .metrics{grid-template-columns:repeat(2,1fr)}
 .templates{grid-template-columns:1fr;padding:20px}
 .panel-heading{padding:20px}
 .hero{padding:45px 5px 35px}
}
@media(max-width:480px){
 .metrics{gap:8px}
 .metric{padding:13px}
 .metric h2{font-size:21px}
 .detail-grid{grid-template-columns:1fr}
 .event-head{flex-direction:column}
}
@media print{
 body *{visibility:hidden}
 #documentPreview,#documentPreview *{visibility:visible}
 #documentPreview{position:absolute;left:0;top:0;width:100%;box-shadow:none}
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useMemo,useCallback}=React;

/*
  IMPORTANT:
  Configure this URL to your authenticated backend.
  Do not place Google service-account credentials in this HTML.
*/
const API_BASE=""; 
const SHEET_URL="https://docs.google.com/spreadsheets/d/1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU/edit";
const COMPANY_WEBSITE="https://share.google/Staafq7spnZSStc8n";

const TEMPLATE_LIST=[
 ["internship-offer","Internship Offer Letter"],
 ["internship-completion","Internship Completion Certificate"],
 ["internship-training","Internship Training Letter"],
 ["training-offer","Training Offer Letter"],
 ["training-completion","Training Completion Certificate"],
 ["participation","Participation Certificate"],
 ["experience","Experience Certificate"],
 ["appreciation","Appreciation Certificate"],
 ["project-completion","Project Completion Certificate"],
 ["general-certificate","General Certification Letter"]
];

function getValue(row, names){
 const keys=Object.keys(row||{});
 for(const name of names){
  const key=keys.find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,"")===name.toLowerCase().replace(/[^a-z0-9]/g,""));
  if(key) return row[key]??"";
 }
 return "";
}

function dateText(value){
 if(!value)return "—";
 const d=new Date(value);
 return isNaN(d.getTime())?String(value):d.toLocaleString();
}

async function getAPI(path,signal){
 const response=await fetch(API_BASE+path,{
  method:"GET",
  credentials:"include",
  headers:{Accept:"application/json"},
  cache:"no-store",
  signal
 });
 if(!response.ok)throw new Error("API request failed: "+response.status);
 return response.json();
}

function App(){
 const [candidates,setCandidates]=useState([]);
 const [events,setEvents]=useState([]);
 const [loading,setLoading]=useState(true);
 const [error,setError]=useState("");
 const [lastSync,setLastSync]=useState(null);
 const [query,setQuery]=useState("");
 const [tab,setTab]=useState("candidates");
 const [selected,setSelected]=useState(null);
 const [template,setTemplate]=useState(TEMPLATE_LIST[0][0]);
 const [historyType,setHistoryType]=useState("ALL");

 const refresh=useCallback(async(signal)=>{
  try{
   setError("");
   const [candidateData,historyData]=await Promise.all([
    getAPI("/api/candidates",signal),
    getAPI("/api/history",signal)
   ]);
   setCandidates(Array.isArray(candidateData.rows)?candidateData.rows:[]);
   setEvents(Array.isArray(historyData.events)?historyData.events:[]);
   setLastSync(new Date());
  }catch(err){
   if(err.name!=="AbortError")setError(err.message+" — Check your backend API connection.");
  }finally{setLoading(false)}
 },[]);

 useEffect(()=>{
  const controller=new AbortController();
  refresh(controller.signal);
  const timer=setInterval(()=>refresh(),15000);
  return ()=>{controller.abort();clearInterval(timer)};
 },[refresh]);

 const filteredCandidates=useMemo(()=>{
  const q=query.toLowerCase().trim();
  if(!q)return candidates;
  return candidates.filter(row=>Object.values(row).some(v=>String(v??"").toLowerCase().includes(q)));
 },[candidates,query]);

 const filteredEvents=useMemo(()=>{
  const q=query.toLowerCase().trim();
  return events.filter(e=>{
   const typeMatch=historyType==="ALL"||String(e.eventType).toUpperCase()===historyType;
   const searchMatch=!q||Object.values(e).some(v=>String(v??"").toLowerCase().includes(q));
   return typeMatch&&searchMatch;
  });
 },[events,query,historyType]);

 const sentCount=candidates.filter(row=>
  String(getValue(row,["Email Status","Letter Sent","Status"])).toLowerCase().includes("sent")
 ).length;

 const selectedTemplate=TEMPLATE_LIST.find(x=>x[0]===template)?.[1];

 return <div className="app">
  <header className="header">
   <a className="brand" href={COMPANY_WEBSITE} target="_blank" rel="noreferrer" style={{textDecoration:"none",color:"inherit"}}>
    <div className="logo">VR</div>
    <div>
     <h2>VR PI Group Of Company</h2>
     <p>Enterprise Talent & Documentation Operations</p>
    </div>
   </a>
   <div className="header-actions">
    <a className="btn btn-light" href={COMPANY_WEBSITE} target="_blank" rel="noreferrer" style={{textDecoration:"none"}}>Company Website ↗</a>
    <a className="btn btn-light" href={SHEET_URL} target="_blank" rel="noreferrer" style={{textDecoration:"none"}}>Open Google Sheet ↗</a>
    <button className="btn btn-primary" onClick={()=>refresh()}>Refresh Data</button>
   </div>
  </header>

  <section className="hero">
   <div className="eyebrow"><span className="dot"></span>VR PI GROUP • ENTERPRISE OPERATIONS SUITE</div>
   <h1>Enterprise Talent Excellence Platform</h1>
   <p>A unified enterprise solution for intelligent talent management, official documentation, professional certifications, and automated corporate communication.</p>
   <small>INTEGRATED TALENT OPERATIONS • CORPORATE DOCUMENTATION • AUTOMATED WORKFLOWS</small>
  </section>

  {error&&<div className="alert"><b>Live connection unavailable:</b> {error} No sample records are displayed.</div>}

  <section className="metrics">
   <Metric label="Candidate Records" value={candidates.length} note="Actual source sheet records"/>
   <Metric label="History Events" value={events.length} note="Recorded audit events"/>
   <Metric label="Sent Records" value={sentCount} note="Based on actual returned status"/>
   <Metric label="Last Synchronization" value={lastSync?lastSync.toLocaleTimeString():"—"} note="Automatic refresh every 15 seconds"/>
  </section>

  <section className="panel">
   <div className="panel-heading">
    <div>
     <span className="kicker">ENTERPRISE OPERATIONS CONSOLE</span>
     <h2>Talent & Documentation Management</h2>
     <p>Connected Google Sheets records • Read-only dashboard</p>
    </div>
    <span className="connected">● Live data view</span>
   </div>

   <div className="toolbar">
    <div className="tabs">
     <button className={"tab "+(tab==="candidates"?"active":"")} onClick={()=>setTab("candidates")}>Candidate Records</button>
     <button className={"tab "+(tab==="history"?"active":"")} onClick={()=>setTab("history")}>Sheet History</button>
     <button className={"tab "+(tab==="templates"?"active":"")} onClick={()=>setTab("templates")}>Document Templates</button>
    </div>
    <input className="search" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search application ID, name, email, or event..."/>
   </div>

   {tab==="candidates"&&<div className="table-wrap">
    {loading&&candidates.length===0?<Empty>Loading actual Google Sheets records...</Empty>:
     filteredCandidates.length===0?<Empty>No candidate records returned from the connected sheet.</Empty>:
     <table>
      <thead><tr>
       <th>Application ID</th><th>Full Name</th><th>Email Address</th><th>WhatsApp / Phone</th><th>College</th><th>Domain</th><th>Application Status</th><th>Timestamp</th><th>Details</th>
      </tr></thead>
      <tbody>{filteredCandidates.map((row,i)=>{
       const id=getValue(row,["Application ID"])||"row-"+i;
       const status=getValue(row,["Application Status","Email Status","Letter Sent","Status"]);
       return <tr key={id}>
        <td className="mono">{id||"—"}</td>
        <td><strong>{getValue(row,["Full Name","Name"])||"—"}</strong></td>
        <td>{getValue(row,["Email Address","Email"])||"—"}</td>
        <td>{getValue(row,["WhatsApp / Phone","WhatsApp","Phone"])||"—"}</td>
        <td>{getValue(row,["College"])||"—"}</td>
        <td>{getValue(row,["Domain","Internship Domain"])||"—"}</td>
        <td><Status value={status}/></td>
        <td>{dateText(getValue(row,["Timestamp","Last Updated"]))}</td>
        <td><button className="link-btn" onClick={()=>setSelected(row)}>View details</button></td>
       </tr>
      })}</tbody>
     </table>}
   </div>}

   {tab==="history"&&<div className="history">
    <div style={{display:"flex",justifyContent:"space-between",gap:15,flexWrap:"wrap",marginBottom:25}}>
     <p style={{fontSize:11,color:"#8491a5"}}>Chronological changes recorded from the separate Audit_Log. Original candidate records are not modified.</p>
     <select value={historyType} onChange={e=>setHistoryType(e.target.value)} style={{padding:9,border:"1px solid #e1e7ef",borderRadius:8}}>
      <option value="ALL">All Events</option>
      <option value="EDIT">Edits</option>
      <option value="INSERT_ROW">Inserted Rows</option>
      <option value="REMOVE_ROW">Removed Rows</option>
      <option value="FORM_SUBMIT">Form Submissions</option>
     </select>
    </div>
    {filteredEvents.length===0?<Empty>No audit events found. Install the Google Apps Script triggers described below.</Empty>:
     filteredEvents.map((event,i)=><div className="history-event" key={event.eventId||i}>
      <div className="event-head">
       <strong>{event.eventType||"SHEET EVENT"}</strong>
       <time>{dateText(event.timestamp)}</time>
      </div>
      <p>{event.description||"Google Sheet change recorded."}</p>
      <div className="event-details">
       <span>Application ID: <b>{event.applicationId||"—"}</b></span>
       <span>Sheet: <b>{event.sheetName||"—"}</b></span>
       <span>Cell: <b>{event.rangeA1||"—"}</b></span>
       <span>Column: <b>{event.columnName||"—"}</b></span>
       <span>Previous: <b>{event.oldValue??"—"}</b></span>
       <span>New: <b>{event.newValue??"—"}</b></span>
       <span>Actor: <b>{event.actor||"—"}</b></span>
      </div>
     </div>)}
   </div>}

   {tab==="templates"&&<div className="templates">
    <div>
     <span className="kicker">OFFICIAL CORPORATE DOCUMENT LIBRARY</span>
     <h3>Professional Document Templates</h3>
     <p>Select a document type to view its branded A4 preview. Candidate-specific documents must be generated using verified live sheet records and authorized backend processing.</p>
     <label>Select Document Template</label>
     <select className="template-select" value={template} onChange={e=>setTemplate(e.target.value)}>
      {TEMPLATE_LIST.map(t=><option key={t[0]} value={t[0]}>{t[1]}</option>)}
     </select>
     <p>Selected: <b>{selectedTemplate}</b></p>
     <button className="btn btn-dark" onClick={()=>window.print()}>Print / Save Preview as PDF</button>
    </div>
    <div className="preview" id="documentPreview">
     <div className="paper-header">
      <div className="logo">VR</div>
      <div><h4>VR PI GROUP OF COMPANY</h4><small>Corporate Talent & Professional Development</small></div>
     </div>
     <div className="paper-rule"></div>
     <div className="preview-meta"><span>Official Corporate Document</span><span>Reference: Preview</span></div>
     <h2>{selectedTemplate}</h2>
     <div className="preview-body">
      <p>To Whom It May Concern,</p>
      <p>This document is issued by <b>VR PI Group Of Company</b> in connection with its professional talent development and corporate engagement programmes.</p>
      <p>Candidate information, programme details, dates, and document references will be populated from the verified candidate record when the authorized document-generation service is connected.</p>
      <p>All information must be reviewed and validated by the authorized company representative before issuance.</p>
     </div>
     <div className="signoff">
      <b>Authorized Signatory</b>
      <span>VR PI Group Of Company</span>
      <span>No digital or simulated signature is included.</span>
     </div>
     <div className="preview-footer">
      {COMPANY_WEBSITE}<br/>Official Corporate Documentation
     </div>
    </div>
   </div>}
  </section>

  <footer className="footer">
   <b>VR PI Group Of Company</b><br/>
   Enterprise Talent Excellence Platform<br/>
   <a href={COMPANY_WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a><br/><br/>
   Read-only candidate dashboard • Secure enterprise data operations
  </footer>

  {selected&&<div className="modal-bg" onClick={()=>setSelected(null)}>
   <div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="modal-top">
     <div><span className="kicker">SOURCE GOOGLE SHEET RECORD</span><h2>Candidate Details</h2></div>
     <button className="btn btn-light" onClick={()=>setSelected(null)}>Close ×</button>
    </div>
    <div className="detail-grid">
     {Object.entries(selected).map(([key,value])=><div className="detail" key={key}>
      <span>{key}</span><b>{String(value??"—")||"—"}</b>
     </div>)}
    </div>
    <p style={{fontSize:10,color:"#8b97a8",marginTop:18}}>Read-only view. Editing and deletion are disabled.</p>
   </div>
  </div>}
 </div>;
}

function Metric({label,value,note}){
 return <div className="metric"><span>{label}</span><h2>{value}</h2><small>{note}</small></div>
}
function Empty({children}){return <div className="empty">{children}</div>}
function Status({value}){
 const s=String(value||"Not specified");
 const type=s.toLowerCase().includes("sent")||s.toLowerCase().includes("success")||s.toLowerCase().includes("complete")?"success":s.toLowerCase().includes("fail")||s.toLowerCase().includes("reject")?"failed":"";
 return <span className={"status "+type}>{s}</span>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
