
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VR PI Group | Enterprise Talent Excellence Platform</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#17233a;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1240px;margin:auto;padding:28px 24px}
.header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid #e2e8f0}
.brand{display:flex;align-items:center;text-decoration:none}
.logo{width:180px;height:auto;display:block;object-fit:contain}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 15px;border:1px solid #dfe6ef;background:white;border-radius:9px;color:#263d5e;text-decoration:none;font-size:10px;font-weight:800}
.dark{background:#1e3a5f;color:white;border-color:#1e3a5f}
.orange{background:#e94b17;color:white;border-color:#e94b17}
.hero{text-align:center;padding:55px 10px 38px}
.eyebrow{display:inline-block;background:white;border:1px solid #e1e7ef;border-radius:30px;padding:9px 17px;color:#687891;font-size:10px;font-weight:800;letter-spacing:1px}
.hero h1{font-size:clamp(34px,5vw,55px);line-height:1.12;letter-spacing:-2px;color:#111a2d;font-weight:800;margin:22px 0 14px}
.hero p{max-width:750px;margin:auto;color:#74839a;font-size:13px;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:19px 20px}
.stat label{font-size:9px;font-weight:800;color:#8795a9;letter-spacing:1px}
.stat strong{display:block;font-size:27px;font-weight:800;margin:9px 0 4px}
.stat small{font-size:10px;color:#94a3b8}
.panel{background:white;border:1px solid #e1e7ef;border-radius:18px;padding:27px;box-shadow:0 10px 32px #263b5909;margin-bottom:24px}
.kicker{color:#8291a6;font-size:10px;font-weight:800;letter-spacing:1.5px}
h2{font-size:20px;color:#172b49;margin:8px 0}
.description{font-size:12px;color:#8290a5;line-height:1.8}
.alert{padding:13px 15px;border-radius:9px;margin-top:15px;font-size:11px;line-height:1.8}
.info{background:#eff6ff;color:#315b8c;border:1px solid #d7e7fa}
.warning{background:#fff5ed;color:#a34a16;border:1px solid #ffdbbd}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.field label,.form-field label{display:block;font-size:10px;font-weight:800;color:#52637c;margin-bottom:9px}
.field select,.form-field input,.form-field select{width:100%;padding:12px;border:1px solid #dfe6ef;border-radius:9px;background:white;color:#30425d;font-size:11px}
.field select:focus,.form-field input:focus,.form-field select:focus{border-color:#e94b17;outline:none}
.template-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.template-info{padding:18px;background:#f8fafc;border:1px solid #e9edf3;border-radius:12px;margin-top:15px}
.template-info strong{display:block;font-size:13px;color:#1e3a5f;margin:8px 0}
.template-info p{font-size:11px;color:#8290a5;line-height:1.8}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:9px;padding:6px 10px;border:1px solid #e4e9ef;border-radius:20px;color:#718098;background:white}
.source-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.tab{border:1px solid #dce4ed;background:white;color:#50617a;padding:10px 16px;border-radius:9px;font-size:10px;font-weight:800}
.tab.active{background:#1e3a5f;color:white;border-color:#1e3a5f}
.manual-box{background:#f8fafc;border:1px solid #e4eaf1;border-radius:14px;padding:23px;margin-top:19px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;flex-wrap:wrap}
.footer{text-align:center;padding:26px 0;color:#8491a5;font-size:10px}
.footer a{color:#0d7377;text-decoration:none}
.modal{position:fixed;inset:0;background:rgba(12,23,41,.9);z-index:100;overflow:auto;padding:15px}
.modal-inner{max-width:920px;width:100%;margin:0 auto}
.modalbar{background:#111c30;padding:12px 15px;border-radius:11px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.modalbar strong{font-size:11px;color:white}
.modal-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.a4{width:210mm;height:297mm;min-height:297mm;margin:0 auto;background:white;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#26354d;box-shadow:0 15px 50px #0004}
.doc-logo{width:155px;height:auto;display:block;object-fit:contain}
.doc-header{padding:21px 32px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:2px solid #1e3a5f}
.doc-info{text-align:right;font-size:8.5px;color:#66758c;line-height:1.8;overflow-wrap:anywhere}
.doc-info strong{color:#1e3a5f;font-size:10px}
.doc-content{padding:25px 38px;flex:1;display:flex;flex-direction:column;font-size:10.5px;line-height:1.8}
.doc-content p{color:#475569;margin:8px 0;line-height:1.85}
.doc-title{text-align:center;margin:12px 0 21px}
.doc-title h2{font-size:18px;letter-spacing:1.5px;color:#1e3a5f;margin:8px}
.doc-title small{color:#8491a5;font-size:9px;letter-spacing:2px;font-weight:700}
.doc-section{font-size:9.5px;letter-spacing:1.2px;color:#1e3a5f;font-weight:800;border-bottom:1px solid #dce3ec;padding-bottom:6px;margin-top:15px}
.doc-table{width:100%;border-collapse:collapse;margin:9px 0;font-size:9.5px}
.doc-table td{border-bottom:1px solid #e5eaf0;padding:7px 9px}
.doc-table td:first-child{width:36%;background:#f3f6fa;color:#1e3a5f;font-weight:700}
.doc-footer{padding:10px 18px;background:#1e3a5f;color:white;text-align:center;font-size:8.5px;line-height:1.7}
.signoff{margin-top:auto;padding-top:17px;border-top:1px solid #e1e7ef}
.signoff strong{display:block;margin-top:6px;color:#1e3a5f;font-size:11px}
.signoff small{display:block;color:#8190a5;margin-top:3px;font-size:9px}
.acceptance{border:1px solid #d5dfe9;border-radius:7px;padding:12px;margin-top:12px;background:#f8fafc}
.acceptance-line{display:inline-block;border-bottom:1px solid #66758c;width:140px;margin:0 7px}
.training-top{height:8px;background:linear-gradient(90deg,#191928 70%,#e94b17)}
.modal-tabs{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.modal-tabs button{padding:8px 13px;border:1px solid #526077;border-radius:20px;background:#26354b;color:white;font-size:9px;font-weight:700}
.modal-tabs button.active{background:#e94b17;border-color:#e94b17}
.draft{padding:7px;text-align:center;background:#fff4e8;color:#aa4b16;border:1px solid #ffd7b5;font-weight:800;font-size:9px;letter-spacing:1px}

/* LANDSCAPE COMPLETION CERTIFICATE */
.a4.completion-landscape{width:297mm;height:210mm;min-height:210mm;padding:9mm;background:#fffefa;color:#315a32}
.completion-frame{height:100%;border:5px double #7eac71;padding:7px;background:repeating-linear-gradient(0deg,transparent 0px,transparent 7px,rgba(120,174,111,.1) 8px,transparent 9px)}
.completion-inner{height:100%;border:1px solid #93bd85;padding:13px 25px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.completion-title{font-size:34px;font-weight:800;letter-spacing:2px;color:#315a32;margin:0}
.completion-company{display:flex;justify-content:center;align-items:center;gap:13px;font-size:15px;font-weight:800;letter-spacing:1px;color:#315a32}
.completion-company img{width:105px}
.completion-intro{font-size:13px;color:#526f50;margin-top:9px}
.completion-name{font-family:'Playfair Display',serif;font-size:35px;font-weight:700;color:#315a32;margin:6px 0}
.completion-statement{font-size:12px;line-height:1.8;max-width:710px;margin:auto;color:#426343}
.completion-meta{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:14px;align-items:end;color:#355e37;font-size:10px}
.completion-meta strong{display:block;font-size:11px;margin-bottom:5px}
.completion-meta small{display:block;font-size:9px;line-height:1.7}
.completion-meta .middle{border-left:1px solid #aac99f;border-right:1px solid #aac99f;padding:0 10px}

/* LANDSCAPE PARTICIPATION CERTIFICATE */
.a4.participation-landscape{width:297mm;height:210mm;min-height:210mm;padding:9mm;background:#f6f7fa;color:#1a2b46}
.participation-frame{height:100%;padding:8px;border:4px solid #1e3a5f;background:white;position:relative}
.participation-frame:before{content:"";position:absolute;inset:8px;border:1px solid #c6a96a;pointer-events:none}
.participation-inner{height:100%;padding:20px 32px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;position:relative}
.participation-top{width:100%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d4c18d;padding-bottom:12px}
.participation-title{font-size:27px;letter-spacing:4px;color:#1e3a5f;font-weight:800;margin:0}
.participation-subtitle{font-size:10px;letter-spacing:3px;color:#a57d33;font-weight:800}
.participation-badge{width:83px;height:83px;border:2px solid #c3a15a;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;color:#1e3a5f;font-size:12px;font-weight:800;line-height:1.3;background:#fbf8ed}
.participation-name{font-family:'Playfair Display',serif;font-size:34px;color:#1e3a5f;margin:3px 0}
.participation-statement{font-size:12px;line-height:1.85;color:#53647d;max-width:670px;margin:auto}
.participation-detail{display:flex;justify-content:center;gap:45px;border-top:1px solid #dfd5bc;border-bottom:1px solid #dfd5bc;padding:11px 24px;width:90%;font-size:10px;color:#52637b}
.participation-detail strong{display:block;color:#1e3a5f;margin-bottom:3px}
.participation-footer{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;width:100%;font-size:9px;color:#52637b}
.participation-footer strong{display:block;color:#1e3a5f;font-size:10px;margin-bottom:4px}
.participation-footer .company-center{border-left:1px solid #d8c99d;border-right:1px solid #d8c99d;padding:0 10px}

@media(max-width:850px){
 .app{padding:17px 12px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .template-layout{grid-template-columns:1fr}
 .panel{padding:20px}
 .form-grid{grid-template-columns:1fr}
 .a4{width:100%;height:auto;min-height:1000px}
 .a4.completion-landscape,.a4.participation-landscape{width:100%;height:auto;min-height:650px}
 .doc-content{padding:22px}
 .doc-header{padding:15px}
}
@media(max-width:520px){
 .stats{gap:8px}.stat{padding:13px}.stat strong{font-size:23px}
 .actions{width:100%}.actions .btn{flex:1}
 .hero{padding:40px 5px 30px}
 .completion-title{font-size:20px}
 .completion-name,.participation-name{font-size:25px}
 .completion-meta,.participation-footer{gap:5px;font-size:8px}
 .participation-title{font-size:19px;letter-spacing:2px}
}
@media print{
 @page{size:A4 portrait;margin:0}
 @page completionPage{size:A4 landscape;margin:0}
 @page participationPage{size:A4 landscape;margin:0}
 html,body{margin:0!important;padding:0!important;background:white!important}
 body *{visibility:hidden!important}
 #printTarget,#printTarget *{visibility:visible!important}
 .modal{position:static!important;display:block!important;padding:0!important;background:white!important;overflow:visible!important}
 .modal-inner{width:210mm!important;max-width:none!important;margin:0!important}
 .modalbar,.modal-tabs,.no-print{display:none!important}
 #printTarget{position:absolute!important;left:0!important;top:0!important}
 .a4.portrait{page:portrait;width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .a4.completion-landscape{page:completionPage;width:297mm!important;height:210mm!important;min-height:210mm!important;margin:0!important;box-shadow:none!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .a4.participation-landscape{page:participationPage;width:297mm!important;height:210mm!important;min-height:210mm!important;margin:0!important;box-shadow:none!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>

<body>
<div id="root">
<div style="padding:40px;text-align:center;font-family:Arial,sans-serif">
Loading VR PI Group platform...
</div>
</div>

<script type="text/babel">
const {useState}=React;

const COMPANY="VR PI Group Of Companies";
const EMAIL="vrpigroupoftechnology@gmail.com";
const LOCATION="Wanaparthy, Telangana, India";
const WEBSITE="https://share.google/Staafq7spnZSStc8n";
const SHEET_URL="https://docs.google.com/spreadsheets/d/1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU/edit?gid=0";
const GMAIL_URL="https://mail.google.com/mail/?authuser=vrpigroupoftechnology%40gmail.com#inbox";
const TODAY=()=>new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});

const LOGO="data:image/webp;base64,LOGO_DATA";

function CompanyLogo({className="",style={}}){
 return <img src={LOGO} alt="VR PI Group Of Companies" className={className} style={{display:"block",width:"100%",height:"auto",objectFit:"contain",...style}}/>;
}

const TEMPLATES=[
 {id:"offer",name:"Internship Offer Letter",group:"Internship",style:"offer",color:"#1e3a5f",desc:"Formal internship offer with programme particulars, terms and candidate acceptance."},
 {id:"intern-completion",name:"Internship Completion Certificate",group:"Internship",style:"completion",color:"#4f8b55",desc:"Premium green landscape completion certificate."},
 {id:"training",name:"Industrial Training Appointment Letter",group:"Training",style:"training",color:"#e94b17",desc:"Corporate industrial training appointment letter."},
 {id:"training-completion",name:"Training Completion Certificate",group:"Training",style:"completion",color:"#4f8b55",desc:"Professional certificate recognizing verified training completion."},
 {id:"participation",name:"Participation Certificate",group:"Certification",style:"participation",color:"#1e3a5f",desc:"Distinctive navy and gold landscape participation certificate."},
 {id:"experience",name:"Experience Letter",group:"Certification",style:"experience",color:"#1e3a5f",desc:"Formal company-branded experience letter."}
];

const FIELDS={
 offer:[
  {key:"name",label:"Candidate Name",required:true},
  {key:"domain",label:"Internship Domain",required:true},
  {key:"mode",label:"Programme Mode",type:"select",options:["Virtual / Remote","Hybrid","On-site"],required:true},
  {key:"duration",label:"Duration",required:true},
  {key:"startDate",label:"Start Date",type:"date",required:true}
 ],
 "intern-completion":[
  {key:"name",label:"Candidate Name",required:true},
  {key:"domain",label:"Internship Domain",required:true},
  {key:"startDate",label:"Start Date",type:"date"},
  {key:"endDate",label:"End Date",type:"date",required:true},
  {key:"duration",label:"Duration"}
 ],
 training:[
  {key:"name",label:"Candidate Name",required:true},
  {key:"domain",label:"Training Domain",required:true},
  {key:"mode",label:"Training Mode",type:"select",options:["Virtual / Remote","Hybrid","On-site"],required:true},
  {key:"duration",label:"Duration",required:true},
  {key:"startDate",label:"Start Date",type:"date",required:true}
 ],
 "training-completion":[
  {key:"name",label:"Candidate Name",required:true},
  {key:"domain",label:"Training Domain",required:true},
  {key:"startDate",label:"Start Date",type:"date"},
  {key:"endDate",label:"End Date",type:"date",required:true},
  {key:"duration",label:"Duration"},
  {key:"completionDate",label:"Completion Date",type:"date",required:true}
 ],
 participation:[
  {key:"name",label:"Candidate Name",required:true},
  {key:"eventTitle",label:"Programme / Event Name",required:true},
  {key:"participationDate",label:"Participation Date",type:"date",required:true}
 ],
 experience:[
  {key:"name",label:"Candidate Name",required:true},
  {key:"role",label:"Role / Designation",required:true},
  {key:"domain",label:"Department / Domain",required:true},
  {key:"startDate",label:"Start Date",type:"date",required:true},
  {key:"endDate",label:"End Date",type:"date",required:true}
 ]
};

function sanitize(key,value){
 if(["name","domain","role"].includes(key)){
  return value.replace(/[^a-zA-Z ]/g,"").replace(/\s+/g," ");
 }
 if(key==="duration"){
  return value.replace(/[^a-zA-Z0-9 ]/g,"").replace(/\s+/g," ");
 }
 return value;
}

const LABELS={
 name:"Candidate Name",domain:"Programme Domain",
 mode:"Programme Mode",duration:"Duration",
 startDate:"Start Date",endDate:"End Date",
 completionDate:"Completion Date",eventTitle:"Programme / Event",
 participationDate:"Participation Date",role:"Role / Designation"
};

function DetailTable({candidate,keys}){
 return <table className="doc-table"><tbody>
  {keys.map(key=>candidate[key]?(
   <tr key={key}><td>{LABELS[key]||key}</td><td>{candidate[key]}</td></tr>
  ):null)}
 </tbody></table>;
}

function DocumentHeader({color="#1e3a5f"}){
 return <div className="doc-header" style={{borderColor:color}}>
  <CompanyLogo className="doc-logo"/>
  <div className="doc-info">
   <strong>{COMPANY}</strong><br/>
   {LOCATION}<br/>{EMAIL}<br/>{WEBSITE}
  </div>
 </div>;
}

function DocumentFooter({color="#1e3a5f"}){
 return <div className="doc-footer" style={{background:color}}>
  <b>{COMPANY}</b><br/>
  {LOCATION} • {EMAIL}<br/>{WEBSITE}
 </div>;
}

function Signoff({department="Talent Acquisition Department"}){
 return <div className="signoff">
  Regards,
  <strong>{department}</strong>
  <small>{COMPANY}</small>
  <small>{LOCATION}</small>
  <small>{EMAIL}</small>
  <small>Authorized Corporate Representative</small>
 </div>;
}

function OfferLetter({c}){
 return <div className="a4 portrait">
  <div className="doc-header" style={{background:"#1e3a5f",borderColor:"#e94b17"}}>
   <CompanyLogo className="doc-logo"/>
   <div className="doc-info" style={{color:"#fff"}}>
    <strong style={{color:"#fff"}}>{COMPANY}</strong><br/>
    {LOCATION}<br/>{EMAIL}<br/>{WEBSITE}
   </div>
  </div>
  <div style={{height:4,background:"linear-gradient(90deg,#f97316,#fed7aa)"}}/>
  <div className="doc-content">
   <div className="doc-title">
    <small>OFFICIAL CORPORATE COMMUNICATION</small>
    <h2>INTERNSHIP OFFER LETTER</h2>
    <small>DATE OF ISSUE: {TODAY()}</small>
   </div>
   <p><b>To,</b><br/>{c.name}<br/>Subject: Offer of Internship</p>
   <p>Dear <b>{c.name}</b>,</p>
   <p>We are pleased to offer you an internship opportunity with <b>{COMPANY}</b> in the domain of <b>{c.domain}</b>. We welcome you to this professional learning programme.</p>
   <p>The programme is designed to provide practical exposure, strengthen relevant skills and encourage participation in guided assignments and project activities. The engagement will be conducted in <b>{c.mode}</b> mode for <b>{c.duration}</b>, commencing on <b>{c.startDate}</b>.</p>
   <div className="doc-section">INTERNSHIP PARTICULARS</div>
   <DetailTable candidate={c} keys={["name","domain","mode","duration","startDate"]}/>
   <div className="doc-section">TERMS AND CONDITIONS</div>
   <p><b>1. Professional Conduct:</b> Maintain professional behaviour, discipline and integrity throughout the programme.</p>
   <p><b>2. Assigned Responsibilities:</b> Complete assigned projects, tasks and learning activities within the timelines communicated by the coordinator.</p>
   <p><b>3. Attendance and Participation:</b> Participate in scheduled sessions, meetings and assigned programme activities.</p>
   <p><b>4. Confidentiality:</b> Company information, internal documents, project materials and confidential data must not be disclosed to unauthorized persons.</p>
   <p><b>5. Performance Evaluation:</b> Progress may be evaluated based on task completion, participation and learning outcomes.</p>
   <p><b>6. Organizational Guidelines:</b> Follow the organizational policies and instructions communicated by the authorized programme coordinator.</p>
   <p><b>7. Communication:</b> Any absence, concern or request related to the programme should be communicated to the designated coordinator.</p>
   <div className="acceptance">
    <b style={{color:"#1e3a5f"}}>CANDIDATE ACCEPTANCE</b>
    <p>I, <b>{c.name}</b>, acknowledge receipt of this internship offer and confirm that I have reviewed and understood the programme particulars and terms and conditions stated in this letter.</p>
    <p>I agree to comply with the applicable programme guidelines and professional expectations.</p>
    <div style={{marginTop:12,fontSize:10}}>
     Candidate Name: <b>{c.name}</b><br/><br/>
     Signature: <span className="acceptance-line"/><br/><br/>
     Date: <span className="acceptance-line"/>
    </div>
   </div>
   <Signoff department="Talent Acquisition Department"/>
  </div>
  <DocumentFooter/>
 </div>;
}

function TrainingLetter({c}){
 return <div className="a4 portrait">
  <div className="training-top"/>
  <div className="doc-header" style={{borderColor:"#e94b17"}}>
   <CompanyLogo className="doc-logo"/>
   <div className="doc-info">
    <strong>{COMPANY}</strong><br/>{LOCATION}<br/>{EMAIL}<br/>{WEBSITE}
   </div>
  </div>
  <div className="doc-content">
   <div style={{fontSize:10,color:"#e94b17",fontWeight:800,letterSpacing:2}}>{COMPANY.toUpperCase()}</div>
   <h2 style={{fontSize:23,color:"#111827",lineHeight:1.25,margin:"13px 0 22px"}}>INDUSTRIAL TRAINING<br/>APPOINTMENT LETTER</h2>
   <p><b>Date:</b> {TODAY()}</p>
   <p><b>Trainee Name:</b> {c.name}</p>
   <p>Dear {c.name},</p>
   <p>We are pleased to welcome you to the <b>{c.domain}</b> Industrial Training Programme at <b>{COMPANY}</b>.</p>
   <p>Your training will be conducted in <b>{c.mode}</b> mode for a duration of <b>{c.duration}</b>, commencing on <b>{c.startDate}</b>.</p>
   <div className="doc-section" style={{color:"#e94b17"}}>TRAINING PARTICULARS</div>
   <DetailTable candidate={c} keys={["name","domain","mode","duration","startDate"]}/>
   <div style={{background:"#111827",color:"#e2e8f0",padding:16,borderRadius:7,fontSize:10,lineHeight:1.9,marginTop:15}}>
    <b style={{color:"#f97316"}}>PROFESSIONAL EXPECTATIONS</b><br/>
    Maintain professional conduct, participate in assigned learning activities, complete deliverables within communicated timelines and follow organizational confidentiality guidelines.
   </div>
   <div className="acceptance">
    <b style={{color:"#e94b17"}}>TRAINEE ACKNOWLEDGEMENT</b>
    <p>I, <b>{c.name}</b>, acknowledge this training appointment and agree to follow the applicable programme guidelines.</p>
    <p>Signature: <span className="acceptance-line"/> Date: <span className="acceptance-line"/></p>
   </div>
   <Signoff department="Industrial Training Department"/>
  </div>
  <DocumentFooter color="#191928"/>
 </div>;
}

 return <div className="a4 completion-landscape">
  <div className="completion-frame">
   <div className="completion-inner">
    <h1 className="completion-title">COMPLETION CERTIFICATE</h1>
    <div>
     <div className="completion-company">
      <CompanyLogo/>
      <span>{COMPANY.toUpperCase()}</span>
     </div>
     <div style={{fontSize:10,color:"#688866",marginTop:5}}>{LOCATION}</div>

    <div>
     <div className="completion-intro">This certificate is granted to</div>
     <div className="completion-name">{c.name}</div>
     <div className="completion-statement">
      Has successfully completed the <b>{c.domain}</b> programme.
      {c.duration?` Programme duration: ${c.duration}.`:""}
      {c.startDate?` Commencement date: ${c.startDate}.`:""}
      {c.endDate?` Completion date: ${c.endDate}.`:""}
     </div>
    </div>
    <div className="completion-meta">
     <div>
      <strong>{COMPANY}</strong>
      <small>Talent Excellence Division</small>
      <small>{LOCATION}</small>
     </div>
     <div className="middle">
      <strong>Certificate Reference</strong>
      <small>To be assigned by the company</small>
      <strong style={{marginTop:8}}>Date of Issue</strong>
      <small>{TODAY()}</small>
     </div>
     <div>
      <strong>Authorized Representative</strong>
      <small>{COMPANY}</small>
      <small>{EMAIL}</small>
     </div>
    </div>
    <div className="certificate-draft">PREVIEW ONLY • VERIFY COMPLETION BEFORE OFFICIAL ISSUE</div>
   </div>
  </div>
 </div>;
}

  <div className="participation-frame">
   <div className="participation-inner">
    <div className="participation-top">
     <CompanyLogo style={{width:145,height:"auto"}}/>
     <div style={{textAlign:"right"}}>

      <div style={{fontSize:9,color:"#77869c",marginTop:5}}>{LOCATION}</div>

    <div>
     <div className="participation-subtitle">RECOGNITION OF PARTICIPATION</div>
     <h1 className="participation-title">CERTIFICATE OF PARTICIPATION</h1>
     <div style={{height:2,width:95,background:"#c3a15a",margin:"13px auto"}}/>

    <div>
     <div style={{fontSize:13,color:"#687a91"}}>This certificate is proudly presented to</div>

function ExperienceLetter({c}){
 return <div className="a4 portrait">
  <DocumentHeader/>
  <div style={{height:4,background:"linear-gradient(90deg,#1e3a5f,#e94b17)"}}/>
  <div className="doc-content" style={{padding:"29px 39px"}}>
   <div className="doc-title">
    <small>OFFICIAL CORPORATE COMMUNICATION</small>
    <h2>EXPERIENCE LETTER</h2>
    <small>DATE OF ISSUE: {TODAY()}</small>
   </div>
   <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#64748b",marginBottom:18}}>
    <strong>TO WHOM IT MAY CONCERN</strong>
    <span>{TODAY()}</span>
   </div>
   <p>Dear Sir/Madam,</p>
   <p>This letter is prepared in connection with <b>{c.name}</b> and the role of <b>{c.role}</b> within the <b>{c.domain}</b> department at <b>{COMPANY}</b>.</p>
   <p>The engagement particulars provided below are intended for formal organizational reference and should be checked against the company's authorized records before this letter is issued as an official experience credential.</p>
   <div className="doc-section">PROFESSIONAL ENGAGEMENT DETAILS</div>
   <DetailTable candidate={c} keys={["name","role","domain","startDate","endDate"]}/>
   <div className="doc-section">PROFESSIONAL RESPONSIBILITIES</div>
   <p>Throughout the engagement, the individual was expected to:</p>
   <p>1. Demonstrate professional conduct, accountability and responsibility in assigned activities.</p>
   <p>2. Follow organizational procedures and instructions communicated by the designated supervisor.</p>
   <p>3. Maintain confidentiality of company information and project-related materials.</p>
   <p>4. Complete assigned responsibilities with appropriate attention to quality and timelines.</p>
   <div className="doc-section">ORGANIZATIONAL ACKNOWLEDGEMENT</div>
   <p>We appreciate the individual's association with <b>{COMPANY}</b> and wish them continued success in their future professional endeavours.</p>
   <div className="signoff">
    Sincerely,
    <strong>Human Resources Department</strong>
    <small>{COMPANY}</small>
    <small>{LOCATION}</small>
    <small>{EMAIL}</small>
    <small>Authorized Corporate Representative</small>
   </div>
  </div>
  <DocumentFooter/>
 </div>;
}

function RenderDocument({candidate,template}){
 if(template.id==="offer")return <OfferLetter c={candidate}/>;
 if(template.id==="training")return <TrainingLetter c={candidate}/>;
 if(template.id==="experience")return <ExperienceLetter c={candidate}/>;
 if(template.id==="participation")return <ParticipationCertificate c={candidate}/>;
 return <CompletionCertificate c={candidate} t={template}/>;
}

function App(){
 const [templateId,setTemplateId]=useState("offer");
 const [form,setForm]=useState({});
 const [preview,setPreview]=useState(false);

 const template=TEMPLATES.find(t=>t.id===templateId)||TEMPLATES[0];
 const fields=FIELDS[templateId]||[];
 const missing=fields.some(f=>f.required&&!String(form[f.key]||"").trim());
 const candidate={...form,source:"manual",name:form.name||""};

 function updateField(key,value){
  setForm(old=>({...old,[key]:sanitize(key,value)}));
 }

 function chooseTemplate(id){
  setTemplateId(id);
  setForm({});
  setPreview(false);
 }

 const sheetOpen=()=>window.open(SHEET_URL,"_blank","noopener,noreferrer");
 const gmailOpen=()=>window.open(GMAIL_URL,"_blank","noopener,noreferrer");

 return <main className="app">
  <header className="header no-print">
   <a className="brand" href={WEBSITE} target="_blank" rel="noreferrer">
    <CompanyLogo className="logo"/>
   </a>
   <div className="actions">
    <a className="btn" href={WEBSITE} target="_blank" rel="noreferrer">Company Website ↗</a>
    <button className="btn" onClick={sheetOpen}>Google Sheet ↗</button>
    <button className="btn dark" onClick={gmailOpen}>Company Gmail ↗</button>
   </div>
  </header>

  <section className="hero no-print">
   <div className="eyebrow">VR PI GROUP • ENTERPRISE OPERATIONS SUITE</div>
   <h1>Enterprise Talent<br/><span style={{color:"#1e3a5f"}}>Excellence Platform</span></h1>
   <p>A unified enterprise solution for intelligent talent management, official documentation, professional certifications, and automated corporate communication.</p>
  </section>

  <section className="stats no-print">
   {[
    ["TOTAL APPLICANTS","—","Live Sheet integration disabled"],
    ["LETTERS SENT","—","Open company spreadsheet"],
    ["PENDING ACTIONS","—","Live status not loaded"],
    ["FAILED RECORDS","—","Live status not loaded"]
   ].map(([label,value,note])=>(
    <div className="stat" key={label}>
     <label>{label}</label>
     <strong>{value}</strong>
     <small>{note}</small>
    </div>
   ))}
  </section>

  <section className="panel no-print">
   <div className="kicker">COMPANY SPREADSHEET</div>
   <h2>Candidate Records</h2>
   <p className="description">
    Open the original Google Sheet to view the latest applicant information.
    This standalone file does not retrieve or modify spreadsheet data.
   </p>
   <div className="alert info">
    <b>Read-only document workflow:</b> Google Sheet access is provided
    through its direct link. Candidate details for document generation
    are entered below as temporary preview information.
   </div>
   <div style={{marginTop:18}}>
    <button className="btn dark" onClick={sheetOpen}>Open Actual Google Sheet ↗</button>
   </div>
  </section>

  <section className="panel no-print">
   <div className="kicker">OFFICIAL CORPORATE DOCUMENT LIBRARY</div>
   <h2>Professional Document Generation</h2>
   <p className="description">
    Select one of six professional templates. Enter only the fields
    required by that document, then preview it in A4 format.
   </p>

   <div className="field" style={{marginTop:22}}>
    <label>SELECT DOCUMENT TEMPLATE</label>
    <select value={templateId} onChange={e=>chooseTemplate(e.target.value)}>
     <optgroup label="Internship">
      {TEMPLATES.filter(t=>t.group==="Internship").map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
     </optgroup>
     <optgroup label="Training">
      {TEMPLATES.filter(t=>t.group==="Training").map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
     </optgroup>
     <optgroup label="Certification">
      {TEMPLATES.filter(t=>t.group==="Certification").map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
     </optgroup>
    </select>
    <div className="template-info">
     <span className="kicker" style={{color:template.color}}>VR PI • OFFICIAL DOCUMENT</span>
     <strong>{template.name}</strong>
     <p>{template.desc}</p>
     <div className="pills">
      <span className="pill">{template.group}</span>
      <span className="pill">{template.style==="completion"||template.style==="participation"?"A4 Landscape":"A4 Portrait"}</span>
      <span className="pill">PDF Preview</span>
     </div>
    </div>
   </div>

   <div className="manual-box">
    <div className="kicker">DOCUMENT-SPECIFIC DETAILS</div>
    <h2>Enter Candidate Details</h2>
    <p className="description">
     Only the information needed by the selected template is shown.
     These values will not be saved to the spreadsheet.
    </p>

    <div className="form-grid">
     {fields.map(f=>(
      <div className="form-field" key={f.key}>
       <label>{f.label}{f.required?<span style={{color:"#e94b17"}}> *</span>:""}</label>
       {f.type==="select"?
        <select value={form[f.key]||""} onChange={e=>updateField(f.key,e.target.value)}>
         <option value="">Select {f.label}</option>
         {f.options.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
        :
        <input
         type={f.type||"text"}
         value={form[f.key]||""}
         placeholder={"Enter "+f.label.toLowerCase()}
         onChange={e=>updateField(f.key,e.target.value)}
        />
       }
      </div>
     ))}
    </div>

    <div className="alert info">
     Manual details are used only for document preview.
     No spreadsheet changes, uploads, emails or database records are created.
    </div>

    <div className="form-actions">
     <button className="btn" onClick={()=>setForm({})}>Clear Details</button>
     <button className="btn orange" disabled={missing} onClick={()=>setPreview(true)}>
      Preview A4 Document →
     </button>
    </div>
   </div>
  </section>

  <footer className="footer no-print">
   <CompanyLogo className="footer-logo"/>
   <b>{COMPANY}</b><br/>
   {LOCATION}<br/>{EMAIL}<br/>
   <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a>
   <p>Enterprise Talent Excellence Platform</p>
  </footer>

  {preview&&
   <div className="modal">
    <div className="modal-inner">
     <div className="modalbar no-print">
      <strong>{template.name} • {candidate.name}</strong>
      <div className="modal-actions">
       <button className="btn orange" onClick={()=>window.print()}>Print / Save A4 PDF</button>
       <button className="btn" onClick={()=>setPreview(false)}>Close ×</button>
      </div>
     </div>
     <div className="modal-tabs no-print">
      {TEMPLATES.map(t=><button key={t.id} className={templateId===t.id?"active":""} onClick={()=>chooseTemplate(t.id)}>{t.name}</button>)}
     </div>
     <div id="printTarget">
      <RenderDocument candidate={candidate} template={template}/>
     </div>
    </div>
   </div>
  }
 </main>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
