
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR PI Group | Enterprise Talent Platform</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;color:#17243b;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1450px;margin:auto;padding:28px 32px}
.header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 0 24px;border-bottom:1px solid #dfe6ef}
.logo{width:190px;height:auto;display:block;object-fit:contain}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid #dce4ef;background:#fff;color:#263c5e;border-radius:9px;padding:12px 17px;font-size:11px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
.btn.orange{background:#ed4d18;color:#fff;border-color:#ed4d18}
.btn:hover{transform:translateY(-1px)}
.hero{text-align:center;padding:57px 10px 42px}
.eyebrow{display:inline-block;background:#fff;border:1px solid #dce4ef;border-radius:30px;padding:10px 18px;color:#72829a;font-size:10px;font-weight:800;letter-spacing:1.4px}
.hero h1{font-size:clamp(35px,5vw,58px);line-height:1.12;letter-spacing:-2.5px;color:#111b30;margin:22px 0 15px;font-weight:800}
.hero h1 span{color:#1e3a5f}
.hero p{max-width:780px;margin:auto;color:#8190a6;font-size:13px;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:15px 0 30px}
.stat{background:white;border:1px solid #dfe6ef;border-radius:17px;padding:23px 25px;min-height:135px}
.stat label{font-size:10px;color:#8492a8;font-weight:800;letter-spacing:1px}
.stat strong{display:block;font-size:37px;margin:10px 0 3px;color:#1e3a5f}
.stat small{color:#91a0b5;font-size:11px}
.stat:nth-child(2) strong{color:#128348}
.stat:nth-child(3) strong{color:#bd5700}
.stat:nth-child(4) strong{color:#e32929}
.panel{background:#fff;border:1px solid #dfe6ef;border-radius:19px;padding:30px;margin-bottom:25px;box-shadow:0 10px 35px #233b5908}
.kicker{font-size:10px;font-weight:800;letter-spacing:1.6px;color:#8795aa}
h2{font-size:22px;color:#172d4d;margin:10px 0}
.desc{font-size:12px;line-height:1.8;color:#8492a8}
.notice{padding:14px 17px;background:#f0f5fb;border:1px solid #dce6f2;color:#526780;border-radius:10px;font-size:11px;line-height:1.8;margin:16px 0}
.notice.success{background:#edfaf3;border-color:#c9eedc;color:#16764c}
.notice.warning{background:#fff5ed;border-color:#ffd9bd;color:#a64a13}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}
.toolbar input[type=file]{display:none}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:23px}
.field label{display:block;font-size:11px;font-weight:800;color:#52647f;margin-bottom:8px}
.field input,.field select{width:100%;padding:14px 15px;border:1px solid #dce4ef;border-radius:10px;background:#fff;color:#243b5c;outline:none;font-size:12px}
.field input:focus,.field select:focus{border-color:#ed4d18;box-shadow:0 0 0 3px #ed4d1810}
.field small{display:block;color:#9aa6b7;font-size:10px;margin-top:6px}
.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.template{border:1px solid #dfe6ef;border-radius:14px;padding:22px;display:flex;flex-direction:column;min-height:210px;transition:.2s}
.template.active{border:2px solid #ed4d18;background:#fffaf7}
.template h3{font-size:14px;color:#1e3a5f;margin:13px 0 8px}
.template p{font-size:11px;line-height:1.8;color:#8391a5;flex:1}
.template .btn{width:100%;margin-top:14px}
.template-color{font-size:9px;font-weight:800;letter-spacing:1.5px}
.table-wrap{overflow-x:auto;margin-top:18px}
table.records{width:100%;border-collapse:collapse;min-width:760px;font-size:11px}
.records th{background:#f5f7fa;color:#8492a8;text-align:left;padding:14px 12px;font-size:9px;letter-spacing:.5px}
.records td{padding:14px 12px;border-bottom:1px solid #edf0f5;color:#50627b}
.records tr:hover td{background:#fafbfd}
.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:9px;font-weight:800;background:#f0f3f7;color:#63758d}
.status.sent{background:#eaf8ef;color:#13804a}
.status.failed{background:#fff0f0;color:#cf2929}
.status.pending{background:#fff5e9;color:#ad600b}
.modal{position:fixed;inset:0;background:#101827ed;z-index:1000;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start}
.modal-inner{width:100%;max-width:1100px;margin:auto}
.modalbar{background:#17243a;border-radius:12px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.modalbar strong{font-size:11px;color:#fff}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modalbar select{padding:9px;border-radius:8px;border:0;font-size:10px}
.a4{width:210mm;height:297mm;min-height:297mm;margin:0 auto;background:#fff;position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 45px #0004;color:#34445d}
.doc-head{padding:22px 34px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:2px solid #1e3a5f}
.doc-head .logo{width:155px}
.doc-company{text-align:right;font-size:9px;line-height:1.9;color:#697990}
.doc-company strong{color:#1e3a5f;font-size:10px}
.doc-topline{height:5px;background:linear-gradient(90deg,#d0003c 0 50%,#f05f00 50% 100%)}
.doc-body{padding:29px 39px 24px;flex:1;display:flex;flex-direction:column;font-size:10.5px;line-height:1.85}
.doc-title{text-align:center;margin:12px 0 23px}
.doc-title .overline{font-size:9px;font-weight:800;letter-spacing:2.3px;color:#8492a8}
.doc-title h2{font-size:20px;letter-spacing:1px;color:#1e3a5f;margin:10px 0}
.doc-title small{font-size:9px;color:#8391a5;letter-spacing:1px}
.doc-body p{margin:8px 0;color:#53647c}
.doc-body b{color:#1e3a5f}
.doc-section{font-size:10px;letter-spacing:1.3px;font-weight:800;color:#1e3a5f;border-bottom:1px solid #dce4ef;padding-bottom:7px;margin:16px 0 7px}
.doc-table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:10px}
.doc-table td{padding:8px 10px;border-bottom:1px solid #e5eaf0}
.doc-table td:first-child{width:36%;background:#f3f6fa;color:#1e3a5f;font-weight:700}
.doc-list{padding-left:18px;margin:5px 0;color:#53647c}
.doc-list li{padding:3px 0}
.acceptance{border:1px solid #cfd9e5;border-radius:7px;padding:12px 15px;margin-top:14px;background:#f9fbfd}
.acceptance strong{color:#1e3a5f}
.signoff{margin-top:auto;padding-top:22px}
.signoff strong{display:block;color:#1e3a5f;margin-top:5px;font-size:11px}
.signoff small{display:block;color:#8492a8;font-size:9px}
.doc-footer{padding:11px 20px;background:#1e3a5f;color:#fff;text-align:center;font-size:9px;line-height:1.8}
.certificate{border:9px double #8ab77f;margin:13mm;width:calc(100% - 26mm);height:calc(100% - 26mm);min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 34px;position:relative;background:repeating-linear-gradient(0deg,#fff 0,#fff 10px,#f7fbf5 11px,#fff 12px);color:#315533}
.certificate.completion{border-color:#80aa76}
.certificate.participation{border-color:#b28b55;background:repeating-linear-gradient(0deg,#fff 0,#fff 12px,#fbf8f1 13px,#fff 14px);color:#72552d}
.certificate h1{font-size:34px;letter-spacing:2px;margin:10px 0 12px;color:inherit}
.certificate .cert-company{font-size:15px;font-weight:800;margin:10px 0 30px}
.certificate .cert-intro{font-size:14px;margin-top:8px}
.certificate .cert-name{font-family:'DM Serif Display',serif;font-size:39px;margin:12px 0 15px;color:inherit}
.certificate .cert-copy{font-size:14px;line-height:1.9;max-width:600px}
.cert-bottom{width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;font-size:11px}
.cert-bottom div{width:30%}
.cert-line{border-top:1px solid currentColor;padding-top:7px;margin-top:36px}
.experience-band{background:#1e3a5f;color:white;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}
.experience-band .logo{width:145px;background:white;padding:5px;border-radius:4px}
.experience-band .company-white{text-align:right;font-size:9px;line-height:1.8}
.footer{text-align:center;padding:25px 0;color:#8996a9;font-size:10px;line-height:2}
.footer .logo{width:150px;margin:0 auto 10px}
.empty{text-align:center;padding:30px;color:#93a0b3;font-size:12px}
.search{padding:11px 14px;border:1px solid #dce4ef;border-radius:9px;min-width:220px;font-size:11px}
@media(max-width:850px){
 .app{padding:16px}
 .stats{grid-template-columns:1fr 1fr}
 .templates{grid-template-columns:1fr 1fr}
 .field-grid{grid-template-columns:1fr}
 .panel{padding:20px}
 .header{align-items:flex-start}
 .a4{width:100%;height:auto;min-height:1050px}
 .certificate{min-height:950px}
}
@media(max-width:540px){
 .templates,.stats{grid-template-columns:1fr}
 .hero{padding:35px 5px}
 .hero h1{letter-spacing:-1px}
 .logo{width:145px}
}
@media print{
 @page{size:A4 portrait;margin:0}
 html,body{margin:0!important;padding:0!important;background:white!important}
 body *{visibility:hidden!important}
 #printTarget,#printTarget *{visibility:visible!important}
 .modal{position:static!important;display:block!important;background:white!important;padding:0!important;overflow:visible!important}
 .modal-inner{width:210mm!important;max-width:none!important;margin:0!important}
 .modalbar,.no-print{display:none!important}
 #printTarget{position:absolute!important;top:0!important;left:0!important;width:210mm!important}
 .a4{width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}
 .certificate{width:calc(100% - 26mm)!important;height:calc(100% - 26mm)!important;min-height:0!important}
}
</style>
</head>

function csvParse(text){
 const rows=[];
 let row=[],cell="",quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i],next=text[i+1];
  if(ch==='"'&&quoted&&next==='"'){cell+='"';i++}
  else if(ch==='"'){quoted=!quoted}
  else if(ch===","&&!quoted){row.push(cell.trim());cell=""}
  else if((ch==="\n"||ch==="\r")&&!quoted){
   if(ch==="\r"&&next==="\n")i++;
   row.push(cell.trim());
   if(row.some(x=>x!==""))rows.push(row);
   row=[];cell="";
  }else cell+=ch;
 }
 row.push(cell.trim());
 if(row.some(x=>x!==""))rows.push(row);
 if(rows.length<2)return [];
 const headers=rows[0].map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,""));
 const find=(obj,names)=>{
  const idx=headers.findIndex(h=>names.some(n=>h===n));
  return idx>=0?obj[idx]||"":"";
 };
 return rows.slice(1).map(r=>({
  name:find(r,["fullname","name","candidatename"]),
  email:find(r,["email","emailaddress"]),
  domain:find(r,["domain","internshipdomain","trainingdomain","track"]),
  mode:find(r,["mode","programmemode"]),
  duration:find(r,["duration","programmeduration"]),
  startDate:find(r,["startdate","joiningdate","commencementdate"]),
  endDate:find(r,["enddate","internshipenddate"]),
  status:find(r,["applicationstatus","emailstatus","letterstatus","status","lettersent"]),
  pdf:find(r,["pdflink","pdfrecord"])
 })).filter(r=>r.name||r.email);
}

   <h1>{title}</h1>
   <div className="cert-company">{COMPANY.toUpperCase()}</div>
   <div className="cert-intro">{participation?"This certificate is proudly presented to":"This certificate is awarded to"}</div>
   <div className="cert-name">{data.name}</div>
   <div className="cert-copy">
    {message}<br/><br/>
    Programme Domain: <b>{data.domain}</b><br/>
    Programme Mode: <b>{data.mode}</b><br/>
    Duration: <b>{data.duration}</b><br/>
    {data.startDate&&<>Programme Start Date: <b>{data.startDate}</b></>}
   </div>
   <div className="cert-bottom">
    <div><div className="cert-line"><b>Authorized Signatory</b><br/>{COMPANY}</div></div>
    <div><div className="cert-line"><b>Date of Issue</b><br/>{today()}</div></div>
    <div><div className="cert-line"><b>Company Location</b><br/>{LOCATION}</div></div>
   </div>
  </div>
 </div>;
}

function ExperienceDocument({data}){
 return <div className="a4">
  <div className="experience-band">
   <Logo/>
   <div className="company-white">
    <b>{COMPANY}</b><br/>{LOCATION}<br/>{EMAIL}
   </div>
  </div>
  <div className="doc-body" style={{padding:"43px 43px"}}>
   <div className="doc-title">
    <div className="overline">OFFICIAL CORPORATE COMMUNICATION</div>
    <h2>EXPERIENCE LETTER</h2>
    <small>{today()}</small>
   </div>
   <p>TO WHOM IT MAY CONCERN,</p>
   <p>This is to certify that <b>{data.name}</b> has been associated with <b>{COMPANY}</b> in the capacity of a participant in the <b>{data.domain}</b> programme.</p>
   <p>The engagement was conducted in <b>{data.mode}</b> mode for a duration of <b>{data.duration}</b>, commencing on <b>{data.startDate}</b>.</p>
   <p>During this engagement, the candidate was involved in domain-related activities, practical assignments and professional learning initiatives. The programme provided opportunities to apply relevant concepts, strengthen technical understanding and develop workplace skills.</p>
   <div className="doc-section">PROFESSIONAL DETAILS</div>
   <DetailTable data={data} fields={[
    ["Candidate Name","name"],
    ["Programme Domain","domain"],
    ["Programme Mode","mode"],
    ["Duration","duration"],
    ["Start Date","startDate"]
   ]}/>
   <p>We appreciate the candidate's participation and contribution during the engagement and wish them success in their future academic and professional endeavours.</p>
   <p>This letter is issued upon request for professional record and verification purposes.</p>
   <Signoff department="Human Resources and Corporate Relations"/>
  </div>
  <CompanyFooter/>
 </div>;
}

function InternshipCompletionDocument({data}){
 return <div className="a4">
  <div className="doc-topline"/>
  <CompanyHeader/>
  <div className="doc-body" style={{padding:"38px 44px"}}>
   <div className="doc-title">
    <div className="overline" style={{color:"#087b7b"}}>OFFICIAL PROGRAMME RECORD</div>
    <h2>INTERNSHIP COMPLETION LETTER</h2>
    <small>{today()}</small>
   </div>
   <p>Dear <b>{data.name}</b>,</p>
   <p>We are pleased to acknowledge the successful completion of your internship programme with <b>{COMPANY}</b> in the domain of <b>{data.domain}</b>.</p>
   <p>Throughout the programme, you participated in learning activities and practical assignments designed to strengthen your domain knowledge, professional capabilities and understanding of workplace practices.</p>
   <div className="doc-section" style={{color:"#087b7b"}}>PROGRAMME RECORD</div>
   <DetailTable data={data} fields={[
    ["Candidate Name","name"],
    ["Programme Domain","domain"],
    ["Programme Mode","mode"],
    ["Duration","duration"],
    ["Start Date","startDate"]
   ]}/>
   <p>We acknowledge your participation and appreciate the time and effort invested during the programme. We encourage you to continue developing your skills and applying your learning in future professional opportunities.</p>
   <p>We wish you every success in your future endeavours.</p>
   <Signoff department="Talent Development Department"/>
  </div>
  <CompanyFooter color="#087b7b"/>
 </div>;
}

function DocumentView({template,data}){
 if(template==="offer")return <OfferDocument data={data}/>;
 if(template==="training")return <TrainingDocument data={data}/>;
 if(template==="completion")return <Certificate data={data}/>;
 if(template==="participation")return <Certificate data={data} participation/>;
 if(template==="experience")return <ExperienceDocument data={data}/>;
 return <InternshipCompletionDocument data={data}/>;
}

function App(){
 const [records,setRecords]=useState([]);
 const [mode,setMode]=useState("manual");
 const [templateId,setTemplateId]=useState("offer");
 const [preview,setPreview]=useState(false);
 const [search,setSearch]=useState("");
 const [selectedIndex,setSelectedIndex]=useState("");
 const [message,setMessage]=useState("Import the latest CSV export from your Google Sheet to display live candidate records here.");
 const [data,setData]=useState({
  name:"",domain:"",mode:"Online",duration:"3 Months",startDate:""
 });
 const fileRef=useRef(null);

 const template=TEMPLATES.find(t=>t.id===templateId);
 const update=(key,value)=>setData(old=>({...old,[key]:value}));

 const filtered=useMemo(()=>records.filter(r=>
  [r.name,r.email,r.domain,r.status].join(" ").toLowerCase().includes(search.toLowerCase())
 ),[records,search]);

 const sent=records.filter(r=>/sent|success|issued|completed/i.test(r.status)).length;
 const failed=records.filter(r=>/fail|error/i.test(r.status)).length;
 const pending=records.length-sent-failed;

 function importCSV(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
   const parsed=csvParse(String(reader.result||""));
   if(!parsed.length){
    setMessage("No candidate rows were found. Check that the CSV has a header row containing Full Name, Domain, Mode, Duration and Start Date.");
    return;
   }
   setRecords(parsed);
   setSelectedIndex("");
   setMessage(parsed.length+" candidate records imported successfully from the Google Sheets CSV. Import a new CSV whenever the Sheet changes.");
  };
  reader.onerror=()=>setMessage("Unable to read this CSV file. Please export it again from Google Sheets.");
  reader.readAsText(file);
 }

 function chooseRecord(index){
  const c=records[Number(index)];
  if(!c)return;
  setSelectedIndex(index);
  setMode("sheet");
  setData({
   name:cleanLetters(c.name||""),
   domain:cleanLetters(c.domain||""),
   mode:cleanLetters(c.mode||"Online")||"Online",
   duration:cleanDuration(c.duration||"3 Months"),
   startDate:c.startDate||""
  });
 }

 function valid(){
  if(!data.name.trim()||!data.domain.trim()||!data.mode.trim()||!data.duration.trim()||!data.startDate){
   setMessage("Please complete all required fields before previewing the document.");
   return false;
  }
  return true;
 }

 function openPreview(id){
  if(id)setTemplateId(id);
  if(!valid())return;
  setPreview(true);
 }

 return <main className="app">
  <header className="header no-print">
   <Logo style={{width:190}}/>
   <div className="actions">
    <a className="btn" href={WEBSITE} target="_blank" rel="noreferrer">Company Website ↗</a>
    <a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Google Sheet ↗</a>
    <a className="btn primary" href={GMAIL_URL} target="_blank" rel="noreferrer">Company Gmail ↗</a>
   </div>
  </header>

  <section className="hero no-print">
   <div className="eyebrow">VR PI GROUP • ENTERPRISE OPERATIONS SUITE</div>
   <h1>Enterprise Talent<br/><span>Excellence Platform</span></h1>
   <p>A professional corporate platform for candidate records, official internship documentation, training appointments, experience letters and certificates.</p>
  </section>

  <section className="stats no-print">
   <div className="stat"><label>TOTAL APPLICANTS</label><strong>{records.length}</strong><small>Imported Google Sheet records</small></div>
   <div className="stat"><label>LETTERS SENT</label><strong>{sent}</strong><small>Based on imported status values</small></div>
   <div className="stat"><label>PENDING ACTIONS</label><strong>{pending}</strong><small>Records not marked sent or failed</small></div>
   <div className="stat"><label>FAILED RECORDS</label><strong>{failed}</strong><small>Based on imported status values</small></div>
  </section>

  <section className="panel no-print">
   <div className="kicker">LIVE DATA MANAGEMENT • CSV IMPORT</div>
   <h2>Candidate Records</h2>
   <p className="desc">Import the latest CSV downloaded from your company Google Sheet. The dashboard reads the imported records without a database or backend.</p>
   <div className="notice warning">{message}<br/><br/>Private Google Sheets cannot be read directly by a local HTML file without an authenticated integration. This page does not make your candidate data public.</div>
   <div className="toolbar">
    <button className="btn primary" onClick={()=>fileRef.current.click()}>Import Google Sheet CSV</button>
    <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={e=>importCSV(e.target.files[0])}/>
    <a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Open Company Sheet ↗</a>
    <input className="search" placeholder="Search name, email or domain..." value={search} onChange={e=>setSearch(e.target.value)}/>
   </div>
   <div className="table-wrap">
    <table className="records">
     <thead><tr><th>FULL NAME</th><th>EMAIL</th><th>DOMAIN</th><th>MODE</th><th>DURATION</th><th>STATUS</th><th>ACTION</th></tr></thead>
     <tbody>
      {filtered.map((r,i)=>{
       const original=records.indexOf(r);
       const s=/sent|success|issued|completed/i.test(r.status)?"sent":/fail|error/i.test(r.status)?"failed":"pending";
       return <tr key={original}>
        <td><b>{r.name||"—"}</b></td>
        <td>{r.email||"—"}</td>
        <td>{r.domain||"—"}</td>
        <td>{r.mode||"—"}</td>
        <td>{r.duration||"—"}</td>
        <td><span className={"status "+s}>{r.status||"Not specified"}</span></td>
        <td><button className="btn" onClick={()=>chooseRecord(String(original))}>Use Record</button></td>
       </tr>;
      })}
      {!filtered.length&&<tr><td colSpan="7"><div className="empty">No imported candidate records. Import your Google Sheet CSV to display records.</div></td></tr>}
     </tbody>
    </table>
   </div>
  </section>

  <section className="panel no-print">
   <div className="kicker">CORPORATE DOCUMENT LIBRARY</div>
   <h2>Professional Document Generation</h2>
   <p className="desc">Choose a candidate record or enter details manually. Manual details are used only to generate the preview and are not added to your Google Sheet.</p>

   <div className="toolbar">
    <button className={"btn "+(mode==="sheet"?"primary":"")} onClick={()=>setMode("sheet")}>Use Google Sheet Record</button>
    <button className={"btn "+(mode==="manual"?"primary":"")} onClick={()=>{setMode("manual");setSelectedIndex("");setData({name:"",domain:"",mode:"Online",duration:"3 Months",startDate:""})}}>Enter Candidate Details Manually</button>
   </div>

   {mode==="sheet"&&<div className="notice">
    <b>Select an imported candidate</b>
    <div className="field" style={{marginTop:10}}>
     <select value={selectedIndex} onChange={e=>chooseRecord(e.target.value)}>
      <option value="">Select candidate from imported records</option>
      {records.map((r,i)=><option value={i} key={i}>{r.name} {r.email?"— "+r.email:""}</option>)}
     </select>
    </div>
    {!records.length&&<p>No imported records. Import your Google Sheet CSV above first.</p>}
   </div>}

   <div className="kicker" style={{marginTop:25}}>CANDIDATE DOCUMENT DETAILS</div>
   <h2>Create a document from your details</h2>
   <p className="desc">Only the information required for professional document generation is requested.</p>

   <div className="field-grid">
    <div className="field">
     <label>FULL NAME *</label>
     <input value={data.name} maxLength="70" placeholder="Enter candidate full name" onChange={e=>update("name",cleanLetters(e.target.value))}/>
     <small>Letters and spaces only.</small>
    </div>
    <div className="field">
     <label>PROGRAMME DOMAIN *</label>
     <input value={data.domain} maxLength="80" placeholder="Example: Cloud Computing" onChange={e=>update("domain",cleanLetters(e.target.value))}/>
     <small>Letters and spaces only.</small>
    </div>
    <div className="field">
     <label>PROGRAMME MODE *</label>
     <input value={data.mode} maxLength="30" placeholder="Online, Offline or Hybrid" onChange={e=>update("mode",cleanLetters(e.target.value))}/>
     <small>Letters and spaces only.</small>
    </div>
    <div className="field">
     <label>PROGRAMME DURATION *</label>
     <input value={data.duration} maxLength="30" placeholder="Example: 3 Months" onChange={e=>update("duration",cleanDuration(e.target.value))}/>
     <small>Letters, numbers and spaces only.</small>
    </div>
    <div className="field">
     <label>START DATE *</label>
     <input type="date" value={data.startDate} onChange={e=>update("startDate",e.target.value)}/>
    </div>
    <div className="field">
     <label>DOCUMENT ISSUE DATE</label>
     <input value={today()} disabled/>
    </div>
   </div>

   <div className="notice success">Company details are automatically included in the documents: {COMPANY}, {LOCATION} and {EMAIL}. Your exact uploaded logo is embedded in this HTML file.</div>

   <div className="kicker" style={{marginTop:30}}>SELECT DOCUMENT TEMPLATE</div>
   <div className="templates">
    {TEMPLATES.map(t=><article className={"template "+(templateId===t.id?"active":"")} key={t.id}>
     <span className="template-color" style={{color:t.color}}>VR PI • OFFICIAL DOCUMENT</span>
     <h3>{t.name}</h3>
     <p>{t.desc}</p>
     <button className="btn primary" onClick={()=>openPreview(t.id)}>Preview A4 Document →</button>
    </article>)}
   </div>

   <div style={{display:"flex",justifyContent:"flex-end",marginTop:23}}>
    <button className="btn orange" onClick={()=>openPreview(templateId)}>Open A4 / PDF Preview</button>
   </div>
  </section>

  <footer className="footer no-print">
   <Logo/>
   <b>{COMPANY}</b><br/>
   {LOCATION}<br/>
   {EMAIL}<br/>
   <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a>
   <p>Enterprise Talent Excellence Platform</p>
  </footer>

  {preview&&<div className="modal">
   <div className="modal-inner">
    <div className="modalbar no-print">
     <strong>{template.name} • {data.name}</strong>
     <div className="modal-actions">
      <select value={templateId} onChange={e=>setTemplateId(e.target.value)}>
       {TEMPLATES.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
      </select>
      <button className="btn orange" onClick={()=>window.print()}>Print / Save PDF</button>
      <button className="btn" onClick={()=>setPreview(false)}>Close ×</button>
     </div>
    </div>
    <div id="printTarget">
     <DocumentView template={templateId} data={data}/>
    </div>
   </div>
  </div>}
 </main>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
