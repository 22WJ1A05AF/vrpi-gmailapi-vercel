.btn{padding:11px 16px;border:1px solid #dfe6ef;background:white;border-radius:9px;color:#263d5e;text-decoration:none;font-size:11px;font-weight:800}
.dark{background:#1e3a5f;color:white}

.panel{padding:27px;margin-bottom:24px;box-shadow:0 10px 32px #263b5909}
.kicker{font-size:10px;font-weight:800;color:#8291a6;letter-spacing:1.5px}

const TEMPLATES=[
 {id:"offer",name:"Internship Offer Letter",kind:"offer",group:"Internship",color:"#1e3a5f",desc:"Formal internship offer with professional terms and candidate acceptance."},

];

const clean=s=>String(s??"").trim();
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

function cellValue(cell){
 if(!cell)return "";
 if(cell.f)return String(cell.f).trim();
 return cell.v==null?"":String(cell.v).trim();
}
function colIndex(cols,names,fallback=-1){
 const labels=cols.map(c=>norm(c.label||c.id));
 for(const n of names){
  const i=labels.indexOf(norm(n));
  if(i>=0)return i;
 }
 return fallback;
}
function mapRow(row,cols,i){
 const ix={
  timestamp:colIndex(cols,["Timestamp"],0),
  aid:colIndex(cols,["Application ID","Application Id"],1),
  name:colIndex(cols,["Full Name","Name"],2),
  email:colIndex(cols,["Email Address","Email"],3),
  phone:colIndex(cols,["WhatsApp / Phone","WhatsApp","Phone"],4),
  college:colIndex(cols,["College","Institution"],5),
  degree:colIndex(cols,["Degree","Qualification"],6),
  domain:colIndex(cols,["Domain","Internship Domain","Track"],7),
  mode:colIndex(cols,["Mode","Programme Mode","Work Mode"]),
  status:colIndex(cols,["Letter Sent","Email Sent Status","Email Status","Email Delivery Status","Mail Status","Application Status","Status"],17),
  pdf:colIndex(cols,["PDF Record","PDF Link"],18),
  updated:colIndex(cols,["Last Updated","Updated At"],19),
  joining:colIndex(cols,["Joining Date","Start Date","Commencement Date"]),
  endDate:colIndex(cols,["End Date","Internship End Date"]),
  duration:colIndex(cols,["Duration","Programme Duration"]),
  completionDate:colIndex(cols,["Completion Date"]),
  completionStatus:colIndex(cols,["Completion Status","Training Completion Status","Certificate Status"]),
  participationStatus:colIndex(cols,["Participation Status","Attendance Status"]),
  project:colIndex(cols,["Project Name","Project Title"])
 };
 const v=k=>cellValue(row.c?.[ix[k]]);
 const raw={};
 cols.forEach((c,j)=>{raw[c.label||c.id||`Column ${j+1}`]=cellValue(row.c?.[j]);});
 return {
  key:v("aid")||`row-${i+2}`,
  aid:v("aid"),name:v("name"),email:v("email"),phone:v("phone"),
  college:v("college"),degree:v("degree"),domain:v("domain"),
  mode:v("mode"),status:v("status")||"Not recorded",
  pdf:v("pdf"),updated:v("updated"),timestamp:v("timestamp"),
  joining:v("joining"),endDate:v("endDate"),duration:v("duration"),
  completionDate:v("completionDate"),completionStatus:v("completionStatus"),
  participationStatus:v("participationStatus"),project:v("project"),
  raw,manual:false
 };
}

let requestNumber=0;
function loadSheet(){
 return new Promise((resolve,reject)=>{
  const cb="vrpiSheetCallback"+(++requestNumber);
  const script=document.createElement("script");
  let done=false;
  const finish=(err,data)=>{
   if(done)return;
   done=true;
   clearTimeout(timer);
   script.remove();
   try{delete window[cb]}catch(e){window[cb]=undefined}
   if(err)reject(err);else resolve(data);
  };
  const timer=setTimeout(()=>finish(new Error("Google Sheets timed out. Check link access and worksheet ID.")),18000);
  window[cb]=response=>{
   if(!response?.table){finish(new Error("Google Sheets did not return data. Check Anyone with the link — Viewer permission."));return;}
   if(response.status&&response.status!=="ok"){finish(new Error("Google Sheets returned an error."));return;}
   finish(null,response.table);
  };
  const tqx=encodeURIComponent(`out:json;responseHandler:${cb};reqId:0`);
  script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=${tqx}&_=${Date.now()}`;
  script.async=true;
  script.onerror=()=>finish(new Error("Could not reach Google Sheets. Check your internet connection and sharing permission."));
  document.head.appendChild(script);
 });
}
async function getCandidates(){
 const table=await loadSheet();
 return (table.rows||[]).map((r,i)=>mapRow(r,table.cols||[],i)).filter(r=>r.name||r.email||r.aid);
}
function verified(c,kind){
 if(c.manual)return false;
 const s=kind==="participation"?c.participationStatus:c.completionStatus;
 return /completed|complete|verified|approved|issued|participated|passed/i.test(String(s||""));
}

  <div style={{background:"#1e3a5f",padding:"21px 34px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:14}}>
   <Logo style={{width:155,height:78}}/>
   <div style={{textAlign:"right",color:"#e2e8f0",fontSize:9,lineHeight:1.9}}>
    <b style={{color:"white"}}>{COMPANY}</b><br/>{LOCATION}<br/>{EMAIL}<br/>{WEBSITE}
   </div>
  </div>
  <div style={{height:4,background:"linear-gradient(90deg,#f97316,#fed7aa)"}}/>
  <div className="doc-content">
   <div className="doc-title">
    <small>OFFICIAL CORPORATE COMMUNICATION</small>
    <h2>INTERNSHIP OFFER LETTER</h2>
    <small>DATE ISSUED: {TODAY}</small>
   </div>
   <p><b>To: {c.name}</b></p>
   <p>Dear {c.name},</p>
   <p>We are pleased to offer you an internship opportunity with <b>{COMPANY}</b> in the <b>{c.domain||"designated programme domain"}</b> domain. We welcome you to this professional learning engagement and look forward to your contribution.</p>
   <p>This offer outlines the programme information and the professional expectations applicable during your internship.</p>
   <div className="doc-section">INTERNSHIP PARTICULARS</div>
   <Table candidate={c} fields={[
    ["Candidate Name","name"],["Programme Domain","domain"],
    ["Programme Mode","mode"],["Start Date","joining"],["Duration","duration"]
   ]}/>
   <div className="doc-section">TERMS AND CONDITIONS</div>
   <p><b>1. Professional Conduct:</b> The candidate shall maintain professional behaviour, punctuality and respectful communication throughout the programme.</p>
   <p><b>2. Assigned Responsibilities:</b> Assigned activities, learning tasks and project deliverables must be completed within the timelines communicated by the programme coordinator.</p>
   <p><b>3. Confidentiality:</b> Internal documents, credentials, business information and project materials must not be disclosed or misused.</p>
   <p><b>4. Attendance and Participation:</b> The candidate is expected to follow the programme schedule and notify the coordinator of any unavoidable absence.</p>
   <p><b>5. Company Policies:</b> All applicable organizational instructions, information-security requirements and programme guidelines must be followed.</p>
   <p><b>6. Completion:</b> Any completion credential will be considered only after the programme requirements and records have been reviewed by the authorized department.</p>
   <div style={{marginTop:15,padding:14,border:"1px solid #d8e0ea",background:"#f8fafc",borderRadius:6}}>
    <b style={{color:"#1e3a5f"}}>CANDIDATE ACCEPTANCE</b>
    <p>I, <b>{c.name}</b>, acknowledge receipt of this internship offer and agree to follow the programme terms and conditions stated above.</p>
    <p>Candidate Signature: __________________________</p>
    <p>Date: __________________________</p>
   </div>
   <Signoff/>
  </div>
  <Footer/>
 </div>;
}
function TrainingDocument({c}){
 return <div className="a4">
  <div className="training-top"/>
  <LogoHeader candidate={c} color="#e94b17"/>
  <div className="doc-content" style={{padding:"36px 43px"}}>
   <div style={{color:"#e94b17",fontWeight:800,fontSize:10,letterSpacing:2}}>{COMPANY.toUpperCase()}</div>
   <h2 style={{fontSize:24,color:"#17233a",lineHeight:1.3}}>TRAINING APPOINTMENT LETTER</h2>
   <p><b>Date:</b> {TODAY}</p>
   <p><b>Candidate:</b> {c.name}</p>
   <p>Dear {c.name},</p>
   <p>We are pleased to confirm your training appointment with <b>{COMPANY}</b> for the <b>{c.domain||"designated training programme"}</b> programme. This engagement is intended to provide structured practical exposure and professional development.</p>
   <div className="doc-section" style={{color:"#e94b17"}}>TRAINING PARTICULARS</div>
   <Table candidate={c} fields={[
    ["Trainee Name","name"],["Training Domain","domain"],
    ["Programme Mode","mode"],["Commencement Date","joining"],["Duration","duration"]
   ]}/>
   <div className="doc-section" style={{color:"#e94b17"}}>PROGRAMME EXPECTATIONS</div>
   <p>1. Follow the training schedule and instructions communicated by the training department.</p>
   <p>2. Participate actively in assigned exercises, practical sessions and project activities.</p>
   <p>3. Maintain professional conduct and cooperate with mentors and team members.</p>
   <p>4. Protect confidential information and use company resources responsibly.</p>
   <p>5. Complete assigned work and submit progress updates within the communicated timelines.</p>
   <p>6. Raise any programme-related concerns with the authorized coordinator.</p>
   <Signoff title="Head, Industrial Training Department"/>
  </div>
  <Footer color="#191928"/>
  <div style={{height:5,background:"#e94b17"}}/>
 </div>;
}
function FormalDocument({c,t}){
 const isParticipation=t.kind==="participation";
 const isExperience=t.kind==="experience";
 const isCompletion=t.kind==="completion";
 const isVerified=verified(c,isParticipation?"participation":"completion");
 const title=t.name.toUpperCase();
 let message;
 if(isExperience){
  message=`This letter confirms that ${c.name} was associated with ${COMPANY} in the ${c.domain||"designated"} domain. The engagement information below is provided for official reference and verification.`;
 }else if(isParticipation){
  message=isVerified
   ?`This certificate recognizes the verified participation of ${c.name} in the ${c.domain||"programme"} programme organized by ${COMPANY}.`
   :`This preview recognizes the proposed participation of ${c.name} in the ${c.domain||"programme"} programme. Attendance and participation must be verified before official issue.`;
 }else{
  message=isVerified
   ?`This document confirms that ${c.name} successfully completed the ${c.domain||"designated"} programme with ${COMPANY}.`
   :`This document has been prepared for ${c.name} in connection with the ${c.domain||"designated"} programme at ${COMPANY}. Completion must be verified by the authorized department before official issue.`;
 }
 if(isParticipation){
  return <div className="a4">
   <LogoHeader candidate={c} color="#0d7377"/>
   {!isVerified&&<div className="draft">DRAFT PREVIEW • PARTICIPATION VERIFICATION REQUIRED</div>}
   <div className="certificate">
    <div className="certificate-inner">
     <div style={{fontSize:11,fontWeight:800,letterSpacing:3}}>VR PI GROUP OF COMPANIES</div>
     <h2>PARTICIPATION CERTIFICATE</h2>
     <p>This certificate is presented to</p>
     <div className="recipient">{c.name}</div>
     <p>{message}</p>
     <p><b>Programme:</b> {c.domain||"Not provided"}</p>
     <p><b>Mode:</b> {c.mode||"Not provided"} &nbsp; <b>Duration:</b> {c.duration||"Not provided"}</p>
     <div style={{display:"flex",justifyContent:"space-between",width:"100%",marginTop:35,gap:20}}>
      <div>_________________<br/><b>Authorized Signatory</b><br/>VR PI Group</div>
      <div>_________________<br/><b>Date of Issue</b><br/>{TODAY}</div>
     </div>
    </div>
   </div>
   <Footer color="#0d7377"/>
  </div>;
 }
 return <div className="a4">
  <LogoHeader candidate={c} color={isExperience?"#1e3a5f":"#0d7377"}/>
  {!isVerified&&isCompletion&&<div className="draft">DRAFT PREVIEW • COMPLETION VERIFICATION REQUIRED</div>}
  <div className="doc-content" style={{padding:"35px 45px"}}>
   <div className="doc-title">
    <small>OFFICIAL CORPORATE COMMUNICATION</small>
    <h2>{title}</h2>
    <small>{TODAY}</small>
   </div>
   {isExperience?<p>TO WHOM IT MAY CONCERN,</p>:<p>Respected {c.name},</p>}
   <p>{message}</p>
   <p>The following engagement particulars are provided for official reference and verification.</p>
   <div className="doc-section">PROFESSIONAL DETAILS</div>
   <Table candidate={c} fields={[
    ["Candidate Name","name"],["Programme Domain","domain"],
    ["Programme Mode","mode"],["Start Date","joining"],
    ["End Date","endDate"],["Duration","duration"],
    ["Completion Date","completionDate"]
   ]}/>
   {isExperience&&<>
    <p>During this association, the candidate was expected to demonstrate professional responsibility, cooperation, effective communication and commitment to assigned activities.</p>
    <p>We appreciate the candidate's professional contribution and wish them continued success in their future endeavours.</p>
   </>}
   {isCompletion&&<p>We appreciate the candidate's dedication, participation and efforts during the programme and wish them success in future professional pursuits.</p>}
   <Signoff title={isExperience?"Human Resources Department":"Talent Excellence Division"}/>
  </div>
  <Footer color={isExperience?"#1e3a5f":"#0d7377"}/>
 </div>;
}

function App(){
 const [records,setRecords]=useState([]);
 const [selected,setSelected]=useState("");
 const [templateId,setTemplateId]=useState("offer");
 const [search,setSearch]=useState("");
 const [loading,setLoading]=useState(true);
 const [error,setError]=useState("");
 const [lastSync,setLastSync]=useState("");
 const [preview,setPreview]=useState(false);
 const [entryMode,setEntryMode]=useState("sheet");
 const [manual,setManual]=useState({name:"",domain:"",mode:"",duration:"",joining:"",completionDate:"",completionStatus:"",participationStatus:""});
 const [manualCandidate,setManualCandidate]=useState(null);

 const refresh=useCallback(async()=>{
  setLoading(true);
  setError("");
  try{
   const data=await getCandidates();
   setRecords(data);
   setSelected(old=>data.some(c=>c.key===old)?old:(data[0]?.key||""));
   setLastSync(new Date().toLocaleTimeString("en-IN"));
  }catch(e){
   setError(e.message||"Unable to synchronize Google Sheets.");
  }finally{setLoading(false);}
 },[]);

 useEffect(()=>{
  refresh();
  const timer=setInterval(refresh,REFRESH_INTERVAL);
  return()=>clearInterval(timer);
 },[refresh]);

 const filtered=useMemo(()=>{
  const q=search.trim().toLowerCase();
  return records.filter(c=>!q||[c.aid,c.name,c.email,c.phone,c.domain,c.status].join(" ").toLowerCase().includes(q));
 },[records,search]);

 const candidate=records.find(c=>c.key===selected)||null;
 const active=entryMode==="manual"?manualCandidate:candidate;
 const template=TEMPLATES.find(t=>t.id===templateId)||TEMPLATES[0];

 const sent=records.filter(c=>{
  const s=String(c.status||"").toUpperCase();
  return s.includes("SENT")||s.includes("SUCCESS")||s.includes("DELIVERED")||s==="YES";
 }).length;
 const failed=records.filter(c=>{
  const s=String(c.status||"").toUpperCase();
  return s.includes("FAIL")||s.includes("ERROR");
 }).length;
 const pending=records.length-sent-failed;

 function updateManual(e){
  const {name}=e.target;
  let {value}=e.target;
  if(["name","domain","mode"].includes(name))value=value.replace(/[^A-Za-z\s]/g,"");
  if(name==="duration")value=value.replace(/[^A-Za-z0-9\s]/g,"");
  setManual(old=>({...old,[name]:value}));
 }
 function createManual(){
  return {
   key:"preview-"+Date.now(),aid:"",name:manual.name.trim(),
   email:"",phone:"",college:"",degree:"",
   domain:manual.domain.trim(),mode:manual.mode.trim(),
   joining:manual.joining.trim(),endDate:"",
   duration:manual.duration.trim(),
   completionDate:manual.completionDate.trim(),
   completionStatus:manual.completionStatus,
   participationStatus:manual.participationStatus,
   status:"Manual preview",manual:true
  };
 }
 function openPreview(){
  if(entryMode==="manual"){
   if(!manual.name.trim()){alert("Enter the candidate name first.");return;}
   setManualCandidate(createManual());
  }else if(!candidate){
   alert("Select an actual Google Sheets candidate first.");return;
  }
  setPreview(true);
 }
 function documentContent(){
  if(!active)return null;
  if(template.kind==="offer")return <OfferDocument c={active}/>;
  if(template.kind==="training")return <TrainingDocument c={active}/>;
  return <FormalDocument c={active} t={template}/>;
 }

 return <main className="app">
  <header className="header no-print">
   <a href={WEBSITE} target="_blank" rel="noreferrer">
    <Logo className="logo"/>
   </a>
   <div className="actions">
    <a className="btn" href={WEBSITE} target="_blank" rel="noreferrer">Company Website ↗</a>
    <a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Google Sheet ↗</a>
    <a className="btn dark" href={GMAIL_URL} target="_blank" rel="noreferrer">Company Gmail ↗</a>
    <button className="btn orange" onClick={refresh} disabled={loading}>{loading?"Syncing...":"↻ Refresh"}</button>
   </div>
  </header>

  <section className="hero no-print">
   <div className="eyebrow">VR PI GROUP • ENTERPRISE OPERATIONS SUITE</div>
   <h1>Enterprise Talent<br/><span style={{color:"#1e3a5f"}}>Excellence Platform</span></h1>
   <p>A professional corporate platform for candidate records, official internship documentation, training appointments, experience letters and certificates.</p>
  </section>

  {error&&<div className="notice error no-print"><b>Google Sheets connection:</b> {error}<br/>Confirm that General access is Anyone with the link — Viewer and that the worksheet ID is correct.</div>}
  {lastSync&&<div className="notice success no-print">{records.length} live records synchronized from Google Sheets. • Last sync: {lastSync}</div>}

  <section className="stats no-print">
   {[
    ["TOTAL APPLICANTS",records.length,"Actual Sheet records","#1e3a5f"],
    ["LETTERS SENT",sent,"Recorded sent status","#15803d"],
    ["PENDING ACTIONS",pending,"Not marked sent or failed","#b45309"],
    ["FAILED RECORDS",failed,"Recorded failed status","#dc2626"]
   ].map(([label,value,note,color])=><div className="stat" key={label}>
    <label>{label}</label><strong style={{color}}>{value}</strong><small>{note}</small>
   </div>)}
  </section>

  <section className="panel no-print">
   <div className="section-head">
    <div>
     <div className="kicker">LIVE DATA MANAGEMENT • READ ONLY</div>
     <h2>Candidate Records</h2>
     <p className="description">Live records from your Google Sheet. This website cannot edit or delete Sheet information.</p>
    </div>
    <input className="search" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search ID, candidate or email..."/>
   </div>
   <div className="table-wrap">
    {loading&&records.length===0?<div className="empty">Connecting to Google Sheets...</div>:
     filtered.length===0?<div className="empty">No candidate records available.</div>:
     <table className="records">
      <thead><tr>
       <th>Application ID</th><th>Candidate</th><th>Email</th>
       <th>Phone</th><th>Domain</th><th>Status</th>
       <th>PDF Record</th><th>Timestamp</th><th>Action</th>
      </tr></thead>
      <tbody>{filtered.map(c=>{
       const s=String(c.status||"Not recorded");
       const cls=s.toUpperCase().includes("SENT")?"sent":s.toUpperCase().includes("FAIL")?"failed":s.toUpperCase().includes("PENDING")?"pending":"";
       return <tr key={c.key}>
        <td>{c.aid||"—"}</td><td><b>{c.name||"—"}</b></td>
        <td>{c.email||"—"}</td><td>{c.phone||"—"}</td>
        <td>{c.domain||"—"}</td><td><span className={"status "+cls}>{s}</span></td>
        <td>{c.pdf||"—"}</td><td>{c.timestamp||"—"}</td>
        <td><button className="text-btn" onClick={()=>{setEntryMode("sheet");setSelected(c.key);setPreview(true);}}>Open Document</button></td>
       </tr>;
      })}</tbody>
     </table>}
   </div>
   <div className="description">{records.length} records loaded • Automatic refresh every 30 seconds • Read-only connection.</div>
  </section>

  <section className="panel no-print">
   <div className="kicker">OFFICIAL CORPORATE DOCUMENT LIBRARY</div>
   <h2>Professional Document Generation</h2>
   <p className="description">Select an actual Sheet candidate or enter temporary preview details. Choose a document template and preview it in A4 before printing or saving as PDF.</p>

   <div className="mode-switch">
    <button className={entryMode==="sheet"?"active":""} onClick={()=>{setEntryMode("sheet");setManualCandidate(null);}}>Use Google Sheet Record</button>
    <button className={entryMode==="manual"?"active":""} onClick={()=>{setEntryMode("manual");setPreview(false);}}>Enter Details Manually</button>
   </div>

   {entryMode==="manual"&&<div className="manual">
    <div className="kicker">TEMPORARY DOCUMENT PREVIEW</div>
    <h2>Candidate Details</h2>
    <p className="description">Only details needed by the selected document. These entries are not saved to Google Sheets or a database.</p>
    <div className="grid">
     {[
      ["name","Full Name *","Enter candidate name"],
      ["domain","Programme Domain","e.g. Full Stack Java"],
      ["mode","Programme Mode","Online / Offline / Hybrid"],
      ["duration","Duration","e.g. 3 months"],
      ["joining","Start Date","e.g. 01 December 2026"],
      ["completionDate","Completion Date","For completion documents"]
     ].map(([name,label,placeholder])=><div className="field" key={name}>
      <label>{label}</label>
      <input name={name} value={manual[name]} onChange={updateManual} placeholder={placeholder}/>
     </div>)}
     <div className="field">
      <label>COMPLETION STATUS</label>
      <select name="completionStatus" value={manual.completionStatus} onChange={updateManual}>
       <option value="">Not verified</option><option value="Completed">Completed</option><option value="Pending Verification">Pending Verification</option>
      </select>
     </div>
     <div className="field">
      <label>PARTICIPATION STATUS</label>
      <select name="participationStatus" value={manual.participationStatus} onChange={updateManual}>
       <option value="">Not verified</option><option value="Participated">Participated</option><option value="Pending Verification">Pending Verification</option>
      </select>
     </div>
    </div>
   </div>}

   <div className="template-layout">
    {entryMode==="sheet"&&<div className="field">
     <label>SELECT CANDIDATE</label>
     <select value={selected} onChange={e=>setSelected(e.target.value)}>
      <option value="">Select candidate</option>
      {records.map(c=><option key={c.key} value={c.key}>{c.name||"Candidate"} — {c.aid||"No ID"}</option>)}
     </select>
     <div className="notice info">{candidate?`${candidate.name} • ${candidate.domain||"Domain not recorded"}`:"Choose a candidate from the connected Sheet."}</div>
    </div>}
    <div className="field">
     <label>SELECT DOCUMENT TEMPLATE</label>
     <select value={templateId} onChange={e=>setTemplateId(e.target.value)}>
      {TEMPLATES.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
     </select>
     <div className="template-description">
      <span className="kicker" style={{color:template.color}}>VR PI • OFFICIAL DOCUMENT</span>
      <strong>{template.name}</strong><p>{template.desc}</p>
      <div className="pills"><span className="pill">{template.group}</span><span className="pill">A4 Portrait</span><span className="pill">PDF Preview</span></div>
     </div>
    </div>
   </div>
   <div className="section-head" style={{marginTop:22}}>
    <span className="description">6 professional templates • A4 preview and PDF printing</span>
    <button className="btn orange" disabled={entryMode==="sheet"?!candidate:!manual.name.trim()} onClick={openPreview}>Preview Selected A4 Document →</button>
   </div>
   <div className="notice info"><b>Verification:</b> Completion and participation documents remain marked as drafts until the corresponding Sheet status is verified. Manual preview data is never treated as verified.</div>
  </section>

  <footer className="footer no-print">
   <Logo className="footer-logo"/>
   <b>{COMPANY}</b><br/>{LOCATION}<br/>{EMAIL}<br/>
   <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a>
   <p>Enterprise Talent Excellence Platform</p>
  </footer>

  {preview&&active&&<div className="modal">
   <div className="modal-inner">
    <div className="modalbar no-print">
     <strong>{template.name} • {active.name}</strong>
     <div className="modal-actions">
      {entryMode==="sheet"&&<select value={selected} onChange={e=>setSelected(e.target.value)}>
       {records.map(c=><option key={c.key} value={c.key}>{c.name} — {c.aid||"No ID"}</option>)}
      </select>}
      <button className="btn orange" onClick={()=>window.print()}>Print / Save A4 PDF</button>
      <button className="btn" onClick={()=>setPreview(false)}>Close ×</button>
     </div>
    </div>
    <div className="modal-tabs no-print">
     {TEMPLATES.map(t=><button key={t.id} className={templateId===t.id?"active":""} onClick={()=>setTemplateId(t.id)}>{t.name}</button>)}
    </div>
    <div id="printTarget">{documentContent()}</div>
   </div>
  </div>}
 </main>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
