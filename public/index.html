body{margin:0;background:#f3f6fa;color:#17233a;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:1240px;margin:auto;padding:28px 24px}
.header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid #e2e8f0}
.brand{display:flex;align-items:center;gap:15px;text-decoration:none}
.logo{width:185px;height:92px;display:block}
.brand-text strong{font-size:14px;color:#182b49;display:block}
.brand-text small{font-size:9px;color:#8391a5;letter-spacing:1px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{padding:10px 15px;border:1px solid #dfe6ef;background:white;border-radius:9px;color:#263d5e;text-decoration:none;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-dark{background:#1e3a5f;color:white;border-color:#1e3a5f}
.btn-orange{background:#e94b17;color:white;border-color:#e94b17}
.hero{text-align:center;padding:57px 10px 40px}
.eyebrow{display:inline-block;background:white;border:1px solid #e1e7ef;border-radius:30px;padding:9px 17px;color:#687891;font-size:10px;font-weight:800;letter-spacing:1px}
.hero h1{font-size:clamp(34px,5vw,55px);line-height:1.12;letter-spacing:-2px;color:#111a2d;font-weight:800;margin:22px 0 14px}
.hero p{max-width:750px;margin:auto;color:#74839a;font-size:13px;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:19px 20px}
.stat label{font-size:9px;font-weight:800;color:#8795a9;letter-spacing:1px}
.stat strong{display:block;font-size:30px;font-weight:800;margin:9px 0 4px}
.stat small{font-size:10px;color:#94a3b8}
.panel{background:white;border:1px solid #e1e7ef;border-radius:18px;padding:27px;box-shadow:0 10px 32px #263b5909;margin-bottom:24px}
.kicker{color:#8291a6;font-size:10px;font-weight:800;letter-spacing:1.5px}
h2{font-size:20px;color:#172b49;margin:8px 0}
.description{font-size:12px;color:#8290a5;line-height:1.8}
.alert{padding:13px 15px;border-radius:9px;margin-top:15px;font-size:11px;line-height:1.7}
.alert-error{background:#fff5ed;color:#a34a16;border:1px solid #ffdbbd}
.alert-success{background:#edfaf3;color:#16754c;border:1px solid #c9eedc}
.alert-info{background:#eff6ff;color:#315b8c;border:1px solid #d7e7fa}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.search{padding:11px 13px;border:1px solid #dfe6ef;border-radius:9px;font-size:11px;outline:none;min-width:230px}
.search:focus,select:focus{border-color:#e94b17;outline:none}
.table-wrap{overflow-x:auto;margin-top:18px}
table.records{width:100%;border-collapse:collapse;white-space:nowrap}
.records th{background:#f8fafc;text-align:left;padding:13px 12px;color:#8b99ad;font-size:9px;letter-spacing:.7px;text-transform:uppercase}
.records td{padding:14px 12px;border-bottom:1px solid #eef1f5;font-size:10px;color:#54647a}
.records td:first-child{font-family:'JetBrains Mono',monospace;font-weight:700;color:#1e3a5f}
.records tr:hover{background:#f8faff}
.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:9px;font-weight:800;background:#edf2f7;color:#52637b}
.status.sent{background:#dcfce7;color:#166534}
.status.pending{background:#fef3c7;color:#92400e}
.status.failed{background:#fee2e2;color:#991b1b}
.text-btn{border:0;background:none;color:#087eae;font-size:10px;font-weight:800}
.template-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.field label{display:block;font-size:10px;font-weight:800;color:#52637c;margin-bottom:9px}
.field select{width:100%;padding:13px;border:1px solid #dfe6ef;border-radius:9px;background:white;color:#30425d;font-size:12px}
.template-description{padding:18px;background:#f8fafc;border:1px solid #e9edf3;border-radius:12px;margin-top:17px}
.template-description strong{display:block;font-size:13px;color:#1e3a5f;margin-bottom:7px}
.template-description p{font-size:11px;color:#8290a5;line-height:1.8;margin:0}
.template-categories{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.category-pill{font-size:9px;padding:6px 10px;border:1px solid #e4e9ef;border-radius:20px;color:#718098;background:white}
.footer{text-align:center;padding:26px 0;color:#8491a5;font-size:10px}
.footer a{color:#0d7377;text-decoration:none}
.footer-logo{width:135px;height:auto;margin:0 auto 8px;display:block}
.modal{position:fixed;inset:0;background:rgba(12,23,41,.88);z-index:100;overflow:auto;padding:15px}
.modal-inner{max-width:920px;width:100%;margin:0 auto}
.modalbar{background:#111c30;padding:12px 15px;border-radius:11px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.modalbar strong{font-size:11px;color:white}
.modal-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-actions select{padding:8px;border-radius:7px;font-size:10px;max-width:230px}

.doc-header{padding:21px 32px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:2px solid #1e3a5f}

.manual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.manual-grid input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:1;padding:3px}
.mode-switch{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 5px}
.mode-switch button{border:1px solid #dfe6ef;background:#fff;color:#52637c;padding:10px 14px;border-radius:9px;font-size:10px;font-weight:800}
.mode-switch button.active{background:#1e3a5f;border-color:#1e3a5f;color:#fff}
.manual-help{font-size:10px;color:#8190a5;line-height:1.7;margin-top:12px}

.app{padding:17px 12px}
.stats{grid-template-columns:repeat(2,1fr)}

.panel{padding:20px}
.header{align-items:flex-start}
.a4{width:100%;min-height:1000px}
.doc-content{padding:22px}
.doc-header{padding:17px}
.a4-logo{width:125px;height:65px}

@media(max-width:520px){
.stats{gap:8px}
.stat{padding:13px}
.stat strong{font-size:23px}
.actions{width:100%}
.actions .btn{flex:1}
.hero{padding:40px 5px 30px}
.hero h1{letter-spacing:-1px}
.search{width:100%}
.section-head{align-items:flex-start}
}

const normalize=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function getIndex(columns,names,fallback=-1){
 const labels=columns.map(c=>normalize(c.label||c.id||""));
 for(const name of names){
  const i=labels.findIndex(x=>x===normalize(name));
  if(i>=0)return i;
 }

}
function cellText(row,index){
 if(index<0)return "";
 const cell=row.c?.[index];
 if(!cell||cell.v==null)return "";
 if(cell.f)return String(cell.f).trim();

}

  let finished=false;
  const script=document.createElement("script");
  const timer=setTimeout(()=>{
   finish(new Error("Google Sheets did not respond. Check link-view access or use a private backend."));
  },18000);
  function finish(error,result){
   if(finished)return;
   finished=true;
   clearTimeout(timer);
   script.remove();
   try{delete window[callback]}catch(e){window[callback]=undefined}
   error?reject(error):resolve(result);
  }
  window[callback]=response=>{
   if(!response||!response.table){
    const detail=response?.errors?.[0]?.detailed_message||response?.errors?.[0]?.message||"No table returned";
    finish(new Error(detail));
    return;
   }
   if(response.status&&String(response.status).toLowerCase()!=="ok"){
    finish(new Error(response.errors?.[0]?.detailed_message||"Google Sheets returned an error"));
    return;
   }
   finish(null,response.table);
  };
  const tqx=encodeURIComponent(`out:json;responseHandler:${callback};reqId:0`);
  script.async=true;
  script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=${tqx}&_=${Date.now()}`;
  script.onerror=()=>finish(new Error("Google Sheets could not be reached. The sheet may be private or unavailable."));
  document.head.appendChild(script);
 });
}

}

      <optgroup label="Internship Documents">{TEMPLATES.filter(t=>t.group==="Internship").map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>
      <optgroup label="Training Documents">{TEMPLATES.filter(t=>t.group==="Training").map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>
      <optgroup label="Certifications and Other Letters">{TEMPLATES.filter(t=>t.group==="Certification").map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>
     </select>
     <div className="template-description">
      <span className="kicker" style={{color:template.color}}>VR PI • OFFICIAL DOCUMENT</span>
      <strong>{template.name}</strong><p>{template.desc}</p>
      <div className="template-categories"><span className="category-pill">{template.group}</span><span className="category-pill">A4 Portrait</span><span className="category-pill">PDF Preview</span></div>
     </div>
    </div>
   </div>
   <div className="section-head" style={{marginTop:22}}>
    <span className="notice-mini">6 professional templates • A4 preview and PDF printing</span>
    <button className="btn btn-orange" disabled={entryMode==="sheet"?!candidate:!manualForm.name.trim()} onClick={()=>previewDocument()}>Preview Selected A4 Document →</button>
   </div>
  </section>
  <footer className="footer no-print">
   <CompanyLogo className="footer-logo"/>
   <b>{COMPANY}</b><br/>{LOCATION}<br/>{EMAIL}<br/>
   <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a>
   <p>Enterprise Talent Excellence Platform</p>
  </footer>
  {preview&&activeCandidate&&<div className="modal">
   <div className="modal-inner">
    <div className="modalbar no-print">
     <strong>{template.name} • {activeCandidate.name}</strong>
     <div className="modal-actions">
      {entryMode==="sheet"&&<select value={selectedId} onChange={e=>setSelectedId(e.target.value)}>{records.map(c=><option key={c.key} value={c.key}>{c.name} — {c.aid||"No Application ID"}</option>)}</select>}
      <button className="btn btn-orange" onClick={()=>window.print()}>Print / Save A4 PDF</button>
      <button className="btn" onClick={closePreview}>Close ×</button>
     </div>
    </div>
    <div className="modal-tabs no-print">{TEMPLATES.map(t=><button key={t.id} className={templateId===t.id?"active":""} onClick={()=>setTemplateId(t.id)}>{t.name}</button>)}</div>
    <div id="printTarget">{renderDocument()}</div>
   </div>
  </div>}
 </main>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
