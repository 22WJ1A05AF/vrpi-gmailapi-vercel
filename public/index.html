
<!DOCTYPE html>
<html lang="en">
<head>

<title>VR PI Group | Corporate Document Platform</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#17233a;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1400px;margin:auto;padding:25px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid #dfe6ef;padding-bottom:18px}
.logo{width:205px;height:105px;object-fit:contain;display:block}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{padding:11px 16px;background:white;border:1px solid #dfe6ef;border-radius:9px;color:#1e3a5f;text-decoration:none;font-size:11px;font-weight:800}
.dark{background:#1e3a5f;color:white}
.orange{background:#e94b17;color:white;border-color:#e94b17}
.hero{text-align:center;padding:48px 10px 35px}
.eyebrow{display:inline-block;background:white;border:1px solid #dfe6ef;border-radius:25px;padding:10px 18px;font-size:10px;font-weight:800;letter-spacing:1px;color:#75849a}
h1{font-size:clamp(34px,5vw,54px);line-height:1.15;margin:20px 0;color:#121c30;letter-spacing:-2px}
.hero p,.desc{color:#8290a5;font-size:12px;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}
.stat,.panel{background:white;border:1px solid #dfe6ef;border-radius:16px}
.stat{padding:22px}
.stat label{font-size:10px;font-weight:800;color:#8795a9;letter-spacing:1px}
.stat strong{display:block;font-size:32px;margin:10px 0}
.stat small{font-size:10px;color:#94a3b8}
.panel{padding:26px;margin-bottom:23px}
.kicker{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#8492a7}
h2{font-size:21px;color:#172b49;margin:9px 0}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.search{padding:12px;border:1px solid #dfe6ef;border-radius:9px;min-width:230px;font-size:11px}
.table-wrap{overflow-x:auto;margin-top:20px}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{background:#f8fafc;text-align:left;padding:14px;color:#8795a9;font-size:9px}
td{padding:14px;border-bottom:1px solid #edf0f4;font-size:10px;color:#52637c}
.status{padding:5px 9px;border-radius:20px;background:#edf2f7;font-size:9px}

.alert{padding:14px;border-radius:9px;font-size:11px;line-height:1.8;margin-bottom:15px}

footer{text-align:center;color:#8491a5;font-size:10px;padding:25px}

.modal{position:fixed;inset:0;background:#101b2fee;z-index:100;overflow:auto;padding:15px}
.modal-inner{max-width:950px;margin:auto}
.modalbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#17233a;padding:14px;border-radius:10px;margin-bottom:14px}
.modalbar strong{color:white;font-size:11px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.a4{width:210mm;min-height:297mm;background:white;margin:auto;display:flex;flex-direction:column;color:#26354d;box-shadow:0 15px 40px #0003}
.doc-header{padding:20px 35px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1e3a5f;gap:15px}
.doc-logo{width:155px;height:90px;object-fit:contain;display:block}
.doc-info{text-align:right;font-size:9px;color:#718096;line-height:1.9;overflow-wrap:anywhere}

.doc-content{padding:30px 42px;flex:1;display:flex;flex-direction:column;font-size:11px;line-height:1.9}
.doc-title{text-align:center;margin:12px 0 24px}
.doc-title h2{font-size:19px;letter-spacing:1.5px}

.doc-section{font-size:10px;letter-spacing:1px;font-weight:800;color:#1e3a5f;border-bottom:1px solid #dfe6ef;padding-bottom:7px;margin-top:17px}
.doc-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:10px;white-space:normal}

.doc-table td:first-child{background:#f2f5f9;color:#1e3a5f;font-weight:700;width:36%}
.doc-content p{color:#475569;line-height:1.9}
.doc-footer{background:#1e3a5f;color:white;text-align:center;padding:12px;font-size:9px;line-height:1.8}
.signoff{margin-top:auto;padding-top:25px}
.signoff strong{display:block;color:#1e3a5f;margin-top:8px}
.acceptance-box{border:1.5px solid #1e3a5f;border-radius:9px;padding:8px 15px;margin-top:10px}
.acceptance-box p{margin:5px 0}
.completion-page{border:1px solid #e5e9ef}
.completion-head{padding:18px 30px 15px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:5px solid #d6ad59}
.completion-head .doc-logo{width:145px;height:85px}
.completion-company{text-align:right;font-size:9px;line-height:1.9;color:#52637c}
.completion-company strong{font-size:13px;color:#1e3a5f}
.completion-accent{height:8px;background:linear-gradient(90deg,#172f50 0%,#d5ae61 48%,#172f50 100%)}
.completion-body{padding:27px 42px;flex:1;display:flex;flex-direction:column;font-size:11px;line-height:1.9}
.completion-title{text-align:center;margin:10px 0 24px}
.completion-title h2{font-family:'Playfair Display',serif;font-size:23px;color:#152d4c;letter-spacing:.5px}
.completion-title small{font-size:9px;font-weight:800;letter-spacing:2px;color:#9a7b39}
.completion-body p{font-size:11px;color:#36465d;line-height:2;margin:9px 0}
.completion-recipient{border-bottom:1px solid #d9e0e9;padding-bottom:13px;margin-bottom:14px}
.completion-recipient b{color:#1e3a5f}
.completion-details{width:100%;border-collapse:collapse;margin:14px 0;font-size:10px;white-space:normal}
.completion-details td{border-bottom:1px solid #e3e8ee;padding:8px 10px}
.completion-details td:first-child{width:34%;background:#f4f6f9;color:#1e3a5f;font-weight:800}
.completion-signoff{margin-top:auto;padding-top:16px;position:relative;min-height:112px}
.completion-signoff strong{display:block;color:#1e3a5f;margin-top:5px}
.well-done{position:absolute;right:10px;bottom:15px;width:100px;height:100px;border:5px double #c49b46;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#1e3a5f;background:#fffdf6;font-size:8px;font-weight:800;line-height:1.4;transform:rotate(7deg)}
.well-done .star{font-size:20px;color:#bc923f}
.completion-footer{background:#132e50;color:#fff;padding:12px 20px;text-align:center;font-size:8.5px;line-height:1.9;border-top:4px solid #c69f4d}
.participation-page{width:297mm;min-height:210mm;height:210mm;position:relative;overflow:hidden;background:#fffdf8;border:9px double #cba85a;padding:13mm 16mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.participation-page:before{content:"";position:absolute;left:-5%;top:-55px;width:110%;height:78px;background:#17395c;border-bottom:9px solid #e6ce8f;border-radius:0 0 50% 50%;z-index:0}
.participation-page:after{content:"";position:absolute;left:-5%;bottom:-58px;width:110%;height:90px;background:#17395c;border-top:9px solid #e6ce8f;border-radius:50% 50% 0 0;z-index:0}
.participation-content{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center}
.participation-logo{width:145px;height:72px;object-fit:contain;margin:3px auto 7px}
.participation-company{font-size:10px;font-weight:800;letter-spacing:3px;color:#17395c}
.participation-heading{margin:10px 0 3px;font-family:'Playfair Display',serif;font-size:37px;letter-spacing:5px;color:#17395c}
.participation-subtitle{font-size:14px;letter-spacing:4px;color:#a58038;font-weight:700}
.participation-medal{position:absolute;left:15px;top:28px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b8,#cfac56 45%,#9f722d 80%);border:4px double #f8e9b7;box-shadow:0 3px 10px #76531b33}
.participation-medal:after{content:"";position:absolute;top:48px;left:10px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:29px solid #c49b48;transform:rotate(15deg)}
.participation-medal:before{content:"";position:absolute;top:48px;right:10px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:29px solid #e3ca86;transform:rotate(-15deg)}
.participation-intro{font-size:12px;color:#45566c;margin-top:20px}
.participation-name{font-family:'Playfair Display',serif;font-style:italic;font-size:38px;color:#bd974c;border-bottom:1px solid #bca66f;padding:0 45px 5px;margin:7px 0 10px;max-width:90%;overflow-wrap:anywhere}
.participation-copy{font-size:11px;color:#344861;line-height:1.9;max-width:690px;margin:8px auto}
.participation-meta{display:flex;justify-content:space-around;width:100%;gap:24px;margin-top:17px;color:#17395c;font-size:10px}
.participation-meta strong{display:block;font-size:11px}
.participation-meta span{display:block;color:#687789}
.participation-foot{font-size:9px;color:#17395c;font-weight:700;position:relative;z-index:2;margin-bottom:3px}
@media(max-width:800px){
.app{padding:13px}
.stats{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:1fr}
.a4{width:100%;min-height:1000px}
.doc-content,.completion-body{padding:22px}
.doc-header,.completion-head{padding:16px}
.participation-page{width:100%;height:auto;min-height:680px;padding:80px 20px}
.participation-heading{font-size:27px}
.participation-name{font-size:27px;padding:0 12px 5px}
.participation-medal{width:43px;height:43px}
.participation-meta{gap:8px}
}
@media print{
@page{size:A4 portrait;margin:0}
@page certificatePage{size:A4 landscape;margin:0}
body *{visibility:hidden!important}
.modal,#printTarget,#printTarget *{visibility:visible!important}
.modal{position:static!important;padding:0!important;background:white!important;overflow:visible!important}
.modal-inner{width:210mm!important;max-width:none!important;margin:0!important}
.modalbar{display:none!important}
.a4{width:210mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.participation-page{page:certificatePage;width:297mm!important;height:210mm!important;min-height:210mm!important;margin:0!important;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.completion-page,.completion-footer,.doc-table td:first-child{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;

const COMPANY="VR PI Group Of Companies";
const EMAIL="vrpigroupoftechnology@gmail.com";
const SHEET_ID="1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU";
const SHEET_GID="0";
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SHEET_GID}`;
const GMAIL_URL="https://mail.google.com/mail/?authuser=vrpigroupoftechnology%40gmail.com#inbox";
const WEBSITE="https://share.google/Staafq7spnZSStc8n";

function Logo({className="",style={}}){
return <img src="./vrpi-logo.png" alt="VR PI Group Of Companies" className={className} style={{objectFit:"contain",display:"block",...style}}/>;
}

const TEMPLATES=[
{id:"offer",name:"Internship Offer Letter",fields:["name","domain","mode","joining","duration"],desc:"Formal internship offer with professional terms and conditions.",type:"letter"},
{id:"internship-completion",name:"Internship Completion Certificate",fields:["name","domain","mode","joining","duration","completionDate"],desc:"Corporate internship completion letter with personalized company details.",type:"completion",programme:"internship"},
{id:"training-appointment",name:"Training Appointment Letter",fields:["name","domain","mode","appointmentDate","duration"],desc:"Professional training appointment and responsibilities.",type:"letter"},
{id:"training-completion",name:"Training Completion Certificate",fields:["name","domain","mode","joining","duration","completionDate"],desc:"Formal training completion letter with company branding.",type:"completion",programme:"training"},
{id:"participation",name:"Participation Certificate",fields:["name","eventName","domain","participationDate"],desc:"Elegant navy-and-gold participation certificate.",type:"participation"},
{id:"experience",name:"Experience Letter",fields:["name","domain","role","joining","duration"],desc:"Professional engagement and experience confirmation.",type:"experience"}
];

const LABELS={
name:"Candidate Full Name",domain:"Programme Domain",mode:"Programme Mode",
joining:"Start Date",duration:"Duration",completionDate:"Completion Date",
appointmentDate:"Appointment Date",eventName:"Event / Programme Name",
participationDate:"Participation Date",role:"Designation / Role"
};

const DOMAINS=[
"Full Stack Development","Java Development","Python Development",
"Web Development","Artificial Intelligence","Machine Learning",
"Data Science","Data Analytics","Cloud Computing","Cybersecurity",
"DevOps","UI UX Design","Software Testing",
"Mobile Application Development","Digital Marketing","Business Analytics"
];
const MODES=["Online","Offline","Hybrid"];
const DURATIONS=["1 Month","2 Months","3 Months","4 Months","5 Months","6 Months","9 Months","12 Months"];

function today(){
return new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});
}
function dateText(v){
if(!v)return "";
const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"}):v;
}
function norm(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function column(cols,names,fallback=-1){
for(const n of names){
const i=cols.findIndex(c=>norm(c.label||c.id)===norm(n));
if(i>=0)return i;
}
return fallback;
}
function cell(row,i){
return i<0?"":String(row.c?.[i]?.f||row.c?.[i]?.v||"").trim();
}

function fetchSheet(){
return new Promise((resolve,reject)=>{
const cb="vrpiReadOnlySheet";
let done=false;
const script=document.createElement("script");
const timer=setTimeout(()=>finish(new Error("Google Sheets connection timed out.")),15000);
function finish(err,data){
if(done)return;
done=true;
clearTimeout(timer);
script.remove();
try{delete window[cb]}catch(e){}
err?reject(err):resolve(data);
}
window[cb]=data=>{
if(!data?.table){finish(new Error("Sheet is not accessible. Enable Anyone with the link – Viewer."));return}
finish(null,data.table);
};
script.onerror=()=>finish(new Error("Unable to load Google Sheets."));
script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=${encodeURIComponent("out:json;responseHandler:"+cb)}&t=${Date.now()}`;
document.head.appendChild(script);
});
}

async function getRecords(){
const table=await fetchSheet();
const cols=table.cols||[];
return (table.rows||[]).map((row,i)=>{
const read=(names,fallback=-1)=>cell(row,column(cols,names,fallback));
return {
key:read(["Application ID","Application Id"],1)||"row-"+i,
aid:read(["Application ID","Application Id"],1),
name:read(["Full Name","Candidate Name","Name"],2),
email:read(["Email Address","Email","Candidate Email"],3),
phone:read(["WhatsApp / Phone","WhatsApp","Phone"],4),
domain:read(["Domain","Internship Domain","Programme Domain"],7),
mode:read(["Mode","Programme Mode","Internship Mode"],-1),
joining:read(["Start Date","Joining Date","Internship Start Date"],-1),
duration:read(["Duration","Internship Duration","Programme Duration"],-1),
completionDate:read(["Completion Date","End Date","Internship End Date"],-1),
appointmentDate:read(["Appointment Date","Training Date"],-1),
eventName:read(["Event Name","Programme Name","Event"],-1),
participationDate:read(["Participation Date","Event Date"],-1),
role:read(["Designation","Role","Job Role"],-1),
status:read(["Letter Sent","Email Status","Application Status","Status"],17)||"Not recorded",
pdf:read(["PDF Record","PDF Link"],18)
};
}).filter(x=>x.name||x.email||x.aid);
}

function Header(){
return <div className="doc-header">
<Logo className="doc-logo"/>
<div className="doc-info">
<strong>{COMPANY}</strong><br/>
Wanaparthy, Telangana, India<br/>
{EMAIL}<br/>
{WEBSITE}<br/>
{today()}
</div>
</div>;
}

function Footer(){
return <div className="doc-footer"><b>{COMPANY}</b><br/>Wanaparthy, Telangana, India • {EMAIL}<br/>{WEBSITE}</div>;
}

function Signoff({experience=false}){
return <div className="signoff">
Regards,
<strong>{experience?"Human Resources Department":"Talent Excellence Division"}</strong>
{COMPANY}<br/>Authorized Corporate Representative
</div>;
}

function StandardDocument({data,template}){
const experience=template.id==="experience";
const offer=template.id==="offer";
const training=template.id==="training-appointment";

const intro=offer
?`We are pleased to offer ${data.name} an internship opportunity with ${COMPANY} in the ${data.domain} programme. We are delighted to welcome you and look forward to your contribution, learning and professional growth during this engagement.`
:training
?`We are pleased to appoint ${data.name} to the ${data.domain} training programme with ${COMPANY}. This appointment is intended to provide structured learning, practical exposure and an opportunity to strengthen professional skills.`
:`This letter confirms the professional engagement of ${data.name} with ${COMPANY} in the capacity of ${data.role} within the ${data.domain} domain. This letter is issued as a formal record of the experience details set out below.`;

return <div className="a4">
<Header/>
<div className="doc-content">
<div className="doc-title">
<h2>{template.name.toUpperCase()}</h2>
<small>{today().toUpperCase()}</small>
</div>

<p><b>To,</b><br/>{data.name}</p>
{offer&&<p><b>Subject: Internship Offer – {data.domain}</b></p>}
{training&&<p><b>Subject: Training Appointment – {data.domain}</b></p>}
{experience&&<p><b>Subject: Experience Confirmation</b></p>}
<p>Dear {data.name},</p>
<p>{intro}</p>

<div className="doc-section">{experience?"PROFESSIONAL EXPERIENCE DETAILS":training?"TRAINING APPOINTMENT DETAILS":"INTERNSHIP OFFER DETAILS"}</div>

<table className="doc-table"><tbody>
<tr><td>Candidate Name</td><td>{data.name}</td></tr>
{experience&&<tr><td>Designation / Role</td><td>{data.role||"—"}</td></tr>}
<tr><td>Programme Domain</td><td>{data.domain||"—"}</td></tr>
{!experience&&data.mode&&<tr><td>Programme Mode</td><td>{data.mode}</td></tr>}
<tr><td>{training?"Appointment Date":"Start Date"}</td><td>{dateText(training?data.appointmentDate:data.joining)||"—"}</td></tr>
<tr><td>Duration</td><td>{data.duration||"—"}</td></tr>
</tbody></table>

{offer&&<>
<p>Your internship is scheduled to commence on <b>{dateText(data.joining)}</b> for a period of <b>{data.duration}</b>, in <b>{data.mode}</b> mode. You will be guided by the designated programme coordinator and will be expected to complete the learning activities and responsibilities assigned during the programme.</p>

<div className="doc-section">TERMS AND CONDITIONS</div>
<p><b>1. Professional conduct:</b> You are expected to maintain punctuality, discipline, respectful communication and professional behaviour throughout the internship.</p>
<p><b>2. Programme responsibilities:</b> You must actively participate in assigned learning activities, meetings, tasks and project work and complete them within the communicated timelines.</p>
<p><b>3. Confidentiality:</b> All company, client, project and operational information must be kept confidential and must not be shared with unauthorized persons.</p>
<p><b>4. Company policies:</b> You agree to follow the applicable company policies, information security practices and reasonable instructions issued by the authorized coordinator.</p>
<p><b>5. Attendance and communication:</b> You must maintain regular attendance and promptly inform the coordinator of any absence or circumstance that may affect your participation.</p>
<p><b>6. Completion and documentation:</b> Issuance of a completion certificate or other programme document is subject to fulfilment of the programme requirements and verification by the company.</p>
<p><b>7. Nature of engagement:</b> This internship offer is a learning engagement and does not by itself constitute a promise of permanent employment.</p>
<p><b>8. Acceptance:</b> Please confirm your acceptance by signing the acknowledgement below.</p>

<div className="doc-section">CANDIDATE ACCEPTANCE</div>
<p>I, <b>{data.name}</b>, acknowledge that I have read and understood this internship offer and agree to the programme details and terms and conditions stated in this letter.</p>
<div className="acceptance-box">
<p><b>Candidate Name:</b> {data.name}</p>
<p><b>Signature:</b> ____________________________________</p>
<p><b>Date:</b> ____________________</p>
</div>
</>}

{training&&<>
<p>The training programme is scheduled to begin on <b>{dateText(data.appointmentDate)}</b> and will continue for <b>{data.duration}</b>. During this period, you will take part in structured learning sessions, practical exercises and programme-related assignments under the guidance of the designated training coordinator.</p>

<div className="doc-section">TRAINING TERMS AND EXPECTATIONS</div>
<p><b>1.</b> Maintain punctuality, attendance and professional conduct throughout the training period.</p>
<p><b>2.</b> Participate in scheduled sessions and complete assigned exercises, assessments and practical tasks.</p>
<p><b>3.</b> Follow the guidance of the training coordinator and comply with applicable company policies.</p>
<p><b>4.</b> Protect confidential company, client and project information and use it only for authorized training purposes.</p>
<p><b>5.</b> Training documents or completion credentials may be issued after verification of attendance and fulfilment of programme requirements.</p>

<div className="doc-section">CANDIDATE ACKNOWLEDGEMENT</div>
<p>I acknowledge this training appointment and agree to follow the programme details, expectations and company guidelines described in this letter.</p>
<div className="acceptance-box">
<p><b>Candidate Name:</b> {data.name}</p>
<p><b>Signature:</b> ____________________________________</p>
<p><b>Date:</b> ____________________</p>
</div>
</>}

{experience&&<>
<p>During this period, the candidate was associated with the company in the capacity stated above. This letter is issued upon request as a formal confirmation of the professional engagement details recorded by the company.</p>
<p>We appreciate the candidate's contribution, commitment and professional approach during the engagement. We wish them continued success in their future career endeavours.</p>
</>}

<Signoff experience={experience}/>
</div>
<Footer/>
</div>;
}

const type=training?"training":"internship";
const dateFrom=dateText(data.joining);
const dateTo=dateText(data.completionDate);

return <div className="a4 completion-page">
<div className="completion-head">
<Logo className="doc-logo"/>
<div className="completion-company">
<strong>{COMPANY}</strong><br/>
Wanaparthy, Telangana, India<br/>

<div className="completion-signoff">

<span className="star">★</span>
WELL DONE!
<span>BEST WISHES</span>

<span>FUTURE</span>

</div>

{EMAIL} • {WEBSITE}

return <div className="a4 participation-page">
<div className="participation-medal"></div>
<div className="participation-content">
<Logo className="participation-logo"/>
<div className="participation-company">{COMPANY.toUpperCase()}</div>
<div className="participation-heading">CERTIFICATE</div>

function Document({data,template}){
if(template.type==="completion")return <CompletionDocument data={data} template={template}/>;
if(template.type==="participation")return <ParticipationDocument data={data} template={template}/>;
return <StandardDocument data={data} template={template}/>;
}

function App(){
const [records,setRecords]=useState([]);
const [selected,setSelected]=useState("");
const [templateId,setTemplateId]=useState("offer");
const [manual,setManual]=useState(true);
const [form,setForm]=useState({});
const [previewData,setPreviewData]=useState(null);
const [preview,setPreview]=useState(false);
const [search,setSearch]=useState("");
const [loading,setLoading]=useState(false);
const [error,setError]=useState("");
const [lastSync,setLastSync]=useState("");

const template=TEMPLATES.find(t=>t.id===templateId)||TEMPLATES[0];
const selectedRecord=records.find(r=>r.key===selected);

async function refresh(){
setLoading(true);
try{
const result=await getRecords();
setRecords(result);
setSelected(old=>result.some(r=>r.key===old)?old:(result[0]?.key||""));
setError("");
setLastSync(new Date().toLocaleTimeString("en-IN"));
}catch(e){setError(e.message);}
finally{setLoading(false);}
}

useEffect(()=>{
refresh();
const timer=setInterval(refresh,30000);
return()=>clearInterval(timer);
},[]);

const filtered=useMemo(()=>{
const q=search.toLowerCase();
return records.filter(r=>[r.aid,r.name,r.email,r.domain].join(" ").toLowerCase().includes(q));
},[records,search]);

const sent=records.filter(r=>/sent|success|delivered/i.test(r.status)).length;
const failed=records.filter(r=>/failed|error/i.test(r.status)).length;
const pending=records.length-sent-failed;

function changeTemplate(id){
setTemplateId(id);
setForm({});
setPreviewData(null);
setPreview(false);
}

function changeField(e){
const {name}=e.target;
let value=e.target.value;
if(name==="name"||name==="role"||name==="eventName")value=value.replace(/[^a-zA-Z\s&'-]/g,"");
setForm(old=>({...old,[name]:value}));
}

function makePreview(){
const source=manual?{...form}:{...(selectedRecord||{})};

if(!source.name||!source.name.trim()){
alert("Please enter or select a candidate name.");
return;
}

if(manual){
const missing=template.fields.filter(key=>!String(source[key]||"").trim());
if(missing.length){
alert("Please complete: "+missing.map(key=>LABELS[key]).join(", "));
return;
}
}

setPreviewData({...source});
setPreview(true);

if(manual)setForm({});
}

function closePreview(){
setPreview(false);
setPreviewData(null);
if(manual)setForm({});
else refresh();
}

useEffect(()=>{
const afterPrint=()=>{
setPreview(false);
setPreviewData(null);
if(manual)setForm({});
else refresh();
};
window.addEventListener("afterprint",afterPrint);
return()=>window.removeEventListener("afterprint",afterPrint);
},[manual]);

return <main className="app">
<header>
<a href={WEBSITE} target="_blank" rel="noreferrer">
<Logo className="logo"/>
</a>
<div className="actions">
<a className="btn" href={WEBSITE} target="_blank" rel="noreferrer">Company Website ↗</a>
<a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Google Sheet ↗</a>
<a className="btn dark" href={GMAIL_URL} target="_blank" rel="noreferrer">Company Gmail ↗</a>
<button className="btn orange" onClick={refresh} disabled={loading}>{loading?"Syncing...":"↻ Refresh"}</button>
</div>
</header>

<section className="hero">
<div className="eyebrow">VR PI GROUP • ENTERPRISE OPERATIONS SUITE</div>
<h1>Enterprise Talent<br/><span style={{color:"#1e3a5f"}}>Excellence Platform</span></h1>
<p>Professional candidate records, official internship documentation, training appointments, experience letters and certificates.</p>
</section>

{error&&<div className="alert error"><b>Google Sheets connection:</b> {error}</div>}
{lastSync&&<div className="alert success">{records.length} live records synchronized from Google Sheets • Last sync: {lastSync}</div>}

<section className="stats">
{[
["TOTAL APPLICANTS",records.length,"Actual sheet records","#1e3a5f"],
["LETTERS SENT",sent,"Recorded sent status","#15803d"],
["PENDING ACTIONS",pending,"Pending records","#b45309"],
["FAILED RECORDS",failed,"Recorded failed status","#dc2626"]
].map(([label,value,note,color])=><div className="stat" key={label}>
<label>{label}</label><strong style={{color}}>{value}</strong><small>{note}</small>
</div>)}
</section>

<section className="panel">
<div className="section-head">
<div>
<div className="kicker">LIVE DATA MANAGEMENT • READ ONLY</div>
<h2>Candidate Records</h2>
<p className="desc">Google Sheets records synchronized every 30 seconds.</p>
</div>
<input className="search" placeholder="Search ID, name, email..." value={search} onChange={e=>setSearch(e.target.value)}/>
</div>

<div className="table-wrap">
{!filtered.length?<div className="no-record">{loading?"Connecting to Google Sheets...":"No records available."}</div>:
<table>
<thead><tr><th>APPLICATION ID</th><th>NAME</th><th>EMAIL</th><th>PHONE</th><th>DOMAIN</th><th>STATUS</th><th>PDF</th><th>ACTION</th></tr></thead>
<tbody>{filtered.map(r=><tr key={r.key}>
<td>{r.aid||"—"}</td>
<td><b>{r.name}</b></td>
<td>{r.email||"—"}</td>
<td>{r.phone||"—"}</td>
<td>{r.domain||"—"}</td>
<td><span className={"status "+(/sent|success|delivered/i.test(r.status)?"sent":/failed|error/i.test(r.status)?"failed":"pending")}>{r.status}</span></td>
<td>{r.pdf||"—"}</td>
<td><button className="text-btn" onClick={()=>{setManual(false);setSelected(r.key);setTemplateId("offer");setPreviewData(null);setPreview(false);}}>Select</button></td>
</tr>)}</tbody>
</table>}
</div>
</section>

<section className="panel">
<div className="kicker">OFFICIAL CORPORATE DOCUMENT LIBRARY</div>
<h2>Professional Document Generation</h2>
<p className="desc">Choose a template. Only the fields needed for that specific document will appear.</p>

<div className="mode-switch">
<button className={!manual?"active":""} onClick={()=>{setManual(false);setForm({});setPreviewData(null);setPreview(false);}}>Use Google Sheet Record</button>
<button className={manual?"active":""} onClick={()=>{setManual(true);setForm({});setPreviewData(null);setPreview(false);}}>Enter Candidate Details Manually</button>
</div>

<div className="template-pills">
{TEMPLATES.map(t=><button key={t.id} className={templateId===t.id?"active":""} onClick={()=>changeTemplate(t.id)}>{t.name}</button>)}
</div>

<div className="template-info">
<strong>{template.name}</strong>
<p>{template.desc}</p>
<span className="kicker">{template.fields.length} TEMPLATE-SPECIFIC FIELDS • A4 FORMAT</span>
</div>

{manual?
<div className="form-box">
<div className="kicker">MANUAL CANDIDATE DETAILS</div>
<h2>{template.name}</h2>
<div className="grid">
{template.fields.map(key=><div className="field" key={key}>
<label>{LABELS[key].toUpperCase()}{key==="name"?" *":""}</label>
{key==="domain"?
<select name={key} value={form[key]||""} onChange={changeField}>
<option value="">Select domain</option>
{DOMAINS.map(x=><option key={x}>{x}</option>)}
</select>
:key==="mode"?
<select name={key} value={form[key]||""} onChange={changeField}>
<option value="">Select mode</option>
{MODES.map(x=><option key={x}>{x}</option>)}
</select>
:key==="duration"?
<select name={key} value={form[key]||""} onChange={changeField}>
<option value="">Select duration</option>
{DURATIONS.map(x=><option key={x}>{x}</option>)}
</select>
:["joining","completionDate","appointmentDate","participationDate"].includes(key)?
<input type="date" name={key} value={form[key]||""} onChange={changeField}/>
:<input type="text" name={key} value={form[key]||""} onChange={changeField} placeholder={"Enter "+LABELS[key].toLowerCase()} autoComplete="off"/>
}
</div>)}
</div>
<p className="help">Your details are used only for this document. They are not saved to Google Sheets or a database. Clicking Preview saves a temporary snapshot for the document and clears the input form.</p>
</div>
:
<div className="form-box">
<div className="field">
<label>SELECT CANDIDATE FROM GOOGLE SHEETS</label>
<select value={selected} onChange={e=>setSelected(e.target.value)}>
<option value="">Select candidate</option>
{records.map(r=><option key={r.key} value={r.key}>{r.name} — {r.aid||"No ID"}</option>)}
</select>
</div>
<p className="help">Read-only company records. No spreadsheet values are changed.</p>
</div>
}

<div className="section-head" style={{marginTop:22}}>
<span className="desc">Six professional templates • A4 PDF preview</span>
<button className="btn orange" onClick={makePreview}>Preview Document →</button>
</div>
</section>

<footer>
<Logo style={{width:95,height:"auto",margin:"0 auto 8px"}}/>
<b>{COMPANY}</b><br/>
Wanaparthy, Telangana, India<br/>
{EMAIL}<br/>
<a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website</a>
</footer>

{preview&&previewData&&<div className="modal">
<div className="modal-inner">
<div className="modalbar">
<strong>{template.name} • {previewData.name}</strong>
<div className="modal-actions">
<button className="btn orange" onClick={()=>window.print()}>Print / Save PDF</button>
<button className="btn" onClick={closePreview}>Close ×</button>
</div>
</div>
<div id="printTarget"><Document data={previewData} template={template}/></div>
</div>
</div>}
</main>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
