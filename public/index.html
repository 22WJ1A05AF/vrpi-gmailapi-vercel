<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR PI Group | Corporate Document Platform & HR Studio</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#17233a;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1520px;margin:auto;padding:20px}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #dfe6ef;padding-bottom:14px}
.logo{width:180px;height:85px;object-fit:contain;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 15px;background:white;border:1px solid #dfe6ef;border-radius:9px;color:#1e3a5f;text-decoration:none;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.dark{background:#1e3a5f;color:white;border-color:#1e3a5f}
.dark:hover{background:#152d4c}
.orange{background:#e94b17;color:white;border-color:#e94b17}
.orange:hover{background:#d03e0e}
.gmail-btn{background:linear-gradient(135deg,#312e81 0%,#4338ca 100%);color:white;border:1px solid #4f46e5}
.teams-btn{background:linear-gradient(135deg,#464eb8 0%,#5b5fc7 100%);color:white;border:1px solid #5b5fc7}

/* Hero */
.hero{text-align:center;padding:26px 10px 16px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;background:white;border:1px solid #dfe6ef;border-radius:25px;padding:6px 16px;font-size:10px;font-weight:800;letter-spacing:1px;color:#64748b}
h1{font-size:clamp(28px,4vw,44px);line-height:1.15;margin:12px 0;color:#121c30;letter-spacing:-1px}
.desc{color:#8290a5;font-size:11.5px;line-height:1.7}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat,.panel{background:white;border:1px solid #dfe6ef;border-radius:14px}
.stat{padding:16px}
.stat label{font-size:9.5px;font-weight:800;color:#8795a9;letter-spacing:1px}
.stat strong{display:block;font-size:22px;margin:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat small{font-size:9.5px;color:#94a3b8}

/* Panels */
.panel{padding:20px;margin-bottom:20px}
.kicker{font-size:10px;letter-spacing:1.2px;font-weight:800;color:#8492a7;display:flex;align-items:center;gap:6px}
h2{font-size:19px;color:#172b49;margin:6px 0}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.search{padding:9px 12px;border:1px solid #dfe6ef;border-radius:8px;min-width:220px;font-size:11px}
.table-wrap{overflow-x:auto;margin-top:14px;max-height:240px}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{background:#f8fafc;text-align:left;padding:10px 12px;color:#8795a9;font-size:9px;position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-bottom:1px solid #edf0f4;font-size:10px;color:#52637c}
.status{padding:3px 7px;border-radius:20px;background:#edf2f7;font-size:9px;font-weight:700}
.sent{background:#dcfce7;color:#166534}
.failed{background:#fee2e2;color:#991b1b}
.pending{background:#fef3c7;color:#92400e}
.text-btn{border:0;background:none;color:#0284c7;font-weight:800;font-size:10px;cursor:pointer}

/* Two-Column Studio Layout */
.studio-grid{display:grid;grid-template-columns:1fr 0.6fr;gap:20px;align-items:start}
@media(max-width:1150px){.studio-grid{grid-template-columns:1fr}}

.mode-switch,.template-pills{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.mode-switch button,.template-pills button{padding:8px 12px;border:1px solid #dfe6ef;background:white;border-radius:8px;font-size:10px;font-weight:800;color:#52637c;transition:all .15s ease}
.mode-switch button.active,.template-pills button.active{background:#1e3a5f;color:white;border-color:#1e3a5f}

.form-box{padding:18px;background:#f8fafc;border:1px solid #e4eaf1;border-radius:12px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field label{display:block;font-size:9.5px;font-weight:800;color:#52637c;margin-bottom:6px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid #dfe6ef;border-radius:8px;background:white;color:#30425d;font-size:11px;outline:none}
.field input:focus,.field select:focus{border-color:#e94b17;box-shadow:0 0 0 3px #e94b1712}
.field input[type=date]{min-height:37px;cursor:pointer;color-scheme:light}

/* Live Preview Side Panel */
.preview-column{position:sticky;top:15px}
.preview-topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0f172a;color:white;padding:10px 16px;border-radius:10px 10px 0 0}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:#4ade80}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80}
.preview-controls{display:flex;align-items:center;gap:6px}
.preview-scale-btn{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700}
.preview-stage{background:#94a3b8;padding:16px 8px;border-radius:0 0 10px 10px;border:1px solid #94a3b8;overflow:auto;max-height:750px;display:flex;justify-content:center}
.preview-scaled-wrap{transform-origin:top center;transition:transform .12s ease}

/* Fullscreen Preview Modal */
.modal-overlay{position:fixed;inset:0;background:#090d16cc;backdrop-filter:blur(4px);z-index:200;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:15px}
.modal-container{max-width:980px;width:100%;margin:auto}
.modalbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#17233a;padding:12px 18px;border-radius:12px;margin-bottom:14px;color:white}
.modalbar strong{font-size:12px}
.modal-actions{display:flex;gap:8px}

/* ========================================================
   EXECUTIVE TIMES NEW ROMAN A4 DOCUMENT ENGINE
   ======================================================== */
.doc-serif{font-family:'Times New Roman',Times,'Georgia',serif;color:#111827}
.a4{width:210mm;height:296mm;max-height:296mm;overflow:hidden;background:white;margin:auto;display:flex;flex-direction:column;box-shadow:0 6px 25px #00000020}

/* Official Corporate Letterhead */
.doc-header{padding:14px 28px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1e3a5f;gap:12px}
.doc-logo{width:135px;height:65px;object-fit:contain;display:block}
.doc-info{text-align:right;font-size:8.5px;color:#374151;line-height:1.55}
.doc-info strong{color:#1e3a5f;font-size:11.5px;font-weight:bold}

.doc-content{padding:14px 28px;flex:1;display:flex;flex-direction:column;font-size:12.5px;line-height:1.52;text-align:justify}
.doc-ref-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;font-weight:bold;color:#1e3a5f}
.doc-title{text-align:center;margin:6px 0 10px}
.doc-title h2{font-size:17.5px;letter-spacing:1px;color:#152d4c;margin:2px 0;font-weight:bold;text-decoration:underline}

.doc-recipient{margin-bottom:6px;font-size:12px;line-height:1.45}
.doc-subject{font-size:12px;font-weight:bold;color:#111827;margin:5px 0 7px;text-decoration:underline}

.doc-section{font-size:11px;font-weight:bold;color:#1e3a5f;border-bottom:1px solid #1e3a5f;padding-bottom:2px;margin:8px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.doc-table{width:100%;border-collapse:collapse;margin:6px 0 8px;font-size:11.5px}
.doc-table td{padding:4.5px 8px;border:1px solid #cbd5e1;vertical-align:middle}
.doc-table td:first-child{background:#f8fafc;color:#1e3a5f;font-weight:bold;width:32%}

.doc-content p{margin:4px 0;color:#1f2937}
.terms-list{margin:4px 0 6px;padding-left:18px}
.terms-list li{margin-bottom:3px;color:#1f2937;line-height:1.45}

/* Authentic Corporate Stamp / Notary Seal */
.signoff-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:10px}
.signoff-col{font-size:11.5px;line-height:1.45}
.signoff-col strong{display:block;color:#1e3a5f;font-size:12px;margin-top:2px}

.corp-seal-svg{
  width:88px;
  height:88px;
  display:block;
  transform:rotate(-4deg);
}

.acceptance-box{border:1px solid #1e3a5f;border-radius:4px;padding:5px 10px;margin-top:6px;font-size:11px;background:#fcfdfd}
.acceptance-box p{margin:2px 0}

.doc-footer{background:#1e3a5f;color:white;text-align:center;padding:7px 12px;font-size:8px;line-height:1.5;margin-top:auto;font-family:'Plus Jakarta Sans',sans-serif}

/* Completion Certificate Template */
.completion-page{border:1px solid #e5e9ef}
.completion-head{padding:14px 28px 10px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:3.5px solid #d6ad59}
.completion-head .doc-logo{width:130px;height:65px}
.completion-company{text-align:right;font-size:8.5px;line-height:1.55;color:#475569}
.completion-company strong{font-size:11.5px;color:#1e3a5f}
.completion-accent{height:4px;background:linear-gradient(90deg,#172f50 0%,#d5ae61 48%,#172f50 100%)}
.completion-body{padding:18px 30px;flex:1;display:flex;flex-direction:column;font-size:12.5px;line-height:1.6;text-align:justify}
.completion-title{text-align:center;margin:6px 0 12px}
.completion-title h2{font-family:'Playfair Display',serif;font-size:20.5px;color:#152d4c;margin:2px 0;font-weight:bold;letter-spacing:.5px}
.completion-title small{font-size:9.5px;font-weight:bold;letter-spacing:1px;color:#9a7b39}
.completion-details{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:12px}
.completion-details td{border:1px solid #cbd5e1;padding:5.5px 10px}
.completion-details td:first-child{width:32%;background:#f8fafc;color:#1e3a5f;font-weight:bold}
.completion-signoff{margin-top:auto;padding-top:12px;position:relative;display:flex;justify-content:space-between;align-items:flex-end}
.completion-footer{background:#132e50;color:#fff;padding:7px 14px;text-align:center;font-size:7.5px;line-height:1.5;border-top:2.5px solid #c69f4d;margin-top:auto;font-family:'Plus Jakarta Sans',sans-serif}

/* ========================================================
   PARTICIPATION CERTIFICATE (CEO SIGNATURES REMOVED)
   ======================================================== */
.participation-page{
  width:278mm;
  height:208mm;
  max-height:208mm;
  position:relative;
  overflow:hidden;
  background:#fffdf8;
  border:8px double #cba85a;
  padding:12mm 16mm 10mm;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  text-align:center;
}
.participation-frame{
  position:absolute;
  inset:5px;
  border:1.5px solid #1e3a5f;
  pointer-events:none;
}
.participation-content{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
}
.participation-header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  padding-bottom:6px;
  border-bottom:1.5px solid #d4b26f;
}
.participation-logo{width:125px;height:55px;object-fit:contain}
.participation-institution{text-align:right;font-size:9px;line-height:1.45;color:#334155}
.participation-institution strong{font-size:12px;color:#17395c;letter-spacing:1px}

.participation-heading-wrap{margin:8px 0 2px}
.participation-heading-wrap small{font-size:10px;font-weight:800;letter-spacing:3px;color:#9a7832}
.participation-heading{font-family:'Playfair Display',serif;font-size:36px;letter-spacing:4px;color:#17395c;margin:2px 0}
.participation-subtitle{font-size:12px;letter-spacing:3.5px;color:#a58038;font-weight:700}

.participation-intro{font-size:12px;color:#475569;margin-top:6px}
.participation-name{font-family:'Playfair Display',serif;font-style:italic;font-size:36px;color:#b48c3b;border-bottom:1.5px solid #caa962;padding:0 35px 2px;margin:4px 0 6px;min-width:320px;max-width:85%}

.participation-copy{font-size:12px;color:#1e293b;line-height:1.6;max-width:760px;margin:4px auto;text-align:center}
.participation-citation{font-size:11.5px;color:#475569;line-height:1.55;max-width:740px;margin:4px auto;font-style:italic}

.participation-meta-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  width:92%;
  background:#f9f8f4;
  border:1px solid #e2d7be;
  border-radius:6px;
  padding:8px 14px;
  margin:8px auto;
  color:#17395c;
  font-size:11px;
}
.participation-meta-box strong{display:block;font-size:11.5px}
.participation-meta-box span{display:block;color:#64748b;font-size:9.5px}

/* Clean Corporate Endorsement (No Individual Digital Signatures) */
.participation-accreditation{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin-top:4px;
  padding:4px 0;
}
.gold-seal-svg{
  width:78px;
  height:78px;
  display:block;
}
.participation-foot{font-size:8px;color:#17395c;font-weight:700;position:relative;z-index:2;margin-top:4px;letter-spacing:1px}

/* Dialog Modals */
.cred-card{background:white;border-radius:16px;max-width:600px;width:100%;box-shadow:0 25px 60px #00000040;overflow:hidden;margin:auto}
.cred-header{padding:18px 22px;color:white;display:flex;justify-content:space-between;align-items:center}
.cred-title-row{display:flex;align-items:center;gap:12px}
.cred-g-icon{width:38px;height:38px;background:#ffffff20;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.cred-header h3{margin:0;font-size:16px;font-weight:700}
.cred-header p{margin:2px 0 0;font-size:10.5px;opacity:.9}
.close-round{background:#ffffff20;border:0;color:white;width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer}
.cred-body{padding:18px 22px}
.cred-field{margin-bottom:13px}
.cred-field label{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;color:#334155;margin-bottom:5px}
.cred-input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:11.5px;outline:none;background:#f8fafc}
.cred-input:focus{border-color:#4338ca;background:white}
.app-pwd-help{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:11px 14px;font-size:9.5px;color:#475569;line-height:1.6}
.cred-footer{padding:14px 22px;background:#f8fafc;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}

footer{text-align:center;color:#8491a5;font-size:9.5px;padding:22px}
footer .logo{width:80px;height:auto;margin:0 auto 6px}

/* Guaranteed 1-Page Clean Print Isolation */
@media print{
  @page{size:A4 portrait;margin:0}
  @page certPage{size:A4 landscape;margin:0}
  
  body *{visibility:hidden!important}
  #printTarget,#printTarget *{visibility:visible!important}
  
  #printTarget{
    position:absolute!important;
    left:0!important;
    top:0!important;
    width:100%!important;
    margin:0!important;
    padding:0!important;
    background:white!important;
  }
  
  .modal-overlay{position:static!important;padding:0!important;background:white!important;overflow:visible!important}
  .modal-container{max-width:none!important;width:100%!important;margin:0!important}
  .modalbar{display:none!important}
  
  .a4{
    width:210mm!important;
    height:296mm!important;
    max-height:296mm!important;
    margin:0 auto!important;
    box-shadow:none!important;
    page-break-inside:avoid!important;
    break-inside:avoid!important;
    page-break-after:avoid!important;
    break-after:avoid!important;
    print-color-adjust:exact!important;
    -webkit-print-color-adjust:exact!important;
  }
  
  .participation-page{
    page:certPage;
    width:297mm!important;
    height:208mm!important;
    max-height:208mm!important;
    margin:0 auto!important;
    page-break-inside:avoid!important;
    break-inside:avoid!important;
    page-break-after:avoid!important;
    break-after:avoid!important;
    print-color-adjust:exact!important;
    -webkit-print-color-adjust:exact!important;
  }
  
  .completion-page,.completion-footer,.doc-table td:first-child{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;

const COMPANY="VR PI Group Of Companies";
const SHEET_ID="1dCJXGZN3dbThvJt5SnMYUSp0uAAsVuWnKuXd1rabBOU";
const SHEET_GID="0";
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${SHEET_GID}`;
const WEBSITE="https://share.google/Staafq7spnZSStc8n";
const OFFICIAL_EMAIL="vrpigroupoftechnology@gmail.com";

function Logo({className="",style={}}){
  return <img src="./vrpi-logo.png" alt="VR PI Group" className={className} style={{objectFit:"contain",display:"block",...style}} onError={e=>{e.target.style.display='none';}}/>;
}

/* Professional Corporate Registrar Stamp / Seal */
function CorporateSeal(){
  return <svg viewBox="0 0 100 100" className="corp-seal-svg">
    <circle cx="50" cy="50" r="47" fill="none" stroke="#1e3a5f" strokeWidth="2.5"/>
    <circle cx="50" cy="50" r="43.5" fill="none" stroke="#1e3a5f" strokeWidth="0.8" strokeDasharray="2,2"/>
    <circle cx="50" cy="50" r="33" fill="none" stroke="#1e3a5f" strokeWidth="1.5"/>

      </textPath>
    </text>
    <text fill="#1e3a5f" fontSize="6.8" fontWeight="bold" letterSpacing="1">
      <textPath href="#sealPathInner" startOffset="50%" textAnchor="middle">
        ★ CORPORATE SEAL ★
      </textPath>
    </text>
    <circle cx="50" cy="50" r="16" fill="#1e3a5f" fillOpacity="0.08"/>
    <text x="50" y="47" fill="#1e3a5f" fontSize="9" fontWeight="900" textAnchor="middle">VR PI</text>
    <text x="50" y="56" fill="#1e3a5f" fontSize="5.5" fontWeight="bold" textAnchor="middle">OFFICIAL</text>
  </svg>;
}

/* Gold Excellence Medallion for Participation Certificate */
function GoldSealBadge(){
  return <svg viewBox="0 0 100 100" className="gold-seal-svg">
    <defs>
      <radialGradient id="goldGrad" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stopColor="#fff8e1"/>
        <stop offset="45%" stopColor="#d4af37"/>
        <stop offset="100%" stopColor="#997018"/>
      </radialGradient>
    </defs>
    <circle cx="50" cy="50" r="48" fill="url(#goldGrad)" stroke="#6b4c10" strokeWidth="2"/>
    <circle cx="50" cy="50" r="43" fill="none" stroke="#fff8dc" strokeWidth="1.2" strokeDasharray="3,2"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#fff8dc" strokeWidth="1.5"/>
    <text x="50" y="32" fill="#fff" fontSize="13" fontWeight="bold" textAnchor="middle">★</text>
    <text x="50" y="46" fill="#fff" fontSize="8" fontWeight="bold" letterSpacing="1" textAnchor="middle">EXCELLENCE</text>
    <text x="50" y="55" fill="#fff" fontSize="7" fontWeight="bold" letterSpacing="0.8" textAnchor="middle">IN MERIT</text>
    <text x="50" y="66" fill="#fff8dc" fontSize="5.8" fontWeight="bold" textAnchor="middle">VR PI GROUP</text>
  </svg>;
}

const TEMPLATES=[
  {id:"offer",name:"Internship Offer Letter",fields:["name","domain","mode","joining","duration"],desc:"Executive corporate internship appointment and terms of engagement.",type:"letter"},
  {id:"internship-completion",name:"Internship Completion Certificate",fields:["name","domain","mode","joining","duration","completionDate"],desc:"Official corporate credential certifying performance and project completion.",type:"completion",programme:"internship"},
  {id:"training-appointment",name:"Training Appointment Letter",fields:["name","domain","mode","appointmentDate","duration"],desc:"Structured technical industrial training appointment and curriculum agreement.",type:"letter"},
  {id:"training-completion",name:"Training Completion Certificate",fields:["name","domain","mode","joining","duration","completionDate"],desc:"Formal technical completion credential and competence verification.",type:"completion",programme:"training"},
  {id:"participation",name:"Participation Certificate",fields:["name","eventName","domain","participationDate"],desc:"Prestigious navy-and-gold diploma certificate for summit & workshop participation.",type:"participation"},
  {id:"experience",name:"Experience Letter",fields:["name","domain","role","joining","duration"],desc:"Formal service and tenure verification letter for career progression.",type:"experience"}
];

const LABELS={
  name:"Candidate Full Name",domain:"Programme Domain",mode:"Programme Mode",

function today(){
  return new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});
}
function dateText(v){
  if(!v)return "";
  const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"}):v;
}
function norm(v){return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function column(cols,names,fallback=-1){
  for(const n of names){
    const i=cols.findIndex(c=>norm(c.label||c.id)===norm(n));
    if(i>=0)return i;
  }
  return fallback;
}
function cell(row,i){
  return i<0?"":String(row.c?.[i]?.f||row.c?.[i]?.v||"").trim();
}

function fetchSheet(){
  return new Promise((resolve,reject)=>{
    const cb="vrpiReadOnlySheet";
    let done=false;
    const script=document.createElement("script");
    const timer=setTimeout(()=>finish(new Error("Google Sheets connection timed out.")),15000);
    function finish(err,data){
      if(done)return;
      done=true;
      clearTimeout(timer);
      script.remove();
      try{delete window[cb]}catch(e){}
      err?reject(err):resolve(data);
    }
    window[cb]=data=>{
      if(!data?.table){finish(new Error("Sheet is not accessible. Enable Anyone with the link – Viewer."));return}
      finish(null,data.table);
    };
    script.onerror=()=>finish(new Error("Unable to load Google Sheets."));
    script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=${encodeURIComponent("out:json;responseHandler:"+cb)}&t=${Date.now()}`;
    document.head.appendChild(script);
  });
}

async function getRecords(){
  const table=await fetchSheet();
  const cols=table.cols||[];
  return (table.rows||[]).map((row,i)=>{
    const read=(names,fallback=-1)=>cell(row,column(cols,names,fallback));
    return {
      key:read(["Application ID","Application Id"],1)||"row-"+i,
      aid:read(["Application ID","Application Id"],1),
      name:read(["Full Name","Candidate Name","Name"],2),
      email:read(["Email Address","Email","Candidate Email"],3),
      phone:read(["WhatsApp / Phone","WhatsApp","Phone"],4),
      domain:read(["Domain","Internship Domain","Programme Domain"],7),
      mode:read(["Mode","Programme Mode","Internship Mode"],-1),
      joining:read(["Start Date","Joining Date","Internship Start Date"],-1),
      duration:read(["Duration","Internship Duration","Programme Duration"],-1),
      completionDate:read(["Completion Date","End Date","Internship End Date"],-1),
      appointmentDate:read(["Appointment Date","Training Date"],-1),
      eventName:read(["Event Name","Programme Name","Event"],-1),
      participationDate:read(["Participation Date","Event Date"],-1),
      role:read(["Designation","Role","Job Role"],-1),
      status:read(["Letter Sent","Email Status","Application Status","Status"],17)||"Not recorded",
      pdf:read(["PDF Record","PDF Link"],18)
    };
  }).filter(x=>x.name||x.email||x.aid);
}

      const s=localStorage.getItem("vrpi_teams_creds");
      return s?JSON.parse(s):{email:"hr@vrpigroup.co.in",meetingLink:"https://teams.microsoft.com/",displayName:"VR PI Interview Panel"};
    }catch(e){return {email:"hr@vrpigroup.co.in",meetingLink:"https://teams.microsoft.com/",displayName:"VR PI Interview Panel"};}
  });
  const [teamsModalOpen,setTeamsModalOpen]=useState(false);

  const template=TEMPLATES.find(t=>t.id===templateId)||TEMPLATES[0];
  const selectedRecord=records.find(r=>r.key===selected);

  async function refresh(){
    setLoading(true);
    try{
      const result=await getRecords();
      setRecords(result);
      setSelected(old=>result.some(r=>r.key===old)?old:(result[0]?.key||""));
      setError("");
      setLastSync(new Date().toLocaleTimeString("en-IN"));
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  }

  useEffect(()=>{
    refresh();
    const timer=setInterval(refresh,30000);
    return()=>clearInterval(timer);
  },[]);

  const activeData=useMemo(()=>{
    if(manual)return form;
    if(selectedRecord){
      return {
        ...form,
        ...selectedRecord,
        name:selectedRecord.name||form.name,
        domain:selectedRecord.domain||form.domain,
        mode:selectedRecord.mode||form.mode,
        joining:selectedRecord.joining||form.joining,
        duration:selectedRecord.duration||form.duration,
        completionDate:selectedRecord.completionDate||form.completionDate,
        appointmentDate:selectedRecord.appointmentDate||form.appointmentDate,
        eventName:selectedRecord.eventName||form.eventName,
        participationDate:selectedRecord.participationDate||form.participationDate,
        role:selectedRecord.role||form.role
      };
    }
    return form;
  },[manual,form,selectedRecord]);

  const filtered=useMemo(()=>{
    const q=search.toLowerCase();
    return records.filter(r=>[r.aid,r.name,r.email,r.domain].join(" ").toLowerCase().includes(q));
  },[records,search]);

  const sent=records.filter(r=>/sent|success|delivered/i.test(r.status)).length;
  const failed=records.filter(r=>/failed|error/i.test(r.status)).length;
  const pending=records.length-sent-failed;

  function changeField(e){
    const {name}=e.target;
    let value=e.target.value;
    if(name==="name"||name==="role"||name==="eventName")value=value.replace(/[^a-zA-Z0-9\s&'.,-]/g,"");
    setForm(old=>({...old,[name]:value}));
  }

  function saveTeamsCreds(c){
    setTeamsCreds(c);
    try{localStorage.setItem("vrpi_teams_creds",JSON.stringify(c));}catch(e){}
  }

  /* Automatically opens the Company Gmail */
  function openCompanyGmailDirect(){
    window.open(`https://mail.google.com/mail/?authuser=${encodeURIComponent(OFFICIAL_EMAIL)}#inbox`, "_blank");
  }

  return <>
    <main className="app">
      <header>
        <a href={WEBSITE} target="_blank" rel="noreferrer">
          <Logo className="logo"/>
        </a>
        <div className="actions">
          <a className="btn" href={WEBSITE} target="_blank" rel="noreferrer">Company Website ↗</a>
          <a className="btn" href={SHEET_URL} target="_blank" rel="noreferrer">Google Sheet ↗</a>
          <button className="btn gmail-btn" onClick={()=>setGmailModalOpen(true)}>
            ⚙ Gmail Settings
          </button>
          <button className="btn teams-btn" onClick={()=>setTeamsModalOpen(true)}>
            👥 Teams Settings
          </button>
          <button className="btn dark" onClick={openCompanyGmailDirect}>
            ✉ Open Gmail ↗
          </button>
          <a className="btn" style={{background:"#5b5fc7",color:"white",borderColor:"#5b5fc7"}} href={teamsCreds.meetingLink||"https://teams.microsoft.com/"} target="_blank" rel="noreferrer">
            👥 Open Teams ↗
          </a>
          <button className="btn orange" onClick={refresh} disabled={loading}>{loading?"...":"↻ Refresh"}</button>
        </div>
      </header>

      <section className="hero">
        <div className="eyebrow">VR PI GROUP • ENTERPRISE HR & DOCUMENT PLATFORM</div>
        <h1>Enterprise Talent<br/><span style={{color:"#1e3a5f"}}>Excellence Platform</span></h1>
        <p className="desc">Official Executive Document Platform • Official Corporate Notary Seals & Single-Page Print</p>
      </section>

      {error&&<div style={{padding:"10px 14px",background:"#fff5ed",color:"#a34a16",borderRadius:8,marginBottom:14,fontSize:11}}>
        <b>Google Sheets Note:</b> {error}
      </div>}

      <section className="stats">
        {[
          ["TOTAL APPLICANTS",records.length,"Synchronized sheet records","#1e3a5f"],
          ["LETTERS SENT",sent,"Recorded sent status","#15803d"],
          ["COMPANY GMAIL SENDER",OFFICIAL_EMAIL,"VR PI TECH SOLUTIONS HR","#4338ca"],
          ["TEAMS STATUS","ACTIVE","Microsoft Teams Ready","#5b5fc7"]
        ].map(([label,value,note,color])=><div className="stat" key={label}>
          <label>{label}</label><strong style={{color}} title={String(value)}>{value}</strong><small>{note}</small>
        </div>)}
      </section>

      {/* Candidate Records Table */}
      <section className="panel">
        <div className="section-head">
          <div>
            <div className="kicker">LIVE DATA MANAGEMENT</div>
            <h2>Candidate Records</h2>
          </div>
          <input className="search" placeholder="Search ID, name, email..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>

        <div className="table-wrap">
          {!filtered.length?<div style={{padding:16,textAlign:"center",color:"#64748b",fontSize:11}}>{loading?"Syncing...":"No records available."}</div>:
          <table>
            <thead><tr><th>APPLICATION ID</th><th>NAME</th><th>EMAIL</th><th>PHONE</th><th>DOMAIN</th><th>STATUS</th><th>ACTION</th></tr></thead>
            <tbody>{filtered.map(r=><tr key={r.key}>
              <td>{r.aid||"—"}</td>
              <td><b>{r.name}</b></td>
              <td>{r.email||"—"}</td>
              <td>{r.phone||"—"}</td>
              <td>{r.domain||"—"}</td>
              <td><span className={"status "+(/sent|success/i.test(r.status)?"sent":/failed/i.test(r.status)?"failed":"pending")}>{r.status}</span></td>
              <td>
                <button className="text-btn" onClick={()=>{
                  setManual(false);
                  setSelected(r.key);
                  setForm(prev=>({
                    ...prev,
                    name:r.name||prev.name,
                    domain:r.domain||prev.domain,
                    email:r.email||prev.email,
                    mode:r.mode||prev.mode,
                    joining:r.joining||prev.joining,
                    duration:r.duration||prev.duration
                  }));
                }}>Select Candidate ↗</button>
              </td>
            </tr>)}</tbody>
          </table>}
        </div>
      </section>

      {/* Live Studio Layout */}
      <div className="studio-grid">
        <section className="panel" style={{marginBottom:0}}>
          <div className="kicker"><span style={{color:"#059669"}}>● Real-Time Studio</span></div>
          <h2>Document Customizer</h2>
          <p className="desc">Choose a template. Enter details or select a candidate to customize.</p>

          <div className="mode-switch">
            <button className={!manual?"active":""} onClick={()=>setManual(false)}>Use Google Sheet Record</button>
            <button className={manual?"active":""} onClick={()=>setManual(true)}>Enter Details Manually</button>
          </div>

          <div className="template-pills">
            {TEMPLATES.map(t=><button key={t.id} className={templateId===t.id?"active":""} onClick={()=>setTemplateId(t.id)}>{t.name}</button>)}
          </div>

          {!manual&&<div className="form-box" style={{marginTop:0,marginBottom:12}}>
            <div className="field">
              <label>SELECT APPLICANT FROM SPREADSHEET</label>
              <select value={selected} onChange={e=>setSelected(e.target.value)}>
                <option value="">Choose candidate...</option>
                {records.map(r=><option key={r.key} value={r.key}>{r.name} — {r.domain||"No Domain"}</option>)}
              </select>
            </div>
          </div>}

          <div className="form-box" style={{marginTop:0}}>
            <div className="kicker">{template.name.toUpperCase()} FIELDS</div>
            <div className="grid">
              {template.fields.map(key=><div className="field" key={key}>
                <label>{LABELS[key].toUpperCase()}{key==="name"?" *":""}</label>
                {key==="domain"?
                  <select name={key} value={activeData[key]||""} onChange={changeField}>
                    <option value="">Select domain</option>
                    {DOMAINS.map(x=><option key={x} value={x}>{x}</option>)}
                  </select>
                :key==="mode"?
                  <select name={key} value={activeData[key]||""} onChange={changeField}>
                    <option value="">Select mode</option>
                    {MODES.map(x=><option key={x} value={x}>{x}</option>)}
                  </select>
                :key==="duration"?
                  <select name={key} value={activeData[key]||""} onChange={changeField}>
                    <option value="">Select duration</option>
                    {DURATIONS.map(x=><option key={x} value={x}>{x}</option>)}
                  </select>
                :["joining","completionDate","appointmentDate","participationDate"].includes(key)?
                  <input type="date" name={key} value={activeData[key]||""} onChange={changeField}/>
                :<input type="text" name={key} value={activeData[key]||""} onChange={changeField} placeholder={"Enter "+LABELS[key].toLowerCase()} autoComplete="off"/>
                }
              </div>)}
            </div>
          </div>

          <div style={{display:"flex",justifyContent:"flex-end",marginTop:18}}>
            <button className="btn orange" style={{padding:"12px 24px",fontSize:12}} onClick={()=>setPreviewModalOpen(true)}>
              Preview Document →
            </button>
          </div>
        </section>

        {/* Live Preview Side Panel */}
        <div className="preview-column">
          <div className="preview-topbar">
            <div className="sync-badge">
              <span className="sync-dot"></span>
              <span>Times New Roman Live Preview</span>
            </div>
            <div className="preview-controls">
              <span style={{fontSize:9.5,color:"#94a3b8"}}>Scale:</span>
              <button className="preview-scale-btn" onClick={()=>setPreviewScale(s=>Math.max(0.35,+(s-0.05).toFixed(2)))}>-</button>
              <span style={{fontSize:9.5,fontWeight:700,minWidth:30,textAlign:"center"}}>{Math.round(previewScale*100)}%</span>
              <button className="preview-scale-btn" onClick={()=>setPreviewScale(s=>Math.min(1.0,+(s+0.05).toFixed(2)))}>+</button>
              <button className="btn orange" style={{padding:"5px 10px",fontSize:9.5}} onClick={()=>setPreviewModalOpen(true)}>
                Full Preview ↗
              </button>
            </div>
          </div>

          <div className="preview-stage">
            <div
              className="preview-scaled-wrap"
              style={{
                transform:`scale(${previewScale})`,
                marginBottom:template.type==="participation"?-140:-280
              }}
            >
              <DocumentRenderer
                data={activeData}
                template={template}
              />
            </div>
          </div>
        </div>
      </div>

      <footer>
        <Logo style={{width:80,height:"auto",margin:"0 auto 6px"}}/>
        <b>{COMPANY}</b><br/>
        Wanaparthy, Telangana, India • {OFFICIAL_EMAIL}<br/>
        <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website</a>
      </footer>

      {/* Full-Screen Document Preview Modal */}
      {previewModalOpen&&<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setPreviewModalOpen(false);}}>
        <div className="modal-container">
          <div className="modalbar">
            <strong>{template.name} • {activeData.name}</strong>
            <div className="modal-actions">
              <button className="btn orange" onClick={()=>window.print()}>
                🖨 Print / Save PDF
              </button>
              <button className="btn" onClick={()=>setPreviewModalOpen(false)}>
                Close ×
              </button>
            </div>
          </div>
          <div id="printTarget">
            <DocumentRenderer
              data={activeData}
              template={template}
            />
          </div>
        </div>
      </div>}

      {/* Gmail Modal */}
      <GmailModal
        open={gmailModalOpen}
        onClose={()=>setGmailModalOpen(false)}
      />

      {/* Microsoft Teams Modal */}
      <TeamsModal
        open={teamsModalOpen}
        onClose={()=>setTeamsModalOpen(false)}
        credentials={teamsCreds}
        onSave={saveTeamsCreds}
      />
    </main>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
