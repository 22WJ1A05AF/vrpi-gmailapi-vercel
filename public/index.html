
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VR PI Group | Enterprise Talent Excellence Platform</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#17233a;font-family:'Plus Jakarta Sans',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1240px;margin:auto;padding:28px 24px}
.header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid #e2e8f0}
.brand{display:flex;align-items:center;text-decoration:none}
.logo{width:180px;height:auto;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 15px;border:1px solid #dfe6ef;background:white;border-radius:9px;color:#263d5e;text-decoration:none;font-size:10px;font-weight:800}
.dark{background:#1e3a5f;color:white;border-color:#1e3a5f}
.orange{background:#e94b17;color:white;border-color:#e94b17}
.hero{text-align:center;padding:55px 10px 38px}
.eyebrow{display:inline-block;background:white;border:1px solid #e1e7ef;border-radius:30px;padding:9px 17px;color:#687891;font-size:10px;font-weight:800;letter-spacing:1px}
.hero h1{font-size:clamp(34px,5vw,55px);line-height:1.12;letter-spacing:-2px;color:#111a2d;font-weight:800;margin:22px 0 14px}
.hero p{max-width:750px;margin:auto;color:#74839a;font-size:13px;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:19px 20px}
.stat button{border:0;background:none;width:100%;padding:0;text-align:left}
.stat label{font-size:9px;font-weight:800;color:#8795a9;letter-spacing:1px;display:block}
.stat strong{display:block;font-size:30px;font-weight:800;margin:9px 0 4px}
.stat small{font-size:10px;color:#94a3b8}
.stat.active{border:2px solid #e94b17;background:#fffaf7}
.panel{background:white;border:1px solid #e1e7ef;border-radius:18px;padding:27px;box-shadow:0 10px 32px #263b5909;margin-bottom:24px}
.kicker{color:#8291a6;font-size:10px;font-weight:800;letter-spacing:1.5px}
h2{font-size:20px;color:#172b49;margin:8px 0}
.description{font-size:12px;color:#8290a5;line-height:1.8}
.alert{padding:13px 15px;border-radius:9px;margin-top:15px;font-size:11px;line-height:1.8}
.error{background:#fff5ed;color:#a34a16;border:1px solid #ffdbbd}
.success{background:#edfaf3;color:#16754c;border:1px solid #c9eedc}
.info{background:#eff6ff;color:#315b8c;border:1px solid #d7e7fa}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.search{padding:11px 13px;border:1px solid #dfe6ef;border-radius:9px;font-size:11px;outline:none;min-width:230px}
.search:focus,input:focus,select:focus{border-color:#e94b17;outline:none}
.table-wrap{overflow-x:auto;margin-top:18px}
.records{width:100%;border-collapse:collapse;white-space:nowrap}
.records th{background:#f8fafc;text-align:left;padding:13px 12px;color:#8b99ad;font-size:9px;letter-spacing:.7px;text-transform:uppercase}
.records td{padding:14px 12px;border-bottom:1px solid #eef1f5;font-size:10px;color:#54647a}
.records td:first-child{font-family:'JetBrains Mono',monospace;font-weight:700;color:#1e3a5f}
.records tr:hover{background:#f8faff}
.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:9px;font-weight:800;background:#edf2f7;color:#52637b}
.status.sent{background:#dcfce7;color:#166534}
.status.pending{background:#fef3c7;color:#92400e}
.status.failed{background:#fee2e2;color:#991b1b}
.text-btn{border:0;background:none;color:#087eae;font-size:10px;font-weight:800}
.source-tabs,.modal-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.tab{border:1px solid #dce4ed;background:white;color:#50617a;padding:10px 16px;border-radius:9px;font-size:10px;font-weight:800}
.tab.active{background:#1e3a5f;color:white;border-color:#1e3a5f}
.field label,.form-field label{display:block;font-size:10px;font-weight:800;color:#52637c;margin-bottom:9px}
.field select,.form-field input,.form-field select{width:100%;padding:12px;border:1px solid #dfe6ef;border-radius:9px;background:white;color:#30425d;font-size:11px}
.template-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.template-info{padding:18px;background:#f8fafc;border:1px solid #e9edf3;border-radius:12px;margin-top:15px}
.template-info strong{display:block;font-size:13px;color:#1e3a5f;margin:8px 0}
.template-info p{font-size:11px;color:#8290a5;line-height:1.8}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:9px;padding:6px 10px;border:1px solid #e4e9ef;border-radius:20px;color:#718098;background:white}
.manual-box{background:#f8fafc;border:1px solid #e4eaf1;border-radius:14px;padding:23px;margin-top:19px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;flex-wrap:wrap}
.empty{padding:35px;text-align:center;color:#8593a7;font-size:11px}
.footer{text-align:center;padding:26px 0;color:#8491a5;font-size:10px}
.footer a{color:#0d7377;text-decoration:none}
.modal{position:fixed;inset:0;background:rgba(12,23,41,.9);z-index:100;overflow:auto;padding:15px}
.modal-inner{max-width:920px;width:100%;margin:0 auto}
.modalbar{background:#111c30;padding:12px 15px;border-radius:11px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.modalbar strong{font-size:11px;color:white}
.modal-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-actions select{padding:8px;border-radius:7px;font-size:10px;max-width:220px}
.modal-tabs{justify-content:center;margin-bottom:13px}
.modal-tabs button{padding:8px 13px;border:1px solid #526077;border-radius:20px;background:#26354b;color:white;font-size:9px;font-weight:700}
.modal-tabs button.active{background:#e94b17;border-color:#e94b17}
.a4{width:210mm;height:297mm;min-height:297mm;margin:0 auto;background:white;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#26354d;box-shadow:0 15px 50px #0004}
.doc-logo{width:155px;height:auto;display:block;object-fit:contain}
.doc-header{padding:21px 32px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:2px solid #1e3a5f}
.doc-info{text-align:right;font-size:8.5px;color:#66758c;line-height:1.8;overflow-wrap:anywhere}
.doc-info strong{color:#1e3a5f;font-size:10px}
.doc-content{padding:25px 38px;flex:1;display:flex;flex-direction:column;font-size:10.5px;line-height:1.8}
.doc-content p{color:#475569;margin:8px 0;line-height:1.85}
.doc-title{text-align:center;margin:12px 0 21px}
.doc-title h2{font-size:18px;letter-spacing:1.5px;color:#1e3a5f;margin:8px}
.doc-title small{color:#8491a5;font-size:9px;letter-spacing:2px;font-weight:700}
.doc-section{font-size:9.5px;letter-spacing:1.2px;color:#1e3a5f;font-weight:800;border-bottom:1px solid #dce3ec;padding-bottom:6px;margin-top:15px}
.doc-table{width:100%;border-collapse:collapse;margin:9px 0;font-size:9.5px}
.doc-table td{border-bottom:1px solid #e5eaf0;padding:7px 9px;overflow-wrap:anywhere}
.doc-table td:first-child{width:36%;background:#f3f6fa;color:#1e3a5f;font-weight:700}
.doc-footer{padding:10px 18px;background:#1e3a5f;color:white;text-align:center;font-size:8.5px;line-height:1.7}
.signoff{margin-top:auto;padding-top:16px;border-top:1px solid #e1e7ef}
.signoff strong{display:block;margin-top:6px;color:#1e3a5f;font-size:11px}
.signoff small{display:block;color:#8190a5;margin-top:3px;font-size:9px}
.acceptance{border:1px solid #d5dfe9;border-radius:7px;padding:12px;margin-top:12px;background:#f8fafc}
.acceptance-line{display:inline-block;border-bottom:1px solid #66758c;width:140px;margin:0 7px}
.training-top{height:8px;background:linear-gradient(90deg,#191928 70%,#e94b17)}
.draft{padding:7px;text-align:center;background:#fff4e8;color:#aa4b16;border:1px solid #ffd7b5;font-weight:800;font-size:9px;letter-spacing:1px}
.notice-mini{font-size:9px;color:#8b98aa;margin-top:12px}

/* Completion certificate */
.a4.completion-landscape{width:297mm;height:210mm;min-height:210mm;padding:9mm;background:#fffefa;color:#315a32}
.completion-frame{height:100%;border:5px double #7eac71;padding:7px;background:repeating-linear-gradient(0deg,transparent 0px,transparent 7px,rgba(120,174,111,.1) 8px,transparent 9px)}
.completion-inner{height:100%;border:1px solid #93bd85;padding:13px 25px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.completion-title{font-size:34px;font-weight:800;letter-spacing:2px;color:#315a32;margin:0}
.completion-company{display:flex;justify-content:center;align-items:center;gap:13px;font-size:15px;font-weight:800;letter-spacing:1px;color:#315a32}
.completion-company img{width:105px}
.completion-intro{font-size:13px;color:#526f50;margin-top:9px}
.completion-name{font-family:'Playfair Display',serif;font-size:35px;font-weight:700;color:#315a32;margin:6px 0}
.completion-statement{font-size:12px;line-height:1.8;max-width:710px;margin:auto;color:#426343}
.completion-meta{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:14px;align-items:end;color:#355e37;font-size:10px}
.completion-meta strong{display:block;font-size:11px;margin-bottom:5px}
.completion-meta small{display:block;font-size:9px;line-height:1.7}
.completion-meta .middle{border-left:1px solid #aac99f;border-right:1px solid #aac99f;padding:0 10px}

/* Participation certificate */
.a4.participation-landscape{width:297mm;height:210mm;min-height:210mm;padding:9mm;background:#f6f7fa;color:#1a2b46}
.participation-frame{height:100%;padding:8px;border:4px solid #1e3a5f;background:white;position:relative}
.participation-frame:before{content:"";position:absolute;inset:8px;border:1px solid #c6a96a;pointer-events:none}
.participation-inner{height:100%;padding:20px 32px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;position:relative}
.participation-top{width:100%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d4c18d;padding-bottom:12px}
.participation-title{font-size:27px;letter-spacing:4px;color:#1e3a5f;font-weight:800;margin:0}
.participation-subtitle{font-size:10px;letter-spacing:3px;color:#a57d33;font-weight:800}
.participation-badge{width:83px;height:83px;border:2px solid #c3a15a;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;color:#1e3a5f;font-size:12px;font-weight:800;line-height:1.3;background:#fbf8ed}
.participation-name{font-family:'Playfair Display',serif;font-size:34px;color:#1e3a5f;margin:3px 0}
.participation-statement{font-size:12px;line-height:1.85;color:#53647d;max-width:670px;margin:auto}
.participation-detail{display:flex;justify-content:center;gap:45px;border-top:1px solid #dfd5bc;border-bottom:1px solid #dfd5bc;padding:11px 24px;width:90%;font-size:10px;color:#52637b}
.participation-detail strong{display:block;color:#1e3a5f;margin-bottom:3px}
.participation-footer{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;width:100%;font-size:9px;color:#52637b}
.participation-footer strong{display:block;color:#1e3a5f;font-size:10px;margin-bottom:4px}
.participation-footer .company-center{border-left:1px solid #d8c99d;border-right:1px solid #d8c99d;padding:0 10px}

@media(max-width:850px){
 .app{padding:17px 12px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .template-layout{grid-template-columns:1fr}
 .panel{padding:20px}
 .form-grid{grid-template-columns:1fr}
 .a4{width:100%;height:auto;min-height:1000px}
 .a4.completion-landscape,.a4.participation-landscape{width:100%;height:auto;min-height:650px}
 .doc-content{padding:22px}
 .doc-header{padding:15px}
}
@media(max-width:520px){
 .stats{gap:8px}.stat{padding:13px}.stat strong{font-size:23px}
 .actions{width:100%}.actions .btn{flex:1}
 .hero{padding:40px 5px 30px}
 .completion-title{font-size:20px}
 .completion-name,.participation-name{font-size:25px}
 .completion-meta,.participation-footer{gap:5px;font-size:8px}
 .participation-title{font-size:19px;letter-spacing:2px}
}
@media print{
 @page{size:A4 portrait;margin:0}
 @page completionPage{size:A4 landscape;margin:0}
 @page participationPage{size:A4 landscape;margin:0}
 html,body{margin:0!important;padding:0!important;background:white!important}
 body *{visibility:hidden!important}
 #printTarget,#printTarget *{visibility:visible!important}
 .modal{position:static!important;display:block!important;padding:0!important;background:white!important;overflow:visible!important}
 .modal-inner{width:297mm!important;max-width:none!important;margin:0!important}
 .modalbar,.modal-tabs,.no-print{display:none!important}
 #printTarget{position:absolute!important;left:0!important;top:0!important;width:297mm!important}
 .a4.portrait{page:portrait;width:210mm!important;height:297mm!important;min-height:297mm!important;margin:0!important;box-shadow:none!important;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .a4.completion-landscape{page:completionPage;width:297mm!important;height:210mm!important;min-height:210mm!important;margin:0!important;box-shadow:none!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .a4.participation-landscape{page:participationPage;width:297mm!important;height:210mm!important;min-height:210mm!important;margin:0!important;box-shadow:none!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>

function sanitize(key,value){
 if(["name","domain","role"].includes(key)){
  return value.replace(/[^a-zA-Z ]/g,"").replace(/\s+/g," ");
 }
 if(key==="duration"){
  return value.replace(/[^a-zA-Z0-9 ]/g,"").replace(/\s+/g," ");
 }
 if(key==="eventTitle"){
  return value.replace(/[^a-zA-Z0-9 ]/g,"").replace(/\s+/g," ");
 }
 return value;
}

const normalize=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

function getIndex(columns,names,fallback=-1){
 const labels=columns.map(c=>normalize(c.label||c.id||""));
 for(const name of names){
  const index=labels.findIndex(x=>x===normalize(name));
  if(index>=0)return index;
 }
 return fallback;
}

function getCell(row,index){
 if(index<0)return "";
 const cell=row.c?.[index];
 if(!cell||cell.v===null||cell.v===undefined)return "";
 return String(cell.f??cell.v).trim();
}

function createCandidate(row,columns,rowNumber){
 const indexes={
  timestamp:getIndex(columns,["Timestamp"],0),
  aid:getIndex(columns,["Application ID","Application Id"],1),
  name:getIndex(columns,["Full Name","Candidate Name","Name"],2),
  email:getIndex(columns,["Email Address","Email"],3),
  phone:getIndex(columns,["WhatsApp / Phone","WhatsApp","Phone"],4),
  domain:getIndex(columns,["Domain","Internship Domain","Training Domain","Track"],7),
  mode:getIndex(columns,["Mode","Programme Mode","Training Mode","Work Mode"]),
  joining:getIndex(columns,["Joining Date","Start Date","Commencement Date"]),
  endDate:getIndex(columns,["End Date","Internship End Date"]),
  duration:getIndex(columns,["Duration","Programme Duration"]),
  completionDate:getIndex(columns,["Completion Date"]),
  eventTitle:getIndex(columns,["Event Title","Event Name","Programme Name"]),
  participationDate:getIndex(columns,["Participation Date","Event Date"]),
  role:getIndex(columns,["Role","Designation","Job Title"]),
  completionStatus:getIndex(columns,["Completion Status","Training Completion Status","Certificate Status"]),
  participationStatus:getIndex(columns,["Participation Status","Attendance Status"]),
  status:getIndex(columns,["Letter Sent","Email Status","Mail Status","Dispatch Status","Delivery Status","Application Status","Status"],17),
  pdf:getIndex(columns,["PDF Record","PDF Link"],18),
  updated:getIndex(columns,["Last Updated","Updated At"],19)
 };

 const v=index=>getCell(row,index);
 const raw={};
 columns.forEach((col,i)=>{
  raw[col.label||col.id||`Column ${i+1}`]=v(i);
 });

 return {
  key:v(indexes.aid)||`sheet-row-${rowNumber}`,
  rowNumber,
  source:"sheet",
  raw,
  timestamp:v(indexes.timestamp),
  aid:v(indexes.aid),
  name:v(indexes.name),
  email:v(indexes.email),
  phone:v(indexes.phone),
  domain:v(indexes.domain),
  mode:v(indexes.mode),
  joining:v(indexes.joining),
  endDate:v(indexes.endDate),
  duration:v(indexes.duration),
  completionDate:v(indexes.completionDate),
  eventTitle:v(indexes.eventTitle),
  participationDate:v(indexes.participationDate),
  role:v(indexes.role),
  completionStatus:v(indexes.completionStatus),
  participationStatus:v(indexes.participationStatus),
  status:v(indexes.status)||"Not recorded",
  pdf:v(indexes.pdf),
  updated:v(indexes.updated)
 };
}

function loadSheetJSONP(){
 return new Promise((resolve,reject)=>{
  const callback="vrpiGviz_"+Date.now();
  const script=document.createElement("script");
  let finished=false;

  const timer=setTimeout(()=>{
   finish(new Error("Google Sheets did not respond. Check link-view access."));
  },18000);

  function finish(error,result){
   if(finished)return;
   finished=true;
   clearTimeout(timer);
   script.remove();
   try{delete window[callback]}catch(e){window[callback]=undefined}
   if(error)reject(error);
   else resolve(result);
  }

  window[callback]=response=>{
   if(!response||!response.table){
    const message=response?.errors?.[0]?.detailed_message||
     response?.errors?.[0]?.message||
     "Google Sheets returned no readable data.";
    finish(new Error(message));
    return;
   }
   finish(null,response.table);
  };

  const tqx=encodeURIComponent(`out:json;responseHandler:${callback};reqId:0`);
  script.async=true;
  script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=${tqx}&_=${Date.now()}`;
  script.onerror=()=>finish(new Error("Google Sheets could not be reached. Check spreadsheet access."));
  document.head.appendChild(script);
 });
}

async function loadCandidates(){
 const table=await loadSheetJSONP();
 return (table.rows||[])
  .map((row,i)=>createCandidate(row,table.cols||[],i+2))
  .filter(c=>c.name||c.email||c.aid);
}

function classifyStatus(value){
 const s=String(value||"").toUpperCase().trim();

 if(/NOT SENT|NOT DELIVERED|PENDING|QUEUED|WAITING|PROCESSING|IN PROGRESS/.test(s))return "PENDING";
 if(/FAILED|FAILURE|ERROR|BOUNCED|REJECTED|UNDELIVERED/.test(s))return "FAILED";
 if(/SENT|DELIVERED|SUCCESS|ACCEPTED BY GMAIL|TRUE|^YES$|^1$/.test(s))return "SENT";

 return "UNKNOWN";
}

function isVerified(candidate,type){
 if(candidate.source==="manual")return false;
 const value=type==="participation"
  ?candidate.participationStatus
  :candidate.completionStatus;
 return /completed|complete|verified|approved|issued|participated|passed/i.test(String(value||""));
}

     <button onClick={()=>setFilter(key)}>
      <label>{label}</label>
      <strong style={{color}}>{value}</strong>
      <small>{note}</small>
     </button>
    </div>
   ))}
  </section>

  <section className="panel no-print">
   <div className="section-head">
    <div>
     <div className="kicker">LIVE DATA MANAGEMENT • READ ONLY</div>
     <h2>Candidate Records</h2>
     <p className="description">Actual Google Sheet data • Automatic refresh every 30 seconds.</p>
    </div>
    <input className="search" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, application ID or email..."/>
   </div>

   <div className="table-wrap">
    {loading&&records.length===0?
     <div className="empty">Connecting to Google Sheets...</div>:
     visible.length===0?
     <div className="empty">No matching actual candidate records.</div>:
     <table className="records">
      <thead><tr>
       <th>Application ID</th><th>Candidate</th><th>Email</th><th>Phone</th>
       <th>Domain</th><th>Status</th><th>PDF Record</th><th>Timestamp</th><th>Action</th>
      </tr></thead>
      <tbody>
       {visible.map(c=>{
        const s=classifyStatus(c.status);
        return <tr key={c.key}>
         <td>{c.aid||"—"}</td>
         <td><b>{c.name||"—"}</b></td>
         <td>{c.email||"—"}</td>
         <td>{c.phone||"—"}</td>
         <td>{c.domain||"—"}</td>
         <td><span className={"status "+s.toLowerCase()}>{c.status||"Not recorded"}</span></td>
         <td>{c.pdf||"—"}</td>
         <td>{c.timestamp||"—"}</td>
         <td><button className="text-btn" onClick={()=>{
          setSource("sheet");
          setSelectedKey(c.key);
          setTemplateId("offer");
          setPreview(true);
         }}>Preview</button></td>
        </tr>;
       })}
      </tbody>
     </table>
    }
   </div>
   <div className="notice-mini">
    {records.length} records loaded • 30-second automatic refresh • Read-only spreadsheet access.
   </div>
  </section>

  <section className="panel no-print">
   <div className="kicker">OFFICIAL CORPORATE DOCUMENT LIBRARY</div>
   <h2>Professional Document Generation</h2>
   <p className="description">Choose an actual candidate record or enter only the information required by your selected document. Manual entries are temporary and are never written to the spreadsheet.</p>

   <div className="source-tabs">
    <button className={"tab "+(source==="sheet"?"active":"")} onClick={()=>setSource("sheet")}>Use Google Sheet Record</button>
    <button className={"tab "+(source==="manual"?"active":"")} onClick={()=>{setSource("manual");setManual({});}}>Enter Details Manually</button>
   </div>

   <div className="template-layout">
    <div className="field">
     <label>SELECT CANDIDATE</label>
     {source==="sheet"?
      <select value={selectedKey} onChange={e=>setSelectedKey(e.target.value)}>
       <option value="">Select actual candidate</option>
       {records.map(c=><option key={c.key} value={c.key}>{c.name} — {c.aid||"No ID"}</option>)}
      </select>
      :
      <div className="alert info">Manual preview mode is active. Only the selected template's required details are displayed below.</div>
     }
    </div>

    <div className="field">
     <label>SELECT DOCUMENT TEMPLATE</label>
     <select value={templateId} onChange={e=>selectTemplate(e.target.value)}>
      <optgroup label="Internship">
       {TEMPLATES.filter(t=>t.group==="Internship").map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
      </optgroup>
      <optgroup label="Training">
       {TEMPLATES.filter(t=>t.group==="Training").map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
      </optgroup>
      <optgroup label="Certification">
       {TEMPLATES.filter(t=>t.group==="Certification").map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
      </optgroup>
     </select>

     <div className="template-info">
      <span className="kicker" style={{color:template.color}}>VR PI • OFFICIAL DOCUMENT</span>
      <strong>{template.name}</strong>
      <p>{template.desc}</p>
      <div className="pills">
       <span className="pill">{template.group}</span>
       <span className="pill">{["intern-completion","training-completion","participation"].includes(template.id)?"A4 Landscape":"A4 Portrait"}</span>
       <span className="pill">PDF Preview</span>
      </div>
     </div>
    </div>
   </div>

   {source==="manual"&&<div className="manual-box">
    <div className="kicker">TEMPLATE-SPECIFIC DETAILS</div>
    <h2>{template.name}</h2>
    <p className="description">Only the fields needed by this document are displayed.</p>
    <div className="form-grid">
     {fields.map(f=><div className="form-field" key={f.key}>
      <label>{f.label}{f.required?<span style={{color:"#e94b17"}}> *</span>:""}</label>
      {f.type==="select"?
       <select value={manual[f.key]||""} onChange={e=>updateManual(f.key,e.target.value)}>
        <option value="">Select {f.label}</option>
        {f.options.map(o=><option key={o} value={o}>{o}</option>)}
       </select>
       :
       <input type={f.type||"text"} value={manual[f.key]||""}
        placeholder={"Enter "+f.label.toLowerCase()}
        onChange={e=>updateManual(f.key,e.target.value)}/>
      }
     </div>)}
    </div>
    <div className="alert info">Manual entries remain in temporary page memory. They are not stored in Google Sheets or any database.</div>
    <div className="form-actions">
     <button className="btn" onClick={()=>setManual({})}>Clear Details</button>
     <button className="btn orange" disabled={!canPreview} onClick={()=>setPreview(true)}>Preview Document →</button>
    </div>
   </div>}

   {source==="sheet"&&<div className="section-head" style={{marginTop:23}}>
    <span className="description">{sheetCandidate?`Selected: ${sheetCandidate.name}`:"Select a candidate from your actual spreadsheet."}</span>
    <button className="btn orange" disabled={!canPreview} onClick={()=>setPreview(true)}>Preview A4 Document →</button>
   </div>}
  </section>

  <footer className="footer no-print">
   <CompanyLogo style={{width:145,margin:"0 auto 10px"}}/>
   <b>{COMPANY}</b><br/>
   {LOCATION}<br/>{EMAIL}<br/>
   <a href={WEBSITE} target="_blank" rel="noreferrer">Official Company Website ↗</a>
   <p>Enterprise Talent Excellence Platform</p>
  </footer>

  {preview&&candidate&&<div className="modal">
   <div className="modal-inner">
    <div className="modalbar no-print">
     <strong>{template.name} • {candidate.name}</strong>
     <div className="modal-actions">
      {source==="sheet"&&<select value={selectedKey} onChange={e=>setSelectedKey(e.target.value)}>
       {records.map(c=><option key={c.key} value={c.key}>{c.name} — {c.aid||""}</option>)}
      </select>}
      <button className="btn orange" onClick={()=>window.print()}>Print / Save PDF</button>
      <button className="btn" onClick={()=>setPreview(false)}>Close ×</button>
     </div>
    </div>
    <div className="modal-tabs no-print">
     {TEMPLATES.map(t=><button key={t.id} className={templateId===t.id?"active":""} onClick={()=>setTemplateId(t.id)}>{t.name}</button>)}
    </div>
    <div id="printTarget">
     <RenderDocument candidate={candidate} template={template}/>
    </div>
   </div>
  </div>}
 </main>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
